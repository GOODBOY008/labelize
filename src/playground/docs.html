ft_b \n zpl \n 0.01 \n 1.0 \n Sub-pixel \n \n \n text_ft_i \n zpl \n 0.01 \n 1.0 \n Sub-pixel \n \n \n text_ft_n \n zpl \n 0.02 \n 1.0 \n Sub-pixel \n \n \n text_ft_r \n zpl \n 0.02 \n 1.0 \n Sub-pixel \n \n \n text_multiline \n zpl \n 0.24 \n 1.5 \n Word-wrap boundaries \n \n \n thick_rotated_fb_text \n zpl \n 0.11 \n 1.0 \n Rotated ^FB font-0 text (overlay now blends alpha; was stamped full-black AA skirt) \n \n \n ups \n zpl \n 2.88 \n 8.0 \n MaxiCode + font metrics \n \n \n ups_import_control \n zpl \n 3.41 \n 4.5 \n MaxiCode + font metrics \n \n \n cjlogistics \n zpl \n 1.53 \n 3.0 \n Real CJ Logistics production template (adapted fonts): rotated PDF417 + Code128 + CJK blank parity \n \n \n correiosbr \n zpl \n 3.47 \n 3.7 \n Real Correios postagem template (adapted): DataMatrix + Z64 SEDEX logo + font metrics;  Recebedor:______  signature lines improved by the font-0 underscore ink calibration (issue #78) \n \n \n kuehnenagel_intl \n zpl \n 4.80 \n 7.0 \n Real Kuehne+Nagel capture: ^GFA logos + font metrics \n \n \n kuehnenagel_eselect \n zpl \n 2.27 \n 3.5 \n Real Kuehne+Nagel capture: mid-format ^LH honored + ^BY wide:narrow ratio 2.7 applied to 2of5; remaining = font metrics + ^GFA graphics \n \n \n bring \n zpl \n 2.00 \n 3.5 \n Real Bring capture: ~DG graphic + font metrics \n \n \n ups_surepost \n zpl \n 3.58 \n 10.0 \n MaxiCode + font metrics \n \n \n usps \n zpl \n 2.58 \n 5.0 \n Font metrics + ® superscript glyph \n \n \n tnt_express \n zpl \n 2.40 \n 4.0 \n Real TNT capture (Centiro): mid-format ^LH honored; ^GFA logo + font metrics \n \n \n royalmail \n zpl \n 1.64 \n 4.5 \n QR code + font metrics \n \n \n canadapost \n zpl \n 1.98 \n 3.5 \n QR code + font (PDF417 now matches reference) \n \n \n auspost \n zpl \n 2.04 \n 5.0 \n QR code + font metrics \n \n \n colissimo \n zpl \n 2.20 \n 4.5 \n DataMatrix + font metrics \n \n \n postnl \n zpl \n 1.91 \n 5.0 \n QR code + font metrics \n \n \n bpost \n zpl \n 1.94 \n 4.5 \n QR code + font metrics \n \n \n correos \n zpl \n 2.00 \n 5.0 \n QR code + font metrics \n \n \n dbschenker \n zpl \n 2.20 \n 4.0 \n Font metrics (PDF417 now matches reference) \n \n \n evri \n zpl \n 1.52 \n 4.5 \n QR code + font metrics \n \n \n dpdde \n zpl \n 2.00 \n 3.5 \n Font metrics (PDF417 now matches reference) \n \n \n ontrac \n zpl \n 1.97 \n 4.5 \n QR code + font metrics \n \n \n seur \n zpl \n 1.93 \n 3.5 \n Font metrics (PDF417 now matches reference) \n \n \n purolator \n zpl \n 2.08 \n 4.0 \n DataMatrix + font metrics \n \n \n inpost \n zpl \n 3.10 \n 5.5 \n QR code + font metrics \n \n \n yodel \n zpl \n 1.86 \n 4.5 \n QR code + font metrics \n \n \n dhl_express \n zpl \n 2.21 \n 3.5 \n Real DHL Express capture (Centiro): mid-format ^LH honored; ^GFA logo + font metrics \n \n \n dhl_home_delivery \n zpl \n 1.84 \n — \n ^GFA logo + font metrics \n \n \n usps_apo \n zpl \n 2.84 \n 3.5 \n Font metrics (rotated I/B pen-anchor fixed; glyph-top re-anchored to Labelary after #64 unclipping; residual = glyph weight + 1-bit AA fringe) \n \n \n usps_intl \n zpl \n 2.46 \n 4.0 \n Font metrics (^POI rotated text) \n \n \n usps_priority_mail \n zpl \n 0.32 \n — \n Font metrics (^FB centered) \n \n \n usps_test_merchant \n zpl \n 0.07 \n — \n Font metrics \n \n \n cjk_font0_ci28 \n zpl \n 0.11 \n 1.0 \n ^CI28 font-0 CJK: rendered blank with calibrated advance like Labelary (probe-measured, see tuning::FONT0_MISSING_GLYPH_ADVANCE_EM); residual = Roboto Condensed metrics on the Latin prefix \n \n \n font0_latin_ext_a \n zpl \n 0.21 \n 1.0 \n Issue #65: font-0 Latin Extended-A glyphs Labelary renders (Ă ă Đ đ Ţ ţ) drawn with the Roboto Condensed subset; Ș ș Ț ț Ħ ħ stay blank with calibrated advance on both sides \n \n \n font0_symbols \n zpl \n 0.57 \n 1.0 \n Issue #78: font-0 symbol ink calibration (tuning::FONT0_INK_TARGETS) stretches dashes/operators/ % /braces to Labelary's ink box,  © / ®  render as equal-size superscripts, ASCII quotes as curly shapes; en/em dash advances re-probed (Labelary advances the whole dash family uniformly at 0.9 × cell height); residual = Roboto glyph shapes vs Labelary's Helvetica-class face on the letters \n \n \n \n Known Limitations \n MaxiCode (ups, ups_surepost, ups_import_control) \n MaxiCode is a proprietary 2D symbology used by UPS. The encoder implements\nproper GF(64) Reed-Solomon ECC (primary 10+10, secondary 42+20 even/odd tracks)\nand greedy Set-A character encoding. Remaining diff (~3-4%) is due to minor\nhex module placement differences vs Labelary and font metric differences.\nVerified by visual inspection: the MaxiCode symbol renders at the correct\nposition/size on all three; only the interior module bits differ, consistent\nwith Labelary's secondary-message Set-switching heuristic diverging from our\ngreedy Set-A-first one on the same (spec-valid) input. \n PDF417 (fedex, fedex_express, fedex_ground, dbschenker, dpdde, seur, tnt_express) \n The PDF417 pipeline ( src/barcodes/pdf417_encoding.rs ) reproduces the reference\nrenderer's compaction segment-for-segment: ISO/IEC 15438 text sub-mode switching,\nnumeric compaction for medium digit runs, byte-run absorption of short blocks, and\nthe exact descriptor/padding/RS-ECC assembly (verified codeword-identical on the\nfedex secondary-message symbol and byte-identical on  pdf417_basic ). Residual\ndiff on these labels is the font-metrics floor, not the barcode. The automatic\ncolumn count for  ^B7  without a  columns  parameter is the classic near-cubic\nsqrt rule and can still differ from the reference on auto-sized symbols. \n Aztec (aztec_ec, pnldpd) \n The  rxing  crate's Aztec writer produces proper Aztec codes. Minor differences\nstem from error correction level defaults and symbol sizing when the ZPL\nparameters leave the size open. \n DataMatrix (glsdk_return, purolator, posteit) \n The  datamatrix  crate produces a spec-correct ECC 200 symbol (no quiet zone,\nmatching Labelary) at the same size and position as the reference. Pixel\ncomparison shows the interior module pattern is still largely mismatched —\nconfirmed by inspection to be a genuine bit-level difference, not a rendering\nbug (no rotation, mirroring, or size mismatch). ECC 200 leaves the encodation\nmode (ASCII/C40/text/base256) selection open when multiple paths are equally\nefficient for a given input; the  datamatrix  crate and Labelary's encoder\nresolve that ambiguity differently, producing different but equally valid\ncodeword sequences for the same data. \n Font Rendering \n Labelize uses  ab_glyph  with an Apache-2.0 Roboto Condensed Bold subset for\nfont 0 (ink-fitted width ratio 1.2968 + cap-scale 1.3913, see\n tuning::FONT0_* ) and DejaVu Sans Mono variants for bitmap fonts A–H. Labelary\nrenders font 0 with a face that is metrically near-identical to Adobe\nHelvetica Condensed Bold (probe-verified), so residual diffs come from the\ndesign difference between the two faces, concentrated on dense small text\n(dhlecommercetr, dhlparcelit). The previous Helvetica-substitute calibration\nwas replaced in 2026-10 after the old TTF turned out to be an unlicensed Adobe\nderivative (issue #65). \n GFA Graphics \n Embedded  ^GFA  hex graphics are decoded and rasterised accurately. Remaining\ndifferences (\u003c 2 %) are primarily from anti-aliasing at logo edges and slight\ncoordinate rounding. \n Stored Graphics (dhlparcelit, brtit) \n  ~DG  downloads and  ^XG  recalls render correctly. The remaining ~2.4 % diff on\n dhlparcelit  is font metrics; the rotated I/B pen-anchor offset that used to\ndominate its ^A0I text was fixed (see  tuning::ROTATED_ADVANCE_OFFSET ). The\n ^XG.GRF  (unnamed recall) does not match the stored  CMR.GRF  key — both our\nimplementation and Labelary skip it. \n Single-line field-block overflow \n  fb_single_line_overflow  isolates the  C2PQQ…  shipping-label header with\n ^A0,60,0^FB400,1,0,L,0 . Its independent Labelary reference was fetched on\n2026-10-28 using the standard 8 dpmm, 4.005 × 8.01 inch endpoint. Labelary\nbreaks the oversized identifier at character boundaries and overlays the\nwrapped lines in the final line slot, as required for overflow by the\n Zebra ^FB reference .\nThe full-canvas diff fell from 1.36% to 0.12%. The renderer regression also\nchecks the header's 420 × 80 pixel region directly (29.04% → 4.88%, ceiling\n8%) so blank surrounding pixels cannot hide a broken header. \n Updating References \n  datamatrix_dimensions  uses a  0.0%  tolerance against its independent\nLabelary reference. It covers ECC200 rectangular size constraints and the\nrow-only capacity boundary; see  DataMatrix dimensions . \n  qr_mask_selection  has a  0.0%  tolerance against an independent Labelary\nreference for five isolated EC-H Byte cases. See  QR mask selection . \n The  print_mirror ,  print_mirror_width , and  print_mirror_inverted  fixtures\nhave a strict pixel-for-pixel check in  tests/unit_print_mirror.rs  in addition\nto the golden suite. Their independent Labelary references and measured\ncoordinate expectations are documented in  Print mirror . \n To regenerate all Labelary reference images: \n  # ZPL labels (Labelary API)\nfor f in testdata/labels/*.zpl testdata/unit/*.zpl; do\n  name=$(basename \"$f\" .zpl)\n  dir=$(dirname \"$f\")\n  curl -s -X POST http://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/ \\\n    -F \"file=@$f\" -o \"${dir}/${name}.png\"\ndone\n\n# EPL labels — Labelary does not support EPL.\n# Use the Go renderer or keep existing references.\n  \n Running the Diff Report \n  # Full report (no failure on HIGH)\ncargo test --test e2e diff_report -- --nocapture\n\n# Golden tests with per-label tolerances (fails on regression)\ncargo test --test e2e e2e_golden -- --test-threads=4\n  "},{"id":"publishing","group":"Contribute","title":"Docker Image Publishing","file":"DOCKER_PUBLISHING.md","html":"\u003ch1 id=\"docker-image-publishing\">Docker Image Publishing\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>The \u003ccode>Docker\u003c/code> workflow (\u003ccode>.github/workflows/docker.yml\u003c/code>) builds the container image\nand publishes multi-arch manifests to \u003cstrong>Docker Hub\u003c/strong> and the \u003cstrong>GitHub Container\nRegistry (GHCR)\u003c/strong>.\u003c/p>\n\u003ch2 id=\"maintainer-setup\">Maintainer setup\u003c/h2>\n\u003cp>GHCR works out of the box — it authenticates with the built-in \u003ccode>GITHUB_TOKEN\u003c/code>.\nDocker Hub needs two settings, both under\n\u003cstrong>Settings → Secrets and variables → Actions\u003c/strong>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Name\u003c/th>\n\u003cth>Kind\u003c/th>\n\u003cth>Value\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>DOCKERHUB_USERNAME\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Variable\u003c/strong>\u003c/td>\n\u003ctd>Docker Hub account name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DOCKERHUB_TOKEN\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Secret\u003c/strong>\u003c/td>\n\u003ctd>Docker Hub access token (Account Settings → Personal access tokens, \u003ccode>Read \u0026amp; Write\u003c/code> scope)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>[!IMPORTANT]\nThe username must be a repository \u003cstrong>variable\u003c/strong>, not a secret. GitHub redacts\njob outputs that contain a secret value and passes them on as empty strings.\nThe account name is a substring of the image names this workflow computes\n(\u003ccode>ghcr.io/goodboy008/labelize\u003c/code> contains \u003ccode>goodboy008\u003c/code>), so storing it as a\nsecret would silently blank out those outputs and break publishing to \u003cem>both\u003c/em>\nregistries. Only the token is sensitive and belongs in Secrets.\u003c/p>\n\u003c/blockquote>\n\u003cp>Until both exist the workflow still succeeds — it logs a notice and publishes to\nGHCR only. This keeps forks and pre-setup runs green instead of failing on\nmissing credentials.\u003c/p>\n\u003cp>One optional repository \u003cstrong>variable\u003c/strong> is also supported:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Variable\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>DOCKERHUB_IMAGE\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>\u0026lt;DOCKERHUB_USERNAME\u0026gt;/labelize\u003c/code>\u003c/td>\n\u003ctd>Docker Hub repository to push to, if the name differs\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The first GHCR push creates a package that is \u003cstrong>private\u003c/strong> by default. To make it\npublicly pullable, open the package page → \u003cem>Package settings\u003c/em> → \u003cem>Change\nvisibility\u003c/em> → \u003cem>Public\u003c/em>.\u003c/p>\n\u003ch2 id=\"triggers-and-tags\">Triggers and tags\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Event\u003c/th>\n\u003cth>Tags produced\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Push to \u003ccode>main\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>main\u003c/code>, \u003ccode>edge\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Push of tag \u003ccode>vX.Y.Z\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>X.Y.Z\u003c/code>, \u003ccode>X.Y\u003c/code>, \u003ccode>latest\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Push of tag \u003ccode>vX.Y.Z-rc.N\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>X.Y.Z-rc.N\u003c/code> only — prereleases never move \u003ccode>latest\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Push of tag matching \u003ccode>v[0-9]*\u003c/code> but not semver (\u003ccode>v1.3\u003c/code>, \u003ccode>v1abc\u003c/code>)\u003c/td>\n\u003ctd>nothing — the run starts, then skips publishing with a warning\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Push of any other tag (\u003ccode>vtest\u003c/code>, \u003ccode>nightly\u003c/code>)\u003c/td>\n\u003ctd>nothing — the workflow does not start at all\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pull request\u003c/td>\n\u003ctd>none — builds and smoke-tests only, no publish\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The tag scheme follows mainstream OSS practice (e.g. Grafana, n8n): \u003ccode>latest\u003c/code>\nplus full and minor semver tags on a release, and a single moving \u003ccode>edge\u003c/code> tag on\nthe default branch. There is deliberately \u003cstrong>no per-commit \u003ccode>sha-\u0026lt;full\u0026gt;\u003c/code> tag\u003c/strong>\n(each \u003ccode>main\u003c/code> push would otherwise leave a permanent, ever-growing tag on Docker\nHub) and no \u003cstrong>bare \u003ccode>X\u003c/code> major-only tag\u003c/strong>.\u003c/p>\n\u003cp>\u003ccode>latest\u003c/code> is guarded in two layers, because a tag that produces no version tags at\nall must never be able to repoint it at an arbitrary commit:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>The trigger glob\u003c/strong> is \u003ccode>tags: ['v[0-9]*']\u003c/code>, not \u003ccode>v*\u003c/code>. A tag that does not begin\n   with \u003ccode>v\u003c/code> followed by a digit — \u003ccode>vtest\u003c/code>, \u003ccode>vlatest\u003c/code>, \u003ccode>nightly\u003c/code> — never starts a\n   run, so it costs nothing and can affect nothing.\u003c/li>\n\u003cli>\u003cstrong>The \u003ccode>prepare\u003c/code> job\u003c/strong> then matches the tag against \u003ccode>^v[0-9]+\\.[0-9]+\\.[0-9]+$\u003c/code>\n   for \u003ccode>latest\u003c/code>, and against the same pattern plus an optional\n   prerelease/build suffix to decide whether to publish at all. This catches the\n   shapes the glob still lets through — \u003ccode>v1.3\u003c/code>, \u003ccode>v1.3.0.4\u003c/code>, \u003ccode>v1abc\u003c/code> — which would\n   otherwise satisfy a naive \"is a tag and has no \u003ccode>-\u003c/code> in it\" check while\n   \u003ccode>metadata-action\u003c/code> emitted no version tags for them.\u003c/li>\n\u003c/ol>\n\u003cp>\u003ccode>latest\u003c/code> is therefore assigned explicitly rather than via \u003ccode>flavor: latest=auto\u003c/code>.\u003c/p>\n\u003ch2 id=\"how-the-build-is-arranged\">How the build is arranged\u003c/h2>\n\u003cp>Rust release builds under QEMU emulation are extremely slow, so each architecture\nis built on a native runner instead:\u003c/p>\n\u003cpre>\u003ccode>prepare ──┬─► build (linux/amd64  on ubuntu-latest)   ──┐\n          └─► build (linux/arm64  on ubuntu-24.04-arm) ──┴─► merge ─► verify\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>prepare\u003c/strong> — resolves the target registries once. Secrets cannot be read from\n  a job-level \u003ccode>if:\u003c/code>, so the Docker Hub decision is made here and passed down as\n  job outputs.\u003c/li>\n\u003cli>\u003cstrong>build\u003c/strong> — builds a single platform and pushes it \u003cem>by digest\u003c/em> (no tag). Layer\n  caching uses the GitHub Actions cache, scoped per platform. Attestations are\n  disabled because \u003ccode>push-by-digest\u003c/code> cannot carry attestation manifests.\u003c/li>\n\u003cli>\u003cstrong>merge\u003c/strong> — downloads the per-platform digests and assembles one manifest list\n  per registry with \u003ccode>docker buildx imagetools create\u003c/code>. Each registry's manifest\n  is built from its own copies of the digests, so no cross-registry blob copying\n  is needed.\u003c/li>\n\u003cli>\u003cstrong>verify\u003c/strong> — pulls the published manifest back and checks that the image runs:\n  \u003ccode>labelize --version\u003c/code> plus a live \u003ccode>GET /health\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>BuildKit's default of 4 parallel build steps exhausts the 7 GB GitHub runner\nduring Rust compiles (\u003ca href=\"https://github.com/moby/buildkit/issues/3969\">moby/buildkit#3969\u003c/a>),\nso \u003ccode>max-parallelism\u003c/code> is pinned to 2.\u003c/p>\n\u003cp>Publishing runs are never cancelled by \u003ccode>concurrency\u003c/code> — only pull request builds\nare superseded. Aborting between the digest pushes and the manifest merge would\nleave dangling untagged digests and no manifest list.\u003c/p>\n\u003ch2 id=\"build-provenance\">Build provenance\u003c/h2>\n\u003cp>The \u003ccode>merge\u003c/code> job attaches a signed \u003ca href=\"https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations\">build provenance attestation\u003c/a>\nto the published GHCR manifest — a record of which repository, commit, and\nworkflow run produced that exact digest, signed via Sigstore and stored as an OCI\nreferrer alongside the image.\u003c/p>\n\u003cp>Anyone can verify an image is genuine before deploying it:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">gh attestation verify oci://ghcr.io/goodboy008/labelize:latest --owner GOODBOY008\n\u003c/code>\u003c/pre>\n\u003cp>The exact command, with the digest filled in, is printed in each run's job\nsummary. Docker Hub is deliberately left out — its OCI referrers support is less\nsettled than GHCR's.\u003c/p>\n\u003cp>On pull requests the build job loads the image locally instead of pushing, then\nsmoke-tests it — \u003ccode>--version\u003c/code>, \u003ccode>GET /health\u003c/code>, and a real \u003ccode>POST /convert\u003c/code> that must\nreturn a non-empty PNG.\u003c/p>\n\u003cp>PR builds are limited to changes that can actually affect the image (\u003ccode>Dockerfile\u003c/code>,\n\u003ccode>.dockerignore\u003c/code>, \u003ccode>docker-compose.yaml\u003c/code>, \u003ccode>Cargo.toml\u003c/code>, \u003ccode>Cargo.lock\u003c/code>, and the\nworkflow itself). Ordinary source changes are already covered by the \u003ccode>CI\u003c/code>\nworkflow, so they don't pay for a container rebuild.\u003c/p>","headings":[["2","maintainer-setup","Maintainer setup"],["2","triggers-and-tags","Triggers and tags"],["2","how-the-build-is-arranged","How the build is arranged"],["2","build-provenance","Build provenance"]],"examples":[],"search":" Docker Image Publishing \n  Documentation index  \n The  Docker  workflow ( .github/workflows/docker.yml ) builds the container image\nand publishes multi-arch manifests to  Docker Hub  and the  GitHub Container\nRegistry (GHCR) . \n Maintainer setup \n GHCR works out of the box — it authenticates with the built-in  GITHUB_TOKEN .\nDocker Hub needs two settings, both under\n Settings → Secrets and variables → Actions : \n \n \n \n Name \n Kind \n Value \n \n \n \n \n  DOCKERHUB_USERNAME  \n  Variable  \n Docker Hub account name \n \n \n  DOCKERHUB_TOKEN  \n  Secret  \n Docker Hub access token (Account Settings → Personal access tokens,  Read \u0026 Write  scope) \n \n \n \n \n [!IMPORTANT]\nThe username must be a repository  variable , not a secret. GitHub redacts\njob outputs that contain a secret value and passes them on as empty strings.\nThe account name is a substring of the image names this workflow computes\n( ghcr.io/goodboy008/labelize  contains  goodboy008 ), so storing it as a\nsecret would silently blank out those outputs and break publishing to  both \nregistries. Only the token is sensitive and belongs in Secrets. \n \n Until both exist the workflow still succeeds — it logs a notice and publishes to\nGHCR only. This keeps forks and pre-setup runs green instead of failing on\nmissing credentials. \n One optional repository  variable  is also supported: \n \n \n \n Variable \n Default \n Purpose \n \n \n \n \n  DOCKERHUB_IMAGE  \n  \u003cDOCKERHUB_USERNAME>/labelize  \n Docker Hub repository to push to, if the name differs \n \n \n \n The first GHCR push creates a package that is  private  by default. To make it\npublicly pullable, open the package page →  Package settings  →  Change\nvisibility  →  Public . \n Triggers and tags \n \n \n \n Event \n Tags produced \n \n \n \n \n Push to  main  \n  main ,  edge  \n \n \n Push of tag  vX.Y.Z  \n  X.Y.Z ,  X.Y ,  latest  \n \n \n Push of tag  vX.Y.Z-rc.N  \n  X.Y.Z-rc.N  only — prereleases never move  latest  \n \n \n Push of tag matching  v[0-9]*  but not semver ( v1.3 ,  v1abc ) \n nothing — the run starts, then skips publishing with a warning \n \n \n Push of any other tag ( vtest ,  nightly ) \n nothing — the workflow does not start at all \n \n \n Pull request \n none — builds and smoke-tests only, no publish \n \n \n \n The tag scheme follows mainstream OSS practice (e.g. Grafana, n8n):  latest \nplus full and minor semver tags on a release, and a single moving  edge  tag on\nthe default branch. There is deliberately  no per-commit  sha-\u003cfull>  tag \n(each  main  push would otherwise leave a permanent, ever-growing tag on Docker\nHub) and no  bare  X  major-only tag . \n  latest  is guarded in two layers, because a tag that produces no version tags at\nall must never be able to repoint it at an arbitrary commit: \n \n  The trigger glob  is  tags: ['v[0-9]*'] , not  v* . A tag that does not begin\n   with  v  followed by a digit —  vtest ,  vlatest ,  nightly  — never starts a\n   run, so it costs nothing and can affect nothing. \n  The  prepare  job  then matches the tag against  ^v[0-9]+\\.[0-9]+\\.[0-9]+$ \n   for  latest , and against the same pattern plus an optional\n   prerelease/build suffix to decide whether to publish at all. This catches the\n   shapes the glob still lets through —  v1.3 ,  v1.3.0.4 ,  v1abc  — which would\n   otherwise satisfy a naive \"is a tag and has no  -  in it\" check while\n    metadata-action  emitted no version tags for them. \n \n  latest  is therefore assigned explicitly rather than via  flavor: latest=auto . \n How the build is arranged \n Rust release builds under QEMU emulation are extremely slow, so each architecture\nis built on a native runner instead: \n  prepare ──┬─► build (linux/amd64  on ubuntu-latest)   ──┐\n          └─► build (linux/arm64  on ubuntu-24.04-arm) ──┴─► merge ─► verify\n  \n \n  prepare  — resolves the target registries once. Secrets cannot be read from\n  a job-level  if: , so the Docker Hub decision is made here and passed down as\n  job outputs. \n  build  — builds a single platform and pushes it  by digest  (no tag). Layer\n  caching uses the GitHub Actions cache, scoped per platform. Attestations are\n  disabled because  push-by-digest  cannot carry attestation manifests. \n  merge  — downloads the per-platform digests and assembles one manifest list\n  per registry with  docker buildx imagetools create . Each registry's manifest\n  is built from its own copies of the digests, so no cross-registry blob copying\n  is needed. \n  verify  — pulls the published manifest back and checks that the image runs:\n   labelize --version  plus a live  GET /health . \n \n BuildKit's default of 4 parallel build steps exhausts the 7 GB GitHub runner\nduring Rust compiles ( moby/buildkit#3969 ),\nso  max-parallelism  is pinned to 2. \n Publishing runs are never cancelled by  concurrency  — only pull request builds\nare superseded. Aborting between the digest pushes and the manifest merge would\nleave dangling untagged digests and no manifest list. \n Build provenance \n The  merge  job attaches a signed  build provenance attestation \nto the published GHCR manifest — a record of which repository, commit, and\nworkflow run produced that exact digest, signed via Sigstore and stored as an OCI\nreferrer alongside the image. \n Anyone can verify an image is genuine before deploying it: \n  gh attestation verify oci://ghcr.io/goodboy008/labelize:latest --owner GOODBOY008\n  \n The exact command, with the digest filled in, is printed in each run's job\nsummary. Docker Hub is deliberately left out — its OCI referrers support is less\nsettled than GHCR's. \n On pull requests the build job loads the image locally instead of pushing, then\nsmoke-tests it —  --version ,  GET /health , and a real  POST /convert  that must\nreturn a non-empty PNG. \n PR builds are limited to changes that can actually affect the image ( Dockerfile ,\n .dockerignore ,  docker-compose.yaml ,  Cargo.toml ,  Cargo.lock , and the\nworkflow itself). Ordinary source changes are already covered by the  CI \nworkflow, so they don't pay for a container rebuild. "},{"id":"index","group":"Contribute","title":"Labelize documentation","file":"README.md","html":"\u003ch1 id=\"labelize-documentation\">Labelize documentation\u003c/h1>\n\u003cp>Start with \u003ca href=\"#docs/getting-started\">your first label\u003c/a>: render a small example,\nunderstand its coordinates, and export an 800 × 480 PNG. These guides are also\navailable inside the playground under \u003cstrong>Documentation\u003c/strong>, with search, section\nlinks, copyable code and examples that load directly into the editor.\u003c/p>\n\u003ch2 id=\"learn-in-the-playground\">Learn in the playground\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Guide\u003c/th>\n\u003cth>What you will learn\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/getting-started\">Your first label\u003c/a>\u003c/td>\n\u003ctd>Render, edit, export and call the API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/playground\">Playground guide\u003c/a>\u003c/td>\n\u003ctd>Sizing, resolution, sharing, image import and data handling\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/languages\">Languages and examples\u003c/a>\u003c/td>\n\u003ctd>Choose a parser and try small labels\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/troubleshooting\">Troubleshooting\u003c/a>\u003c/td>\n\u003ctd>Diagnose clipping, font differences, barcodes and API errors\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"use-labelize\">Use Labelize\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Document\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/tutorials\">Tutorials\u003c/a>\u003c/td>\n\u003ctd>CLI, Docker, HTTP, JavaScript/WASM, Android and Rust walkthroughs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/api\">Public API\u003c/a>\u003c/td>\n\u003ctd>Interactive API console, OpenAPI and temporary conversion scripts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/usage\">Usage\u003c/a>\u003c/td>\n\u003ctd>Installation, CLI and native HTTP reference, library examples\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/vector\">Vector output\u003c/a>\u003c/td>\n\u003ctd>Raster/vector modes, searchable PDF, scalable PNG and fidelity limits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/zpl\">ZPL command matrix\u003c/a>\u003c/td>\n\u003ctd>Command support and parameter reference\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"develop-and-verify\">Develop and verify\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Document\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/architecture\">Architecture\u003c/a>\u003c/td>\n\u003ctd>Parser/IR/renderer boundaries and the new-language checklist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/testing\">Testing\u003c/a>\u003c/td>\n\u003ctd>Unit/E2E commands, golden policy and independent PDF verification\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/corpus\">Test corpus\u003c/a>\u003c/td>\n\u003ctd>Fixture sources, adaptations and reference provenance\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/thresholds\">Diff thresholds\u003c/a>\u003c/td>\n\u003ctd>Per-fixture visual tolerances and known rendering differences\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/datamatrix\">DataMatrix\u003c/a>\u003c/td>\n\u003ctd>ECC 200 and Legacy behavior, dimensions, field data and evidence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/rendering\">Rendering notes\u003c/a>\u003c/td>\n\u003ctd>Print-mirror semantics and QR mask selection\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/tspl-baselines\">TSPL baselines\u003c/a>\u003c/td>\n\u003ctd>Calibration policy, reference coverage and unresolved differences\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/publishing\">Docker publishing\u003c/a>\u003c/td>\n\u003ctd>Maintainer configuration, image tags and publishing workflow\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Release history lives in the \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/CHANGELOG.md\">changelog\u003c/a>. Build and integration\ndetails stay beside their code: \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/android/README.md\">Android\u003c/a>,\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/wasm/npm/README.md\">WASM package\u003c/a> and the\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/.github/workflows/deploy-worker.yml\">Worker deployment workflow\u003c/a>.\u003c/p>\n\u003ch2 id=\"keep-documentation-organized\">Keep documentation organized\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>tutorials/\u003c/code> is the only subdirectory here. Keep platform walkthroughs there\n  and maintained reference documents at the root, linked from this index.\u003c/li>\n\u003cli>Give each topic one canonical document. Link to it from tutorials and the\n  repository README instead of copying implementation or test details.\u003c/li>\n\u003cli>Keep test fixtures and golden provenance under \u003ccode>testdata/\u003c/code>, runnable checks\n  under \u003ccode>e2e/\u003c/code>, and generated reports under ignored \u003ccode>output/\u003c/code> or CI artifacts.\u003c/li>\n\u003cli>Keep completed plans, task checklists and one-off investigation results in\n  Git/PR history. Preserve lasting semantics, source attribution and evidence\n  limitations in the appropriate reference document.\u003c/li>\n\u003cli>Update inbound links when renaming or removing a document. Keep dated\n  observations scoped to their renderer/device; do not present old test totals\n  or measurements as the current build's result.\u003c/li>\n\u003c/ul>\n\u003cp>The SVG logos and preview PNGs at this root are shared documentation assets;\ntheir paths are also used by package READMEs and playground metadata.\u003c/p>\n\u003ch2 id=\"update-the-built-in-docs\">Update the built-in docs\u003c/h2>\n\u003cp>Markdown in this directory is the source for the playground documentation.\nThe page manifest and compiler live in \u003ccode>tools/docs/build.py\u003c/code>. To regenerate:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 -m venv /tmp/labelize-docs\n/tmp/labelize-docs/bin/pip install -r tools/docs/requirements.txt\n/tmp/labelize-docs/bin/python tools/docs/build.py\n/tmp/labelize-docs/bin/python tools/docs/build.py --check\n\u003c/code>\u003c/pre>\n\u003cp>Commit the Markdown and generated \u003ccode>src/playground/docs.html\u003c/code> together. CI checks\nfor stale output and broken internal page/section links. Native, Worker and\nWASM playgrounds embed the same bundle; runtime builds need neither Python\nnor a documentation server. Add runnable examples with a fenced-code info\nstring such as \u003ccode>zpl playground width=100 height=60 dpmm=8\u003c/code>; the dimensions and\nresolution must match the surrounding explanation. Only mark complete,\nrenderable examples this way. Other code blocks are copyable references.\u003c/p>","headings":[["2","learn-in-the-playground","Learn in the playground"],["2","use-labelize","Use Labelize"],["2","develop-and-verify","Develop and verify"],["2","keep-documentation-organized","Keep documentation organized"],["2","update-the-built-in-docs","Update the built-in docs"]],"examples":[],"search":" Labelize documentation \n Start with  your first label : render a small example,\nunderstand its coordinates, and export an 800 × 480 PNG. These guides are also\navailable inside the playground under  Documentation , with search, section\nlinks, copyable code and examples that load directly into the editor. \n Learn in the playground \n \n \n \n Guide \n What you will learn \n \n \n \n \n  Your first label  \n Render, edit, export and call the API \n \n \n  Playground guide  \n Sizing, resolution, sharing, image import and data handling \n \n \n  Languages and examples  \n Choose a parser and try small labels \n \n \n  Troubleshooting  \n Diagnose clipping, font differences, barcodes and API errors \n \n \n \n Use Labelize \n \n \n \n Document \n Purpose \n \n \n \n \n  Tutorials  \n CLI, Docker, HTTP, JavaScript/WASM, Android and Rust walkthroughs \n \n \n  Public API  \n Interactive API console, OpenAPI and temporary conversion scripts \n \n \n  Usage  \n Installation, CLI and native HTTP reference, library examples \n \n \n  Vector output  \n Raster/vector modes, searchable PDF, scalable PNG and fidelity limits \n \n \n  ZPL command matrix  \n Command support and parameter reference \n \n \n \n Develop and verify \n \n \n \n Document \n Purpose \n \n \n \n \n  Architecture  \n Parser/IR/renderer boundaries and the new-language checklist \n \n \n  Testing  \n Unit/E2E commands, golden policy and independent PDF verification \n \n \n  Test corpus  \n Fixture sources, adaptations and reference provenance \n \n \n  Diff thresholds  \n Per-fixture visual tolerances and known rendering differences \n \n \n  DataMatrix  \n ECC 200 and Legacy behavior, dimensions, field data and evidence \n \n \n  Rendering notes  \n Print-mirror semantics and QR mask selection \n \n \n  TSPL baselines  \n Calibration policy, reference coverage and unresolved differences \n \n \n  Docker publishing  \n Maintainer configuration, image tags and publishing workflow \n \n \n \n Release history lives in the  changelog . Build and integration\ndetails stay beside their code:  Android ,\n WASM package  and the\n Worker deployment workflow . \n Keep documentation organized \n \n  tutorials/  is the only subdirectory here. Keep platform walkthroughs there\n  and maintained reference documents at the root, linked from this index. \n Give each topic one canonical document. Link to it from tutorials and the\n  repository README instead of copying implementation or test details. \n Keep test fixtures and golden provenance under  testdata/ , runnable checks\n  under  e2e/ , and generated reports under ignored  output/  or CI artifacts. \n Keep completed plans, task checklists and one-off investigation results in\n  Git/PR history. Preserve lasting semantics, source attribution and evidence\n  limitations in the appropriate reference document. \n Update inbound links when renaming or removing a document. Keep dated\n  observations scoped to their renderer/device; do not present old test totals\n  or measurements as the current build's result. \n \n The SVG logos and preview PNGs at this root are shared documentation assets;\ntheir paths are also used by package READMEs and playground metadata. \n Update the built-in docs \n Markdown in this directory is the source for the playground documentation.\nThe page manifest and compiler live in  tools/docs/build.py . To regenerate: \n  python3 -m venv /tmp/labelize-docs\n/tmp/labelize-docs/bin/pip install -r tools/docs/requirements.txt\n/tmp/labelize-docs/bin/python tools/docs/build.py\n/tmp/labelize-docs/bin/python tools/docs/build.py --check\n  \n Commit the Markdown and generated  src/playground/docs.html  together. CI checks\nfor stale output and broken internal page/section links. Native, Worker and\nWASM playgrounds embed the same bundle; runtime builds need neither Python\nnor a documentation server. Add runnable examples with a fenced-code info\nstring such as  zpl playground width=100 height=60 dpmm=8 ; the dimensions and\nresolution must match the surrounding explanation. Only mark complete,\nrenderable examples this way. Other code blocks are copyable references. "},{"id":"tutorials","group":"Integrate","title":"Labelize Tutorials","file":"tutorials/README.md","html":"\u003ch1 id=\"labelize-tutorials\">Labelize Tutorials\u003c/h1>\n\u003cp>Step-by-step guides for using Labelize on each platform. Every platform uses\nthe same Rust rendering engine and supports ZPL, EPL, TSPL/TSC, CPCL and DPL.\nMatch input bytes, dimensions and output options when comparing platforms;\nwrapper defaults can differ. For reference material, see the\n\u003ca href=\"#docs/index\">documentation index\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tutorial\u003c/th>\n\u003cth>Platform\u003c/th>\n\u003cth>Start here if you want to…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/cli\">Command Line\u003c/a>\u003c/td>\n\u003ctd>macOS · Linux · Windows\u003c/td>\n\u003ctd>Convert label files to PNG/PDF from a shell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/docker\">Docker\u003c/a>\u003c/td>\n\u003ctd>Any host with Docker\u003c/td>\n\u003ctd>Run a self-hosted conversion service in a container\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/http\">HTTP Service\u003c/a>\u003c/td>\n\u003ctd>Bare metal · container · Cloudflare Workers\u003c/td>\n\u003ctd>Convert labels over a REST API, use the web playground\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/javascript\">JavaScript / WebAssembly\u003c/a>\u003c/td>\n\u003ctd>Node.js · bundlers · browsers\u003c/td>\n\u003ctd>Render labels client-side with \u003ccode>@goodboy008/labelize-wasm\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/android\">Android\u003c/a>\u003c/td>\n\u003ctd>Android (minSdk 24)\u003c/td>\n\u003ctd>Render labels inside an Android app via the AAR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#docs/rust\">Rust Library\u003c/a>\u003c/td>\n\u003ctd>Any Rust project\u003c/td>\n\u003ctd>Call the parser/renderer directly from Rust code\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"picking-a-surface\">Picking a surface\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>One-off conversions\u003c/strong> → \u003ca href=\"#docs/cli\">CLI\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>Service for other systems to call\u003c/strong> → \u003ca href=\"#docs/docker\">Docker\u003c/a> or \u003ca href=\"#docs/http\">HTTP service\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>No server, render in the user's browser\u003c/strong> → \u003ca href=\"#docs/javascript\">JavaScript/WASM\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>Mobile app\u003c/strong> → \u003ca href=\"#docs/android\">Android\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>Already in Rust\u003c/strong> → \u003ca href=\"#docs/rust\">Rust library\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"common-concepts\">Common concepts\u003c/h2>\n\u003cp>A few terms shared by every tutorial:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Input language\u003c/strong> — ZPL, EPL, TSPL/TSC, CPCL or DPL. Select it explicitly\n  or use the detection supported by the platform: file extension, content\n  type or input bytes. See each tutorial for its defaults.\u003c/li>\n\u003cli>\u003cstrong>Label size\u003c/strong> — width × height in millimetres. Native high-level APIs use\n  explicit dimensions, then supported label-declared dimensions, then\n  102 × 152 mm (approximately 4″ × 6″). The hosted Worker's raster mode defaults\n  omitted dimensions to 102 × 152 mm; its vector mode uses declared dimensions\n  before that fallback. Send explicit dimensions when needed.\u003c/li>\n\u003cli>\u003cstrong>dpmm\u003c/strong> — dots per millimetre, i.e. print resolution. 8 dpmm = 203 dpi\n  (most common), 6 dpmm = 152 dpi, 12 dpmm ≈ 305 dpi, 24 dpmm ≈ 610 dpi (often called 300/600 dpi classes).\n  Higher dpmm → larger pixel dimensions for the same physical size.\u003c/li>\n\u003cli>\u003cstrong>PNG vs PDF\u003c/strong> — raster output is the default: PNG is black/white unless\n  antialiasing is enabled, and PDF embeds the rendered image. Both PNG modes\n  use 8-bit grayscale samples. Opt-in \u003ca href=\"#docs/vector\">vector output\u003c/a>\n  adds searchable native PDF text, scalable geometry, multipage PDF and PNG\n  scaling independent of the source printer resolution.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"try-it-without-installing-anything\">Try it without installing anything\u003c/h2>\n\u003cp>The public playground runs the latest \u003ccode>main\u003c/code> build:\n\u003ca href=\"https://labelize.764629910.workers.dev\">https://labelize.764629910.workers.dev\u003c/a> — paste ZPL/EPL/TSPL/CPCL/DPL, preview, download\nPNG/PDF, and optionally score your render against the\n\u003ca href=\"http://labelary.com/\">Labelary\u003c/a> reference.\u003c/p>","headings":[["2","picking-a-surface","Picking a surface"],["2","common-concepts","Common concepts"],["2","try-it-without-installing-anything","Try it without installing anything"]],"examples":[],"search":" Labelize Tutorials \n Step-by-step guides for using Labelize on each platform. Every platform uses\nthe same Rust rendering engine and supports ZPL, EPL, TSPL/TSC, CPCL and DPL.\nMatch input bytes, dimensions and output options when comparing platforms;\nwrapper defaults can differ. For reference material, see the\n documentation index . \n \n \n \n Tutorial \n Platform \n Start here if you want to… \n \n \n \n \n  Command Line  \n macOS · Linux · Windows \n Convert label files to PNG/PDF from a shell \n \n \n  Docker  \n Any host with Docker \n Run a self-hosted conversion service in a container \n \n \n  HTTP Service  \n Bare metal · container · Cloudflare Workers \n Convert labels over a REST API, use the web playground \n \n \n  JavaScript / WebAssembly  \n Node.js · bundlers · browsers \n Render labels client-side with  @goodboy008/labelize-wasm  \n \n \n  Android  \n Android (minSdk 24) \n Render labels inside an Android app via the AAR \n \n \n  Rust Library  \n Any Rust project \n Call the parser/renderer directly from Rust code \n \n \n \n Picking a surface \n \n  One-off conversions  →  CLI  \n  Service for other systems to call  →  Docker  or  HTTP service  \n  No server, render in the user's browser  →  JavaScript/WASM  \n  Mobile app  →  Android  \n  Already in Rust  →  Rust library  \n \n Common concepts \n A few terms shared by every tutorial: \n \n  Input language  — ZPL, EPL, TSPL/TSC, CPCL or DPL. Select it explicitly\n  or use the detection supported by the platform: file extension, content\n  type or input bytes. See each tutorial for its defaults. \n  Label size  — width × height in millimetres. Native high-level APIs use\n  explicit dimensions, then supported label-declared dimensions, then\n  102 × 152 mm (approximately 4″ × 6″). The hosted Worker's raster mode defaults\n  omitted dimensions to 102 × 152 mm; its vector mode uses declared dimensions\n  before that fallback. Send explicit dimensions when needed. \n  dpmm  — dots per millimetre, i.e. print resolution. 8 dpmm = 203 dpi\n  (most common), 6 dpmm = 152 dpi, 12 dpmm ≈ 305 dpi, 24 dpmm ≈ 610 dpi (often called 300/600 dpi classes).\n  Higher dpmm → larger pixel dimensions for the same physical size. \n  PNG vs PDF  — raster output is the default: PNG is black/white unless\n  antialiasing is enabled, and PDF embeds the rendered image. Both PNG modes\n  use 8-bit grayscale samples. Opt-in  vector output \n  adds searchable native PDF text, scalable geometry, multipage PDF and PNG\n  scaling independent of the source printer resolution. \n \n Try it without installing anything \n The public playground runs the latest  main  build:\n https://labelize.764629910.workers.dev  — paste ZPL/EPL/TSPL/CPCL/DPL, preview, download\nPNG/PDF, and optionally score your render against the\n Labelary  reference. "}]</script>
