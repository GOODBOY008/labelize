torial\u003c/a> — same engine as a REST API with a\n  built-in web playground\u003c/li>\n\u003cli>\u003ca href=\"#docs/docker\">Docker tutorial\u003c/a> — run the service in a container\u003c/li>\n\u003cli>\u003ccode>labelize convert --help\u003c/code> — the authoritative flag list\u003c/li>\n\u003c/ul>","headings":[["2","1-install","1. Install"],["2","2-your-first-conversion","2. Your first conversion"],["2","3-choose-the-output-type-and-path","3. Choose the output type and path"],["2","4-get-the-size-right","4. Get the size right"],["2","5-antialiased-output-optional","5. Antialiased output (optional)"],["2","6-batch-conversion","6. Batch conversion"],["2","7-whats-next","7. What's next"]],"examples":[],"search":" Tutorial: Command Line (macOS · Linux · Windows) \n  All tutorials  ·  Documentation index  \n Convert  .zpl  /  .epl  /  .tspl  /  .cpcl  /  .dpl  files to PNG or PDF from a shell. Format is\nauto-detected from the file extension. \n 1. Install \n  macOS / Linux (Homebrew)  \n  brew tap GOODBOY008/homebrew-labelize\nbrew install labelize\n  \n  Any OS with a Rust toolchain  (builds from source, ~1 min) \n  cargo install labelize --features cli\n# or, from a checkout of this repo:\ncargo install --path . --features cli\n  \n  Windows (pre-built binary)  \n \n Go to  https://github.com/GOODBOY008/labelize/releases  \n Download  labelize-x86_64-pc-windows-msvc.zip  \n Extract  labelize.exe  and put its folder on your  PATH  \n \n (Windows with a Rust toolchain:  cargo install labelize --features cli  works too.) \n Verify: \n  labelize --help\n  \n 2. Your first conversion \n  labelize convert label.zpl          # → label.png, next to the input\n  \n EPL works the same way —  labelize convert label.epl . If the file has a\ndifferent extension, force the format: \n  labelize convert data.txt --format zpl\nlabelize convert data.txt --format tspl   # TSPL/TSC input\n  \n A file containing several labels ( ^XA…^XZ  repeated, or several  P  commands\nin EPL) produces one output per label:  label_1.png ,  label_2.png , … \n 3. Choose the output type and path \n  labelize convert label.zpl -t pdf            # → label.pdf (single-page PDF)\nlabelize convert label.zpl -o out/label.png  # explicit output path\n  \n For searchable vector PDF, multipage PDF or larger PNG exports, see\n Vector output . \n 4. Get the size right \n The canvas uses explicit dimensions, then supported label-declared dimensions,\nthen 102 × 152 mm at 8 dpmm. If your label looks\ncropped or has excess whitespace, override: \n  labelize convert label.zpl --width 100 --height 62   # 100 × 62 mm\nlabelize convert label.zpl --dpmm 12                 # 300 dpi → bigger pixels\nlabelize convert label.zpl --dpmm 6                  # 152 dpi\n  \n Tip: many carrier labels declare their width with  ^PW  (in dots). Divide by\nthe dpmm to get millimetres — e.g.  ^PW812  at 8 dpmm ≈ 101.5 mm. \n 5. Antialiased output (optional) \n By default the PNG stores black/white pixels in an 8-bit grayscale image.\nTo keep antialiased greys (closer to Labelary's preview): \n  labelize convert label.zpl --antialias\n  \n 6. Batch conversion \n The CLI converts one file per invocation; loop in your shell: \n  for f in labels/*.zpl; do labelize convert \"$f\"; done\n  \n For recurring service-style workloads, consider the\n HTTP service  instead. \n 7. What's next \n \n  HTTP service tutorial  — same engine as a REST API with a\n  built-in web playground \n  Docker tutorial  — run the service in a container \n  labelize convert --help  — the authoritative flag list \n "},{"id":"docker","group":"Integrate","title":"Tutorial: Docker","file":"tutorials/docker.md","html":"\u003ch1 id=\"tutorial-docker\">Tutorial: Docker\u003c/h1>\n\u003cp>\u003ca href=\"#docs/tutorials\">All tutorials\u003c/a> · \u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Run the Labelize HTTP service (REST API + web playground) in a container.\nPre-built multi-arch images (\u003ccode>linux/amd64\u003c/code> + \u003ccode>linux/arm64\u003c/code>) are published on\nevery release.\u003c/p>\n\u003ch2 id=\"1-run-the-service\">1. Run the service\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\"># Docker Hub\ndocker run -p 8080:8080 goodboy008/labelize:latest\n\n# or GitHub Container Registry\ndocker run -p 8080:8080 ghcr.io/goodboy008/labelize:latest\n\u003c/code>\u003c/pre>\n\u003cp>Available tags:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tag\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>latest\u003c/code>\u003c/td>\n\u003ctd>newest stable release\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1.6.0\u003c/code> / \u003ccode>1.6\u003c/code> / \u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>pinned release versions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>edge\u003c/code>\u003c/td>\n\u003ctd>current \u003ccode>main\u003c/code> branch\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"2-verify-its-up\">2. Verify it's up\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">curl http://localhost:8080/health\n# {\u0026quot;status\u0026quot;:\u0026quot;ok\u0026quot;}\n\u003c/code>\u003c/pre>\n\u003cp>Open \u003ca href=\"http://localhost:8080/\">http://localhost:8080/\u003c/a> in a browser for the interactive playground —\npaste ZPL/EPL/TSPL/CPCL/DPL, pick a label size, download PNG or PDF.\u003c/p>\n\u003ch2 id=\"3-convert-a-label\">3. Convert a label\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST http://localhost:8080/convert \\\n  -H \u0026quot;Content-Type: application/zpl\u0026quot; \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello Docker^FS^XZ' \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003cp>The \u003ccode>Content-Type\u003c/code> header selects the parser (\u003ccode>application/zpl\u003c/code>,\n\u003ccode>application/epl\u003c/code>, or \u003ccode>application/tspl\u003c/code>; without one, the body is sniffed).\nQuery parameters (\u003ccode>width\u003c/code>, \u003ccode>height\u003c/code>, \u003ccode>dpmm\u003c/code>, \u003ccode>output\u003c/code>,\n\u003ccode>antialias\u003c/code>) are the same as the native service — see the\n\u003ca href=\"#docs/http/convert-label-bytes\">HTTP service tutorial\u003c/a> for the full table.\u003c/p>\n\u003ch2 id=\"4-run-with-compose\">4. Run with Compose\u003c/h2>\n\u003cp>A \u003ccode>docker-compose.yaml\u003c/code> ships in the repo root:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">git clone https://github.com/GOODBOY008/labelize\ncd labelize\ndocker compose up -d --build\n\u003c/code>\u003c/pre>\n\u003cp>This builds the image from source (useful for custom forks or offline\nenvironments) and starts it on port 8080.\u003c/p>\n\u003ch2 id=\"5-production-notes\">5. Production notes\u003c/h2>\n\u003cul>\n\u003cli>The container listens on \u003ccode>0.0.0.0:8080\u003c/code>; map \u003ccode>-p 8080:8080\u003c/code> or adjust to\n  taste. Put a TLS-terminating reverse proxy in front for public exposure.\u003c/li>\n\u003cli>The service is stateless — scale horizontally behind a load balancer if\n  needed.\u003c/li>\n\u003cli>Pin a version tag (\u003ccode>docker.io/goodboy008/labelize:1.6.0\u003c/code>) rather than\n  \u003ccode>latest\u003c/code> for reproducible deployments.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"6-whats-next\">6. What's next\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/http\">HTTP service tutorial\u003c/a> — full API reference\u003c/li>\n\u003cli>\u003ca href=\"#docs/cli\">CLI tutorial\u003c/a> — one-off conversions without a server\u003c/li>\n\u003c/ul>","headings":[["2","1-run-the-service","1. Run the service"],["2","2-verify-its-up","2. Verify it's up"],["2","3-convert-a-label","3. Convert a label"],["2","4-run-with-compose","4. Run with Compose"],["2","5-production-notes","5. Production notes"],["2","6-whats-next","6. What's next"]],"examples":[],"search":" Tutorial: Docker \n  All tutorials  ·  Documentation index  \n Run the Labelize HTTP service (REST API + web playground) in a container.\nPre-built multi-arch images ( linux/amd64  +  linux/arm64 ) are published on\nevery release. \n 1. Run the service \n  # Docker Hub\ndocker run -p 8080:8080 goodboy008/labelize:latest\n\n# or GitHub Container Registry\ndocker run -p 8080:8080 ghcr.io/goodboy008/labelize:latest\n  \n Available tags: \n \n \n \n Tag \n Meaning \n \n \n \n \n  latest  \n newest stable release \n \n \n  1.6.0  /  1.6  /  1  \n pinned release versions \n \n \n  edge  \n current  main  branch \n \n \n \n 2. Verify it's up \n  curl http://localhost:8080/health\n# {\"status\":\"ok\"}\n  \n Open  http://localhost:8080/  in a browser for the interactive playground —\npaste ZPL/EPL/TSPL/CPCL/DPL, pick a label size, download PNG or PDF. \n 3. Convert a label \n  curl -X POST http://localhost:8080/convert \\\n  -H \"Content-Type: application/zpl\" \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello Docker^FS^XZ' \\\n  -o label.png\n  \n The  Content-Type  header selects the parser ( application/zpl ,\n application/epl , or  application/tspl ; without one, the body is sniffed).\nQuery parameters ( width ,  height ,  dpmm ,  output ,\n antialias ) are the same as the native service — see the\n HTTP service tutorial  for the full table. \n 4. Run with Compose \n A  docker-compose.yaml  ships in the repo root: \n  git clone https://github.com/GOODBOY008/labelize\ncd labelize\ndocker compose up -d --build\n  \n This builds the image from source (useful for custom forks or offline\nenvironments) and starts it on port 8080. \n 5. Production notes \n \n The container listens on  0.0.0.0:8080 ; map  -p 8080:8080  or adjust to\n  taste. Put a TLS-terminating reverse proxy in front for public exposure. \n The service is stateless — scale horizontally behind a load balancer if\n  needed. \n Pin a version tag ( docker.io/goodboy008/labelize:1.6.0 ) rather than\n   latest  for reproducible deployments. \n \n 6. What's next \n \n  HTTP service tutorial  — full API reference \n  CLI tutorial  — one-off conversions without a server \n "},{"id":"rust","group":"Integrate","title":"Tutorial: Rust Library","file":"tutorials/rust-library.md","html":"\u003ch1 id=\"tutorial-rust-library\">Tutorial: Rust Library\u003c/h1>\n\u003cp>\u003ca href=\"#docs/tutorials\">All tutorials\u003c/a> · \u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Use Labelize as a crate when the caller is already Rust — a batch converter,\na print spooler, an HTTP endpoint of your own, or a test harness that must\nassert on rendered labels.\u003c/p>\n\u003ch2 id=\"1-add-the-dependency\">1. Add the dependency\u003c/h2>\n\u003cpre>\u003ccode class=\"language-toml\">[dependencies]\nlabelize = \u0026quot;1.8\u0026quot;\nimage = \u0026quot;0.25\u0026quot;   # only if you post-process the rendered pixels\n\u003c/code>\u003c/pre>\n\u003cp>The default features are enough for library use; \u003ccode>cli\u003c/code> / \u003ccode>serve\u003c/code> features are\nonly needed for the binaries.\u003c/p>\n\u003ch2 id=\"2-one-call-render_png-render_pdf\">2. One call: \u003ccode>render_png\u003c/code> / \u003ccode>render_pdf\u003c/code>\u003c/h2>\n\u003cp>The high-level API (\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/src/render.rs\">\u003ccode>src/render.rs\u003c/code>\u003c/a>) detects the\nlanguage, parses, resolves the canvas, and encodes — bytes in, bytes out:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{render_png, RenderOptions};\n\nlet input = b\u0026quot;^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\u0026quot;;\n\nlet out = render_png(input, RenderOptions::default())?;\n// out.language == Language::Zpl (auto-detected)\n// out.labels  == 1             (total labels in the input)\n// out.bytes   — PNG file bytes\nstd::fs::write(\u0026quot;output.png\u0026quot;, out.bytes)?;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>render_pdf\u003c/code> takes the same arguments and returns PDF bytes. Everything is\nsteerable through \u003ccode>RenderOptions\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{render_pdf, Language, RenderOptions};\n\nlet opts = RenderOptions {\n    language: Some(Language::Epl), // None = auto-detect\n    width_mm: Some(100.0),         // None = label-declared, else 102×152\n    height_mm: Some(62.0),\n    dpmm: 12,\n    antialias: false,\n};\nlet out = render_pdf(epl_bytes, opts)?;\n\u003c/code>\u003c/pre>\n\u003cp>Errors are a single \u003ccode>LabelizeError\u003c/code>: \u003ccode>Parse\u003c/code> variants are user-input\nproblems, everything else is engine-side — the same split the built-in HTTP\nservice maps to 400 vs 500.\u003c/p>\n\u003ch2 id=\"3-the-composable-path-detect-parse-render\">3. The composable path: detect → parse → render\u003c/h2>\n\u003cp>When you need element-level access, want to iterate every label, or stream\ninto your own writer, drop to the front door in\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/src/lang.rs\">\u003ccode>src/lang.rs\u003c/code>\u003c/a> — one enum, one dispatch, all three\nlanguages:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use std::io::Cursor;\nuse labelize::{detect_language, parse_labels, DrawerOptions, Renderer};\n\nlet input = b\u0026quot;^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\u0026quot;;\n\n// Detect the language from the shape of the data (caret stream → ZPL,\n// letter+commas lines → EPL, `SIZE`/`TEXT` words → TSPL).\nlet language = detect_language(input);\n\n// Parse — one input can contain several labels (^XA…^XZ repeated, ^PQ\n// quantities), so you always get a Vec.\nlet labels = parse_labels(language, input, 8)?;\n\n// Render + encode — pixels go straight into any `impl Write`.\nlet renderer = Renderer::new();\nlet mut buf = Cursor::new(Vec::new());\nrenderer\n    .draw_label_as_png(\u0026amp;labels[0], \u0026amp;mut buf, DrawerOptions::default())?;\nstd::fs::write(\u0026quot;output.png\u0026quot;, buf.into_inner())?;\n\u003c/code>\u003c/pre>\n\u003cp>When you already know the language, skip the sniff:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{parse_labels, Language};\n\nlet labels = parse_labels(Language::Tspl, tspl_bytes, 8)?;\n\u003c/code>\u003c/pre>\n\u003cp>The per-language parsers (\u003ccode>ZplParser\u003c/code>, \u003ccode>EplParser\u003c/code>, \u003ccode>TsplParser\u003c/code>) remain\npublic for direct use, but \u003ccode>parse_labels\u003c/code> is the recommended entry point —\nit is the only place that picks a parser, and new languages land there.\u003c/p>\n\u003ch2 id=\"4-validate-without-rendering\">4. Validate without rendering\u003c/h2>\n\u003cp>Before you spend a render — or before you show a user an error — check the\nsource and get the exact parser failure. \u003ccode>validate\u003c/code> never fails; the outcome\ntravels in the report:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{validate, Language};\n\nlet report = validate(b\u0026quot;N\\nq812\\nB10,10,0,9,2,4,80,B,\\\u0026quot;oops\\\u0026quot;\\nP1\\n\u0026quot;, 8, None);\n\nassert_eq!(report.language, Language::Epl); // auto-detected\nassert!(!report.ok);\nassert!(report.error.as_deref().unwrap().contains(\u0026quot;unsupported bar code type\u0026quot;));\n\nlet ok = validate(b\u0026quot;^XA^FDHi^FS^XZ\u0026quot;, 8, Some(Language::Zpl));\nassert!(ok.ok \u0026amp;\u0026amp; ok.labels == 1);\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>ValidationReport\u003c/code> fields: \u003ccode>language\u003c/code>, \u003ccode>ok\u003c/code>, \u003ccode>labels\u003c/code> (label count), \u003ccode>error\u003c/code>\n(\u003ccode>Some(msg)\u003c/code> when parsing failed). Passing \u003ccode>Some(language)\u003c/code> forces a parser\nand skips detection; empty input reports \u003ccode>ok: true\u003c/code> with \u003ccode>labels: 0\u003c/code> —\n\"parses to nothing\", not \"invalid\".\u003c/p>\n\u003ch2 id=\"5-format-pretty-print-label-source\">5. Format (pretty-print) label source\u003c/h2>\n\u003cp>\u003ccode>format_source\u003c/code> reflows source one command per line — \u003ccode>^XA\u003c/code> blocks indented,\nCRLF normalized, blank runs collapsed — without changing what renders:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{format_source, Language};\n\nlet (language, formatted) = format_source(b\u0026quot;^XA^CF0,60^FO50,50^FDHello^FS^XZ\u0026quot;, None);\n\nassert_eq!(language, Language::Zpl);\nassert_eq!(formatted, b\u0026quot;^XA\\n  ^CF0,60\\n  ^FO50,50\\n  ^FDHello\\n^FS\\n^XZ\\n\u0026quot;);\n\u003c/code>\u003c/pre>\n\u003cp>The return is raw \u003ccode>Vec\u0026lt;u8\u0026gt;\u003c/code>, not \u003ccode>String\u003c/code>: binary payloads (\u003ccode>^FD\u003c/code> field\ndata, \u003ccode>GW\u003c/code>/\u003ccode>BITMAP\u003c/code> graphics) pass through byte-for-byte, and those are not\nvalid UTF-8. On real corpus labels the formatted source renders\npixel-identically (sha256-verified), so it is safe to expose as a\n\"beautify\" feature. Formatting never fails and never rejects input.\u003c/p>\n\u003ch2 id=\"6-control-the-canvas-with-draweroptions\">6. Control the canvas with \u003ccode>DrawerOptions\u003c/code>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-rust\">let options = DrawerOptions {\n    label_width_mm: 101.6,     // default 101.6 (4\u0026quot;)\n    label_height_mm: 152.0,    // default 203.2 (8\u0026quot;) — set to your stock size\n    dpmm: 8,                   // 6 / 8 / 12 / 24\n    enable_inverted_labels: true, // honor ^PO I (default true)\n    antialias: false,          // true → grayscale coverage instead of black/white\n};\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>DrawerOptions::with_defaults()\u003c/code> fills any zero field with the defaults —\nhandy when dimensions come from user input that may be unset\n(\u003ccode>draw_label_as_png\u003c/code> applies it for you).\u003c/p>\n\u003cp>TSPL labels carry their own physical size (\u003ccode>SIZE 60 mm,30 mm\u003c/code>) in\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/src/elements/label_info.rs\">\u003ccode>LabelInfo\u003c/code>\u003c/a>. The built-in CLI and HTTP\nservice prefer an explicit user size, then the label's declared one, then\nthe fallback — copy the pattern when dimensions are optional for you:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">let label = \u0026amp;labels[0];\nlet options = DrawerOptions {\n    label_width_mm: user_width.or(label.label_width_mm).unwrap_or(101.6),\n    label_height_mm: user_height.or(label.label_height_mm).unwrap_or(203.2),\n    dpmm: 8,\n    ..DrawerOptions::default()\n};\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"7-pdf-output\">7. PDF output\u003c/h2>\n\u003cp>The default raster PDF wraps the rendered pixels in a single-page document.\nFor native searchable text and multipage output, see \u003ca href=\"#docs/vector\">Vector output\u003c/a>.\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::encode_pdf;\n\nlet mut png = Cursor::new(Vec::new());\nrenderer.draw_label_as_png(\u0026amp;labels[0], \u0026amp;mut png, options.clone())?;\nlet img = image::load_from_memory(\u0026amp;png.into_inner())?.to_rgba8();\nlet mut pdf = Cursor::new(Vec::new());\nencode_pdf(\u0026amp;img, \u0026amp;options, \u0026amp;mut pdf)?;\nstd::fs::write(\u0026quot;output.pdf\u0026quot;, pdf.into_inner())?;\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"8-multiple-labels-per-input\">8. Multiple labels per input\u003c/h2>\n\u003cp>\u003ccode>^XA…^XZ\u003c/code> blocks repeat, and \u003ccode>^PQ\u003c/code> multiplies a single block into a print\nquantity — both arrive as extra entries in the \u003ccode>Vec\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">let labels = parse_labels(language, input, 8)?;\nfor (i, label) in labels.iter().enumerate() {\n    let mut buf = Cursor::new(Vec::new());\n    renderer.draw_label_as_png(label, \u0026amp;mut buf, options.clone())?;\n    std::fs::write(format!(\u0026quot;label-{i}.png\u0026quot;), buf.into_inner())?;\n}\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"9-error-handling\">9. Error handling\u003c/h2>\n\u003cp>Two stages fail differently — keep them distinct in your messages, they map\nto HTTP 400 vs 500 in the built-in service:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Stage\u003c/th>\n\u003cth>Call\u003c/th>\n\u003cth>Error type\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Any\u003c/td>\n\u003ctd>\u003ccode>render_png\u003c/code> / \u003ccode>render_pdf\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LabelizeError\u003c/code> — \u003ccode>Parse\u003c/code> variants are user-input, the rest engine-side\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Parse\u003c/td>\n\u003ctd>\u003ccode>parse_labels\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LabelizeError::Parse(String)\u003c/code> — bad input, user's fault\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Render\u003c/td>\n\u003ctd>\u003ccode>draw_label_as_png\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>String\u003c/code> — low-level; the one-call API wraps this into \u003ccode>LabelizeError::Render\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Encode\u003c/td>\n\u003ctd>\u003ccode>encode_pdf\u003c/code> / \u003ccode>encode_png\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>LabelizeError\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>validate\u003c/code> sits outside the table: it converts parse failures into data, so\n\"what is wrong with this snippet\" is a question you ask \u003cem>before\u003c/em> rendering\ninstead of an \u003ccode>Err\u003c/code> you unpack after.\u003c/p>\n\u003ch2 id=\"10-a-complete-runnable-example\">10. A complete, runnable example\u003c/h2>\n\u003cp>The repo ships a ~90-line example that turns these pieces into a mini\n\u003ccode>convert\u003c/code> command with PNG/PDF output:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cargo run --example render_label -- testdata/labels/amazon.zpl out.png\n\u003c/code>\u003c/pre>\n\u003cp>Source: \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/examples/render_label.rs\">\u003ccode>examples/render_label.rs\u003c/code>\u003c/a>.\u003c/p>\n\u003ch2 id=\"11-whats-next\">11. What's next\u003c/h2>\n\u003cul>\n\u003cli>Explore the modules — \u003ccode>parsers/\u003c/code> (ZPL/EPL/TSPL/CPCL/DPL), \u003ccode>elements/\u003c/code> (typed label\n  elements), \u003ccode>drawers/renderer.rs\u003c/code> (rasterizer), \u003ccode>images/\u003c/code> (PNG/PDF encoders)\u003c/li>\n\u003cli>\u003ca href=\"#docs/zpl\">\u003ccode>docs/ZPL_COMMANDS_REFERENCE.md\u003c/code>\u003c/a> — the\n  supported command matrix\u003c/li>\n\u003cli>\u003ca href=\"#docs/http\">HTTP service tutorial\u003c/a> — wrap this API in axum yourself,\n  or reuse the built-in server (\u003ccode>/convert\u003c/code>, \u003ccode>/validate\u003c/code>, \u003ccode>/format\u003c/code>)\u003c/li>\n\u003c/ul>","headings":[["2","1-add-the-dependency","1. Add the dependency"],["2","2-one-call-render_png-render_pdf","2. One call: render_png / render_pdf"],["2","3-the-composable-path-detect-parse-render","3. The composable path: detect → parse → render"],["2","4-validate-without-rendering","4. Validate without rendering"],["2","5-format-pretty-print-label-source","5. Format (pretty-print) label source"],["2","6-control-the-canvas-with-draweroptions","6. Control the canvas with DrawerOptions"],["2","7-pdf-output","7. PDF output"],["2","8-multiple-labels-per-input","8. Multiple labels per input"],["2","9-error-handling","9. Error handling"],["2","10-a-complete-runnable-example","10. A complete, runnable example"],["2","11-whats-next","11. What's next"]],"examples":[],"search":" Tutorial: Rust Library \n  All tutorials  ·  Documentation index  \n Use Labelize as a crate when the caller is already Rust — a batch converter,\na print spooler, an HTTP endpoint of your own, or a test harness that must\nassert on rendered labels. \n 1. Add the dependency \n  [dependencies]\nlabelize = \"1.8\"\nimage = \"0.25\"   # only if you post-process the rendered pixels\n  \n The default features are enough for library use;  cli  /  serve  features are\nonly needed for the binaries. \n 2. One call:  render_png  /  render_pdf  \n The high-level API (  src/render.rs  ) detects the\nlanguage, parses, resolves the canvas, and encodes — bytes in, bytes out: \n  use labelize::{render_png, RenderOptions};\n\nlet input = b\"^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\";\n\nlet out = render_png(input, RenderOptions::default())?;\n// out.language == Language::Zpl (auto-detected)\n// out.labels  == 1             (total labels in the input)\n// out.bytes   — PNG file bytes\nstd::fs::write(\"output.png\", out.bytes)?;\n  \n  render_pdf  takes the same arguments and returns PDF bytes. Everything is\nsteerable through  RenderOptions : \n  use labelize::{render_pdf, Language, RenderOptions};\n\nlet opts = RenderOptions {\n    language: Some(Language::Epl), // None = auto-detect\n    width_mm: Some(100.0),         // None = label-declared, else 102×152\n    height_mm: Some(62.0),\n    dpmm: 12,\n    antialias: false,\n};\nlet out = render_pdf(epl_bytes, opts)?;\n  \n Errors are a single  LabelizeError :  Parse  variants are user-input\nproblems, everything else is engine-side — the same split the built-in HTTP\nservice maps to 400 vs 500. \n 3. The composable path: detect → parse → render \n When you need element-level access, want to iterate every label, or stream\ninto your own writer, drop to the front door in\n  src/lang.rs   — one enum, one dispatch, all three\nlanguages: \n  use std::io::Cursor;\nuse labelize::{detect_language, parse_labels, DrawerOptions, Renderer};\n\nlet input = b\"^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\";\n\n// Detect the language from the shape of the data (caret stream → ZPL,\n// letter+commas lines → EPL, `SIZE`/`TEXT` words → TSPL).\nlet language = detect_language(input);\n\n// Parse — one input can contain several labels (^XA…^XZ repeated, ^PQ\n// quantities), so you always get a Vec.\nlet labels = parse_labels(language, input, 8)?;\n\n// Render + encode — pixels go straight into any `impl Write`.\nlet renderer = Renderer::new();\nlet mut buf = Cursor::new(Vec::new());\nrenderer\n    .draw_label_as_png(\u0026labels[0], \u0026mut buf, DrawerOptions::default())?;\nstd::fs::write(\"output.png\", buf.into_inner())?;\n  \n When you already know the language, skip the sniff: \n  use labelize::{parse_labels, Language};\n\nlet labels = parse_labels(Language::Tspl, tspl_bytes, 8)?;\n  \n The per-language parsers ( ZplParser ,  EplParser ,  TsplParser ) remain\npublic for direct use, but  parse_labels  is the recommended entry point —\nit is the only place that picks a parser, and new languages land there. \n 4. Validate without rendering \n Before you spend a render — or before you show a user an error — check the\nsource and get the exact parser failure.  validate  never fails; the outcome\ntravels in the report: \n  use labelize::{validate, Language};\n\nlet report = validate(b\"N\\nq812\\nB10,10,0,9,2,4,80,B,\\\"oops\\\"\\nP1\\n\", 8, None);\n\nassert_eq!(report.language, Language::Epl); // auto-detected\nassert!(!report.ok);\nassert!(report.error.as_deref().unwrap().contains(\"unsupported bar code type\"));\n\nlet ok = validate(b\"^XA^FDHi^FS^XZ\", 8, Some(Language::Zpl));\nassert!(ok.ok \u0026\u0026 ok.labels == 1);\n  \n  ValidationReport  fields:  language ,  ok ,  labels  (label count),  error \n( Some(msg)  when parsing failed). Passing  Some(language)  forces a parser\nand skips detection; empty input reports  ok: true  with  labels: 0  —\n\"parses to nothing\", not \"invalid\". \n 5. Format (pretty-print) label source \n  format_source  reflows source one command per line —  ^XA  blocks indented,\nCRLF normalized, blank runs collapsed — without changing what renders: \n  use labelize::{format_source, Language};\n\nlet (language, formatted) = format_source(b\"^XA^CF0,60^FO50,50^FDHello^FS^XZ\", None);\n\nassert_eq!(language, Language::Zpl);\nassert_eq!(formatted, b\"^XA\\n  ^CF0,60\\n  ^FO50,50\\n  ^FDHello\\n^FS\\n^XZ\\n\");\n  \n The return is raw  Vec\u003cu8> , not  String : binary payloads ( ^FD  field\ndata,  GW / BITMAP  graphics) pass through byte-for-byte, and those are not\nvalid UTF-8. On real corpus labels the formatted source renders\npixel-identically (sha256-verified), so it is safe to expose as a\n\"beautify\" feature. Formatting never fails and never rejects input. \n 6. Control the canvas with  DrawerOptions  \n  let options = DrawerOptions {\n    label_width_mm: 101.6,     // default 101.6 (4\")\n    label_height_mm: 152.0,    // default 203.2 (8\") — set to your stock size\n    dpmm: 8,                   // 6 / 8 / 12 / 24\n    enable_inverted_labels: true, // honor ^PO I (default true)\n    antialias: false,          // true → grayscale coverage instead of black/white\n};\n  \n  DrawerOptions::with_defaults()  fills any zero field with the defaults —\nhandy when dimensions come from user input that may be unset\n( draw_label_as_png  applies it for you). \n TSPL labels carry their own physical size ( SIZE 60 mm,30 mm ) in\n  LabelInfo  . The built-in CLI and HTTP\nservice prefer an explicit user size, then the label's declared one, then\nthe fallback — copy the pattern when dimensions are optional for you: \n  let label = \u0026labels[0];\nlet options = DrawerOptions {\n    label_width_mm: user_width.or(label.label_width_mm).unwrap_or(101.6),\n    label_height_mm: user_height.or(label.label_height_mm).unwrap_or(203.2),\n    dpmm: 8,\n    ..DrawerOptions::default()\n};\n  \n 7. PDF output \n The default raster PDF wraps the rendered pixels in a single-page document.\nFor native searchable text and multipage output, see  Vector output . \n  use labelize::encode_pdf;\n\nlet mut png = Cursor::new(Vec::new());\nrenderer.draw_label_as_png(\u0026labels[0], \u0026mut png, options.clone())?;\nlet img = image::load_from_memory(\u0026png.into_inner())?.to_rgba8();\nlet mut pdf = Cursor::new(Vec::new());\nencode_pdf(\u0026img, \u0026options, \u0026mut pdf)?;\nstd::fs::write(\"output.pdf\", pdf.into_inner())?;\n  \n 8. Multiple labels per input \n  ^XA…^XZ  blocks repeat, and  ^PQ  multiplies a single block into a print\nquantity — both arrive as extra entries in the  Vec : \n  let labels = parse_labels(language, input, 8)?;\nfor (i, label) in labels.iter().enumerate() {\n    let mut buf = Cursor::new(Vec::new());\n    renderer.draw_label_as_png(label, \u0026mut buf, options.clone())?;\n    std::fs::write(format!(\"label-{i}.png\"), buf.into_inner())?;\n}\n  \n 9. Error handling \n Two stages fail differently — keep them distinct in your messages, they map\nto HTTP 400 vs 500 in the built-in service: \n \n \n \n Stage \n Call \n Error type \n \n \n \n \n Any \n  render_png  /  render_pdf  \n  LabelizeError  —  Parse  variants are user-input, the rest engine-side \n \n \n Parse \n  parse_labels  \n  LabelizeError::Parse(String)  — bad input, user's fault \n \n \n Render \n  draw_label_as_png  \n  String  — low-level; the one-call API wraps this into  LabelizeError::Render  \n \n \n Encode \n  encode_pdf  /  encode_png  \n  LabelizeError  \n \n \n \n  validate  sits outside the table: it converts parse failures into data, so\n\"what is wrong with this snippet\" is a question you ask  before  rendering\ninstead of an  Err  you unpack after. \n 10. A complete, runnable example \n The repo ships a ~90-line example that turns these pieces into a mini\n convert  command with PNG/PDF output: \n  cargo run --example render_label -- testdata/labels/amazon.zpl out.png\n  \n Source:   examples/render_label.rs  . \n 11. What's next \n \n Explore the modules —  parsers/  (ZPL/EPL/TSPL/CPCL/DPL),  elements/  (typed label\n  elements),  drawers/renderer.rs  (rasterizer),  images/  (PNG/PDF encoders) \n   docs/ZPL_COMMANDS_REFERENCE.md   — the\n  supported command matrix \n  HTTP service tutorial  — wrap this API in axum yourself,\n  or reuse the built-in server ( /convert ,  /validate ,  /format ) \n "},{"id":"javascript","group":"Integrate","title":"Tutorial: JavaScript / WebAssembly","file":"tutorials/javascript-wasm.md","html":"\u003ch1 id=\"tutorial-javascript-webassembly\">Tutorial: JavaScript / WebAssembly\u003c/h1>\n\u003cp>\u003ca href=\"#docs/tutorials\">All tutorials\u003c/a> · \u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Render ZPL, EPL, TSPL/TSC, CPCL and DPL entirely client-side with\n\u003ca href=\"https://www.npmjs.com/package/@goodboy008/labelize-wasm\">\u003ccode>@goodboy008/labelize-wasm\u003c/code>\u003c/a> —\nno server round-trip, works in Node.js, browsers, and bundlers. The public\nplayground at \u003ca href=\"https://labelize.764629910.workers.dev\">https://labelize.764629910.workers.dev\u003c/a> is built on this\npackage.\u003c/p>\n\u003ch2 id=\"1-install\">1. Install\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">npm install @goodboy008/labelize-wasm\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"2-nodejs-20\">2. Node.js (≥ 20)\u003c/h2>\n\u003cp>Import the \u003ccode>/init\u003c/code> subpath — it instantiates the engine from the packaged\n\u003ccode>.wasm\u003c/code> directly, no bundler support or Node flags needed:\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">import { lz_render } from \u0026quot;@goodboy008/labelize-wasm/init\u0026quot;;\nimport { writeFileSync } from \u0026quot;node:fs\u0026quot;;\n\nconst zpl = Buffer.from(\u0026quot;^XA^FO50,50^A0N,40,40^FDHello Node^FS^XZ\u0026quot;, \u0026quot;ascii\u0026quot;);\nconst png = lz_render(zpl, 102.0, 152.0, 8, false, false, false);\n\nwriteFileSync(\u0026quot;label.png\u0026quot;, png); // Uint8Array of PNG bytes\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"3-tspltsc-input\">3. TSPL/TSC input\u003c/h2>\n\u003cp>\u003ccode>lz_render_lang\u003c/code> is the language-explicit variant — \u003ccode>lang\u003c/code> is \u003ccode>\"zpl\"\u003c/code>,\n\u003ccode>\"epl\"\u003c/code> or \u003ccode>\"tspl\"\u003c/code> (unknown values fall back to ZPL):\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">import { lz_render_lang } from \u0026quot;@goodboy008/labelize-wasm/init\u0026quot;;\n\nconst tspl = Buffer.from('SIZE 101.6 mm,152.4 mm\\nCLS\\nTEXT 40,40,\u0026quot;4\u0026quot;,0,1,1,\u0026quot;Hello World\u0026quot;\\nPRINT 1', \u0026quot;ascii\u0026quot;);\nconst png = lz_render_lang(tspl, 101.6, 152.4, 8, false, false, \u0026quot;tspl\u0026quot;);\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"4-bundlers-webpack-5-vite\">4. Bundlers (webpack 5 · Vite)\u003c/h2>\n\u003cp>Vite needs \u003ccode>vite-plugin-wasm\u003c/code>; webpack 5 supports wasm natively. With a\nbundler, import the package root — initialization happens at module load:\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">import { lz_render } from \u0026quot;@goodboy008/labelize-wasm\u0026quot;;\n\nconst zpl = new TextEncoder().encode(\n  \u0026quot;^XA^FO50,50^A0N,40,40^FDHELLO WORLD^FS^XZ\u0026quot;\n);\nconst png = lz_render(zpl, 102.0, 152.0, 8, false, false, false);\n\u003c/code>\u003c/pre>\n\u003cp>Show it in the browser:\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">const blob = new Blob([png], { type: \u0026quot;image/png\u0026quot; });\nimg.src = URL.createObjectURL(blob);\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"5-the-lz_render-api\">5. The \u003ccode>lz_render\u003c/code> API\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">lz_render(src, width_mm, height_mm, dpmm, antialias, want_pdf, is_epl)\n  → Uint8Array\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Param\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>src\u003c/code>\u003c/td>\n\u003ctd>raw label bytes (ZPL, or EPL when \u003ccode>is_epl = true\u003c/code>; for TSPL use \u003ccode>lz_render_lang\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>width_mm\u003c/code> / \u003ccode>height_mm\u003c/code>\u003c/td>\n\u003ctd>label canvas size in millimetres (defaults 102 × 152)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>dots per millimetre (default 8)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>antialias\u003c/code>\u003c/td>\n\u003ctd>keep renderer greys instead of thresholding to black/white\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>want_pdf\u003c/code>\u003c/td>\n\u003ctd>return a PDF instead of PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>is_epl\u003c/code>\u003c/td>\n\u003ctd>parse input as EPL instead of ZPL\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Errors\u003c/strong> throw a string prefixed with the failure stage:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>1:…\u003c/code> — parse error (bad label data)\u003c/li>\n\u003cli>\u003ccode>2:…\u003c/code> — rendering error (input parsed but rendering failed)\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-js\">try {\n  lz_render(zpl, 102, 152, 8, false, false, false);\n} catch (e) {\n  if (String(e).startsWith(\u0026quot;1:\u0026quot;)) console.error(\u0026quot;bad label data:\u0026quot;, e);\n  else throw e;\n}\n\u003c/code>\u003c/pre>\n\u003cp>The package also exports \u003ccode>lz_playground_html(): string\u003c/code>, the standalone\nplayground page (same HTML the HTTP service serves at \u003ccode>/\u003c/code>).\u003c/p>\n\u003ch2 id=\"6-without-npm\">6. Without npm\u003c/h2>\n\u003cp>Every GitHub Release attaches \u003ccode>labelize-wasm-wasm32.zip\u003c/code> containing the raw\nwasm-bindgen glue + \u003ccode>.wasm\u003c/code> files, for direct \u003ccode>\u0026lt;script\u0026gt;\u003c/code>-style use or\nnon-npm environments. To rebuild from source:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cd wasm \u0026amp;\u0026amp; ./build.sh   # requires the Rust wasm32 target + wasm-bindgen-cli\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"7-whats-next\">7. What's next\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/android\">Android tutorial\u003c/a> — the same engine as an AAR\u003c/li>\n\u003cli>\u003ca href=\"#docs/http\">HTTP service tutorial\u003c/a> — if you'd rather render server-side\u003c/li>\n\u003c/ul>","headings":[["2","1-install","1. Install"],["2","2-nodejs-20","2. Node.js (≥ 20)"],["2","3-tspltsc-input","3. TSPL/TSC input"],["2","4-bundlers-webpack-5-vite","4. Bundlers (webpack 5 · Vite)"],["2","5-the-lz_render-api","5. The lz_render API"],["2","6-without-npm","6. Without npm"],["2","7-whats-next","7. What's next"]],"examples":[],"search":" Tutorial: JavaScript / WebAssembly \n  All tutorials  ·  Documentation index  \n Render ZPL, EPL, TSPL/TSC, CPCL and DPL entirely client-side with\n  @goodboy008/labelize-wasm   —\nno server round-trip, works in Node.js, browsers, and bundlers. The public\nplayground at  https://labelize.764629910.workers.dev  is built on this\npackage. \n 1. Install \n  npm install @goodboy008/labelize-wasm\n  \n 2. Node.js (≥ 20) \n Import the  /init  subpath — it instantiates the engine from the packaged\n .wasm  directly, no bundler support or Node flags needed: \n  import { lz_render } from \"@goodboy008/labelize-wasm/init\";\nimport { writeFileSync } from \"node:fs\";\n\nconst zpl = Buffer.from(\"^XA^FO50,50^A0N,40,40^FDHello Node^FS^XZ\", \"ascii\");\nconst png = lz_render(zpl, 102.0, 152.0, 8, false, false, false);\n\nwriteFileSync(\"label.png\", png); // Uint8Array of PNG bytes\n  \n 3. TSPL/TSC input \n  lz_render_lang  is the language-explicit variant —  lang  is  \"zpl\" ,\n \"epl\"  or  \"tspl\"  (unknown values fall back to ZPL): \n  import { lz_render_lang } from \"@goodboy008/labelize-wasm/init\";\n\nconst tspl = Buffer.from('SIZE 101.6 mm,152.4 mm\\nCLS\\nTEXT 40,40,\"4\",0,1,1,\"Hello World\"\\nPRINT 1', \"ascii\");\nconst png = lz_render_lang(tspl, 101.6, 152.4, 8, false, false, \"tspl\");\n  \n 4. Bundlers (webpack 5 · Vite) \n Vite needs  vite-plugin-wasm ; webpack 5 supports wasm natively. With a\nbundler, import the package root — initialization happens at module load: \n  import { lz_render } from \"@goodboy008/labelize-wasm\";\n\nconst zpl = new TextEncoder().encode(\n  \"^XA^FO50,50^A0N,40,40^FDHELLO WORLD^FS^XZ\"\n);\nconst png = lz_render(zpl, 102.0, 152.0, 8, false, false, false);\n  \n Show it in the browser: \n  const blob = new Blob([png], { type: \"image/png\" });\nimg.src = URL.createObjectURL(blob);\n  \n 5. The  lz_render  API \n  lz_render(src, width_mm, height_mm, dpmm, antialias, want_pdf, is_epl)\n  → Uint8Array\n  \n \n \n \n Param \n Meaning \n \n \n \n \n  src  \n raw label bytes (ZPL, or EPL when  is_epl = true ; for TSPL use  lz_render_lang ) \n \n \n  width_mm  /  height_mm  \n label canvas size in millimetres (defaults 102 × 152) \n \n \n  dpmm  \n dots per millimetre (default 8) \n \n \n  antialias  \n keep renderer greys instead of thresholding to black/white \n \n \n  want_pdf  \n return a PDF instead of PNG \n \n \n  is_epl  \n parse input as EPL instead of ZPL \n \n \n \n  Errors  throw a string prefixed with the failure stage: \n \n  1:…  — parse error (bad label data) \n  2:…  — rendering error (input parsed but rendering failed) \n \n  try {\n  lz_render(zpl, 102, 152, 8, false, false, false);\n} catch (e) {\n  if (String(e).startsWith(\"1:\")) console.error(\"bad label data:\", e);\n  else throw e;\n}\n  \n The package also exports  lz_playground_html(): string , the standalone\nplayground page (same HTML the HTTP service serves at  / ). \n 6. Without npm \n Every GitHub Release attaches  labelize-wasm-wasm32.zip  containing the raw\nwasm-bindgen glue +  .wasm  files, for direct  \u003cscript> -style use or\nnon-npm environments. To rebuild from source: \n  cd wasm \u0026\u0026 ./build.sh   # requires the Rust wasm32 target + wasm-bindgen-cli\n  \n 7. What's next \n \n  Android tutorial  — the same engine as an AAR \n  HTTP service tutorial  — if you'd rather render server-side \n "},{"id":"android","group":"Integrate","title":"Tutorial: Android","file":"tutorials/android.md","html":"\u003ch1 id=\"tutorial-android\">Tutorial: Android\u003c/h1>\n\u003cp>\u003ca href=\"#docs/tutorials\">All tutorials\u003c/a> · \u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Render ZPL/EPL/TSPL/CPCL/DPL to PNG/PDF inside an Android app with the self-contained\n\u003ccode>labelize-android\u003c/code> AAR (\u003ccode>com.goodboy008.labelize\u003c/code>). Native libraries for\n\u003ccode>arm64-v8a\u003c/code>, \u003ccode>armeabi-v7a\u003c/code>, \u003ccode>x86_64\u003c/code>, and \u003ccode>x86\u003c/code> are bundled; output is\nbit-identical to the desktop builds — the same Rust engine runs on the phone.\u003c/p>\n\u003ch2 id=\"1-get-the-aar\">1. Get the AAR\u003c/h2>\n\u003cp>Download \u003ccode>labelize-android-aar.zip\u003c/code> from the\n\u003ca href=\"https://github.com/GOODBOY008/labelize/releases\">latest release\u003c/a> and unzip it\ninto your app module's \u003ccode>libs/\u003c/code> folder.\u003c/p>\n\u003ch2 id=\"2-wire-it-up\">2. Wire it up\u003c/h2>\n\u003cpre>\u003ccode class=\"language-kotlin\">// app/build.gradle.kts\nrepositories {\n    flatDir { dirs(\u0026quot;libs\u0026quot;) }\n}\ndependencies {\n    implementation(name = \u0026quot;labelize-android-release\u0026quot;, ext = \u0026quot;aar\u0026quot;)\n}\n\u003c/code>\u003c/pre>\n\u003cp>No external dependencies — fonts are embedded in the native library.\u003c/p>\n\u003ch2 id=\"3-render-a-label-kotlin\">3. Render a label (Kotlin)\u003c/h2>\n\u003cpre>\u003ccode class=\"language-kotlin\">import com.goodboy008.labelize.Labelize\nimport com.goodboy008.labelize.LabelizeException\n\nval zpl = \u0026quot;^XA^FO50,50^A0N,40,40^FDHello Android^FS^XZ\u0026quot;.toByteArray()\n\nval png: ByteArray = try {\n    Labelize.renderZplToPng(zpl, widthMm = 102.0, heightMm = 152.0)\n} catch (e: LabelizeException) {\n    // e.stage == LabelizeException.STAGE_PARSE  → bad label data\n    // e.stage == LabelizeException.STAGE_RENDER → engine error\n    return\n}\n\n// save / display — e.g. openFileOutput(\u0026quot;label.png\u0026quot;, MODE_PRIVATE).use {\n//   it.write(png) }\n\u003c/code>\u003c/pre>\n\u003cp>Java calls the same static methods.\u003c/p>\n\u003ch2 id=\"4-api-surface\">4. API surface\u003c/h2>\n\u003cp>\u003ccode>Labelize\u003c/code> (Kotlin/Java):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Method\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>renderZplToPng(src, widthMm, heightMm, …)\u003c/code>\u003c/td>\n\u003ctd>ZPL → PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderEplToPng\u003c/code> / \u003ccode>renderTsplToPng\u003c/code>\u003c/td>\n\u003ctd>EPL / TSPL → PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderZplToPdf\u003c/code> / \u003ccode>renderEplToPdf\u003c/code> / \u003ccode>renderTsplToPdf\u003c/code>\u003c/td>\n\u003ctd>ZPL / EPL / TSPL → one-page PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderLang(src, …, lang)\u003c/code>\u003c/td>\n\u003ctd>language-explicit raw entry (\u003ccode>\"zpl\"\u003c/code>/\u003ccode>\"epl\"\u003c/code>/\u003ccode>\"tspl\"\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderZplToPdf(src, widthMm, heightMm, …)\u003c/code>\u003c/td>\n\u003ctd>ZPL → PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderEplToPng(src, widthMm, heightMm, …)\u003c/code>\u003c/td>\n\u003ctd>EPL → PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>renderEplToPdf(src, widthMm, heightMm, …)\u003c/code>\u003c/td>\n\u003ctd>EPL → PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>render(src, widthMm, heightMm, dpmm, antialias, pdf, epl)\u003c/code>\u003c/td>\n\u003ctd>raw entry point — same parameter order as the JS \u003ccode>lz_render\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>version()\u003c/code>\u003c/td>\n\u003ctd>engine/binding version, for support diagnostics\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The convenience methods default to 4″ × 6″ at 8 dpmm; use \u003ccode>render(…)\u003c/code> for full\ncontrol (custom dpmm, antialiasing).\u003c/p>\n\u003cp>Failures throw \u003ccode>LabelizeException(stage, message)\u003c/code>:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>STAGE_PARSE\u003c/code> — the label data is invalid (the HTTP-400 analog)\u003c/li>\n\u003cli>\u003ccode>STAGE_RENDER\u003c/code> — engine error (the HTTP-500 analog)\u003c/li>\n\u003c/ul>\n\u003cp>These mirror the \u003ccode>1:\u003c/code> / \u003ccode>2:\u003c/code> stage codes used by the wasm binding.\u003c/p>\n\u003ch2 id=\"5-threading-note\">5. Threading note\u003c/h2>\n\u003cp>\u003ccode>render*\u003c/code> calls run synchronously on the calling thread and take a few\nmilliseconds per label on modern hardware. On Android, invoke them from a\nbackground thread (e.g. \u003ccode>Dispatchers.Default\u003c/code> in coroutines) and hop back to\nthe main thread to update UI.\u003c/p>\n\u003cpre>\u003ccode class=\"language-kotlin\">withContext(Dispatchers.Default) {\n    Labelize.renderZplToPng(zpl, 102.0, 152.0)\n}\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"6-build-the-aar-from-source\">6. Build the AAR from source\u003c/h2>\n\u003cp>Requirements: Rust toolchain with the four Android targets, Android SDK +\nNDK r25+, JDK 17.\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">rustup target add aarch64-linux-android armv7-linux-androideabi \\\n    i686-linux-android x86_64-linux-android\ncd android\n./build.sh                        # cross-compiles .so for all 4 ABIs\n./gradlew :lib:assembleRelease    # → lib/build/outputs/aar/lib-release.aar\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>./gradlew :demo:installDebug\u003c/code> installs a demo app that renders a sample label\non device — handy for \u003ccode>adb pull\u003c/code> byte-comparison against a desktop render.\nSee \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/android/README.md\">\u003ccode>android/README.md\u003c/code>\u003c/a> for details.\u003c/p>\n\u003ch2 id=\"7-whats-next\">7. What's next\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/javascript\">JavaScript/WASM tutorial\u003c/a> — the same engine for web\u003c/li>\n\u003cli>\u003ca href=\"#docs/rust\">Rust library tutorial\u003c/a> — the API beneath the bindings\u003c/li>\n\u003c/ul>","headings":[["2","1-get-the-aar","1. Get the AAR"],["2","2-wire-it-up","2. Wire it up"],["2","3-render-a-label-kotlin","3. Render a label (Kotlin)"],["2","4-api-surface","4. API surface"],["2","5-threading-note","5. Threading note"],["2","6-build-the-aar-from-source","6. Build the AAR from source"],["2","7-whats-next","7. What's next"]],"examples":[],"search":" Tutorial: Android \n  All tutorials  ·  Documentation index  \n Render ZPL/EPL/TSPL/CPCL/DPL to PNG/PDF inside an Android app with the self-contained\n labelize-android  AAR ( com.goodboy008.labelize ). Native libraries for\n arm64-v8a ,  armeabi-v7a ,  x86_64 , and  x86  are bundled; output is\nbit-identical to the desktop builds — the same Rust engine runs on the phone. \n 1. Get the AAR \n Download  labelize-android-aar.zip  from the\n latest release  and unzip it\ninto your app module's  libs/  folder. \n 2. Wire it up \n  // app/build.gradle.kts\nrepositories {\n    flatDir { dirs(\"libs\") }\n}\ndependencies {\n    implementation(name = \"labelize-android-release\", ext = \"aar\")\n}\n  \n No external dependencies — fonts are embedded in the native library. \n 3. Render a label (Kotlin) \n  import com.goodboy008.labelize.Labelize\nimport com.goodboy008.labelize.LabelizeException\n\nval zpl = \"^XA^FO50,50^A0N,40,40^FDHello Android^FS^XZ\".toByteArray()\n\nval png: ByteArray = try {\n    Labelize.renderZplToPng(zpl, widthMm = 102.0, heightMm = 152.0)\n} catch (e: LabelizeException) {\n    // e.stage == LabelizeException.STAGE_PARSE  → bad label data\n    // e.stage == LabelizeException.STAGE_RENDER → engine error\n    return\n}\n\n// save / display — e.g. openFileOutput(\"label.png\", MODE_PRIVATE).use {\n//   it.write(png) }\n  \n Java calls the same static methods. \n 4. API surface \n  Labelize  (Kotlin/Java): \n \n \n \n Method \n Purpose \n \n \n \n \n  renderZplToPng(src, widthMm, heightMm, …)  \n ZPL → PNG \n \n \n  renderEplToPng  /  renderTsplToPng  \n EPL / TSPL → PNG \n \n \n  renderZplToPdf  /  renderEplToPdf  /  renderTsplToPdf  \n ZPL / EPL / TSPL → one-page PDF \n \n \n  renderLang(src, …, lang)  \n language-explicit raw entry ( \"zpl\" / \"epl\" / \"tspl\" ) \n \n \n  renderZplToPdf(src, widthMm, heightMm, …)  \n ZPL → PDF \n \n \n  renderEplToPng(src, widthMm, heightMm, …)  \n EPL → PNG \n \n \n  renderEplToPdf(src, widthMm, heightMm, …)  \n EPL → PDF \n \n \n  render(src, widthMm, heightMm, dpmm, antialias, pdf, epl)  \n raw entry point — same parameter order as the JS  lz_render  \n \n \n  version()  \n engine/binding version, for support diagnostics \n \n \n \n The convenience methods default to 4″ × 6″ at 8 dpmm; use  render(…)  for full\ncontrol (custom dpmm, antialiasing). \n Failures throw  LabelizeException(stage, message) : \n \n  STAGE_PARSE  — the label data is invalid (the HTTP-400 analog) \n  STAGE_RENDER  — engine error (the HTTP-500 analog) \n \n These mirror the  1:  /  2:  stage codes used by the wasm binding. \n 5. Threading note \n  render*  calls run synchronously on the calling thread and take a few\nmilliseconds per label on modern hardware. On Android, invoke them from a\nbackground thread (e.g.  Dispatchers.Default  in coroutines) and hop back to\nthe main thread to update UI. \n  withContext(Dispatchers.Default) {\n    Labelize.renderZplToPng(zpl, 102.0, 152.0)\n}\n  \n 6. Build the AAR from source \n Requirements: Rust toolchain with the four Android targets, Android SDK +\nNDK r25+, JDK 17. \n  rustup target add aarch64-linux-android armv7-linux-androideabi \\\n    i686-linux-android x86_64-linux-android\ncd android\n./build.sh                        # cross-compiles .so for all 4 ABIs\n./gradlew :lib:assembleRelease    # → lib/build/outputs/aar/lib-release.aar\n  \n  ./gradlew :demo:installDebug  installs a demo app that renders a sample label\non device — handy for  adb pull  byte-comparison against a desktop render.\nSee   android/README.md   for details. \n 7. What's next \n \n  JavaScript/WASM tutorial  — the same engine for web \n  Rust library tutorial  — the API beneath the bindings \n "},{"id":"usage","group":"Reference","title":"Usage Guide","file":"USAGE.md","html":"\u003ch1 id=\"usage-guide\">Usage Guide\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>Looking for a step-by-step intro for one specific platform (CLI, Docker,\nHTTP, JavaScript/WASM, Android, Rust)? See the\n\u003ca href=\"#docs/tutorials\">platform tutorials\u003c/a>. This page is the compact\nreference they build on. \u003ca href=\"#docs/vector\">Vector output\u003c/a> covers searchable\nPDF, multipage PDF and scaled PNG options.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"installation\">Installation\u003c/h2>\n\u003ch3 id=\"from-source\">From Source\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">cd labelize\ncargo install --path . --features serve,vector\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"from-homebrew-macoslinux\">From Homebrew (macOS/Linux)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">brew tap GOODBOY008/homebrew-labelize\nbrew install labelize\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"from-github-releases\">From GitHub Releases\u003c/h3>\n\u003cp>Download the pre-built binary for your platform from \u003ca href=\"https://github.com/GOODBOY008/labelize/releases\">Releases\u003c/a>, extract, and place in your PATH.\u003c/p>\n\u003chr />\n\u003ch2 id=\"cli-tool\">CLI Tool\u003c/h2>\n\u003ch3 id=\"convert-a-zpl-file-to-png\">Convert a ZPL file to PNG\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl\n# → label.png (same directory)\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"convert-a-tspl-file-to-png\">Convert a TSPL file to PNG\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.tspl          # .tspl → PNG; SIZE sets the canvas\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"convert-an-epl-file-to-png\">Convert an EPL file to PNG\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.epl\n# → label.png (auto-detected from extension)\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"specify-output-path\">Specify output path\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl -o output/my_label.png\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"generate-pdf-instead-of-png\">Generate PDF instead of PNG\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl -t pdf\n# → label.pdf\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"override-input-format-detection\">Override input format detection\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert data.txt --format zpl\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"custom-label-dimensions\">Custom label dimensions\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl --width 100 --height 150 --dpmm 12\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Description\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>--width\u003c/code>\u003c/td>\n\u003ctd>declared, then 102\u003c/td>\n\u003ctd>Label width in mm; explicit values override the label\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--height\u003c/code>\u003c/td>\n\u003ctd>declared, then 152\u003c/td>\n\u003ctd>Label height in mm; explicit values override the label\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--dpmm\u003c/code>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>Dots per mm (6, 8, 12, or 24)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-f, --format\u003c/code>\u003c/td>\n\u003ctd>auto\u003c/td>\n\u003ctd>Input format: \u003ccode>zpl\u003c/code>, \u003ccode>epl\u003c/code>, \u003ccode>tspl\u003c/code>, \u003ccode>cpcl\u003c/code> or \u003ccode>dpl\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-t, --type\u003c/code>\u003c/td>\n\u003ctd>png\u003c/td>\n\u003ctd>Output type: \u003ccode>png\u003c/code> or \u003ccode>pdf\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-o, --output\u003c/code>\u003c/td>\n\u003ctd>auto\u003c/td>\n\u003ctd>Output file path\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"multi-label-files\">Multi-label files\u003c/h3>\n\u003cp>When a ZPL file contains multiple \u003ccode>^XA…^XZ\u003c/code> blocks, each label is output as a separate file with a numeric suffix:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert multi.zpl\n# → multi_1.png, multi_2.png, multi_3.png, …\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2 id=\"http-server\">HTTP Server\u003c/h2>\n\u003ch3 id=\"start-the-server\">Start the server\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize serve\n# Listening on 0.0.0.0:8080\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"custom-host-and-port\">Custom host and port\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">labelize serve --host 127.0.0.1 --port 3000\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"health-check\">Health check\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">curl http://localhost:8080/health\n# {\u0026quot;status\u0026quot;:\u0026quot;ok\u0026quot;}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"convert-zpl-to-png-via-http\">Convert ZPL to PNG via HTTP\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST http://localhost:8080/convert \\\n  -H \u0026quot;Content-Type: application/zpl\u0026quot; \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"convert-epl-to-png-via-http\">Convert EPL to PNG via HTTP\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST http://localhost:8080/convert \\\n  -H \u0026quot;Content-Type: application/epl\u0026quot; \\\n  --data-binary @label.epl \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"convert-to-pdf-via-http\">Convert to PDF via HTTP\u003c/h3>\n\u003cp>Add \u003ccode>?output=pdf\u003c/code> to the URL:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST \u0026quot;http://localhost:8080/convert?output=pdf\u0026quot; \\\n  -H \u0026quot;Content-Type: application/zpl\u0026quot; \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.pdf\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"custom-dimensions-via-query-parameters\">Custom dimensions via query parameters\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST \u0026quot;http://localhost:8080/convert?width=100\u0026amp;height=62\u0026amp;dpmm=12\u0026quot; \\\n  -H \u0026quot;Content-Type: application/zpl\u0026quot; \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Description\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>width\u003c/code>\u003c/td>\n\u003ctd>declared, then 102\u003c/td>\n\u003ctd>Label width in mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>height\u003c/code>\u003c/td>\n\u003ctd>declared, then 152\u003c/td>\n\u003ctd>Label height in mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>Dots per mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>output\u003c/code>\u003c/td>\n\u003ctd>png\u003c/td>\n\u003ctd>Output format: png/pdf\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"validate-label-source-via-http\">Validate label source via HTTP\u003c/h3>\n\u003cp>Syntax-check without rendering: auto-detects the language (or takes an\nexplicit \u003ccode>?language=zpl|epl|tspl|cpcl|dpl\u003c/code>) and reports what failed.\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST http://localhost:8080/validate \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ'\n# {\u0026quot;language\u0026quot;:\u0026quot;zpl\u0026quot;,\u0026quot;ok\u0026quot;:true,\u0026quot;labels\u0026quot;:1}\n\ncurl -X POST http://localhost:8080/validate -d 'N\nB10,10,0,9,2,4,80,B,\u0026quot;oops\u0026quot;\nP1'\n# {\u0026quot;language\u0026quot;:\u0026quot;epl\u0026quot;,\u0026quot;ok\u0026quot;:false,\u0026quot;labels\u0026quot;:0,\u0026quot;error\u0026quot;:\u0026quot;Parse error: EPL B command: unsupported bar code type \\\u0026quot;9\\\u0026quot; (Code 93)\u0026quot;}\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Description\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>language\u003c/code>\u003c/td>\n\u003ctd>auto\u003c/td>\n\u003ctd>Force \u003ccode>zpl\u003c/code>/\u003ccode>epl\u003c/code>/\u003ccode>tspl\u003c/code>/\u003ccode>cpcl\u003c/code>/\u003ccode>dpl\u003c/code> (else detect)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>Dots per mm (feeds ZPL \u003ccode>^MU\u003c/code> units)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"format-label-source-via-http\">Format label source via HTTP\u003c/h3>\n\u003cp>Pretty-print the source: one command per line, \u003ccode>^XA\u003c/code> blocks indented, CRLF\nnormalized, blank runs collapsed. Binary payloads (\u003ccode>^FD\u003c/code> data, \u003ccode>GW\u003c/code>/\u003ccode>BITMAP\u003c/code>\ngraphics) pass through byte-for-byte, so formatted source renders\npixel-identically (verified by sha256 on real corpus labels).\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl -X POST http://localhost:8080/format \\\n  -d '^XA^CF0,60^FO50,50^FDHello^FS^XZ'\n# ^XA\n#   ^CF0,60\n#   ^FO50,50\n#   ^FDHello\n# ^FS\n# ^XZ\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Description\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>language\u003c/code>\u003c/td>\n\u003ctd>auto\u003c/td>\n\u003ctd>Force \u003ccode>zpl\u003c/code>/\u003ccode>epl\u003c/code>/\u003ccode>tspl\u003c/code>/\u003ccode>cpcl\u003c/code>/\u003ccode>dpl\u003c/code> (else detect)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr />\n\u003ch2 id=\"library-usage\">Library Usage\u003c/h2>\n\u003cp>Add to your \u003ccode>Cargo.toml\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-toml\">[dependencies]\nlabelize = \u0026quot;1.8\u0026quot;\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"parse-and-render-a-label\">Parse and render a label\u003c/h3>\n\u003cp>One call detects the language, parses, resolves the canvas and encodes —\nsee the \u003ca href=\"#docs/rust\">Rust tutorial\u003c/a> for the full guide\n(composable parse/render path, canvas control, PDF, \u003ccode>validate()\u003c/code> /\n\u003ccode>format_source()\u003c/code> and error handling):\u003c/p>\n\u003cpre>\u003ccode class=\"language-rust\">fn main() {\n    let input = b\u0026quot;^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\u0026quot;;\n    let out = labelize::render_png(input, labelize::RenderOptions::default()).unwrap();\n    std::fs::write(\u0026quot;output.png\u0026quot;, out.bytes).unwrap();\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"render-to-pdf\">Render to PDF\u003c/h3>\n\u003cpre>\u003ccode class=\"language-rust\">use std::io::Cursor;\nuse labelize::{detect_language, parse_labels, Renderer, DrawerOptions, encode_pdf};\n\nfn main() {\n    let input = b\u0026quot;^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\u0026quot;;\n    let labels = parse_labels(detect_language(input), input, 8).unwrap();\n\n    let opts = DrawerOptions::default();\n    let renderer = Renderer::new();\n\n    // Render to image\n    let mut png_buf = Cursor::new(Vec::new());\n    renderer.draw_label_as_png(\u0026amp;labels[0], \u0026amp;mut png_buf, opts.clone()).unwrap();\n\n    let img = image::load_from_memory(\u0026amp;png_buf.into_inner()).unwrap().to_rgba8();\n\n    // Encode as PDF\n    let mut pdf_buf = Cursor::new(Vec::new());\n    encode_pdf(\u0026amp;img, \u0026amp;opts, \u0026amp;mut pdf_buf).unwrap();\n    std::fs::write(\u0026quot;output.pdf\u0026quot;, pdf_buf.into_inner()).unwrap();\n}\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2 id=\"language-reference\">Language reference\u003c/h2>\n\u003cp>The \u003ca href=\"#docs/zpl\">ZPL command matrix\u003c/a> is the canonical command\nreference. The \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/README.md\">repository README\u003c/a> summarizes the other supported\nlanguages. For detailed rendering behavior and reference evidence, use the\n\u003ca href=\"#docs/index/develop-and-verify\">documentation index\u003c/a>.\u003c/p>","headings":[["2","installation","Installation"],["3","from-source","From Source"],["3","from-homebrew-macoslinux","From Homebrew (macOS/Linux)"],["3","from-github-releases","From GitHub Releases"],["2","cli-tool","CLI Tool"],["3","convert-a-zpl-file-to-png","Convert a ZPL file to PNG"],["3","convert-a-tspl-file-to-png","Convert a TSPL file to PNG"],["3","convert-an-epl-file-to-png","Convert an EPL file to PNG"],["3","specify-output-path","Specify output path"],["3","generate-pdf-instead-of-png","Generate PDF instead of PNG"],["3","override-input-format-detection","Override input format detection"],["3","custom-label-dimensions","Custom label dimensions"],["3","multi-label-files","Multi-label files"],["2","http-server","HTTP Server"],["3","start-the-server","Start the server"],["3","custom-host-and-port","Custom host and port"],["3","health-check","Health check"],["3","convert-zpl-to-png-via-http","Convert ZPL to PNG via HTTP"],["3","convert-epl-to-png-via-http","Convert EPL to PNG via HTTP"],["3","convert-to-pdf-via-http","Convert to PDF via HTTP"],["3","custom-dimensions-via-query-parameters","Custom dimensions via query parameters"],["3","validate-label-source-via-http","Validate label source via HTTP"],["3","format-label-source-via-http","Format label source via HTTP"],["2","library-usage","Library Usage"],["3","parse-and-render-a-label","Parse and render a label"],["3","render-to-pdf","Render to PDF"],["2","language-reference","Language reference"]],"examples":[],"search":" Usage Guide \n  Documentation index  \n \n Looking for a step-by-step intro for one specific platform (CLI, Docker,\nHTTP, JavaScript/WASM, Android, Rust)? See the\n platform tutorials . This page is the compact\nreference they build on.  Vector output  covers searchable\nPDF, multipage PDF and scaled PNG options. \n \n Installation \n From Source \n  cd labelize\ncargo install --path . --features serve,vector\n  \n From Homebrew (macOS/Linux) \n  brew tap GOODBOY008/homebrew-labelize\nbrew install labelize\n  \n From GitHub Releases \n Download the pre-built binary for your platform from  Releases , extract, and place in your PATH. \n \n CLI Tool \n Convert a ZPL file to PNG \n  labelize convert label.zpl\n# → label.png (same directory)\n  \n Convert a TSPL file to PNG \n  labelize convert label.tspl          # .tspl → PNG; SIZE sets the canvas\n  \n Convert an EPL file to PNG \n  labelize convert label.epl\n# → label.png (auto-detected from extension)\n  \n Specify output path \n  labelize convert label.zpl -o output/my_label.png\n  \n Generate PDF instead of PNG \n  labelize convert label.zpl -t pdf\n# → label.pdf\n  \n Override input format detection \n  labelize convert data.txt --format zpl\n  \n Custom label dimensions \n  labelize convert label.zpl --width 100 --height 150 --dpmm 12\n  \n \n \n \n Option \n Default \n Description \n \n \n \n \n  --width  \n declared, then 102 \n Label width in mm; explicit values override the label \n \n \n  --height  \n declared, then 152 \n Label height in mm; explicit values override the label \n \n \n  --dpmm  \n 8 \n Dots per mm (6, 8, 12, or 24) \n \n \n  -f, --format  \n auto \n Input format:  zpl ,  epl ,  tspl ,  cpcl  or  dpl  \n \n \n  -t, --type  \n png \n Output type:  png  or  pdf  \n \n \n  -o, --output  \n auto \n Output file path \n \n \n \n Multi-label files \n When a ZPL file contains multiple  ^XA…^XZ  blocks, each label is output as a separate file with a numeric suffix: \n  labelize convert multi.zpl\n# → multi_1.png, multi_2.png, multi_3.png, …\n  \n \n HTTP Server \n Start the server \n  labelize serve\n# Listening on 0.0.0.0:8080\n  \n Custom host and port \n  labelize serve --host 127.0.0.1 --port 3000\n  \n Health check \n  curl http://localhost:8080/health\n# {\"status\":\"ok\"}\n  \n Convert ZPL to PNG via HTTP \n  curl -X POST http://localhost:8080/convert \\\n  -H \"Content-Type: application/zpl\" \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.png\n  \n Convert EPL to PNG via HTTP \n  curl -X POST http://localhost:8080/convert \\\n  -H \"Content-Type: application/epl\" \\\n  --data-binary @label.epl \\\n  -o label.png\n  \n Convert to PDF via HTTP \n Add  ?output=pdf  to the URL: \n  curl -X POST \"http://localhost:8080/convert?output=pdf\" \\\n  -H \"Content-Type: application/zpl\" \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.pdf\n  \n Custom dimensions via query parameters \n  curl -X POST \"http://localhost:8080/convert?width=100\u0026height=62\u0026dpmm=12\" \\\n  -H \"Content-Type: application/zpl\" \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ' \\\n  -o label.png\n  \n \n \n \n Parameter \n Default \n Description \n \n \n \n \n  width  \n declared, then 102 \n Label width in mm \n \n \n  height  \n declared, then 152 \n Label height in mm \n \n \n  dpmm  \n 8 \n Dots per mm \n \n \n  output  \n png \n Output format: png/pdf \n \n \n \n Validate label source via HTTP \n Syntax-check without rendering: auto-detects the language (or takes an\nexplicit  ?language=zpl|epl|tspl|cpcl|dpl ) and reports what failed. \n  curl -X POST http://localhost:8080/validate \\\n  -d '^XA^FO50,50^A0N,40,40^FDHello World^FS^XZ'\n# {\"language\":\"zpl\",\"ok\":true,\"labels\":1}\n\ncurl -X POST http://localhost:8080/validate -d 'N\nB10,10,0,9,2,4,80,B,\"oops\"\nP1'\n# {\"language\":\"epl\",\"ok\":false,\"labels\":0,\"error\":\"Parse error: EPL B command: unsupported bar code type \\\"9\\\" (Code 93)\"}\n  \n \n \n \n Parameter \n Default \n Description \n \n \n \n \n  language  \n auto \n Force  zpl / epl / tspl / cpcl / dpl  (else detect) \n \n \n  dpmm  \n 8 \n Dots per mm (feeds ZPL  ^MU  units) \n \n \n \n Format label source via HTTP \n Pretty-print the source: one command per line,  ^XA  blocks indented, CRLF\nnormalized, blank runs collapsed. Binary payloads ( ^FD  data,  GW / BITMAP \ngraphics) pass through byte-for-byte, so formatted source renders\npixel-identically (verified by sha256 on real corpus labels). \n  curl -X POST http://localhost:8080/format \\\n  -d '^XA^CF0,60^FO50,50^FDHello^FS^XZ'\n# ^XA\n#   ^CF0,60\n#   ^FO50,50\n#   ^FDHello\n# ^FS\n# ^XZ\n  \n \n \n \n Parameter \n Default \n Description \n \n \n \n \n  language  \n auto \n Force  zpl / epl / tspl / cpcl / dpl  (else detect) \n \n \n \n \n Library Usage \n Add to your  Cargo.toml : \n  [dependencies]\nlabelize = \"1.8\"\n  \n Parse and render a label \n One call detects the language, parses, resolves the canvas and encodes —\nsee the  Rust tutorial  for the full guide\n(composable parse/render path, canvas control, PDF,  validate()  /\n format_source()  and error handling): \n  fn main() {\n    let input = b\"^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\";\n    let out = labelize::render_png(input, labelize::RenderOptions::default()).unwrap();\n    std::fs::write(\"output.png\", out.bytes).unwrap();\n}\n  \n Render to PDF \n  use std::io::Cursor;\nuse labelize::{detect_language, parse_labels, Renderer, DrawerOptions, encode_pdf};\n\nfn main() {\n    let input = b\"^XA^FO50,50^A0N,40,40^FDHello^FS^XZ\";\n    let labels = parse_labels(detect_language(input), input, 8).unwrap();\n\n    let opts = DrawerOptions::default();\n    let renderer = Renderer::new();\n\n    // Render to image\n    let mut png_buf = Cursor::new(Vec::new());\n    renderer.draw_label_as_png(\u0026labels[0], \u0026mut png_buf, opts.clone()).unwrap();\n\n    let img = image::load_from_memory(\u0026png_buf.into_inner()).unwrap().to_rgba8();\n\n    // Encode as PDF\n    let mut pdf_buf = Cursor::new(Vec::new());\n    encode_pdf(\u0026img, \u0026opts, \u0026mut pdf_buf).unwrap();\n    std::fs::write(\"output.pdf\", pdf_buf.into_inner()).unwrap();\n}\n  \n \n Language reference \n The  ZPL command matrix  is the canonical command\nreference. The  repository README  summarizes the other supported\nlanguages. For detailed rendering behavior and reference evidence, use the\n documentation index . "},{"id":"vector","group":"Reference","title":"Vector PDF and scalable PNG","file":"VECTOR_OUTPUT.md","html":"\u003ch1 id=\"vector-pdf-and-scalable-png\">Vector PDF and scalable PNG\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>The optional \u003ccode>vector\u003c/code> feature compiles a language-neutral drawing scene from\nthe existing label IR. Positioned glyphs, barcode modules, curves, clipping,\nrotations and physical dimensions are shared between the PDF and PNG consumers.\nThe PDF backend uses krilla with embedded subset fonts and Unicode mappings;\nthe PNG backend rasterizes those same coordinates with tiny-skia. It does not\nserialize or reparse SVG, and never changes source parsing resolution to scale\nan output image.\u003c/p>\n\u003cp>Raster PNG/PDF remains the default. Existing \u003ccode>render_png\u003c/code>, \u003ccode>render_pdf\u003c/code>,\n\u003ccode>lz_render\u003c/code>, \u003ccode>lz_render_lang\u003c/code> and Android methods retain their contracts.\nThe new output functions validate their options before rendering. The release\nbuild configurations, Docker, WASM and Android include the optional backend;\nRust library users explicitly enable \u003ccode>features = [\"vector\"]\u003c/code>. krilla 0.8.2\nrequires Rust 1.92 or later.\u003c/p>\n\u003ch2 id=\"cli-and-http\">CLI and HTTP\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">cargo build --release --features serve,vector\nlabelize convert label.zpl --mode vector --type pdf\nlabelize convert label.zpl --mode vector --scale 3 --antialias\nlabelize convert batch.tspl --mode vector --type pdf --all-pages -o batch.pdf\n\u003c/code>\u003c/pre>\n\u003cp>Without \u003ccode>--all-pages\u003c/code>, the CLI retains its numbered-file behavior for inputs\ncontaining several labels. A multipage PDF preserves each label's declared\nsize unless the caller supplies explicit width/height overrides.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --data-binary @label.zpl -H 'Content-Type: application/zpl' \\\n  'http://localhost:8080/convert?mode=vector\u0026amp;output=pdf' -o label.pdf\ncurl --data-binary @label.zpl -H 'Content-Type: application/zpl' \\\n  'http://localhost:8080/convert?mode=vector\u0026amp;scale=3\u0026amp;antialias=true' -o label.png\ncurl --data-binary @batch.tspl -H 'Content-Type: application/tspl' \\\n  'http://localhost:8080/convert?mode=vector\u0026amp;output=pdf\u0026amp;pages=all' -o batch.pdf\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Option\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Contract\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>mode\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>raster\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>raster\u003c/code> or \u003ccode>vector\u003c/code>; unavailable builds reject \u003ccode>vector\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>scale\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>Finite positive PNG pixels per source dot; only vector PNG accepts another value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>first\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>first\u003c/code> or \u003ccode>all\u003c/code>; \u003ccode>all\u003c/code> requires vector PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>8\u003c/code>\u003c/td>\n\u003ctd>Source printer resolution; unaffected by \u003ccode>scale\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>antialias\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>Keep grayscale PNG coverage instead of black/white thresholding\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Invalid settings return HTTP 400. Parse, render and encoding failures keep the\nexisting stage distinction. PNG stores eight-bit grayscale samples in both\nvisual modes; it writes \u003ccode>pHYs\u003c/code> resolution as \u003ccode>dpmm × scale × 1000\u003c/code> pixels/metre.\n\u003ccode>scale=3\u003c/code> at 8 dpmm means 24 output pixels/mm (609.6 dpi), while coordinates\nand font metrics are still interpreted at 8 dpmm.\u003c/p>\n\u003cp>The scene limits a source canvas to 16 Mi pixels, an output PNG to 64 Mi pixels,\nand either dimension to 32000 dots/pixels. PDF dimensions are millimetres\nconverted to points independently of pixel rounding. Scaling does not add\ndetail to source bitmaps or local raster regions.\u003c/p>\n\u003ch2 id=\"rust\">Rust\u003c/h2>\n\u003cpre>\u003ccode class=\"language-rust\">use labelize::{render_pdf_with_output, OutputMode, OutputOptions, RenderOptions};\n\nlet output = OutputOptions {\n    mode: OutputMode::Vector,\n    all_pages: true,\n    ..Default::default()\n};\nlet pdf = render_pdf_with_output(b\u0026quot;^XA^FO20,20^A0N,30,20^FDHello^FS^XZ\u0026quot;,\n    RenderOptions::default(), output)?;\n# Ok::\u0026lt;(), labelize::LabelizeError\u0026gt;(())\n\u003c/code>\u003c/pre>\n\u003cp>Use \u003ccode>render_png_with_output\u003c/code> for PNG, or \u003ccode>render_label_with_output\u003c/code> for an\nalready parsed label. The existing \u003ccode>RenderOptions\u003c/code> struct was not expanded.\nFor repeated exports, create \u003ccode>LabelScene::new(\u0026amp;label, drawer_options)\u003c/code> once,\nthen call \u003ccode>to_pdf()\u003c/code> or \u003ccode>to_png(ScenePngOptions { scale, antialias })\u003c/code>.\n\u003ccode>encode_scenes_pdf(\u0026amp;scenes)\u003c/code> combines scenes with different page sizes.\n\u003ccode>LabelScene::stats()\u003c/code> reports actual glyph/path/image counts and each local\nfallback's source element index, reason and bounds. Enable \u003ccode>serde\u003c/code> to serialize\nthose diagnostics.\u003c/p>\n\u003ch2 id=\"wasm-playground-and-android\">WASM, playground and Android\u003c/h2>\n\u003cp>The new WASM export, also available from the Node \u003ccode>init\u003c/code> subpath, is:\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">lz_render_output(src, widthMm, heightMm, dpmm, antialias, wantPdf,\n                 language, \u0026quot;vector\u0026quot;, scale, allPages);\n\u003c/code>\u003c/pre>\n\u003cp>Zero width/height selects declared sizes and then the standard fallback.\nAn empty language requests detection; unknown nonempty language names fail.\nErrors retain \u003ccode>1:\u003c/code> (input/options) and \u003ccode>2:\u003c/code> (render/encode) prefixes.\nThe Worker exposes the same HTTP query parameters as the server.\u003c/p>\n\u003cp>The playground adds \u003cstrong>Output\u003c/strong>, \u003cstrong>PNG scale\u003c/strong>, and \u003cstrong>All PDF pages\u003c/strong> controls\nwhen the build supports vector output. Share links retain these settings.\nPDF downloads omit PNG scale; Labelary pixel c
