wrapper.\n  Host JNI checks are separate from tests on an Android device. \n  HTTP E2E script  exercises a running service.\n   Docker publishing  describes container smoke checks. \n \n Playground documentation \n The Markdown guides are compiled into the self-contained playground. After\nediting docs,  regenerate the bundle , then run: \n  python tools/docs/build.py --check\nnode --test workers/playground.test.mjs workers/api.test.mjs\ncargo test --lib --features playground playground::\n  \n The compiler verifies internal page and section links and detects stale\nbundles. JavaScript checks cover the embedded scripts and example metadata;\nthe Rust suite renders every runnable documentation example and checks its\npixel dimensions and nonempty output. CI enables  playground  alongside  vector  for these tests. The command\nabove also checks a raster-only build locally. \n For navigation changes, serve locally and check docs search, empty results,\ndeep-link reloads, browser back, copying code and loading examples. Confirm\nthat switching views preserves the editor draft and that share-link reloads\nrestore source and settings. Check both themes, English/Chinese navigation,\nPDF downloads and widths from 320 to 1440 pixels. Documentation content is\nEnglish; the surrounding controls follow the playground's language setting. \n Also check  #api  deep links, draft preservation across all three views,\nrequest cancellation, image previews, binary file downloads and copied\nexamples. The API tests exercise the shipped request/response code and run\nthe generated cURL, Node.js and Python examples against an HTTP byte echo.\nWorker tests use the actual WASM for conversions and separately inject an\ninitialization failure to prove preflights/schema work without the engine. "},{"id":"corpus","group":"Contribute","title":"Test corpus and reference provenance","file":"TEST_CORPUS.md","html":"\u003ch1 id=\"test-corpus-and-reference-provenance\">Test corpus and reference provenance\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Use this ledger to distinguish captured inputs, adapted templates, synthetic\nfixtures, external reference images and renderer baselines. Test execution and\nreference-update rules live in \u003ca href=\"#docs/testing\">Testing\u003c/a>.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/corpus/zpl-and-epl\">ZPL and EPL\u003c/a>: carrier captures, production templates and demos.\u003c/li>\n\u003cli>\u003ca href=\"#docs/corpus/tspl\">TSPL\u003c/a>: real input sources and reference capture provenance.\u003c/li>\n\u003cli>\u003ca href=\"#docs/corpus/cpcl-and-dpl\">CPCL and DPL\u003c/a>: vendor examples, manual samples and payload tests.\u003c/li>\n\u003c/ul>\n\u003cp>Specialized fixtures keep their provenance beside the data:\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/reverse/README.md\">reverse encoding\u003c/a>,\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/vector/README.md\">vector output\u003c/a>, and\n\u003ca href=\"#docs/datamatrix/legacy-ecc-000-140\">Legacy DataMatrix\u003c/a>.\u003c/p>\n\u003ch2 id=\"zpl-and-epl\">ZPL and EPL\u003c/h2>\n\u003cp>\u003ccode>testdata/unit/field_parameters.zpl\u003c/code> is a synthetic, independent Labelary\nreference for text direction and additional character spacing, captured on\nNovember 6, 2026 at 8 dots/mm and 813 x 1626 pixels. Its adjacent provenance\nJSON records the original source and PNG hashes. This covers fonts 0/A,\npositive and negative gaps, upright reverse/vertical text and field reset;\nit does not establish physical Zebra printer behavior. Detailed measurements\nare in \u003ca href=\"#docs/rendering/field-parameters\">Rendering behavior\u003c/a>.\u003c/p>\n\u003cp>Six additional frozen captures under \u003ccode>testdata/field-parameters/\u003c/code> cover\nrotated \u003ccode>^FO\u003c/code>/\u003ccode>^FT\u003c/code> origins, explicit origin alignment, field-block alignment,\nvertical wrapping and reverse-before-wrap ordering. Their portable\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/field-parameters/provenance.json\">\u003ccode>provenance.json\u003c/code>\u003c/a> records\nthe exact inputs, independent PNG hashes and actual canvas dimensions.\nThe interaction tests measure individual fields in raster and vector output;\nthey do not fit or realign an erroneous rendered field to the reference.\u003c/p>\n\u003cp>\u003ccode>testdata/labels/\u003c/code> contains captured labels, adapted production templates and\nsynthetic carrier demos. The tables below distinguish those origins. Current\ndifferences are regenerated in \u003ccode>testdata/diffs/diff_report_labels.txt\u003c/code>; limits\nare maintained in \u003ca href=\"#docs/thresholds\">Diff thresholds\u003c/a>.\u003c/p>\n\u003ch3 id=\"provenance-kinds\">Provenance kinds\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>real (capture)\u003c/td>\n\u003ctd>Real ZPL captured from a production print stream. Personal names, phone numbers, street addresses and tracking numbers are anonymized while preserving field formats, layout and graphics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>real (template, adapted)\u003c/td>\n\u003ctd>A real production label template; carrier-specific printer fonts (\u003ccode>^SEE\u003c/code>/\u003ccode>^CW\u003c/code> dot fonts) were normalized to scalable font 0 while keeping the authentic geometry, barcodes and graphics\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"real-corpus\">Real corpus\u003c/h3>\n\u003ch4 id=\"captured-production-labels\">Captured production labels\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Label\u003c/th>\n\u003cth>Carrier / system\u003c/th>\n\u003cth>Source\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>usps\u003c/code>, \u003ccode>usps_apo\u003c/code>, \u003ccode>usps_intl\u003c/code>\u003c/td>\n\u003ctd>USPS eVS production stream\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ups\u003c/code>, \u003ccode>ups_surepost\u003c/code>, \u003ccode>ups_import_control\u003c/code>\u003c/td>\n\u003ctd>UPS production waybills\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>fedex\u003c/code>, \u003ccode>fedex_express\u003c/code>, \u003ccode>fedex_ground\u003c/code>\u003c/td>\n\u003ctd>FedEx production waybills\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhlpaket\u003c/code>\u003c/td>\n\u003ctd>DHL Paket (DE) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhl_home_delivery\u003c/code>\u003c/td>\n\u003ctd>DHL home delivery production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhlparceluk\u003c/code>\u003c/td>\n\u003ctd>DHL Parcel UK production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhlparcelit\u003c/code>\u003c/td>\n\u003ctd>DHL Parcel Italy production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhlecommercetr\u003c/code>\u003c/td>\n\u003ctd>DHL eCommerce Türkiye production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpduk.epl\u003c/code>\u003c/td>\n\u003ctd>DPD UK production (EPL)\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pnldpd\u003c/code>\u003c/td>\n\u003ctd>DPD pipeline production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpdpl\u003c/code>\u003c/td>\n\u003ctd>DPD Poland production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>glscz\u003c/code>, \u003ccode>glsdk_return\u003c/code>\u003c/td>\n\u003ctd>GLS CZ/DK production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>swisspost\u003c/code>\u003c/td>\n\u003ctd>Swiss Post production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>posten\u003c/code>\u003c/td>\n\u003ctd>Posten Norway production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>porterbuddy\u003c/code>\u003c/td>\n\u003ctd>Porterbuddy (NO) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>icapaket\u003c/code>\u003c/td>\n\u003ctd>ICA Paket (SE) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dbs\u003c/code>\u003c/td>\n\u003ctd>DB Schenker (SE) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>brtit\u003c/code>\u003c/td>\n\u003ctd>BRT Bartolini (IT) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>posteit\u003c/code>\u003c/td>\n\u003ctd>Poste Italiane production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pocztex\u003c/code>\u003c/td>\n\u003ctd>Pocztex (PL) production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>bstc\u003c/code>\u003c/td>\n\u003ctd>BSTC production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>amazon\u003c/code>, \u003ccode>amazonshipping\u003c/code>\u003c/td>\n\u003ctd>Amazon FBA / MXP5 production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>jcpenney\u003c/code>, \u003ccode>kmart\u003c/code>\u003c/td>\n\u003ctd>US retail routing production\u003c/td>\n\u003ctd>captured (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>kuehnenagel_intl\u003c/code>, \u003ccode>kuehnenagel_eselect\u003c/code>\u003c/td>\n\u003ctd>Kuehne+Nagel (Centiro platform)\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/sahild-cen/Label_EDI_Validator_V3\">sahild-cen/Label_EDI_Validator_V3\u003c/a> real uploads (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>bring\u003c/code>\u003c/td>\n\u003ctd>Bring (SE), Centiro platform\u003c/td>\n\u003ctd>same source as above (anonymized)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>labelary\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"http://labelary.com/service.html\">Labelary sample label\u003c/a>\u003c/td>\n\u003ctd>official demo\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch4 id=\"real-production-templates-adapted\">Real production templates (adapted)\u003c/h4>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Label\u003c/th>\n\u003cth>Carrier\u003c/th>\n\u003cth>Source\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>cjlogistics\u003c/code>\u003c/td>\n\u003ctd>CJ대한통운 (KR) warehouse template\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/sLogis-SLK/CS.WCS.PAS/blob/main/pas.smp/Services/%EC%B6%9C%ED%95%98/%EC%B6%9C%EB%A0%A5%ED%85%9C%ED%94%8C%EB%A6%BF.cs\">sLogis-SLK/CS.WCS.PAS \u003ccode>대한통운_템플릿\u003c/code>\u003c/a> — Korean dot-font setup normalized to font 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>correiosbr\u003c/code>\u003c/td>\n\u003ctd>Correios Brasil SEDEX postagem\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/marcelofecchio/correios-api/blob/master/resources/templates/postagem.zpl\">marcelofecchio/correios-api \u003ccode>postagem.zpl\u003c/code>\u003c/a> — includes the genuine SEDEX service logo as \u003ccode>^GFA\u003c/code> Z64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tnt_express\u003c/code>\u003c/td>\n\u003ctd>TNT Express 12:00 (Centiro)\u003c/td>\n\u003ctd>real capture from the Kuehne+Nagel/Centiro upload corpus (anonymized); replaces an earlier stylized demo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dhl_express\u003c/code>\u003c/td>\n\u003ctd>DHL Express Worldwide (Centiro)\u003c/td>\n\u003ctd>same source (anonymized); replaces an earlier stylized demo\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"synthetic-fixtures\">Synthetic fixtures\u003c/h3>\n\u003cp>A number of older golden fixtures in \u003ccode>testdata/labels/\u003c/code> (e.g. \u003ccode>auspost\u003c/code>,\n\u003ccode>bpost\u003c/code>, \u003ccode>royalmail\u003c/code>, \u003ccode>canadapost\u003c/code>, \u003ccode>colissimo\u003c/code>, \u003ccode>correos\u003c/code>, \u003ccode>dpdde\u003c/code>, \u003ccode>evri\u003c/code>,\n\u003ccode>inpost\u003c/code>, \u003ccode>ontrac\u003c/code>, \u003ccode>postnl\u003c/code>, \u003ccode>seur\u003c/code>, \u003ccode>yodel\u003c/code>, \u003ccode>dbschenker\u003c/code>, \u003ccode>purolator\u003c/code>) are \u003cstrong>stylized demos authored from public label designs\u003c/strong>, kept\nbecause they exercise rendering paths (QR/DataMatrix/PDF417 placement, rotated\ntext, \u003ccode>^GFA\u003c/code> logos) against Labelary with tight tolerances. They are \u003cem>not\u003c/em>\nreal captures and are listed here so nobody mistakes them for carrier\nartifacts. \u003ccode>DIFF_THRESHOLDS.md\u003c/code> marks them implicitly; this note is the\nauthoritative provenance statement.\u003c/p>\n\u003ch2 id=\"tspl\">TSPL\u003c/h2>\n\u003cp>Real-world TSPL/TSC label data used by the golden tests (\u003ccode>tspl_real_*\u003c/code> in\n\u003ccode>testdata/unit/\u003c/code>). Provenance follows the repo convention: every file has a\nreal source; nothing here is synthesized. Reference PNGs were rendered by\n\u003ca href=\"https://labelixa.com/tools/tspl-viewer\">labelixa.com\u003c/a> (see\n\u003ca href=\"#docs/tspl-baselines\">TSPL_BASELINES.md\u003c/a> for the baseline strategy).\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fixture\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>tspl_real_probe_text.tspl\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/hyiger/filament-db\">hyiger/filament-db\u003c/a> \u003ccode>tests/fixtures/tspl/02_probe_text.prn\u003c/code>\u003c/td>\n\u003ctd>Text-only capability probe from a Rust 3D-filament inventory project\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tspl_real_probe_full.tspl\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/hyiger/filament-db\">hyiger/filament-db\u003c/a> \u003ccode>tests/fixtures/tspl/03_probe_full.prn\u003c/code>\u003c/td>\n\u003ctd>Full element-kind probe (incl. \u003ccode>REVERSE\u003c/code>, magnified text)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tspl_real_drybox.tspl\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/hyiger/filament-db\">hyiger/filament-db\u003c/a> \u003ccode>tests/fixtures/tspl/04_drybox_label.prn\u003c/code>\u003c/td>\n\u003ctd>3D-printing drybox label\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tspl_real_te210.tspl\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/nasnek/FlowStock\">nasnek/FlowStock\u003c/a> \u003ccode>flowstock_scanner_diagnostics_v1_TSC_TE210_100x72_working.prn\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>TSC TE210 hardware capture\u003c/strong> (repo marks it \"working\") — 3 labels per stream\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tspl_real_sklad.tspl\u003c/code>\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/AndreySavastyuk/AndroidSklad01\">AndreySavastyuk/AndroidSklad01\u003c/a> \u003ccode>app/src/main/assets/tspl_label.prn\u003c/code>\u003c/td>\n\u003ctd>Russian warehouse app template; \u003ccode>${placeholder}\u003c/code> tokens render as literal text (documented behavior)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3 id=\"reference-provenance\">Reference provenance\u003c/h3>\n\u003cp>\u003ccode>tspl_real_*.png\u003c/code> references were fetched from the labelixa API on\n2026-10-12 (before the anonymous daily quota reset). \u003ccode>auto_bootstrap_tspl\u003c/code>\nprefers labelixa on refetch and falls back to the renderer baseline when the\nquota is spent; both provenances are printed in the bootstrap log line.\u003c/p>\n\u003ch2 id=\"cpcl-and-dpl\">CPCL and DPL\u003c/h2>\n\u003cp>Each \u003ccode>cpcl_real_*\u003c/code> / \u003ccode>dpl_real_*\u003c/code> fixture comes from a renderer vendor's example\ncorpus or a printer manual. The source tables record adaptations explicitly.\u003c/p>\n\u003ch3 id=\"reference-renderers\">Reference renderers\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Language\u003c/th>\n\u003cth>Reference\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CPCL\u003c/td>\n\u003ctd>\u003ccode>api.labelixa.com/v1/cpcl/render\u003c/code>\u003c/td>\n\u003ctd>Recorded external comparison; an interpretation of the CPCL guide at 203 dpi covering a subset (text, BOX/LINE, 128/39/EAN-13/UPC-A). Same pipeline as the TSPL corpus.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DPL\u003c/td>\n\u003ctd>\u003ccode>layoutview.evolabel.com\u003c/code> (Layout view)\u003c/td>\n\u003ctd>Recorded server-side DPL comparison (Evolabel print-applicator preview, ~11.8 px/mm ≈ 300 dpi). Not printer-verified; used as the external comparison like portakal was for TSPL triangulation.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Both clients cache under \u003ccode>testdata/labelixa_cache/\u003c/code> (gitignored) and fall\nback to the renderer baseline when offline — the golden tolerances record\nthe honest cross-engine distance where a reference was fetched and guard\nregressions where the baseline was used.\u003c/p>\n\u003ch3 id=\"parser-and-payload-regression-coverage\">Parser and payload regression coverage\u003c/h3>\n\u003cp>The language review also checks behavior that a visual corpus cannot reliably\ndetect. \u003ccode>tests/unit_cpcl_parser.rs\u003c/code>, \u003ccode>tests/unit_dpl_parser.rs\u003c/code> and\n\u003ccode>tests/unit_cpcl_dpl_robustness.rs\u003c/code> cover counted payload boundaries, all byte\nvalues, malformed records, formatter round trips and arbitrary input. The\nforward-render tests in \u003ccode>tests/e2e_cpcl_dpl_payloads.rs\u003c/code> compare every CPCL\nbitmap pixel with its input bit and independently decode DPL DataMatrix output\nat 8 and 12 dpmm, before and after source formatting.\u003c/p>\n\u003cp>The command semantics come from Zebra's\n\u003ca href=\"https://www.zebra.com/content/dam/support-dam/en/documentation/unrestricted/guide/software/cpcl-link-os-pg-en.pdf\">CPCL Programming Guide\u003c/a>\n(sections 3.3.2, 6.7, 6.11, 6.19 and 6.34) and Honeywell's\n\u003ca href=\"https://applog.se/storage/B31B01F8DF5B7C3BA38F0A91D9493A5D9D2EE0047E4127279FEC9D22BBD08659/eafb4bac400147bc8931418ea6f25c88/pdf/media/b092b1e119d540c49e214c88e4649039/DPL%20Command%20Reference%20Guide.pdf\">DPL Command Reference\u003c/a>\n(\u003ccode>T\u003c/code>, \u003ccode>W1C\u003c/code>, \u003ccode>Z\u003c/code>, \u003ccode>U\u003c/code> and scalable font records). DPL byte counts include\nthe barcode option fields after the count; they override record terminators.\n\u003ccode>Tnn\u003c/code> takes two hexadecimal digits and changes only the next format record.\u003c/p>\n\u003cp>The existing \u003ccode>dpl_2d_graphics\u003c/code> fixture now specifies \u003ccode>200\u003c/code> explicitly for its\nECC 200 symbol, correcting the previous \u003ccode>000\u003c/code> command without replacing its\nreference PNG. Legacy DPL DataMatrix qualities and unequal horizontal/vertical\nmodules remain unsupported and now fail explicitly. QR structured append and\nDPL QR hex-ASCII modes also fail explicitly. PDF417 accepts UTF-8 and embedded\ncontrol characters; non-UTF-8 PDF417 payloads are rejected because its shared\nencoder currently takes text. Font substitution and the previously documented\nprinter-only/unsupported commands remain limitations of these frontends.\u003c/p>\n\u003cp>The \u003ccode>dpl_text_styles\u003c/code> renderer baseline was regenerated after removing the\nerroneously printed scalable-size fields (\u003ccode>P015P015\u003c/code>). Its 0.01% tolerance is\nunchanged. External reference PNGs are unchanged; the scalable-text assertions\nand independent box-edge pixel check cover the intended semantic corrections.\u003c/p>\n\u003ch3 id=\"cpcl-fixtures-labelixathermal-printer-examples\">CPCL fixtures — Labelixa/thermal-printer-examples\u003c/h3>\n\u003cp>Source: \u003ca href=\"https://github.com/Labelixa/thermal-printer-examples\">https://github.com/Labelixa/thermal-printer-examples\u003c/a> (MIT,\n© 2026 Newempo LLC), fetched 2026-10-25.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fixture\u003c/th>\n\u003cth>Source file\u003c/th>\n\u003cth>Content\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>cpcl_real_asset_tag\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>cpcl/asset-tag-2x1.cpcl\u003c/code>\u003c/td>\n\u003ctd>Asset tag 2×1\": fonts 4/7, Code 39 (ratio 2, no HRI)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cpcl_real_route_label\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>cpcl/route-label-2x2.cpcl\u003c/code>\u003c/td>\n\u003ctd>Delivery route 2×2\": BOX border, LINE rule, \u003ccode>TEXT270\u003c/code>, Code 128\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cpcl_real_receipt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>cpcl/receipt-label-2x3.cpcl\u003c/code>\u003c/td>\n\u003ctd>Delivery note 2×3\": text block, LINE, Code 128\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Unmodified byte-for-byte from the corpus.\u003c/p>\n\u003ch3 id=\"dpl-fixtures-m-class-dpl-programmers-manual-appendix-b\">DPL fixtures — M-Class DPL Programmer's Manual (Appendix B)\u003c/h3>\n\u003cp>Source: \u003cem>M-Class DPL Programmer's Manual\u003c/em>, Rev B (Datamax-O'Neil,\nP/N 88-2302-01), Appendix B \"Sample Programs\".\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fixture\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>Content\u003c/th>\n\u003cth>Adaptation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>dpl_real_manual_component\u003c/code>\u003c/td>\n\u003ctd>Figure B-1 sample (Basic/C/ASCII programs)\u003c/td>\n\u003ctd>Electronic component label: smooth font 9 (\u003ccode>008\u003c/code> = A18), Code 39 \u003ccode>a\u003c/code> with 6:2 modules, \u003ccode>H07\u003c/code>/\u003ccode>D11\u003c/code>\u003c/td>\n\u003ctd>none — verbatim sample\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpl_real_manual_order\u003c/code>\u003c/td>\n\u003ctd>\"VB Application Generating DPL\" sample\u003c/td>\n\u003ctd>Order-picking label: font 9 headings/values, five Code 39 fields, box record\u003c/td>\n\u003ctd>field values filled in with plausible data (\u003ccode>SO-44715\u003c/code>, \u003ccode>NORTHWIND SUPPLY\u003c/code>, …); the \u003ccode>1Y…SLANT1\u003c/code> stored-image record is dropped (stored images are unsupported and error loudly); the \u003ccode>~\u003c/code>-alternative STX is written as the standard 0x02 byte\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Current per-fixture tolerances are in \u003ca href=\"#docs/thresholds\">Diff thresholds\u003c/a>;\nregenerated measurements are in \u003ccode>testdata/diffs/diff_report_unit.txt\u003c/code>. External\nfont substitutions and barcode geometry can differ substantially. A renderer\nbaseline protects regressions but does not independently establish printer\naccuracy.\u003c/p>","headings":[["2","zpl-and-epl","ZPL and EPL"],["3","provenance-kinds","Provenance kinds"],["3","real-corpus","Real corpus"],["3","synthetic-fixtures","Synthetic fixtures"],["2","tspl","TSPL"],["3","reference-provenance","Reference provenance"],["2","cpcl-and-dpl","CPCL and DPL"],["3","reference-renderers","Reference renderers"],["3","parser-and-payload-regression-coverage","Parser and payload regression coverage"],["3","cpcl-fixtures-labelixathermal-printer-examples","CPCL fixtures — Labelixa/thermal-printer-examples"],["3","dpl-fixtures-m-class-dpl-programmers-manual-appendix-b","DPL fixtures — M-Class DPL Programmer's Manual (Appendix B)"]],"examples":[],"search":" Test corpus and reference provenance \n  Documentation index  \n Use this ledger to distinguish captured inputs, adapted templates, synthetic\nfixtures, external reference images and renderer baselines. Test execution and\nreference-update rules live in  Testing . \n \n  ZPL and EPL : carrier captures, production templates and demos. \n  TSPL : real input sources and reference capture provenance. \n  CPCL and DPL : vendor examples, manual samples and payload tests. \n \n Specialized fixtures keep their provenance beside the data:\n reverse encoding ,\n vector output , and\n Legacy DataMatrix . \n ZPL and EPL \n  testdata/unit/field_parameters.zpl  is a synthetic, independent Labelary\nreference for text direction and additional character spacing, captured on\nNovember 6, 2026 at 8 dots/mm and 813 x 1626 pixels. Its adjacent provenance\nJSON records the original source and PNG hashes. This covers fonts 0/A,\npositive and negative gaps, upright reverse/vertical text and field reset;\nit does not establish physical Zebra printer behavior. Detailed measurements\nare in  Rendering behavior . \n Six additional frozen captures under  testdata/field-parameters/  cover\nrotated  ^FO / ^FT  origins, explicit origin alignment, field-block alignment,\nvertical wrapping and reverse-before-wrap ordering. Their portable\n  provenance.json   records\nthe exact inputs, independent PNG hashes and actual canvas dimensions.\nThe interaction tests measure individual fields in raster and vector output;\nthey do not fit or realign an erroneous rendered field to the reference. \n  testdata/labels/  contains captured labels, adapted production templates and\nsynthetic carrier demos. The tables below distinguish those origins. Current\ndifferences are regenerated in  testdata/diffs/diff_report_labels.txt ; limits\nare maintained in  Diff thresholds . \n Provenance kinds \n \n \n \n Kind \n Meaning \n \n \n \n \n real (capture) \n Real ZPL captured from a production print stream. Personal names, phone numbers, street addresses and tracking numbers are anonymized while preserving field formats, layout and graphics \n \n \n real (template, adapted) \n A real production label template; carrier-specific printer fonts ( ^SEE / ^CW  dot fonts) were normalized to scalable font 0 while keeping the authentic geometry, barcodes and graphics \n \n \n \n Real corpus \n Captured production labels \n \n \n \n Label \n Carrier / system \n Source \n \n \n \n \n  usps ,  usps_apo ,  usps_intl  \n USPS eVS production stream \n captured (anonymized) \n \n \n  ups ,  ups_surepost ,  ups_import_control  \n UPS production waybills \n captured (anonymized) \n \n \n  fedex ,  fedex_express ,  fedex_ground  \n FedEx production waybills \n captured (anonymized) \n \n \n  dhlpaket  \n DHL Paket (DE) production \n captured (anonymized) \n \n \n  dhl_home_delivery  \n DHL home delivery production \n captured (anonymized) \n \n \n  dhlparceluk  \n DHL Parcel UK production \n captured (anonymized) \n \n \n  dhlparcelit  \n DHL Parcel Italy production \n captured (anonymized) \n \n \n  dhlecommercetr  \n DHL eCommerce Türkiye production \n captured (anonymized) \n \n \n  dpduk.epl  \n DPD UK production (EPL) \n captured (anonymized) \n \n \n  pnldpd  \n DPD pipeline production \n captured (anonymized) \n \n \n  dpdpl  \n DPD Poland production \n captured (anonymized) \n \n \n  glscz ,  glsdk_return  \n GLS CZ/DK production \n captured (anonymized) \n \n \n  swisspost  \n Swiss Post production \n captured (anonymized) \n \n \n  posten  \n Posten Norway production \n captured (anonymized) \n \n \n  porterbuddy  \n Porterbuddy (NO) production \n captured (anonymized) \n \n \n  icapaket  \n ICA Paket (SE) production \n captured (anonymized) \n \n \n  dbs  \n DB Schenker (SE) production \n captured (anonymized) \n \n \n  brtit  \n BRT Bartolini (IT) production \n captured (anonymized) \n \n \n  posteit  \n Poste Italiane production \n captured (anonymized) \n \n \n  pocztex  \n Pocztex (PL) production \n captured (anonymized) \n \n \n  bstc  \n BSTC production \n captured (anonymized) \n \n \n  amazon ,  amazonshipping  \n Amazon FBA / MXP5 production \n captured (anonymized) \n \n \n  jcpenney ,  kmart  \n US retail routing production \n captured (anonymized) \n \n \n  kuehnenagel_intl ,  kuehnenagel_eselect  \n Kuehne+Nagel (Centiro platform) \n  sahild-cen/Label_EDI_Validator_V3  real uploads (anonymized) \n \n \n  bring  \n Bring (SE), Centiro platform \n same source as above (anonymized) \n \n \n  labelary  \n  Labelary sample label  \n official demo \n \n \n \n Real production templates (adapted) \n \n \n \n Label \n Carrier \n Source \n \n \n \n \n  cjlogistics  \n CJ대한통운 (KR) warehouse template \n  sLogis-SLK/CS.WCS.PAS  대한통운_템플릿   — Korean dot-font setup normalized to font 0 \n \n \n  correiosbr  \n Correios Brasil SEDEX postagem \n  marcelofecchio/correios-api  postagem.zpl   — includes the genuine SEDEX service logo as  ^GFA  Z64 \n \n \n  tnt_express  \n TNT Express 12:00 (Centiro) \n real capture from the Kuehne+Nagel/Centiro upload corpus (anonymized); replaces an earlier stylized demo \n \n \n  dhl_express  \n DHL Express Worldwide (Centiro) \n same source (anonymized); replaces an earlier stylized demo \n \n \n \n Synthetic fixtures \n A number of older golden fixtures in  testdata/labels/  (e.g.  auspost ,\n bpost ,  royalmail ,  canadapost ,  colissimo ,  correos ,  dpdde ,  evri ,\n inpost ,  ontrac ,  postnl ,  seur ,  yodel ,  dbschenker ,  purolator ) are  stylized demos authored from public label designs , kept\nbecause they exercise rendering paths (QR/DataMatrix/PDF417 placement, rotated\ntext,  ^GFA  logos) against Labelary with tight tolerances. They are  not \nreal captures and are listed here so nobody mistakes them for carrier\nartifacts.  DIFF_THRESHOLDS.md  marks them implicitly; this note is the\nauthoritative provenance statement. \n TSPL \n Real-world TSPL/TSC label data used by the golden tests ( tspl_real_*  in\n testdata/unit/ ). Provenance follows the repo convention: every file has a\nreal source; nothing here is synthesized. Reference PNGs were rendered by\n labelixa.com  (see\n TSPL_BASELINES.md  for the baseline strategy). \n \n \n \n Fixture \n Source \n Notes \n \n \n \n \n  tspl_real_probe_text.tspl  \n  hyiger/filament-db   tests/fixtures/tspl/02_probe_text.prn  \n Text-only capability probe from a Rust 3D-filament inventory project \n \n \n  tspl_real_probe_full.tspl  \n  hyiger/filament-db   tests/fixtures/tspl/03_probe_full.prn  \n Full element-kind probe (incl.  REVERSE , magnified text) \n \n \n  tspl_real_drybox.tspl  \n  hyiger/filament-db   tests/fixtures/tspl/04_drybox_label.prn  \n 3D-printing drybox label \n \n \n  tspl_real_te210.tspl  \n  nasnek/FlowStock   flowstock_scanner_diagnostics_v1_TSC_TE210_100x72_working.prn  \n  TSC TE210 hardware capture  (repo marks it \"working\") — 3 labels per stream \n \n \n  tspl_real_sklad.tspl  \n  AndreySavastyuk/AndroidSklad01   app/src/main/assets/tspl_label.prn  \n Russian warehouse app template;  ${placeholder}  tokens render as literal text (documented behavior) \n \n \n \n Reference provenance \n  tspl_real_*.png  references were fetched from the labelixa API on\n2026-10-12 (before the anonymous daily quota reset).  auto_bootstrap_tspl \nprefers labelixa on refetch and falls back to the renderer baseline when the\nquota is spent; both provenances are printed in the bootstrap log line. \n CPCL and DPL \n Each  cpcl_real_*  /  dpl_real_*  fixture comes from a renderer vendor's example\ncorpus or a printer manual. The source tables record adaptations explicitly. \n Reference renderers \n \n \n \n Language \n Reference \n Notes \n \n \n \n \n CPCL \n  api.labelixa.com/v1/cpcl/render  \n Recorded external comparison; an interpretation of the CPCL guide at 203 dpi covering a subset (text, BOX/LINE, 128/39/EAN-13/UPC-A). Same pipeline as the TSPL corpus. \n \n \n DPL \n  layoutview.evolabel.com  (Layout view) \n Recorded server-side DPL comparison (Evolabel print-applicator preview, ~11.8 px/mm ≈ 300 dpi). Not printer-verified; used as the external comparison like portakal was for TSPL triangulation. \n \n \n \n Both clients cache under  testdata/labelixa_cache/  (gitignored) and fall\nback to the renderer baseline when offline — the golden tolerances record\nthe honest cross-engine distance where a reference was fetched and guard\nregressions where the baseline was used. \n Parser and payload regression coverage \n The language review also checks behavior that a visual corpus cannot reliably\ndetect.  tests/unit_cpcl_parser.rs ,  tests/unit_dpl_parser.rs  and\n tests/unit_cpcl_dpl_robustness.rs  cover counted payload boundaries, all byte\nvalues, malformed records, formatter round trips and arbitrary input. The\nforward-render tests in  tests/e2e_cpcl_dpl_payloads.rs  compare every CPCL\nbitmap pixel with its input bit and independently decode DPL DataMatrix output\nat 8 and 12 dpmm, before and after source formatting. \n The command semantics come from Zebra's\n CPCL Programming Guide \n(sections 3.3.2, 6.7, 6.11, 6.19 and 6.34) and Honeywell's\n DPL Command Reference \n( T ,  W1C ,  Z ,  U  and scalable font records). DPL byte counts include\nthe barcode option fields after the count; they override record terminators.\n Tnn  takes two hexadecimal digits and changes only the next format record. \n The existing  dpl_2d_graphics  fixture now specifies  200  explicitly for its\nECC 200 symbol, correcting the previous  000  command without replacing its\nreference PNG. Legacy DPL DataMatrix qualities and unequal horizontal/vertical\nmodules remain unsupported and now fail explicitly. QR structured append and\nDPL QR hex-ASCII modes also fail explicitly. PDF417 accepts UTF-8 and embedded\ncontrol characters; non-UTF-8 PDF417 payloads are rejected because its shared\nencoder currently takes text. Font substitution and the previously documented\nprinter-only/unsupported commands remain limitations of these frontends. \n The  dpl_text_styles  renderer baseline was regenerated after removing the\nerroneously printed scalable-size fields ( P015P015 ). Its 0.01% tolerance is\nunchanged. External reference PNGs are unchanged; the scalable-text assertions\nand independent box-edge pixel check cover the intended semantic corrections. \n CPCL fixtures — Labelixa/thermal-printer-examples \n Source:  https://github.com/Labelixa/thermal-printer-examples  (MIT,\n© 2026 Newempo LLC), fetched 2026-10-25. \n \n \n \n Fixture \n Source file \n Content \n \n \n \n \n  cpcl_real_asset_tag  \n  cpcl/asset-tag-2x1.cpcl  \n Asset tag 2×1\": fonts 4/7, Code 39 (ratio 2, no HRI) \n \n \n  cpcl_real_route_label  \n  cpcl/route-label-2x2.cpcl  \n Delivery route 2×2\": BOX border, LINE rule,  TEXT270 , Code 128 \n \n \n  cpcl_real_receipt  \n  cpcl/receipt-label-2x3.cpcl  \n Delivery note 2×3\": text block, LINE, Code 128 \n \n \n \n Unmodified byte-for-byte from the corpus. \n DPL fixtures — M-Class DPL Programmer's Manual (Appendix B) \n Source:  M-Class DPL Programmer's Manual , Rev B (Datamax-O'Neil,\nP/N 88-2302-01), Appendix B \"Sample Programs\". \n \n \n \n Fixture \n Source \n Content \n Adaptation \n \n \n \n \n  dpl_real_manual_component  \n Figure B-1 sample (Basic/C/ASCII programs) \n Electronic component label: smooth font 9 ( 008  = A18), Code 39  a  with 6:2 modules,  H07 / D11  \n none — verbatim sample \n \n \n  dpl_real_manual_order  \n \"VB Application Generating DPL\" sample \n Order-picking label: font 9 headings/values, five Code 39 fields, box record \n field values filled in with plausible data ( SO-44715 ,  NORTHWIND SUPPLY , …); the  1Y…SLANT1  stored-image record is dropped (stored images are unsupported and error loudly); the  ~ -alternative STX is written as the standard 0x02 byte \n \n \n \n Current per-fixture tolerances are in  Diff thresholds ;\nregenerated measurements are in  testdata/diffs/diff_report_unit.txt . External\nfont substitutions and barcode geometry can differ substantially. A renderer\nbaseline protects regressions but does not independently establish printer\naccuracy. "},{"id":"thresholds","group":"Contribute","title":"Rendering Diff Thresholds","file":"DIFF_THRESHOLDS.md","html":"\u003ch1 id=\"rendering-diff-thresholds\">Rendering Diff Thresholds\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Labelize renders ZPL/EPL labels to pixel images. This document tracks the\nexpected pixel-difference percentage for every test label compared against\nreference images from the \u003ca href=\"https://labelary.com/viewer.html\">Labelary ZPL viewer\u003c/a>.\u003c/p>\n\u003ch2 id=\"reference-setup\">Reference Setup\u003c/h2>\n\u003ch3 id=\"carrier-labels-testdatalabels-and-unit-tests-testdataunit\">Carrier Labels (\u003ccode>testdata/labels/\u003c/code>) and Unit Tests (\u003ccode>testdata/unit/\u003c/code>)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Value\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>DPI\u003c/td>\n\u003ctd>8 dpmm (≈ 203 dpi)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Label size\u003c/td>\n\u003ctd>4.005 × 8.01 inches (101.625 × 203.25 mm)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pixel dims\u003c/td>\n\u003ctd>813 × 1626\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Source\u003c/td>\n\u003ctd>Labelary API \u003ccode>http://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Both directories share the same canvas: \u003ccode>default_options()\u003c/code> renders at 813 × 1626 and\nevery Labelary request uses \u003ccode>LABELARY_LABEL_SIZE_IN\u003c/code> (4.005 × 8.01 in), which Labelary\nserves natively at 813 × 1626 — the exact same size, so no padding is needed.\u003c/p>\n\u003cp>\u003cstrong>Do not derive the request size from the mm values\u003c/strong> (\u003ccode>101.625 / 25.4\u003c/code> in): Labelary\nfloor-rounds that 4.00197 × 8.00197 in request to a 812 × 1624 px canvas server-side.\nPadding such a response up to 813 × 1626 shifts all content by (−1, −2) px relative to\na native render, which misaligned every \u003ccode>^POI\u003c/code> (inverted) label — e.g. the fedex family\nframe lines and barcodes sat 2 px off, inflating \u003ccode>fedex_express\u003c/code> from 6.2 % to 11.3 %.\nReferences fetched before this convention were re-fetched at the native size (all\n\u003ccode>^POI\u003c/code> labels: bpost, brtit, canadapost, colissimo, fedex, fedex_express, fedex_ground,\nmu_millimeters, purolator, ups, ups_import_control, ups_maxicode, ups_surepost,\nusps_apo, usps_intl).\u003c/p>\n\u003cp>Non-inverted labels are insensitive to this (their content anchors to the top-left\norigin), so a few of their references may still contain padded 812 × 1624 renders —\nharmless, and they are refreshed opportunistically when a label's fixture changes.\u003c/p>\n\u003cp>The EPL label \u003ccode>dpduk.epl\u003c/code> uses a reference rendered by the Go-based labelize\npredecessor because Labelary does not support EPL. The \u003ccode>epl2_showcase.epl\u003c/code>\nsnippet (Table 1 bar code types, \u003ccode>b\u003c/code> 2-D bar codes, \u003ccode>GW\u003c/code>/\u003ccode>X\u003c/code>/\u003ccode>LS\u003c/code>/\u003ccode>LW\u003c/code>)\nuses the renderer baseline as its reference (0.00 % at rest), so its\ntolerance only guards against regressions in the covered EPL paths.\u003c/p>\n\u003ch2 id=\"diff-categories\">Diff Categories\u003c/h2>\n\u003ch3 id=\"reverse-encoding-testdatareverse\">Reverse encoding (\u003ccode>testdata/reverse/\u003c/code>)\u003c/h3>\n\u003cp>All eight \u003ccode>golden_reverse_*\u003c/code> tests require \u003cstrong>0% difference and identical dimensions\u003c/strong>,\nand also compare generated ZPL/TSPL bytes to committed snapshots. References are\nLabelary captures of the generated ZPL, independently checked against the intended\nthresholded raster. TSPL uses that raster as its expected output, not a TSPL\nprinter capture. See \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/reverse/README.md\">fixture provenance and regeneration\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Case\u003c/th>\n\u003cth>Languages\u003c/th>\n\u003cth>Dimensions\u003c/th>\n\u003cth>dpmm / threshold\u003c/th>\n\u003cth>Tolerance\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>shipping\u003c/td>\n\u003ctd>ZPL, TSPL\u003c/td>\n\u003ctd>813×1626\u003c/td>\n\u003ctd>8 / 128\u003c/td>\n\u003ctd>0.00%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>rgba\u003c/td>\n\u003ctd>ZPL, TSPL\u003c/td>\n\u003ctd>205×137\u003c/td>\n\u003ctd>8 / 128\u003c/td>\n\u003ctd>0.00%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>threshold\u003c/td>\n\u003ctd>ZPL, TSPL\u003c/td>\n\u003ctd>205×137\u003c/td>\n\u003ctd>12 / 200\u003c/td>\n\u003ctd>0.00%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>field_block\u003c/td>\n\u003ctd>ZPL, TSPL\u003c/td>\n\u003ctd>813×1626\u003c/td>\n\u003ctd>8 / 128\u003c/td>\n\u003ctd>0.00%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The report is \u003ccode>testdata/diffs/diff_report_reverse.txt\u003c/code>; side-by-side images and\npixel-difference masks are \u003ccode>testdata/diffs/reverse_*\u003c/code>.\u003c/p>\n\u003ch3 id=\"categories-for-forward-rendering\">Categories for forward rendering\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Category\u003c/th>\n\u003cth>Range\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PERFECT\u003c/td>\n\u003ctd>0 %\u003c/td>\n\u003ctd>Pixel-identical\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GOOD\u003c/td>\n\u003ctd>\u0026lt; 1 %\u003c/td>\n\u003ctd>Sub-pixel / anti-alias noise\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MINOR\u003c/td>\n\u003ctd>1 – 5 %\u003c/td>\n\u003ctd>Small font or position deltas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MODERATE\u003c/td>\n\u003ctd>5 – 15 %\u003c/td>\n\u003ctd>Font engine, embedded graphics, or 2D barcode differences\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HIGH\u003c/td>\n\u003ctd>≥ 15 %\u003c/td>\n\u003ctd>Missing encoder or large structural mismatch\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"per-label-thresholds\">Per-Label Thresholds\u003c/h2>\n\u003cp>Each label has a CI tolerance set slightly above the current diff to catch regressions.\nIf a future change raises the diff beyond this ceiling the golden test fails.\nLabels marked \u003cstrong>—\u003c/strong> have no dedicated golden test; they appear only in the diff report\n(\u003ccode>cargo test --test e2e_diff_report\u003c/code>), whose HIGH (≥ 15 %) classification is\ninformational.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Label\u003c/th>\n\u003cth>Ext\u003c/th>\n\u003cth>Diff %\u003c/th>\n\u003cth>Tolerance\u003c/th>\n\u003cth>Primary diff source\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>amazonshipping\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>2.18\u003c/td>\n\u003ctd>4.0\u003c/td>\n\u003ctd>DataMatrix in 4 orientations + ^FR + font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>aztec_ec_1_ec23\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.36\u003c/td>\n\u003ctd>7.5\u003c/td>\n\u003ctd>Aztec encoder pattern differences (rxing vs Labelary), EC 23%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>aztec_ec_2_ec45\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.53\u003c/td>\n\u003ctd>7.5\u003c/td>\n\u003ctd>Aztec encoder pattern differences, EC 45%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>aztec_ec_3_ec70\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.87\u003c/td>\n\u003ctd>7.5\u003c/td>\n\u003ctd>Aztec encoder pattern differences, EC 70%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>aztec_ec_4_ec95\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>5.06\u003c/td>\n\u003ctd>7.5\u003c/td>\n\u003ctd>Aztec encoder pattern differences, EC 95%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>brtit\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>1.21\u003c/td>\n\u003ctd>2.0\u003c/td>\n\u003ctd>^POI orientation + ~DG logo + font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cf_font_designator\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.13\u003c/td>\n\u003ctd>5.0\u003c/td>\n\u003ctd>^CF default font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cf_font_no_orientation\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.18\u003c/td>\n\u003ctd>5.0\u003c/td>\n\u003ctd>^CF default font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>code128_mode_d_fnc1\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.50\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>Code128 mode D FNC1 display\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dhlparcelit\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>1.84\u003c/td>\n\u003ctd>2.5\u003c/td>\n\u003ctd>~DG/^XG stored graphics + font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dhlparceluk_dhl_text\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.12\u003c/td>\n\u003ctd>5.5\u003c/td>\n\u003ctd>Font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>dhlparceluk_ver\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.05\u003c/td>\n\u003ctd>5.5\u003c/td>\n\u003ctd>Font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>empty_barcodes\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.00\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>Empty 2D barcode fields (QR/DM/MaxiCode skip, Aztec core) — pixel-identical\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fb_single_line_overflow\u003c/td>\ 3ctd>4.0\u003c/td>\n\u003ctd>Font metrics (^POI rotated text)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>usps_priority_mail\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.32\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Font metrics (^FB centered)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>usps_test_merchant\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.07\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Font metrics\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cjk_font0_ci28\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.11\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>^CI28 font-0 CJK: rendered blank with calibrated advance like Labelary (probe-measured, see tuning::FONT0_MISSING_GLYPH_ADVANCE_EM); residual = Roboto Condensed metrics on the Latin prefix\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>font0_latin_ext_a\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.21\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>Issue #65: font-0 Latin Extended-A glyphs Labelary renders (Ă ă Đ đ Ţ ţ) drawn with the Roboto Condensed subset; Ș ș Ț ț Ħ ħ stay blank with calibrated advance on both sides\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>font0_symbols\u003c/td>\n\u003ctd>zpl\u003c/td>\n\u003ctd>0.57\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>Issue #78: font-0 symbol ink calibration (tuning::FONT0_INK_TARGETS) stretches dashes/operators/\u003ccode>%\u003c/code>/braces to Labelary's ink box, \u003ccode>©\u003c/code>/\u003ccode>®\u003c/code> render as equal-size superscripts, ASCII quotes as curly shapes; en/em dash advances re-probed (Labelary advances the whole dash family uniformly at 0.9 × cell height); residual = Roboto glyph shapes vs Labelary's Helvetica-class face on the letters\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"known-limitations\">Known Limitations\u003c/h2>\n\u003ch3 id=\"maxicode-ups-ups_surepost-ups_import_control\">MaxiCode (ups, ups_surepost, ups_import_control)\u003c/h3>\n\u003cp>MaxiCode is a proprietary 2D symbology used by UPS. The encoder implements\nproper GF(64) Reed-Solomon ECC (primary 10+10, secondary 42+20 even/odd tracks)\nand greedy Set-A character encoding. Remaining diff (~3-4%) is due to minor\nhex module placement differences vs Labelary and font metric differences.\nVerified by visual inspection: the MaxiCode symbol renders at the correct\nposition/size on all three; only the interior module bits differ, consistent\nwith Labelary's secondary-message Set-switching heuristic diverging from our\ngreedy Set-A-first one on the same (spec-valid) input.\u003c/p>\n\u003ch3 id=\"pdf417-fedex-fedex_express-fedex_ground-dbschenker-dpdde-seur-tnt_express\">PDF417 (fedex, fedex_express, fedex_ground, dbschenker, dpdde, seur, tnt_express)\u003c/h3>\n\u003cp>The PDF417 pipeline (\u003ccode>src/barcodes/pdf417_encoding.rs\u003c/code>) reproduces the reference\nrenderer's compaction segment-for-segment: ISO/IEC 15438 text sub-mode switching,\nnumeric compaction for medium digit runs, byte-run absorption of short blocks, and\nthe exact descriptor/padding/RS-ECC assembly (verified codeword-identical on the\nfedex secondary-message symbol and byte-identical on \u003ccode>pdf417_basic\u003c/code>). Residual\ndiff on these labels is the font-metrics floor, not the barcode. The automatic\ncolumn count for \u003ccode>^B7\u003c/code> without a \u003ccode>columns\u003c/code> parameter is the classic near-cubic\nsqrt rule and can still differ from the reference on auto-sized symbols.\u003c/p>\n\u003ch3 id=\"aztec-aztec_ec-pnldpd\">Aztec (aztec_ec, pnldpd)\u003c/h3>\n\u003cp>The \u003ccode>rxing\u003c/code> crate's Aztec writer produces proper Aztec codes. Minor differences\nstem from error correction level defaults and symbol sizing when the ZPL\nparameters leave the size open.\u003c/p>\n\u003ch3 id=\"datamatrix-glsdk_return-purolator-posteit\">DataMatrix (glsdk_return, purolator, posteit)\u003c/h3>\n\u003cp>The \u003ccode>datamatrix\u003c/code> crate produces a spec-correct ECC 200 symbol (no quiet zone,\nmatching Labelary) at the same size and position as the reference. Pixel\ncomparison shows the interior module pattern is still largely mismatched —\nconfirmed by inspection to be a genuine bit-level difference, not a rendering\nbug (no rotation, mirroring, or size mismatch). ECC 200 leaves the encodation\nmode (ASCII/C40/text/base256) selection open when multiple paths are equally\nefficient for a given input; the \u003ccode>datamatrix\u003c/code> crate and Labelary's encoder\nresolve that ambiguity differently, producing different but equally valid\ncodeword sequences for the same data.\u003c/p>\n\u003ch3 id=\"font-rendering\">Font Rendering\u003c/h3>\n\u003cp>Labelize uses \u003ccode>ab_glyph\u003c/code> with an Apache-2.0 Roboto Condensed Bold subset for\nfont 0 (ink-fitted width ratio 1.2968 + cap-scale 1.3913, see\n\u003ccode>tuning::FONT0_*\u003c/code>) and DejaVu Sans Mono variants for bitmap fonts A–H. Labelary\nrenders font 0 with a face that is metrically near-identical to Adobe\nHelvetica Condensed Bold (probe-verified), so residual diffs come from the\ndesign difference between the two faces, concentrated on dense small text\n(dhlecommercetr, dhlparcelit). The previous Helvetica-substitute calibration\nwas replaced in 2026-10 after the old TTF turned out to be an unlicensed Adobe\nderivative (issue #65).\u003c/p>\n\u003ch3 id=\"gfa-graphics\">GFA Graphics\u003c/h3>\n\u003cp>Embedded \u003ccode>^GFA\u003c/code> hex graphics are decoded and rasterised accurately. Remaining\ndifferences (\u0026lt; 2 %) are primarily from anti-aliasing at logo edges and slight\ncoordinate rounding.\u003c/p>\n\u003ch3 id=\"stored-graphics-dhlparcelit-brtit\">Stored Graphics (dhlparcelit, brtit)\u003c/h3>\n\u003cp>\u003ccode>~DG\u003c/code> downloads and \u003ccode>^XG\u003c/code> recalls render correctly. The remaining ~2.4 % diff on\n\u003ccode>dhlparcelit\u003c/code> is font metrics; the rotated I/B pen-anchor offset that used to\ndominate its ^A0I text was fixed (see \u003ccode>tuning::ROTATED_ADVANCE_OFFSET\u003c/code>). The\n\u003ccode>^XG.GRF\u003c/code> (unnamed recall) does not match the stored \u003ccode>CMR.GRF\u003c/code> key — both our\nimplementation and Labelary skip it.\u003c/p>\n\u003ch3 id=\"single-line-field-block-overflow\">Single-line field-block overflow\u003c/h3>\n\u003cp>\u003ccode>fb_single_line_overflow\u003c/code> isolates the \u003ccode>C2PQQ…\u003c/code> shipping-label header with\n\u003ccode>^A0,60,0^FB400,1,0,L,0\u003c/code>. Its independent Labelary reference was fetched on\n2026-10-28 using the standard 8 dpmm, 4.005 × 8.01 inch endpoint. Labelary\nbreaks the oversized identifier at character boundaries and overlays the\nwrapped lines in the final line slot, as required for overflow by the\n\u003ca href=\"https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-fb.html\">Zebra ^FB reference\u003c/a>.\nThe full-canvas diff fell from 1.36% to 0.12%. The renderer regression also\nchecks the header's 420 × 80 pixel region directly (29.04% → 4.88%, ceiling\n8%) so blank surrounding pixels cannot hide a broken header.\u003c/p>\n\u003ch2 id=\"updating-references\">Updating References\u003c/h2>\n\u003cp>\u003ccode>datamatrix_dimensions\u003c/code> uses a \u003cstrong>0.0%\u003c/strong> tolerance against its independent\nLabelary reference. It covers ECC200 rectangular size constraints and the\nrow-only capacity boundary; see \u003ca href=\"#docs/datamatrix/ecc-200-dimensions\">DataMatrix dimensions\u003c/a>.\u003c/p>\n\u003cp>\u003ccode>qr_mask_selection\u003c/code> has a \u003cstrong>0.0%\u003c/strong> tolerance against an independent Labelary\nreference for five isolated EC-H Byte cases. See \u003ca href=\"#docs/rendering/qr-mask-selection\">QR mask selection\u003c/a>.\u003c/p>\n\u003cp>The \u003ccode>print_mirror\u003c/code>, \u003ccode>print_mirror_width\u003c/code>, and \u003ccode>print_mirror_inverted\u003c/code> fixtures\nhave a strict pixel-for-pixel check in \u003ccode>tests/unit_print_mirror.rs\u003c/code> in addition\nto the golden suite. Their independent Labelary references and measured\ncoordinate expectations are documented in \u003ca href=\"#docs/rendering/print-mirror\">Print mirror\u003c/a>.\u003c/p>\n\u003cp>To regenerate all Labelary reference images:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\"># ZPL labels (Labelary API)\nfor f in testdata/labels/*.zpl testdata/unit/*.zpl; do\n  name=$(basename \u0026quot;$f\u0026quot; .zpl)\n  dir=$(dirname \u0026quot;$f\u0026quot;)\n  curl -s -X POST http://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/ \\\n    -F \u0026quot;file=@$f\u0026quot; -o \u0026quot;${dir}/${name}.png\u0026quot;\ndone\n\n# EPL labels — Labelary does not support EPL.\n# Use the Go renderer or keep existing references.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"running-the-diff-report\">Running the Diff Report\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\"># Full report (no failure on HIGH)\ncargo test --test e2e diff_report -- --nocapture\n\n# Golden tests with per-label tolerances (fails on regression)\ncargo test --test e2e e2e_golden -- --test-threads=4\n\u003c/code>\u003c/pre>","headings":[["2","reference-setup","Reference Setup"],["3","carrier-labels-testdatalabels-and-unit-tests-testdataunit","Carrier Labels (testdata/labels/) and Unit Tests (testdata/unit/)"],["2","diff-categories","Diff Categories"],["3","reverse-encoding-testdatareverse","Reverse encoding (testdata/reverse/)"],["3","categories-for-forward-rendering","Categories for forward rendering"],["2","per-label-thresholds","Per-Label Thresholds"],["2","known-limitations","Known Limitations"],["3","maxicode-ups-ups_surepost-ups_import_control","MaxiCode (ups, ups_surepost, ups_import_control)"],["3","pdf417-fedex-fedex_express-fedex_ground-dbschenker-dpdde-seur-tnt_express","PDF417 (fedex, fedex_express, fedex_ground, dbschenker, dpdde, seur, tnt_express)"],["3","aztec-aztec_ec-pnldpd","Aztec (aztec_ec, pnldpd)"],["3","datamatrix-glsdk_return-purolator-posteit","DataMatrix (glsdk_return, purolator, posteit)"],["3","font-rendering","Font Rendering"],["3","gfa-graphics","GFA Graphics"],["3","stored-graphics-dhlparcelit-brtit","Stored Graphics (dhlparcelit, brtit)"],["3","single-line-field-block-overflow","Single-line field-block overflow"],["2","updating-references","Updating References"],["2","running-the-diff-report","Running the Diff Report"]],"examples":[],"search":" Rendering Diff Thresholds \n  Documentation index  \n Labelize renders ZPL/EPL labels to pixel images. This document tracks the\nexpected pixel-difference percentage for every test label compared against\nreference images from the  Labelary ZPL viewer . \n Reference Setup \n Carrier Labels ( testdata/labels/ ) and Unit Tests ( testdata/unit/ ) \n \n \n \n Parameter \n Value \n \n \n \n \n DPI \n 8 dpmm (≈ 203 dpi) \n \n \n Label size \n 4.005 × 8.01 inches (101.625 × 203.25 mm) \n \n \n Pixel dims \n 813 × 1626 \n \n \n Source \n Labelary API  http://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/  \n \n \n \n Both directories share the same canvas:  default_options()  renders at 813 × 1626 and\nevery Labelary request uses  LABELARY_LABEL_SIZE_IN  (4.005 × 8.01 in), which Labelary\nserves natively at 813 × 1626 — the exact same size, so no padding is needed. \n  Do not derive the request size from the mm values  ( 101.625 / 25.4  in): Labelary\nfloor-rounds that 4.00197 × 8.00197 in request to a 812 × 1624 px canvas server-side.\nPadding such a response up to 813 × 1626 shifts all content by (−1, −2) px relative to\na native render, which misaligned every  ^POI  (inverted) label — e.g. the fedex family\nframe lines and barcodes sat 2 px off, inflating  fedex_express  from 6.2 % to 11.3 %.\nReferences fetched before this convention were re-fetched at the native size (all\n ^POI  labels: bpost, brtit, canadapost, colissimo, fedex, fedex_express, fedex_ground,\nmu_millimeters, purolator, ups, ups_import_control, ups_maxicode, ups_surepost,\nusps_apo, usps_intl). \n Non-inverted labels are insensitive to this (their content anchors to the top-left\norigin), so a few of their references may still contain padded 812 × 1624 renders —\nharmless, and they are refreshed opportunistically when a label's fixture changes. \n The EPL label  dpduk.epl  uses a reference rendered by the Go-based labelize\npredecessor because Labelary does not support EPL. The  epl2_showcase.epl \nsnippet (Table 1 bar code types,  b  2-D bar codes,  GW / X / LS / LW )\nuses the renderer baseline as its reference (0.00 % at rest), so its\ntolerance only guards against regressions in the covered EPL paths. \n Diff Categories \n Reverse encoding ( testdata/reverse/ ) \n All eight  golden_reverse_*  tests require  0% difference and identical dimensions ,\nand also compare generated ZPL/TSPL bytes to committed snapshots. References are\nLabelary captures of the generated ZPL, independently checked against the intended\nthresholded raster. TSPL uses that raster as its expected output, not a TSPL\nprinter capture. See  fixture provenance and regeneration . \n \n \n \n Case \n Languages \n Dimensions \n dpmm / threshold \n Tolerance \n \n \n \n \n shipping \n ZPL, TSPL \n 813×1626 \n 8 / 128 \n 0.00% \n \n \n rgba \n ZPL, TSPL \n 205×137 \n 8 / 128 \n 0.00% \n \n \n threshold \n ZPL, TSPL \n 205×137 \n 12 / 200 \n 0.00% \n \n \n field_block \n ZPL, TSPL \n 813×1626 \n 8 / 128 \n 0.00% \n \n \n \n The report is  testdata/diffs/diff_report_reverse.txt ; side-by-side images and\npixel-difference masks are  testdata/diffs/reverse_* . \n Categories for forward rendering \n \n \n \n Category \n Range \n Meaning \n \n \n \n \n PERFECT \n 0 % \n Pixel-identical \n \n \n GOOD \n \u003c 1 % \n Sub-pixel / anti-alias noise \n \n \n MINOR \n 1 – 5 % \n Small font or position deltas \n \n \n MODERATE \n 5 – 15 % \n Font engine, embedded graphics, or 2D barcode differences \n \n \n HIGH \n ≥ 15 % \n Missing encoder or large structural mismatch \n \n \n \n Per-
