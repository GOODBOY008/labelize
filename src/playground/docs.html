3cthead>\n\u003ctr>\n\u003cth>Settings\u003c/th>\n\u003cth>Left, top, right, bottom\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Default\u003c/td>\n\u003ctd>10, 20, 29, 29\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PMY\u003c/code>\u003c/td>\n\u003ctd>173, 20, 192, 29\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PW100\u003c/code>\u003c/td>\n\u003ctd>61, 20, 80, 29\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PW100^PMY\u003c/code>\u003c/td>\n\u003ctd>122, 20, 141, 29\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PW100^POI\u003c/code>\u003c/td>\n\u003ctd>122, 71, 141, 80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PW100^PMY^POI\u003c/code>\u003c/td>\n\u003ctd>61, 71, 80, 80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^PW300^PMY\u003c/code>\u003c/td>\n\u003ctd>173, 20, 192, 29\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The odd 103-dot margin for \u003ccode>^PW100\u003c/code> distinguishes mirroring the completed canvas\nfrom mirroring the narrower printable region before centering.\u003c/p>\n\u003ch3 id=\"regression-fixtures\">Regression fixtures\u003c/h3>\n\u003cp>\u003ccode>testdata/unit/print_mirror{,_width,_inverted}.zpl\u003c/code> have independent PNG references\ndownloaded from Labelary at \u003ccode>8dpmm/labels/4.005x8.01/0/\u003c/code> (813 x 1626 pixels).\nThese contain only asymmetric filled graphics, including print-width clipping,\nso font rasterization does not require a tolerance. \u003ccode>unit_print_mirror\u003c/code> compares\nall three decoded images pixel-for-pixel; the normal golden suite also runs them.\nReference generation has no local-renderer fallback in this investigation.\u003c/p>\n\u003cp>Other tests cover persistent state, separate parser instances, invalid inputs,\nstored formats containing only settings, rotated text, QR codes, clipping,\nantialiasing, and the inversion option. No physical printer was used.\u003c/p>\n\u003ch3 id=\"library-data-model\">Library data model\u003c/h3>\n\u003cp>\u003ccode>LabelInfo::mirrored\u003c/code> is the resolved per-label snapshot. Code constructing\n\u003ccode>LabelInfo\u003c/code> with a struct literal must supply \u003ccode>mirrored: false\u003c/code> for normal output.\n\u003ccode>StoredFormat::mirrored\u003c/code> and \u003ccode>RecalledFormat::mirrored\u003c/code> are \u003ccode>Option\u0026lt;bool\u0026gt;\u003c/code>:\n\u003ccode>None\u003c/code> inherits the current setting, while \u003ccode>Some(false)\u003c/code> explicitly disables it.\nEPL labels initialize the flag to false.\u003c/p>\n\u003ch2 id=\"qr-mask-selection\">QR mask selection\u003c/h2>\n\u003cp>\u003ccode>qrcode 0.14.1\u003c/code> evaluates N4 (dark/light balance) with an approximately linear\nscore. ISO/IEC 18004:2015 section 7.8.3.1, Table 11 requires ten points for each\ncomplete five-percentage-point deviation from 50%. The approximation can change\nthe winning mask, even when segmentation, version, correction level and\ncodewords are identical.\u003c/p>\n\u003ch3 id=\"reproduced-counterexamples\">Reproduced counterexamples\u003c/h3>\n\u003cp>The following inputs use one Byte segment and no ECI. The H case requires\nversion 2; the other four fit version 1. The automatic Labelize API is tested;\nthese lowercase payloads are encoded as Byte by the existing optimizer.\nMask numbers are zero-based. Automatic segmentation is unchanged.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Payload\u003c/th>\n\u003cth>EC\u003c/th>\n\u003cth>Previous mask\u003c/th>\n\u003cth>Corrected mask\u003c/th>\n\u003cth>Standard score, previous -\u0026gt; corrected\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>mask-24\u003c/code>\u003c/td>\n\u003ctd>L\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1041 -\u0026gt; 1037\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mask-37\u003c/code>\u003c/td>\n\u003ctd>M\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>1035 -\u0026gt; 1034\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mask-46\u003c/code>\u003c/td>\n\u003ctd>Q\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1041 -\u0026gt; 1039\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mask-64\u003c/code>\u003c/td>\n\u003ctd>L\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>1019 -\u0026gt; 1017\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mask-907\u003c/code>\u003c/td>\n\u003ctd>H\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>1190 -\u0026gt; 1184\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>A ZPL equivalent of the first case is\n\u003ccode>^XA^FO20,20^BQN,2,4^FDLM,B0007mask-24^FS^XZ\u003c/code>.\u003c/p>\n\u003cp>The first regression failed against the unmodified renderer: \u003ccode>mask-24 L\nAutomatic: must select standard mask 1\u003c/code>. A valid, decodable QR symbol alone\ndoes not establish correct mask selection.\u003c/p>\n\u003ch3 id=\"implementation-and-scope\">Implementation and scope\u003c/h3>\n\u003cp>Labelize continues using the dependency's public \u003ccode>Bits\u003c/code>, Reed-Solomon codeword\nconstruction and \u003ccode>Canvas\u003c/code> mask application. It evaluates the eight completed\ncandidate matrices itself, including format information. Lowest score wins;\nties choose the lowest mask number. This avoids vendoring the dependency or\nmodifying the local Cargo registry.\u003c/p>\n\u003cp>N4 uses integer arithmetic: \u003ccode>abs(2 * dark - total) * 10 / total * 10\u003c/code>.\nN1-N3 retain the existing evaluation: runs, overlapping 2x2 blocks, and one\npenalty per finder-like core with a light area before or after (including the\nquiet zone). The dependency subtracts a mask-independent 720 points from N3;\nour totals retain those points, which cannot change candidate order. Scores use\n\u003ccode>u32\u003c/code> so even an artificial all-dark version-40 matrix cannot overflow.\u003c/p>\n\u003cp>This fixes automatic mask evaluation for the existing Model 2 path. It does not\nimplement the ZPL \u003ccode>^BQ\u003c/code> explicit mask parameter, Micro QR, Model 1, or change\nsegment selection, correction levels, padding, or symbol sizes. It is not a\ncertification of every aspect of QR compliance or physical print quality.\u003c/p>\n\u003ch3 id=\"independent-references-and-verification\">Independent references and verification\u003c/h3>\n\u003cp>The five text fixtures in \u003ccode>testdata/qr-mask/\u003c/code> were generated on September 10,\n2026 from the existing JavaScript toolkit at \u003ccode>096b5d42fc6ed50ba49b8e3a2fb6ab98171b1d7a\u003c/code>.\nIts \u003ccode>QrCore\u003c/code> generated all eight forced-mask matrices using Byte mode, no ECI,\nand the specified EC level. \u003ccode>calculateQrMaskPenalty\u003c/code> evaluated each candidate.\nEach fixture stores payload, EC, winning mask, all eight standard scores, and\nthe winning matrix. No Rust renderer output was used to generate these references.\nThe toolkit itself is unchanged.\u003c/p>\n\u003cp>Tests compare all 40 Rust candidate scores to the recorded independent scores,\nthen compare complete output matrices for automatic input.\nThe independent rxing decoder checks Byte mode and payload bytes. Additional\ntests cover N4 boundaries, symmetry and large scores. Existing automatic-mode\nregressions preserve decoded data codewords, correction level, dimensions,\nquiet zones and magnification while allowing the intended mask changes.\u003c/p>\n\u003cp>Existing Labelary PNGs remain unchanged. Pixel agreement with Labelary is a\nseparate measurement: a changed mask can increase or decrease image differences.\nDifferent error correction levels or character modes must not be mistaken for\na mask-scoring defect. N3 deliberately retains the dependency's interpretation;\nthis change does not claim to resolve every ambiguity in ISO mask evaluation.\u003c/p>\n\u003cp>Sources:\n- \u003ca href=\"https://nuintun.github.io/qrcode/spec/ISO-IEC-18004-2015.pdf\">ISO/IEC 18004:2015, section 7.8.3.1, Table 11\u003c/a>\n- \u003ca href=\"https://docs.rs/qrcode/0.14.1/src/qrcode/canvas.rs.html\">qrcode-rust canvas implementation\u003c/a>\n- Toolkit: \u003ccode>src/barcodes/qr-core.js\u003c/code>, \u003ccode>src/barcodes/qr-mask-penalty.js\u003c/code>\u003c/p>\n\u003ch3 id=\"labelary-and-printer-study-2026-10-06\">Labelary and printer study, 2026-10-06\u003c/h3>\n\u003cp>Five new lowercase, seven-byte EC-H inputs isolate mask selection: their version,\nByte segment, error correction, and unmasked data codewords are identical across\nthe before/after encoders and independently decoded Labelary references.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Payload\u003c/th>\n\u003cth style=\"text-align: right;\">Previous mask\u003c/th>\n\u003cth style=\"text-align: right;\">Corrected / Labelary mask\u003c/th>\n\u003cth>Matrix difference before -\u0026gt; after\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>abcabaa\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd>20.4082% -\u0026gt; 0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>abcucaa\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003ctd>30.8390% -\u0026gt; 0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>abccdaa\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd>24.0363% -\u0026gt; 0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>abcndaa\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">6\u003c/td>\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd>26.3039% -\u0026gt; 0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>abcaeaa\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">5\u003c/td>\n\u003ctd style=\"text-align: right;\">6\u003c/td>\n\u003ctd>13.1519% -\u0026gt; 0%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>These are barcode-module differences, not percentages diluted by white label\nspace. \u003ccode>testdata/unit/qr_mask_selection.zpl\u003c/code> includes all five fields and uses\nan independently fetched Labelary PNG with a strict 0.0% golden tolerance.\nReference endpoint: \u003ccode>https://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/\u003c/code>.\nOriginal PNG SHA-256:\n\u003ccode>865fff0a526ead419ef512e7b8afeea69699a1441c87003795011a81717169ab\u003c/code>.\u003c/p>\n\u003cp>A physical native \u003ccode>^BQ\u003c/code> print of \u003ccode>abcabaa\u003c/code> on a ZD421 (300 dpi, V93.21.17Z)\nuses mask 2, whereas Labelary and this correction use mask 1. The native photo\nwas independently decoded with the same payload and data codewords. This is\nevidence of a separate firmware-mask-selection difference; the correction\nimproves Labelary compatibility on the five verified cases and does not claim\nuniversal Zebra matrix identity.\u003c/p>","headings":[["2","field-parameters","Field parameters"],["3","independent-labelary-measurements-november-6-2026","Independent Labelary measurements (November 6, 2026)"],["2","print-mirror","Print mirror"],["3","sources-and-comparison-september-10-2026","Sources and comparison (September 10, 2026)"],["3","independent-geometry-measurements","Independent geometry measurements"],["3","regression-fixtures","Regression fixtures"],["3","library-data-model","Library data model"],["2","qr-mask-selection","QR mask selection"],["3","reproduced-counterexamples","Reproduced counterexamples"],["3","implementation-and-scope","Implementation and scope"],["3","independent-references-and-verification","Independent references and verification"],["3","labelary-and-printer-study-2026-10-06","Labelary and printer study, 2026-10-06"]],"examples":[],"search":" Rendering behavior and evidence \n  Documentation index  \n Focused semantics and reference measurements that complement the\n ZPL command matrix  and\n diff thresholds . Dated measurements describe the named\nrenderer or device; they are not universal printer conformance claims. \n \n  Print mirror : persistent state, transforms and geometry. \n  Field parameters : text direction, character spacing and\n  measured Labelary compatibility. \n  QR mask selection : scoring, independent matrices and\n  observed firmware differences. \n \n DataMatrix has a separate  reference ; TSPL calibration and\nopen questions are in  TSPL baselines . \n Field parameters \n  ^FPd,g  configures the current text field.  H  places upright characters\nleft to right,  R  places them right to left, and  V  stacks them vertically\nwithout rotating the individual characters. The field's font orientation\nstill rotates the resulting arrangement. This is distinct from  ^FR , which\nreverses field colors. \n The gap  g  is an additional character spacing in printer dots;  ^MU  does\nnot rescale it. Each  ^FP  replaces both parameters: omitted or invalid\ndirection selects  H , and an omitted gap selects zero.  ^FS  restores the\ndefault horizontal direction and zero gap for the next field. \n Independent Labelary measurements (November 6, 2026) \n Synthetic  ABCDE  fields were rendered through the public Labelary API at\n8 dots/mm, using scalable font 0 ( ^A0N,40,32 ) and bitmap font A\n( ^AAN,36,20 ). Visible ink widths were: \n \n \n \n Gap command \n Font 0 \n Font A \n Change from zero gap \n \n \n \n \n  ^FPH,0  \n 86 \n 115 \n 0 \n \n \n  ^FPH,5  \n 106 \n 135 \n +20 \n \n \n  ^FPH,15  \n 146 \n 175 \n +60 \n \n \n  ^FPH,30  \n 206 \n 235 \n +120 \n \n \n  ^FPH,-5  \n 66 \n 95 \n -20 \n \n \n \n Five characters have four between-character spaces: the measured width\nchange is exactly  4 * g , without stretching the glyphs.  ^FPR,10  likewise\nadds ten dots between upright characters in reverse order. \n For  both tested fonts ,  ^FPV,0 ,  ^FPV,5 ,  ^FPV,10  and  ^FPV,30 \nproduced pixel-identical PNGs. Labelize deliberately reproduces this\nLabelary behavior: the gap is ignored for vertical glyph placement. Vertical\nplacement uses the font's cell height as the character pitch. With  ^FB ,\nthe gap still affects wrapping, so different gaps can produce different\nblocks even though the pitch within each vertical run is unchanged. \n Labelary accepts negative gaps down to -10 (more-negative values clamp to\n-10); the Zebra guide documents a nonnegative range instead. Very large\npositive gaps can also be discarded by Labelary based on the selected font\nwidth. These are compatibility observations,  not verified Zebra printer\nbehavior . Physical-printer tests remain outstanding. \n The independent full-page reference is\n  testdata/unit/field_parameters.zpl  \nand its PNG; the adjacent provenance JSON records the endpoint, source hash\nand original reference hash. Tests additionally check individual field\ngeometry and spacing so sparse whole-page tolerances cannot hide an ignored\ncommand. Existing substitute-font shape differences remain visible in the\ncomparison artifacts. \n The new full-page golden has a 3.0% ceiling: the captured comparison measured\n2.7771%, including 1.1299% in the unchanged annotation fields alone. The\nunmodified  db25929  renderer, which ignores  ^FP , measured 3.8829% against\nthe same source and reference and fails this ceiling. Isolated geometry\nchecks separately require the exact requested per-character displacement;\nfont-outline tolerance cannot excuse an ignored or incorrectly scaled gap. \n The  additional frozen captures \npin rotated origins, explicit alignment and field-block interactions. For\ncentered blocks, Labelary includes a trailing word separator in alignment\nmeasurement only when it fits the block width. Acceptance checks compare\nspacing-induced shifts against the zero-gap control, preserving the existing\nsubstitute-font baseline while rejecting new alignment errors. \n Sources:  Zebra Programming Guide ,\n Labelary command reference , and the\ncaptured independent images. Unicode combining sequences and complex field\ninteractions must not be inferred to match physical printer firmware from\nthese synthetic measurements. \n Print mirror \n  ^PMY  mirrors the whole label horizontally. The setting persists across\n ^XA / ^XZ  and subsequent calls to the same  ZplParser .  ^PMN  disables it;\nconstructing a new parser starts with mirroring disabled. Missing or invalid\nparameters leave the current state unchanged. The last valid setting in a\nformat applies to every field and every  ^PQ  copy of that label. \n The completed image is mirrored after print-width clipping/centering and  ^PO \nrotation.  DrawerOptions::enable_inverted_labels  controls  ^PO  only; disabling\nthat option does not disable  ^PM . \n Downloaded formats store an optional explicit mirror instruction. Defining a\nformat does not change the printer's mirror setting. Recalling a format replays\nits instruction, if present; a format without  ^PM  inherits the printer's state\nat recall time. A later  ^PMN  in the calling format takes precedence. \n Sources and comparison (September 10, 2026) \n \n The authoritative  Zebra Programming Guide, ^PM section \n  specifies horizontal reflection, persistence until explicit disable/power-off,\n  and ignoring missing/invalid parameters. \n  Labelary lists ^PM as supported . Live requests\n  confirmed persistence, reset, ignored invalid/missing parameters, whole-label\n  application, print-width/rotation composition, and stored-format behavior. \n The inspected  ZPLR interpreter at 590f03c \n  initializes mirror state per label and uses  yesNo(args[0], true)  for  ^PM .\n  Its  raster transform \n  implements horizontal reflection composed with 180-degree rotation. Its\n  parameter/state handling is not used as the authority for this implementation. \n \n The Labelary HTTP endpoint also ignored a  ^PMY  placed before the first  ^XA .\nThat observation does not establish physical-printer behavior outside formats.\nLike other existing printer settings in Labelize,  ^PM  is interpreted wherever\nthe command parser receives it; the conformance cases below use complete formats. \n Independent geometry measurements \n Requests used  POST https://api.labelary.com/v1/printers/8dpmm/labels/1x0.5/0/ \nwith  Accept: image/png  and the synthetic field\n ^FO10,20^GB20,10,10^FS  inside  ^XA / ^XZ . The returned canvas was 203 x 101\ndots. Coordinates below are inclusive black-pixel bounds. \n \n \n \n Settings \n Left, top, right, bottom \n \n \n \n \n Default \n 10, 20, 29, 29 \n \n \n  ^PMY  \n 173, 20, 192, 29 \n \n \n  ^PW100  \n 61, 20, 80, 29 \n \n \n  ^PW100^PMY  \n 122, 20, 141, 29 \n \n \n  ^PW100^POI  \n 122, 71, 141, 80 \n \n \n  ^PW100^PMY^POI  \n 61, 71, 80, 80 \n \n \n  ^PW300^PMY  \n 173, 20, 192, 29 \n \n \n \n The odd 103-dot margin for  ^PW100  distinguishes mirroring the completed canvas\nfrom mirroring the narrower printable region before centering. \n Regression fixtures \n  testdata/unit/print_mirror{,_width,_inverted}.zpl  have independent PNG references\ndownloaded from Labelary at  8dpmm/labels/4.005x8.01/0/  (813 x 1626 pixels).\nThese contain only asymmetric filled graphics, including print-width clipping,\nso font rasterization does not require a tolerance.  unit_print_mirror  compares\nall three decoded images pixel-for-pixel; the normal golden suite also runs them.\nReference generation has no local-renderer fallback in this investigation. \n Other tests cover persistent state, separate parser instances, invalid inputs,\nstored formats containing only settings, rotated text, QR codes, clipping,\nantialiasing, and the inversion option. No physical printer was used. \n Library data model \n  LabelInfo::mirrored  is the resolved per-label snapshot. Code constructing\n LabelInfo  with a struct literal must supply  mirrored: false  for normal output.\n StoredFormat::mirrored  and  RecalledFormat::mirrored  are  Option\u003cbool> :\n None  inherits the current setting, while  Some(false)  explicitly disables it.\nEPL labels initialize the flag to false. \n QR mask selection \n  qrcode 0.14.1  evaluates N4 (dark/light balance) with an approximately linear\nscore. ISO/IEC 18004:2015 section 7.8.3.1, Table 11 requires ten points for each\ncomplete five-percentage-point deviation from 50%. The approximation can change\nthe winning mask, even when segmentation, version, correction level and\ncodewords are identical. \n Reproduced counterexamples \n The following inputs use one Byte segment and no ECI. The H case requires\nversion 2; the other four fit version 1. The automatic Labelize API is tested;\nthese lowercase payloads are encoded as Byte by the existing optimizer.\nMask numbers are zero-based. Automatic segmentation is unchanged. \n \n \n \n Payload \n EC \n Previous mask \n Corrected mask \n Standard score, previous -> corrected \n \n \n \n \n  mask-24  \n L \n 7 \n 1 \n 1041 -> 1037 \n \n \n  mask-37  \n M \n 0 \n 7 \n 1035 -> 1034 \n \n \n  mask-46  \n Q \n 2 \n 3 \n 1041 -> 1039 \n \n \n  mask-64  \n L \n 1 \n 0 \n 1019 -> 1017 \n \n \n  mask-907  \n H \n 7 \n 2 \n 1190 -> 1184 \n \n \n \n A ZPL equivalent of the first case is\n ^XA^FO20,20^BQN,2,4^FDLM,B0007mask-24^FS^XZ . \n The first regression failed against the unmodified renderer:  mask-24 L\nAutomatic: must select standard mask 1 . A valid, decodable QR symbol alone\ndoes not establish correct mask selection. \n Implementation and scope \n Labelize continues using the dependency's public  Bits , Reed-Solomon codeword\nconstruction and  Canvas  mask application. It evaluates the eight completed\ncandidate matrices itself, including format information. Lowest score wins;\nties choose the lowest mask number. This avoids vendoring the dependency or\nmodifying the local Cargo registry. \n N4 uses integer arithmetic:  abs(2 * dark - total) * 10 / total * 10 .\nN1-N3 retain the existing evaluation: runs, overlapping 2x2 blocks, and one\npenalty per finder-like core with a light area before or after (including the\nquiet zone). The dependency subtracts a mask-independent 720 points from N3;\nour totals retain those points, which cannot change candidate order. Scores use\n u32  so even an artificial all-dark version-40 matrix cannot overflow. \n This fixes automatic mask evaluation for the existing Model 2 path. It does not\nimplement the ZPL  ^BQ  explicit mask parameter, Micro QR, Model 1, or change\nsegment selection, correction levels, padding, or symbol sizes. It is not a\ncertification of every aspect of QR compliance or physical print quality. \n Independent references and verification \n The five text fixtures in  testdata/qr-mask/  were generated on September 10,\n2026 from the existing JavaScript toolkit at  096b5d42fc6ed50ba49b8e3a2fb6ab98171b1d7a .\nIts  QrCore  generated all eight forced-mask matrices using Byte mode, no ECI,\nand the specified EC level.  calculateQrMaskPenalty  evaluated each candidate.\nEach fixture stores payload, EC, winning mask, all eight standard scores, and\nthe winning matrix. No Rust renderer output was used to generate these references.\nThe toolkit itself is unchanged. \n Tests compare all 40 Rust candidate scores to the recorded independent scores,\nthen compare complete output matrices for automatic input.\nThe independent rxing decoder checks Byte mode and payload bytes. Additional\ntests cover N4 boundaries, symmetry and large scores. Existing automatic-mode\nregressions preserve decoded data codewords, correction level, dimensions,\nquiet zones and magnification while allowing the intended mask changes. \n Existing Labelary PNGs remain unchanged. Pixel agreement with Labelary is a\nseparate measurement: a changed mask can increase or decrease image differences.\nDifferent error correction levels or character modes must not be mistaken for\na mask-scoring defect. N3 deliberately retains the dependency's interpretation;\nthis change does not claim to resolve every ambiguity in ISO mask evaluation. \n Sources:\n-  ISO/IEC 18004:2015, section 7.8.3.1, Table 11 \n-  qrcode-rust canvas implementation \n- Toolkit:  src/barcodes/qr-core.js ,  src/barcodes/qr-mask-penalty.js  \n Labelary and printer study, 2026-10-06 \n Five new lowercase, seven-byte EC-H inputs isolate mask selection: their version,\nByte segment, error correction, and unmasked data codewords are identical across\nthe before/after encoders and independently decoded Labelary references. \n \n \n \n Payload \n Previous mask \n Corrected / Labelary mask \n Matrix difference before -> after \n \n \n \n \n  abcabaa  \n 5 \n 1 \n 20.4082% -> 0% \n \n \n  abcucaa  \n 3 \n 5 \n 30.8390% -> 0% \n \n \n  abccdaa  \n 3 \n 2 \n 24.0363% -> 0% \n \n \n  abcndaa  \n 6 \n 4 \n 26.3039% -> 0% \n \n \n  abcaeaa  \n 5 \n 6 \n 13.1519% -> 0% \n \n \n \n These are barcode-module differences, not percentages diluted by white label\nspace.  testdata/unit/qr_mask_selection.zpl  includes all five fields and uses\nan independently fetched Labelary PNG with a strict 0.0% golden tolerance.\nReference endpoint:  https://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/ .\nOriginal PNG SHA-256:\n 865fff0a526ead419ef512e7b8afeea69699a1441c87003795011a81717169ab . \n A physical native  ^BQ  print of  abcabaa  on a ZD421 (300 dpi, V93.21.17Z)\nuses mask 2, whereas Labelary and this correction use mask 1. The native photo\nwas independently decoded with the same payload and data codewords. This is\nevidence of a separate firmware-mask-selection difference; the correction\nimproves Labelary compatibility on the five verified cases and does not claim\nuniversal Zebra matrix identity. "},{"id":"tspl-baselines","group":"Reference","title":"TSPL Baseline Renderers","file":"TSPL_BASELINES.md","html":"\u003ch1 id=\"tspl-baseline-renderers\">TSPL Baseline Renderers\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>TSPL has no equivalent of Labelary (which is ZPL-only and the golden\nreference for the ZPL side). Two independent baseline renderers are used for\nTSPL calibration, with a strict triangulation policy so we never overfit one\napproximation. The service capabilities below are dated observations; recheck\ncoverage before using either service for a new fixture. Source provenance lives\nin \u003ca href=\"#docs/corpus/tspl\">Test corpus\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Baseline\u003c/th>\n\u003cth>Type\u003c/th>\n\u003cth>Access\u003c/th>\n\u003cth>License\u003c/th>\n\u003cth>Role\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>labelixa.com\u003c/strong>\u003c/td>\n\u003ctd>Online renderer (MVP subset)\u003c/td>\n\u003ctd>\u003ccode>POST https://api.labelixa.com/v1/tspl/render\u003c/code> (raw TSPL body → PNG, 203 dpi preview). Diagnostics: \u003ccode>POST /v1/tspl/diagnostics\u003c/code>. Anonymous IP-quota, remaining reported in \u003ccode>X-RateLimit-Remaining\u003c/code>, resets 00:00 UTC; 512 KB body cap. npm \u003ccode>labelixa\u003c/code> / PyPI \u003ccode>labelixa\u003c/code> packages are thin API clients, \u003cstrong>not\u003c/strong> offline renderers.\u003c/td>\n\u003ctd>Proprietary service\u003c/td>\n\u003ctd>\u003cstrong>Primary\u003c/strong> — only hosted TSPL renderer found (6 search rounds, EN+CN, incl. GitHub sweep)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>portakal\u003c/strong>\u003c/td>\n\u003ctd>Local parser + SVG preview\u003c/td>\n\u003ctd>\u003ccode>git clone productdevbook/portakal\u003c/code> (npm \u003ccode>portakal\u003c/code> ≥0.5 lacks the parser; use \u003ccode>main\u003c/code>), \u003ccode>parseTSC(src) → ResolvedLabel\u003c/code>, \u003ccode>renderPreview(label) → SVG\u003c/code>; rasterize SVG with \u003ccode>@resvg/resvg-js\u003c/code> (\u003ccode>fitTo width=812\u003c/code>, background white, \u003ccode>DejaVu Sans Mono\u003c/code>). Run via \u003ccode>npx tsx\u003c/code>.\u003c/td>\n\u003ctd>MIT\u003c/td>\n\u003ctd>\u003cstrong>Secondary\u003c/strong> — offline, unlimited iterations for auto-fix loops\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"capability-boundaries-measured-2026-10-12\">Capability boundaries (measured, 2026-10-12)\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>labelixa\u003c/strong> does not render: \u003ccode>DIRECTION\u003c/code> (declared \"not applied to the\n  MVP preview\"; verified 0–4 identical), \u003ccode>CIRCLE\u003c/code>, \u003ccode>ELLIPSE\u003c/code>, rounded \u003ccode>BOX\u003c/code>,\n  \u003ccode>PDF417\u003c/code>, \u003ccode>ITF14\u003c/code>, \u003ccode>DMATRIX\u003c/code> (returns a blank label; measured 2026-10-21\n  with area-only, \u003ccode>x#\u003c/code>, and manual-sample shapes — DMATRIX is therefore\n  calibrated against the TSC TSPL manual + its result figure alone). It also\n  skips \u003ccode>|\u003c/code> characters in text. Canvas is floor-rounded (812×406 where\n  labelize produces 813×407) — pad to union before diffing.\u003c/li>\n\u003cli>\u003cstrong>portakal\u003c/strong> parses a subset (\u003ccode>doc_QRCODE_sample_1\u003c/code> → 0 elements,\n  \u003ccode>doc_BARCODE_sample_1\u003c/code> → 1 of 3 elements). Its SVG viewport adds a\n  decorative margin; rasterize with \u003ccode>fitTo\u003c/code> and re-check dimensions. Font\n  rendering depends on the rasterizer's system fonts — treat font-metric\n  disagreement involving portakal as weak evidence.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"triangulation-policy\">Triangulation policy\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Both baselines agree, labelize differs\u003c/strong> → labelize is wrong: fix\n   (parser-side calibration only; \u003ccode>tests/unit_architecture.rs\u003c/code> guards the\n   language boundary).\u003c/li>\n\u003cli>\u003cstrong>Baselines disagree with each other\u003c/strong> → open question unless the TSC\n   TSPL/TSPL2 manual states the semantics; never calibrate to one side.\u003c/li>\n\u003cli>\u003cstrong>A baseline skips a feature\u003c/strong> the other renders → compare against the\n   rendering one only, and note the coverage gap.\u003c/li>\n\u003cli>No hardware samples exist in the corpus yet; a TSC print scan always\n   outranks both baselines.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"known-engine-disagreements-open-questions-2026-10-12\">Known engine disagreements (open questions, 2026-10-12)\u003c/h2>\n\u003ch3 id=\"bitmap-exact-hex-compatibility-and-polarity-2026-10-30-108\">\u003ccode>BITMAP\u003c/code> — exact hex compatibility and polarity (2026-10-30, #108)\u003c/h3>\n\u003cp>The \u003ca href=\"https://fs.chinatsc.cn/system/files/tspl_tspl2_programming_2018_5_17_scjiantizhongwen.pdf\">TSC TSPL/TSPL2 manual, Chinese edition\u003c/a>\nshows the BITMAP cell grid on printed p.44 and its byte table/sample stream\non p.45 (PDF pages 56–57). Dark cells correspond to \u003cstrong>0\u003c/strong> bits; the printed\nresult is an arrow pointing up-left. The sample sends \u003cstrong>raw binary\u003c/strong> after\nthe fifth comma. The hexadecimal column is a representation of those wire\nbytes, not evidence of an ASCII-hex firmware mode.\u003c/p>\n\u003cp>Labelize therefore keeps \u003cstrong>0 = black, 1 = white\u003c/strong>, unchanged from 1.9.0.\nIssue #108 reports a TX610 accepting ASCII hex and using a different\npolarity; no physical print scan is attached, so that firmware behavior\nremains unverified. We support hex as a Labelize compatibility extension\nwithout claiming that every TSC printer accepts it or attributing the\nreporter's observations to a particular writer bug.\u003c/p>\n\u003cp>For \u003ccode>N = widthBytes × heightDots\u003c/code>, the compatibility form requires a whole\npayload line with exactly \u003ccode>2 × N\u003c/code> hex digits. Upper/lowercase and spaces/tabs\nare accepted; CR, LF, CRLF or EOF ends the line. Other payloads use the\nexisting \u003ccode>N\u003c/code>-byte binary cursor. In particular, short/odd/overlong runs and\nhex prefixes followed by non-hex bytes are not decoded, padded or truncated.\nThe formatter uses the same boundary check and preserves payload bytes.\u003c/p>\n\u003cp>\u003cstrong>The issue's literal repro is ambiguous:\u003c/strong> its \u003ccode>4,8\u003c/code> header declares 32\nbytes, but its 32 hex characters encode only 16 bytes. Those 32 characters\nare also a valid 32-byte binary bitmap, so guessing hex would corrupt valid\nbinary input. Use \u003cstrong>64 hex digits\u003c/strong> for 4×8 bytes (e.g. \u003ccode>FF00FF00\u003c/code> repeated\neight times), or change the header to \u003ccode>4,4\u003c/code> for the original 32 digits.\nWith the documented polarity, each full row is\n\u003ccode>........########........########\u003c/code> (\u003ccode>.\u003c/code> white, \u003ccode>#\u003c/code> black).\u003c/p>\n\u003cp>For JS/WASM, pass raw binary in a \u003ccode>Uint8Array\u003c/code> (or Node \u003ccode>Buffer\u003c/code>). Do not\nround-trip binary through a UTF-8 string: bytes such as \u003ccode>0xFF\u003c/code> change when\ntext-encoded. A hex-text command stream is ASCII and can be text-encoded.\nThis is a transport requirement, not a diagnosis of the reporter's missing\nsmall-binary reproduction.\u003c/p>\n\u003cp>Verification and reference provenance:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>tspl_bitmap_hex.png\u003c/code> is a 32×8 stripe grid constructed independently\n  from the expected pixels, with a complete 64-digit payload.\u003c/li>\n\u003cli>\u003ccode>tspl_bitmap_manual.png\u003c/code> is a 16×16 transcription of the manual's dark\n  cell grid. \u003ccode>tests/e2e_tspl_bitmap.rs\u003c/code> separately pins the byte table and\n  expected pixel rows, exercising both binary and hex paths.\u003c/li>\n\u003cli>Both new fixtures require \u003cstrong>0.00%\u003c/strong> pixel difference. They are analytical\n  references, not renderer-generated or labelixa-derived goldens.\u003c/li>\n\u003cli>\u003ccode>tspl_graphics*\u003c/code> remain renderer-baseline integration fixtures. Their\n  old hex data contained 62 and 61 bytes respectively despite \u003ccode>4,16\u003c/code>\n  headers; the missing trailing \u003ccode>00\u003c/code> bytes are now explicit in the input.\n  Their references are regenerated for the decoded bitmap. Do not replace\n  these with labelixa captures: the earlier #109 investigation reported\n  hex misparsing and binary misalignment there, and no new hardware\n  evidence supersedes the manual.\u003c/li>\n\u003cli>Existing reverse-render goldens and byte-exact parser/formatter tests\n  protect raw payloads, including ASCII hex bytes, CR/LF and non-UTF-8 data.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"text-scaling-resolved-by-probe-2026-10-12-single-element-battery\">Text scaling — resolved by probe (2026-10-12, single-element battery)\u003c/h3>\n\u003cp>Font cells 1–5 × multipliers (1x1, 2x1, 1x2, 2x2, 3x3), ink bbox of\n\u003ccode>HHHHHH\u003c/code> on both engines:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Ink heights match within ±1 px\u003c/strong> across every font/multiplier — the\n  \"magnified text renders small\" impression was wrong for height.\u003c/li>\n\u003cli>\u003cstrong>Width\u003c/strong>: at \u003ccode>ymul \u0026gt; 1\u003c/code> labelixa widens glyphs by ymul (e.g. font 2:\n  1x1 → 70 px both engines; 1x2 → labelixa 138 vs labelize 70; 2x2 → 276\n  vs 138). The TSC manual defines xmul as horizontal and ymul as vertical,\n  independent — labelize follows the manual; labelixa's proportional face\n  evidently scales both axes. portakal drops ymul entirely. \u003cstrong>Verdict:\n  labelize correct; labelixa quirk recorded, not calibrated to.\u003c/strong>\u003c/li>\n\u003cli>1x advances differ by ≤1.5 px/char vs labelixa with no consistent ratio;\n  labelize lands nearer the manual's nominal cell widths.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"code-128-wide-narrow-barcode-22\">Code 128 \u003ccode>wide == narrow\u003c/code> (\u003ccode>BARCODE …,2,2\u003c/code>)\u003c/h3>\n\u003cp>labelixa draws visibly wider bars than labelize; portakal differs from\nboth. Per the manual, \u003ccode>wide\u003c/code> applies to discrete two-width codes (39, ITF);\ncontinuous codes like 128 use \u003ccode>narrow\u003c/code> only — labelize follows that.\nNeeds hardware arbitration to close (low priority).\u003c/p>\n\u003ch3 id=\"reverse-print-time-inversion\">\u003ccode>REVERSE\u003c/code> — print-time inversion\u003c/h3>\n\u003cp>Manual + corpus intent: print-time region inversion (white-on-black\ntext). labelize now inverts the region; labelixa skips the command\nentirely, portakal draws a plain black rect (both blind to the documented\nbehavior — the fix landed on manual semantics, not on either baseline).\u003c/p>\n\u003ch3 id=\"qr-versionquiet-zone-on-cjk-content-44-on-doc_qrcode_sample_1\">QR version/quiet zone on CJK content (~4.4% on doc_QRCODE_sample_1)\u003c/h3>\n\u003cp>Both engines pick versions automatically; module counts not yet compared\nper symbol. Low priority.\u003c/p>","headings":[["2","capability-boundaries-measured-2026-10-12","Capability boundaries (measured, 2026-10-12)"],["2","triangulation-policy","Triangulation policy"],["2","known-engine-disagreements-open-questions-2026-10-12","Known engine disagreements (open questions, 2026-10-12)"],["3","bitmap-exact-hex-compatibility-and-polarity-2026-10-30-108","BITMAP — exact hex compatibility and polarity (2026-10-30, #108)"],["3","text-scaling-resolved-by-probe-2026-10-12-single-element-battery","Text scaling — resolved by probe (2026-10-12, single-element battery)"],["3","code-128-wide-narrow-barcode-22","Code 128 wide == narrow (BARCODE …,2,2)"],["3","reverse-print-time-inversion","REVERSE — print-time inversion"],["3","qr-versionquiet-zone-on-cjk-content-44-on-doc_qrcode_sample_1","QR version/quiet zone on CJK content (~4.4% on doc_QRCODE_sample_1)"]],"examples":[],"search":" TSPL Baseline Renderers \n  Documentation index  \n TSPL has no equivalent of Labelary (which is ZPL-only and the golden\nreference for the ZPL side). Two independent baseline renderers are used for\nTSPL calibration, with a strict triangulation policy so we never overfit one\napproximation. The service capabilities below are dated observations; recheck\ncoverage before using either service for a new fixture. Source provenance lives\nin  Test corpus . \n \n \n \n Baseline \n Type \n Access \n License \n Role \n \n \n \n \n  labelixa.com  \n Online renderer (MVP subset) \n  POST https://api.labelixa.com/v1/tspl/render  (raw TSPL body → PNG, 203 dpi preview). Diagnostics:  POST /v1/tspl/diagnostics . Anonymous IP-quota, remaining reported in  X-RateLimit-Remaining , resets 00:00 UTC; 512 KB body cap. npm  labelixa  / PyPI  labelixa  packages are thin API clients,  not  offline renderers. \n Proprietary service \n  Primary  — only hosted TSPL renderer found (6 search rounds, EN+CN, incl. GitHub sweep) \n \n \n  portakal  \n Local parser + SVG preview \n  git clone productdevbook/portakal  (npm  portakal  ≥0.5 lacks the parser; use  main ),  parseTSC(src) → ResolvedLabel ,  renderPreview(label) → SVG ; rasterize SVG with  @resvg/resvg-js  ( fitTo width=812 , background white,  DejaVu Sans Mono ). Run via  npx tsx . \n MIT \n  Secondary  — offline, unlimited iterations for auto-fix loops \n \n \n \n Capability boundaries (measured, 2026-10-12) \n \n  labelixa  does not render:  DIRECTION  (declared \"not applied to the\n  MVP preview\"; verified 0–4 identical),  CIRCLE ,  ELLIPSE , rounded  BOX ,\n   PDF417 ,  ITF14 ,  DMATRIX  (returns a blank label; measured 2026-10-21\n  with area-only,  x# , and manual-sample shapes — DMATRIX is therefore\n  calibrated against the TSC TSPL manual + its result figure alone). It also\n  skips  |  characters in text. Canvas is floor-rounded (812×406 where\n  labelize produces 813×407) — pad to union before diffing. \n  portakal  parses a subset ( doc_QRCODE_sample_1  → 0 elements,\n   doc_BARCODE_sample_1  → 1 of 3 elements). Its SVG viewport adds a\n  decorative margin; rasterize with  fitTo  and re-check dimensions. Font\n  rendering depends on the rasterizer's system fonts — treat font-metric\n  disagreement involving portakal as weak evidence. \n \n Triangulation policy \n \n  Both baselines agree, labelize differs  → labelize is wrong: fix\n   (parser-side calibration only;  tests/unit_architecture.rs  guards the\n   language boundary). \n  Baselines disagree with each other  → open question unless the TSC\n   TSPL/TSPL2 manual states the semantics; never calibrate to one side. \n  A baseline skips a feature  the other renders → compare against the\n   rendering one only, and note the coverage gap. \n No hardware samples exist in the corpus yet; a TSC print scan always\n   outranks both baselines. \n \n Known engine disagreements (open questions, 2026-10-12) \n  BITMAP  — exact hex compatibility and polarity (2026-10-30, #108) \n The  TSC TSPL/TSPL2 manual, Chinese edition \nshows the BITMAP cell grid on printed p.44 and its byte table/sample stream\non p.45 (PDF pages 56–57). Dark cells correspond to  0  bits; the printed\nresult is an arrow pointing up-left. The sample sends  raw binary  after\nthe fifth comma. The hexadecimal column is a representation of those wire\nbytes, not evidence of an ASCII-hex firmware mode. \n Labelize therefore keeps  0 = black, 1 = white , unchanged from 1.9.0.\nIssue #108 reports a TX610 accepting ASCII hex and using a different\npolarity; no physical print scan is attached, so that firmware behavior\nremains unverified. We support hex as a Labelize compatibility extension\nwithout claiming that every TSC printer accepts it or attributing the\nreporter's observations to a particular writer bug. \n For  N = widthBytes × heightDots , the compatibility form requires a whole\npayload line with exactly  2 × N  hex digits. Upper/lowercase and spaces/tabs\nare accepted; CR, LF, CRLF or EOF ends the line. Other payloads use the\nexisting  N -byte binary cursor. In particular, short/odd/overlong runs and\nhex prefixes followed by non-hex bytes are not decoded, padded or truncated.\nThe formatter uses the same boundary check and preserves payload bytes. \n  The issue's literal repro is ambiguous:  its  4,8  header declares 32\nbytes, but its 32 hex characters encode only 16 bytes. Those 32 characters\nare also a valid 32-byte binary bitmap, so guessing hex would corrupt valid\nbinary input. Use  64 hex digits  for 4×8 bytes (e.g.  FF00FF00  repeated\neight times), or change the header to  4,4  for the original 32 digits.\nWith the documented polarity, each full row is\n ........########........########  ( .  white,  #  black). \n For JS/WASM, pass raw binary in a  Uint8Array  (or Node  Buffer ). Do not\nround-trip binary through a UTF-8 string: bytes such as  0xFF  change when\ntext-encoded. A hex-text command stream is ASCII and can be text-encoded.\nThis is a transport requirement, not a diagnosis of the reporter's missing\nsmall-binary reproduction. \n Verification and reference provenance: \n \n  tspl_bitmap_hex.png  is a 32×8 stripe grid constructed independently\n  from the expected pixels, with a complete 64-digit payload. \n  tspl_bitmap_manual.png  is a 16×16 transcription of the manual's dark\n  cell grid.  tests/e2e_tspl_bitmap.rs  separately pins the byte table and\n  expected pixel rows, exercising both binary and hex paths. \n Both new fixtures require  0.00%  pixel difference. They are analytical\n  references, not renderer-generated or labelixa-derived goldens. \n  tspl_graphics*  remain renderer-baseline integration fixtures. Their\n  old hex data contained 62 and 61 bytes respectively despite  4,16 \n  headers; the missing trailing  00  bytes are now explicit in the input.\n  Their references are regenerated for the decoded bitmap. Do not replace\n  these with labelixa captures: the earlier #109 investigation reported\n  hex misparsing and binary misalignment there, and no new hardware\n  evidence supersedes the manual. \n Existing reverse-render goldens and byte-exact parser/formatter tests\n  protect raw payloads, including ASCII hex bytes, CR/LF and non-UTF-8 data. \n \n Text scaling — resolved by probe (2026-10-12, single-element battery) \n Font cells 1–5 × multipliers (1x1, 2x1, 1x2, 2x2, 3x3), ink bbox of\n HHHHHH  on both engines: \n \n  Ink heights match within ±1 px  across every font/multiplier — the\n  \"magnified text renders small\" impression was wrong for height. \n  Width : at  ymul > 1  labelixa widens glyphs by ymul (e.g. font 2:\n  1x1 → 70 px both engines; 1x2 → labelixa 138 vs labelize 70; 2x2 → 276\n  vs 138). The TSC manual defines xmul as horizontal and ymul as vertical,\n  independent — labelize follows the manual; labelixa's proportional face\n  evidently scales both axes. portakal drops ymul entirely.  Verdict:\n  labelize correct; labelixa quirk recorded, not calibrated to.  \n 1x advances differ by ≤1.5 px/char vs labelixa with no consistent ratio;\n  labelize lands nearer the manual's nominal cell widths. \n \n Code 128  wide == narrow  ( BARCODE …,2,2 ) \n labelixa draws visibly wider bars than labelize; portakal differs from\nboth. Per the manual,  wide  applies to discrete two-width codes (39, ITF);\ncontinuous codes like 128 use  narrow  only — labelize follows that.\nNeeds hardware arbitration to close (low priority). \n  REVERSE  — print-time inversion \n Manual + corpus intent: print-time region inversion (white-on-black\ntext). labelize now inverts the region; labelixa skips the command\nentirely, portakal draws a plain black rect (both blind to the documented\nbehavior — the fix landed on manual semantics, not on either baseline). \n QR version/quiet zone on CJK content (~4.4% on doc_QRCODE_sample_1) \n Both engines pick versions automatically; module counts not yet compared\nper symbol. Low priority. "},{"id":"architecture","group":"Contribute","title":"Labelize Architecture","file":"ARCHITECTURE.md","html":"\u003ch1 id=\"labelize-architecture\">Labelize Architecture\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Labelize turns label-printer data (ZPL, EPL, TSPL, CPCL, DPL) into PNG or PDF. The design goal is\n\u003cstrong>N languages, one renderer\u003c/strong>: each language gets a self-contained frontend\nthat compiles its commands into a shared, language-neutral IR; a single\nlanguage-blind renderer draws whatever the IR describes.\u003c/p>\n\u003cpre>\u003ccode>Input bytes + Language\n  │\n  ▼\nsrc/lang.rs ── the only place that picks a parser\n  │   Language::{Zpl, Epl, …}          enum of supported languages\n  │   parse_labels(lang, bytes, dpmm)  front door every entry point calls\n  │   detect_language(bytes)           content sniffing for extension-less input\n  │\n  ▼\nsrc/parsers/\u0026lt;lang\u0026gt;/ ── per-language frontends (self-contained module trees)\n  │   zpl/  parser.rs, virtual_printer.rs (state machine), command_utils.rs,\n  │         fs.rs, charsets.rs (^CI), measurement_unit.rs (^MU),\n  │         zebra_fonts.rs (font matrices + designator resolution),\n  │         qr_payload.rs (^FD format conventions), stored_formats.rs (^FN/^XF)\n  │   epl/  parser.rs, fonts.rs (font-number metrics)\n  │   tspl/ parser.rs, fonts.rs (resident font cells; SIZE → LabelInfo dims)\n  │   cpcl/ parser.rs, fonts.rs (Appendix-D font cells), format.rs,\n  │         qr_payload.rs (B QR data conventions); header height /\n  │         PAGE-WIDTH → LabelInfo dims\n  │   dpl/  parser.rs, fonts.rs (Table C-2 cells + smooth 9 sizes),\n  │         format.rs, qr_payload.rs (W1D conventions); bottom-left\n  │         home → LabelPosition.from_bottom\n  │\n  ▼  compiles commands into\nsrc/elements/ ── language-neutral IR\n  │   Text, Barcode*WithData, Graphic*, StoredFormat, LabelInfo {…}\n  │   CONTRACT: an element must fully describe its rendering without\n  │   naming any printer language. Per-language calibration is resolved\n  │   BEFORE the element exists (see \u0026quot;Calibration lives parser-side\u0026quot;).\n  │\n  ▼\nsrc/drawers/ ── language-blind layout and rendering\n  │   dispatches per element type; keys text off FontFace (asset +\n  │   substitute calibration), never off a printer's font names.\n  │   CI-guarded by tests/unit_architecture.rs.\n  │\n  ├─ raster (default) ─► src/images/ ─► PNG or image-backed PDF\n  │\n  └─ vector (opt-in) ──► renderer/scene.rs ─► krilla PDF or tiny-skia PNG\n\u003c/code>\u003c/pre>\n\u003cp>Text and barcode layout are shared by the raster renderer and the scene.\n\u003ccode>src/output.rs\u003c/code> validates output options and selects the backend. A \u003ccode>LabelScene\u003c/code>\ncan be reused for PDF and scaled PNG; local pixel regions preserve operations\nsuch as inversion and XOR. PNG encoders store 8-bit grayscale samples, with\nblack/white thresholding by default. See \u003ca href=\"#docs/vector\">Vector output\u003c/a> for\nsearchable text, multipage output and fidelity limits.\u003c/p>\n\u003ch2 id=\"the-two-invariants\">The two invariants\u003c/h2>\n\u003ch3 id=\"1-calibration-lives-parser-side\">1. Calibration lives parser-side\u003c/h3>\n\u003cp>Everything that encodes \"how a specific printer family renders\" belongs to\nthe language's parser module, and is resolved into final semantic values\nbefore an element is built:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Printer-language knowledge\u003c/th>\n\u003cth>Resolved into the IR as\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Zebra font designator (A–H, P–V, 0, 1, GS), ^CW remap, magnification matrices\u003c/td>\n\u003ctd>\u003ccode>FontInfo { face: FontFace, advance_mult, dedot_zero, width, height }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ZPL ^BQ ^FD payload conventions (\u003ccode>QA,…\u003c/code>, \u003ccode>QM,B\u0026lt;len\u0026gt;…\u003c/code>, \u003ccode>\\|\u003c/code> separator)\u003c/td>\n\u003ctd>\u003ccode>BarcodeQrWithData { data: raw payload, error_correction }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^CI charset tables\u003c/td>\n\u003ctd>final Unicode text in \u003ccode>TextField\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^MU unit conversion\u003c/td>\n\u003ctd>dot-unit positions/sizes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^FN/^XF template field merging\u003c/td>\n\u003ctd>fully resolved drawable elements\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>parsers/zpl/zebra_fonts.rs\u003c/code> owns the Zebra matrices and the\ndesignator→\u003ccode>FontFace\u003c/code> mapping; other languages map their own font identifiers\nonto \u003ccode>FontFace\u003c/code> values (see EPL) and never call into ZPL modules.\u003c/p>\n\u003ch3 id=\"2-the-ir-and-the-renderer-are-language-blind\">2. The IR and the renderer are language-blind\u003c/h3>\n\u003cp>\u003ccode>elements\u003c/code> and \u003ccode>drawers\u003c/code> never mention a printer language. \u003ccode>FontFace\u003c/code>\n(\u003ccode>elements/font_face.rs\u003c/code>) is the rendering class — which embedded TTF to use\nplus the substitute's measured calibration (cap scale, advance ratio,\nline-height factor). The renderer's \u003ccode>draw_text\u003c/code> branches on the face, not on\nfont names. \u003ccode>tests/unit_architecture.rs\u003c/code> enforces both directions in CI:\u003c/p>\n\u003cul>\n\u003cli>shared modules (\u003ccode>drawers\u003c/code>, \u003ccode>elements\u003c/code>, \u003ccode>barcodes\u003c/code>, \u003ccode>images\u003c/code>) must not\n  reference \u003ccode>parsers::\u003c/code>;\u003c/li>\n\u003cli>\u003ccode>drawers\u003c/code> code (comments stripped) must carry no \u003ccode>zpl\u003c/code>/\u003ccode>epl\u003c/code>/\u003ccode>tspl\u003c/code> tokens.\u003c/li>\n\u003c/ul>\n\u003cp>Barcode encoders (\u003ccode>src/barcodes/\u003c/code>) are deliberately exempt from the token\nscan: symbology-level stream semantics (Code 128 invocation codes, ECC 200\nDataMatrix escapes) are encoder concerns — the language flavor is only which\nparameters a command exposes.\u003c/p>\n\u003ch2 id=\"public-api-surface\">Public API surface\u003c/h2>\n\u003cpre>\u003ccode class=\"language-rust\">// Explicit language\nlet labels = labelize::parse_labels(Language::Zpl, \u0026amp;bytes, dpmm)?;\n\n// Sniffed\nlet lang = labelize::detect_language(\u0026amp;bytes);\n\n// Or the classic per-parser API (unchanged, still public)\nlet labels = labelize::ZplParser::with_dpmm(8).parse(\u0026amp;bytes)?;\nlet labels = labelize::EplParser::new().parse(\u0026amp;bytes)?;\n\u003c/code>\u003c/pre>\n\u003cp>Entry points (CLI, HTTP \u003ccode>/convert\u003c/code>, wasm bindings) all delegate to\n\u003ccode>parse_labels\u003c/code>/\u003ccode>detect_language\u003c/code>; none of them name parser types.\u003c/p>\n\u003ch3 id=\"compatibility-aliases\">Compatibility aliases\u003c/h3>\n\u003cp>The 2026-10 module reorganization moved files into per-language directories.\nOld paths remain importable as re-export shims: \u003ccode>parsers::zpl_parser\u003c/code>,\n\u003ccode>parsers::epl_parser\u003c/code>, \u003ccode>parsers::virtual_printer\u003c/code>,\n\u003ccode>parsers::command_utils\u003c/code>, \u003ccode>parsers::fs\u003c/code>, \u003ccode>encodings\u003c/code>. New code should use\n\u003ccode>parsers::zpl::…\u003c/code> / \u003ccode>parsers::epl::…\u003c/code> directly.\u003c/p>\n\u003ch2 id=\"adding-a-new-language-checklist\">Adding a new language (checklist)\u003c/h2>\n\u003cp>Example: TSPL (shipped — see \u003ccode>parsers/tspl/\u003c/code>).\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Frontend module\u003c/strong> — \u003ccode>src/parsers/tspl/\u003c/code> (\u003ccode>parser.rs\u003c/code> at minimum, plus\n   \u003ccode>fonts.rs\u003c/code> etc. as needed). Map commands onto the shared \u003ccode>LabelElement\u003c/code>\n   IR; resolve font identifiers into \u003ccode>FontFace\u003c/code> values yourself (do not\n   import another language's font tables); keep your payload conventions\n   parser-side so elements carry raw/resolved data. Prefer explicit\n   \u003ccode>Err\u003c/code> over silently wrong rendering for unknown or ambiguous syntax.\u003c/li>\n\u003cli>\u003cstrong>Front door\u003c/strong> — add a \u003ccode>Language::Tspl\u003c/code> variant and one \u003ccode>match\u003c/code> arm in\n   \u003ccode>src/lang.rs\u003c/code> (both in \u003ccode>Language::parse\u003c/code> and, if needed, a sniffing rule\n   in \u003ccode>detect_language\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Entry points\u003c/strong> — one \u003ccode>match\u003c/code> arm each: CLI \u003ccode>InputFormat\u003c/code> + file\n   extension, HTTP Content-Type, wasm parameter. None of these need parser\n   types.\u003c/li>\n\u003cli>\u003cstrong>Tests\u003c/strong> —\n   - \u003ccode>tests/unit_tspl_parser.rs\u003c/code> (inline strings, no fixtures required);\n   - \u003ccode>tests/common/render_helpers.rs\u003c/code>: \u003ccode>parse_tspl\u003c/code> / \u003ccode>render_tspl_to_png\u003c/code>;\n   - golden tests in \u003ccode>tests/e2e_golden.rs\u003c/code> with documented reference provenance\n     (see \u003ca href=\"#docs/corpus\">Test corpus\u003c/a> and \u003ca href=\"#docs/tspl-baselines\">TSPL baselines\u003c/a>);\n     identify renderer baselines explicitly when external coverage is absent;\n   - \u003ccode>tests/e2e_diff_report.rs\u003c/code> \u003ccode>scan_dirs\u003c/code>: accept the \u003ccode>.tspl\u003c/code> extension;\n   - a row in \u003ccode>docs/DIFF_THRESHOLDS.md\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Docs\u003c/strong> — update language coverage, corpus provenance and relevant tutorials,\n   plus the command table in \u003ccode>AGENTS.md\u003c/code> and a CHANGELOG entry. Add new reference\n   documents to the \u003ca href=\"#docs/index\">documentation index\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003cp>Do \u003cstrong>not\u003c/strong> touch \u003ccode>drawers/\u003c/code>, \u003ccode>elements/\u003c/code> semantics, or another language's\nmodule. If the renderer lacks something your language needs, add a neutral\nIR field + parser-side resolution and keep the renderer branch\nlanguage-blind (\u003ccode>tests/unit_architecture.rs\u003c/code> will hold you to it).\u003c/p>","headings":[["2","the-two-invariants","The two invariants"],["3","1-calibration-lives-parser-side","1. Calibration lives parser-side"],["3","2-the-ir-and-the-renderer-are-language-blind","2. The IR and the renderer are language-blind"],["2","public-api-surface","Public API surface"],["3","compatibility-aliases","Compatibility aliases"],["2","adding-a-new-language-checklist","Adding a new language (checklist)"]],"examples":[],"search":" Labelize Architecture \n  Documentation index  \n Labelize turns label-printer data (ZPL, EPL, TSPL, CPCL, DPL) into PNG or PDF. The design goal is\n N languages, one renderer : each language gets a self-contained frontend\nthat compiles its commands into a shared, language-neutral IR; a single\nlanguage-blind renderer draws whatever the IR describes. \n  Input bytes + Language\n  │\n  ▼\nsrc/lang.rs ── the only place that picks a parser\n  │   Language::{Zpl, Epl, …}          enum of supported languages\n  │   parse_labels(lang, bytes, dpmm)  front door every entry point calls\n  │   detect_language(bytes)           content sniffing for extension-less input\n  │\n  ▼\nsrc/parsers/\u003clang>/ ── per-language frontends (self-contained module trees)\n  │   zpl/  parser.rs, virtual_printer.rs (state machine), command_utils.rs,\n  │         fs.rs, charsets.rs (^CI), measurement_unit.rs (^MU),\n  │         zebra_fonts.rs (font matrices + designator resolution),\n  │         qr_payload.rs (^FD format conventions), stored_formats.rs (^FN/^XF)\n  │   epl/  parser.rs, fonts.rs (font-number metrics)\n  │   tspl/ parser.rs, fonts.rs (resident font cells; SIZE → LabelInfo dims)\n  │   cpcl/ parser.rs, fonts.rs (Appendix-D font cells), format.rs,\n  │         qr_payload.rs (B QR data conventions); header height /\n  │         PAGE-WIDTH → LabelInfo dims\n  │   dpl/  parser.rs, fonts.rs (Table C-2 cells + smooth 9 sizes),\n  │         format.rs, qr_payload.rs (W1D conventions); bottom-left\n  │         home → LabelPosition.from_bottom\n  │\n  ▼  compiles commands into\nsrc/elements/ ── language-neutral IR\n  │   Text, Barcode*WithData, Graphic*, StoredFormat, LabelInfo {…}\n  │   CONTRACT: an element must fully describe its rendering without\n  │   naming any printer language. Per-language calibration is resolved\n  │   BEFORE the element exists (see \"Calibration lives parser-side\").\n  │\n  ▼\nsrc/drawers/ ── language-blind layout and rendering\n  │   dispatches per element type; keys text off FontFace (asset +\n  │   substitute calibration), never off a printer's font names.\n  │   CI-guarded by tests/unit_architecture.rs.\n  │\n  ├─ raster (default) ─► src/images/ ─► PNG or image-backed PDF\n  │\n  └─ vector (opt-in) ──► renderer/scene.rs ─► krilla PDF or tiny-skia PNG\n  \n Text and barcode layout are shared by the raster renderer and the scene.\n src/output.rs  validates output options and selects the backend. A  LabelScene \ncan be reused for PDF and scaled PNG; local pixel regions preserve operations\nsuch as inversion and XOR. PNG encoders store 8-bit grayscale samples, with\nblack/white thresholding by default. See  Vector output  for\nsearchable text, multipage output and fidelity limits. \n The two invariants \n 1. Calibration lives parser-side \n Everything that encodes \"how a specific printer family renders\" belongs to\nthe language's parser module, and is resolved into final semantic values\nbefore an element is built: \n \n \n \n Printer-language knowledge \n Resolved into the IR as \n \n \n \n \n Zebra font designator (A–H, P–V, 0, 1, GS), ^CW remap, magnification matrices \n  FontInfo { face: FontFace, advance_mult, dedot_zero, width, height }  \n \n \n ZPL ^BQ ^FD payload conventions ( QA,… ,  QM,B\u003clen>… ,  \\|  separator) \n  BarcodeQrWithData { data: raw payload, error_correction }  \n \n \n ^CI charset tables \n final Unicode text in  TextField  \n \n \n ^MU unit conversion \n dot-unit positions/sizes \n \n \n ^FN/^XF template field merging \n fully resolved drawable elements \n \n \n \n  parsers/zpl/zebra_fonts.rs  owns the Zebra matrices and the\ndesignator→ FontFace  mapping; other languages map their own font identifiers\nonto  FontFace  values (see EPL) and never call into ZPL modules. \n 2. The IR and the renderer are language-blind \n  elements  and  drawers  never mention a printer language.  FontFace \n( elements/font_face.rs ) is the rendering class — which embedded TTF to use\nplus the substitute's measured calibration (cap scale, advance ratio,\nline-height factor). The renderer's  draw_text  branches on the face, not on\nfont names.  tests/unit_architecture.rs  enforces both directions in CI: \n \n shared modules ( drawers ,  elements ,  barcodes ,  images ) must not\n  reference  parsers:: ; \n  drawers  code (comments stripped) must carry no  zpl / epl / tspl  tokens. \n \n Barcode encoders ( src/barcodes/ ) are deliberately exempt from the token\nscan: symbology-level stream semantics (Code 128 invocation codes, ECC 200\nDataMatrix escapes) are encoder concerns — the language flavor is only which\nparameters a command exposes. \n Public API surface \n  // Explicit language\nlet labels = labelize::parse_labels(Language::Zpl, \u0026bytes, dpmm)?;\n\n// Sniffed\nlet lang = labelize::detect_language(\u0026bytes);\n\n// Or the classic per-parser API (unchanged, still public)\nlet labels = labelize::ZplParser::with_dpmm(8).parse(\u0026bytes)?;\nlet labels = labelize::EplParser::new().parse(\u0026bytes)?;\n  \n Entry points (CLI, HTTP  /convert , wasm bindings) all delegate to\n parse_labels / detect_language ; none of them name parser types. \n Compatibility aliases \n The 2026-10 module reorganization moved files into per-language directories.\nOld paths remain importable as re-export shims:  parsers::zpl_parser ,\n parsers::epl_parser ,  parsers::virtual_printer ,\n parsers::command_utils ,  parsers::fs ,  encodings . New code should use\n parsers::zpl::…  /  parsers::epl::…  directly. \n Adding a new language (checklist) \n Example: TSPL (shipped — see  parsers/tspl/ ). \n \n  Frontend module  —  src/parsers/tspl/  ( parser.rs  at minimum, plus\n    fonts.rs  etc. as needed). Map commands onto the shared  LabelElement \n   IR; resolve font identifiers into  FontFace  values yourself (do not\n   import another language's font tables); keep your payload conventions\n   parser-side so elements carry raw/resolved data. Prefer explicit\n    Err  over silently wrong rendering for unknown or ambiguous syntax. \n  Front door  — add a  Language::Tspl  variant and one  match  arm in\n    src/lang.rs  (both in  Language::parse  and, if needed, a sniffing rule\n   in  detect_language ). \n  Entry points  — one  match  arm each: CLI  InputFormat  + file\n   extension, HTTP Content-Type, wasm parameter. None of these need parser\n   types. \n  Tests  —\n   -  tests/unit_tspl_parser.rs  (inline strings, no fixtures required);\n   -  tests/common/render_helpers.rs :  parse_tspl  /  render_tspl_to_png ;\n   - golden tests in  tests/e2e_golden.rs  with documented reference provenance\n     (see  Test corpus  and  TSPL baselines );\n     identify renderer baselines explicitly when external coverage is absent;\n   -  tests/e2e_diff_report.rs   scan_dirs : accept the  .tspl  extension;\n   - a row in  docs/DIFF_THRESHOLDS.md . \n  Docs  — update language coverage, corpus provenance and relevant tutorials,\n   plus the command table in  AGENTS.md  and a CHANGELOG entry. Add new reference\n   documents to the  documentation index . \n \n Do  not  touch  drawers/ ,  elements/  semantics, or another language's\nmodule. If the renderer lacks something your language needs, add a neutral\nIR field + parser-side resolution and keep the renderer branch\nlanguage-blind ( tests/unit_architecture.rs  will hold you to it). "},{"id":"testing","group":"Contribute","title":"Testing and golden references","file":"TESTING.md","html":"\u003ch1 id=\"testing-and-golden-references\">Testing and golden references\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Run commands from the repository root. Use the checks relevant to the change;\nthe complete CI configuration is in \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/.github/workflows/ci.yml\">ci.yml\u003c/a>.\u003c/p>\n\u003ch2 id=\"rust-and-process-tests\">Rust and process tests\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">cargo test --locked --lib --test 'unit_*' --features skill,vector\ncargo test --locked --test 'e2e_*' --features vector\ncargo test --locked --features serve,vector \\\n  --test e2e_cli_encode --test e2e_http_encode --test e2e_vector_output\ncargo fmt --all -- --check\ncargo clippy --all-features -- -D warnings\n\u003c/code>\u003c/pre>\n\u003cp>Unit tests cover parsers, neutral IR, layout, encoders and architecture\ninvariants. E2E tests exercise complete conversion and image-to-code round\ntrips. The \u003ccode>serve\u003c/code> feature enables tests that launch the real HTTP server;\n\u003ccode>vector\u003c/code> enables scene/PDF coverage. Ignored bootstrap and diagnostic tests\nare explicit operations, not part of the ordinary passing-test count.\u003c/p>\n\u003ch2 id=\"raster-goldens\">Raster goldens\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fixture directory\u003c/th>\n\u003cth>Canvas at 8 dpmm\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>testdata/labels/\u003c/code>\u003c/td>\n\u003ctd>813 × 1626 px (101.625 × 203.25 mm)\u003c/td>\n\u003ctd>Carrier captures, templates and synthetic carrier demos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>testdata/unit/\u003c/code>\u003c/td>\n\u003ctd>812 × 1624 px (101.5 × 203 mm)\u003c/td>\n\u003ctd>Focused fixtures; language-declared dimensions can override the canvas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>testdata/reverse/\u003c/code>\u003c/td>\n\u003ctd>Fixture-specific\u003c/td>\n\u003ctd>Frozen generated ZPL/TSPL bytes and exact decoded pixels\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ca href=\"#docs/corpus\">Test corpus\u003c/a> records input and reference provenance.\nZPL references come from Labelary; other languages use documented external\nrenderers or explicitly identified renderer baselines. A local baseline\ndetects regressions but cannot independently prove printer accuracy.\n\u003ca href=\"#docs/thresholds\">Diff thresholds\u003c/a> explains the per-fixture tolerances.\u003c/p>\n\u003cp>After changing rendering logic:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">cargo test --test e2e_diff_report -- --nocapture\ncargo test --test e2e_golden\n\u003c/code>\u003c/pre>\n\u003cp>Review all three reports in \u003ccode>testdata/diffs/\u003c/code>: \u003ccode>diff_report_labels.txt\u003c/code>,\n\u003ccode>diff_report_unit.txt\u003c/code> and \u003ccode>diff_report_reverse.txt\u003c/code>. Commit changed comparison\nPNGs and reports with the rendering change. CI regenerates these artifacts and\nrejects uncommitted differences under \u003ccode>testdata/\u003c/code>.\u003c/p>\n\u003cp>For a new ZPL fixture, add its source to the appropriate directory, then fetch\nthe missing reference:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">cargo test --test e2e_labelary bootstrap_golden_pngs -- --ignored --nocapture\n\u003c/code>\u003c/pre>\n\u003cp>This requires network access and does not overwrite existing references.\nAdd the golden case and documented tolerance, record provenance, and run the\ndiff/golden commands above. Do not regenerate a reference or relax a tolerance\nonly to make a failing test pass. Reverse snapshots have their own\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/reverse/README.md\">explicit update procedure\u003c/a>.\u003c/p>\n\u003ch2 id=\"vector-pdf-and-png\">Vector PDF and PNG\u003c/h2>\n\u003cp>Vector output needs several independent checks:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Check\u003c/th>\n\u003cth>What it establishes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PDF structural goldens\u003c/td>\n\u003ctd>Executed painting text, paths, curves, images, used embedded fonts and physical page sizes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Search and extraction\u003c/td>\n\u003ctd>Expected logical strings found through PDFium search and recovered by PDFium/Poppler\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Negative controls\u003c/td>\n\u003ctd>Raster PDFs, including raster pages with hidden searchable text, cannot satisfy the native-content probe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PNG visual goldens\u003c/td>\n\u003ctd>Stable layout, glyph shapes and clipping in scene PNGs and independently rendered PDFs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CLI/HTTP E2E\u003c/td>\n\u003ctd>Options, errors, PNG resolution, page order, quantities and mixed-size multipage output\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Complete corpus audit\u003c/td>\n\u003ctd>Barcode payload preservation and spatial agreement with both PDFium and Poppler\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>PNG snapshots are the appearance check. They do not prove that a PDF contains\nnative vector content, and searchability alone does not prove visible native\ntext. Normal tests never create or overwrite vector references.\u003c/p>\n\u003cp>\u003ccode>e2e_field_parameter_pdf\u003c/code> exports isolated horizontal, reverse and vertical\ntext PDFs through the public API. \u003ccode>e2e/vector/test_field_parameters.py\u003c/code> checks\npainting text and embedded Unicode fonts, rejects raster images, searches\nthe logical strings and compares both independent PDF readers against the\nshared-layout PNGs at 3x. The CI vector job runs this alongside the fixed\ngoldens; these checks never update a reference.\u003c/p>\n\u003cp>Run the fixed goldens and process checks using\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/vector/README.md#run-the-checks\">the vector fixture guide\u003c/a>.\nRun the full corpus and diagnostic controls using\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/e2e/vector/README.md\">the independent verification guide\u003c/a>.\nThat verifier preserves the baseline whole-page barcode payload set at each\ntested resolution and requires zero ink outside one source dot at 3x;\nfailed pages are not skipped. Generated reports and images belong under\n\u003ccode>output/\u003c/code> and CI artifacts, not \u003ccode>docs/\u003c/code>.\u003c/p>\n\u003cp>For intentional renderer changes, inspect structural contracts, visual diffs\nand decoded payloads before following the fixture guide's\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/vector/README.md#explicitly-update-a-reviewed-baseline\">baseline update procedure\u003c/a>.\nKeep source bitmap, font coverage and PDF-reader limitations from\n\u003ca href=\"#docs/vector/hybrid-output-and-fidelity-boundaries\">Vector output\u003c/a> in view.\nSoftware comparisons do not establish physical printer or device behavior.\u003c/p>\n\u003ch2 id=\"platform-checks\">Platform checks\u003c/h2>\n\u003cul>\n\u003cli>The \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/.github/workflows/ci.yml\">WASM and Worker CI job\u003c/a> builds the\n  \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/wasm/npm/README.md\">WASM package\u003c/a>, runs binding unit tests and executes\n  the Worker/playground JavaScript tests.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/android/README.md\">Android build and tests\u003c/a> and the\n  \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/e2e/android/README.md\">Kotlin/JNI host smoke check\u003c/a> cover the mobile wrapper.\n  Host JNI checks are separate from tests on an Android device.\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/e2e/http/test_http.sh\">HTTP E2E script\u003c/a> exercises a running service.\n  \u003ca href=\"#docs/publishing\">Docker publishing\u003c/a> describes container smoke checks.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"playground-documentation\">Playground documentation\u003c/h2>\n\u003cp>The Markdown guides are compiled into the self-contained playground. After\nediting docs, \u003ca href=\"#docs/index/update-the-built-in-docs\">regenerate the bundle\u003c/a>, then run:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python tools/docs/build.py --check\nnode --test workers/playground.test.mjs workers/api.test.mjs\ncargo test --lib --features playground playground::\n\u003c/code>\u003c/pre>\n\u003cp>The compiler verifies internal page and section links and detects stale\nbundles. JavaScript checks cover the embedded scripts and example metadata;\nthe Rust suite renders every runnable documentation example and checks its\npixel dimensions and nonempty output. CI enables \u003ccode>playground\u003c/code> alongside \u003ccode>vector\u003c/code> for these tests. The command\nabove also checks a raster-only build locally.\u003c/p>\n\u003cp>For navigation changes, serve locally and check docs search, empty results,\ndeep-link reloads, browser back, copying code and loading examples. Confirm\nthat switching views preserves the editor draft and that share-link reloads\nrestore source and settings. Check both themes, English/Chinese navigation,\nPDF downloads and widths from 320 to 1440 pixels. Documentation content is\nEnglish; the surrounding controls follow the playground's language setting.\u003c/p>\n\u003cp>Also check \u003ccode>#api\u003c/code> deep links, draft preservation across all three views,\nrequest cancellation, image previews, binary file downloads and copied\nexamples. The API tests exercise the shipped request/response code and run\nthe generated cURL, Node.js and Python examples against an HTTP byte echo.\nWorker tests use the actual WASM for conversions and separately inject an\ninitialization failure to prove preflights/schema work without the engine.\u003c/p>","headings":[["2","rust-and-process-tests","Rust and process tests"],["2","raster-goldens","Raster goldens"],["2","vector-pdf-and-png","Vector PDF and PNG"],["2","platform-checks","Platform checks"],["2","playground-documentation","Playground documentation"]],"examples":[],"search":" Testing and golden references \n  Documentation index  \n Run commands from the repository root. Use the checks relevant to the change;\nthe complete CI configuration is in  ci.yml . \n Rust and process tests \n  cargo test --locked --lib --test 'unit_*' --features skill,vector\ncargo test --locked --test 'e2e_*' --features vector\ncargo test --locked --features serve,vector \\\n  --test e2e_cli_encode --test e2e_http_encode --test e2e_vector_output\ncargo fmt --all -- --check\ncargo clippy --all-features -- -D warnings\n  \n Unit tests cover parsers, neutral IR, layout, encoders and architecture\ninvariants. E2E tests exercise complete conversion and image-to-code round\ntrips. The  serve  feature enables tests that launch the real HTTP server;\n vector  enables scene/PDF coverage. Ignored bootstrap and diagnostic tests\nare explicit operations, not part of the ordinary passing-test count. \n Raster goldens \n \n \n \n Fixture directory \n Canvas at 8 dpmm \n Purpose \n \n \n \n \n  testdata/labels/  \n 813 × 1626 px (101.625 × 203.25 mm) \n Carrier captures, templates and synthetic carrier demos \n \n \n  testdata/unit/  \n 812 × 1624 px (101.5 × 203 mm) \n Focused fixtures; language-declared dimensions can override the canvas \n \n \n  testdata/reverse/  \n Fixture-specific \n Frozen generated ZPL/TSPL bytes and exact decoded pixels \n \n \n \n  Test corpus  records input and reference provenance.\nZPL references come from Labelary; other languages use documented external\nrenderers or explicitly identified renderer baselines. A local baseline\ndetects regressions but cannot independently prove printer accuracy.\n Diff thresholds  explains the per-fixture tolerances. \n After changing rendering logic: \n  cargo test --test e2e_diff_report -- --nocapture\ncargo test --test e2e_golden\n  \n Review all three reports in  testdata/diffs/ :  diff_report_labels.txt ,\n diff_report_unit.txt  and  diff_report_reverse.txt . Commit changed comparison\nPNGs and reports with the rendering change. CI regenerates these artifacts and\nrejects uncommitted differences under  testdata/ . \n For a new ZPL fixture, add its source to the appropriate directory, then fetch\nthe missing reference: \n  cargo test --test e2e_labelary bootstrap_golden_pngs -- --ignored --nocapture\n  \n This requires network access and does not overwrite existing references.\nAdd the golden case and documented tolerance, record provenance, and run the\ndiff/golden commands above. Do not regenerate a reference or relax a tolerance\nonly to make a failing test pass. Reverse snapshots have their own\n explicit update procedure . \n Vector PDF and PNG \n Vector output needs several independent checks: \n \n \n \n Check \n What it establishes \n \n \n \n \n PDF structural goldens \n Executed painting text, paths, curves, images, used embedded fonts and physical page sizes \n \n \n Search and extraction \n Expected logical strings found through PDFium search and recovered by PDFium/Poppler \n \n \n Negative controls \n Raster PDFs, including raster pages with hidden searchable text, cannot satisfy the native-content probe \n \n \n PNG visual goldens \n Stable layout, glyph shapes and clipping in scene PNGs and independently rendered PDFs \n \n \n CLI/HTTP E2E \n Options, errors, PNG resolution, page order, quantities and mixed-size multipage output \n \n \n Complete corpus audit \n Barcode payload preservation and spatial agreement with both PDFium and Poppler \n \n \n \n PNG snapshots are the appearance check. They do not prove that a PDF contains\nnative vector content, and searchability alone does not prove visible native\ntext. Normal tests never create or overwrite vector references. \n  e2e_field_parameter_pdf  exports isolated horizontal, reverse and vertical\ntext PDFs through the public API.  e2e/vector/test_field_parameters.py  checks\npainting text and embedded Unicode fonts, rejects raster images, searches\nthe logical strings and compares both independent PDF readers against the\nshared-layout PNGs at 3x. The CI vector job runs this alongside the fixed\ngoldens; these checks never update a reference. \n Run the fixed goldens and process checks using\n the vector fixture guide .\nRun the full corpus and diagnostic controls using\n the independent verification guide .\nThat verifier preserves the baseline whole-page barcode payload set at each\ntested resolution and requires zero ink outside one source dot at 3x;\nfailed pages are not skipped. Generated reports and images belong under\n output/  and CI artifacts, not  docs/ . \n For intentional renderer changes, inspect structural contracts, visual diffs\nand decoded payloads before following the fixture guide's\n baseline update procedure .\nKeep source bitmap, font coverage and PDF-reader limitations from\n Vector output  in view.\nSoftware comparisons do not establish physical printer or device behavior. \n Platform checks \n \n The  WASM and Worker CI job  builds the\n   WASM package , runs binding unit tests and executes\n  the Worker/playground JavaScript tests. \n  Android build and tests  and the\n   Kotlin/JNI host smoke check  cover the mobile
