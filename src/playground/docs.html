omparison requires scale 1.\u003c/p>\n\u003cp>Android provides \u003ccode>renderOutput(...)\u003c/code>, \u003ccode>renderVectorPdf(...)\u003c/code> and\n\u003ccode>renderScaledPng(...)\u003c/code>. They use the same option validation and retain\n\u003ccode>LabelizeException\u003c/code> stages. WASM and Android enable the feature by default;\n\u003ccode>cargo build --no-default-features\u003c/code> produces their smaller raster-only build.\u003c/p>\n\u003ch2 id=\"hybrid-output-and-fidelity-boundaries\">Hybrid output and fidelity boundaries\u003c/h2>\n\u003cp>This mode does not promise a PDF containing only paths and fonts. Bitmap\nfields retain their source resolution. The scene records local pixel regions for:\u003c/p>\n\u003cul>\n\u003cli>Background-dependent field inversion and bitmap XOR.\u003c/li>\n\u003cli>Shallow multi-dot diagonals whose horizontal band is narrower than one\n  source dot perpendicular to the line; preserving the raster polygon's ink\n  keeps these lines visible in monochrome output.\u003c/li>\n\u003cli>Print-time region inversion, applied after ordinary fields.\u003c/li>\n\u003cli>Source text overlapping barcode modules or their quiet zone: preserve the existing pixels in\n  that region because small changes in text edges can damage the symbol.\u003c/li>\n\u003c/ul>\n\u003cp>The PDF backend represents opaque black/white regions as vertically merged\npixel rectangles, up to 4,096 rectangles per region. This avoids viewer image\nresampling changing barcode modules. A 0.0001-source-dot inward edge guard\nprevents floating-point boundary coverage from tinting neighboring white pixels.\nGrayscale, transparency and more complex images keep their image encoding.\nThese pixel rectangles do not reconstruct smooth detail from a bitmap, and\n\u003ccode>LabelScene::stats().images\u003c/code> counts scene image operations, not PDF resources.\u003c/p>\n\u003cp>Ordinary text, text blocks, all rotations, barcode interpretation lines,\nbarcode modules and geometric shapes have native scene representations.\nOne-dot diagonals retain one dot of perpendicular stroke width at shallow\nand steep angles, so they remain visible in monochrome scaled PNG output.\nMaxiCode uses shared module centers and circular geometry. The resident-font\nzero repair emits corrected outlines with an invisible searchable text layer.\nEvery native glyph uses its explicit layout position, avoiding accumulated\nrounding of fractional CID font widths in PDF readers.\n\u003ccode>ActualText\u003c/code> spans preserve logical strings, including justified spaces. Some\nextractors (notably pypdf) ignore that metadata and infer extra spaces in wide\nresident fonts or superscripts; PDFium and Poppler preserve those strings.\nReader-inferred line order and text-selection boxes can differ; lopdf's raw\nextractor inserts a newline between separately positioned glyphs.\nMissing font characters remain subject to the existing font/parser coverage.\u003c/p>\n\u003cp>PDF viewers use their own font hinting, antialiasing and pixel snapping.\nTheir low-resolution renderings need not be pixel-identical to legacy PNG or\nscene PNG, and low-resolution whole-page barcode detection can vary. Use the\nlegacy output when exact existing pixels are the requirement. Vector output\npreserves physical layout and scales continuous text/shape geometry; it does\nnot make an overlapping, clipped or otherwise invalid source label valid.\u003c/p>\n\u003cp>See \u003ca href=\"#docs/testing/vector-pdf-and-png\">Testing\u003c/a> for the separate structural,\nsearch, visual and process checks, and the\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/e2e/vector/README.md\">independent verification guide\u003c/a> for corpus commands\nand generated reports.\u003c/p>","headings":[["2","cli-and-http","CLI and HTTP"],["2","rust","Rust"],["2","wasm-playground-and-android","WASM, playground and Android"],["2","hybrid-output-and-fidelity-boundaries","Hybrid output and fidelity boundaries"]],"examples":[],"search":" Vector PDF and scalable PNG \n  Documentation index  \n The optional  vector  feature compiles a language-neutral drawing scene from\nthe existing label IR. Positioned glyphs, barcode modules, curves, clipping,\nrotations and physical dimensions are shared between the PDF and PNG consumers.\nThe PDF backend uses krilla with embedded subset fonts and Unicode mappings;\nthe PNG backend rasterizes those same coordinates with tiny-skia. It does not\nserialize or reparse SVG, and never changes source parsing resolution to scale\nan output image. \n Raster PNG/PDF remains the default. Existing  render_png ,  render_pdf ,\n lz_render ,  lz_render_lang  and Android methods retain their contracts.\nThe new output functions validate their options before rendering. The release\nbuild configurations, Docker, WASM and Android include the optional backend;\nRust library users explicitly enable  features = [\"vector\"] . krilla 0.8.2\nrequires Rust 1.92 or later. \n CLI and HTTP \n  cargo build --release --features serve,vector\nlabelize convert label.zpl --mode vector --type pdf\nlabelize convert label.zpl --mode vector --scale 3 --antialias\nlabelize convert batch.tspl --mode vector --type pdf --all-pages -o batch.pdf\n  \n Without  --all-pages , the CLI retains its numbered-file behavior for inputs\ncontaining several labels. A multipage PDF preserves each label's declared\nsize unless the caller supplies explicit width/height overrides. \n  curl --data-binary @label.zpl -H 'Content-Type: application/zpl' \\\n  'http://localhost:8080/convert?mode=vector\u0026output=pdf' -o label.pdf\ncurl --data-binary @label.zpl -H 'Content-Type: application/zpl' \\\n  'http://localhost:8080/convert?mode=vector\u0026scale=3\u0026antialias=true' -o label.png\ncurl --data-binary @batch.tspl -H 'Content-Type: application/tspl' \\\n  'http://localhost:8080/convert?mode=vector\u0026output=pdf\u0026pages=all' -o batch.pdf\n  \n \n \n \n Option \n Default \n Contract \n \n \n \n \n  mode  \n  raster  \n  raster  or  vector ; unavailable builds reject  vector  \n \n \n  scale  \n  1  \n Finite positive PNG pixels per source dot; only vector PNG accepts another value \n \n \n  pages  \n  first  \n  first  or  all ;  all  requires vector PDF \n \n \n  dpmm  \n  8  \n Source printer resolution; unaffected by  scale  \n \n \n  antialias  \n  false  \n Keep grayscale PNG coverage instead of black/white thresholding \n \n \n \n Invalid settings return HTTP 400. Parse, render and encoding failures keep the\nexisting stage distinction. PNG stores eight-bit grayscale samples in both\nvisual modes; it writes  pHYs  resolution as  dpmm × scale × 1000  pixels/metre.\n scale=3  at 8 dpmm means 24 output pixels/mm (609.6 dpi), while coordinates\nand font metrics are still interpreted at 8 dpmm. \n The scene limits a source canvas to 16 Mi pixels, an output PNG to 64 Mi pixels,\nand either dimension to 32000 dots/pixels. PDF dimensions are millimetres\nconverted to points independently of pixel rounding. Scaling does not add\ndetail to source bitmaps or local raster regions. \n Rust \n  use labelize::{render_pdf_with_output, OutputMode, OutputOptions, RenderOptions};\n\nlet output = OutputOptions {\n    mode: OutputMode::Vector,\n    all_pages: true,\n    ..Default::default()\n};\nlet pdf = render_pdf_with_output(b\"^XA^FO20,20^A0N,30,20^FDHello^FS^XZ\",\n    RenderOptions::default(), output)?;\n# Ok::\u003c(), labelize::LabelizeError>(())\n  \n Use  render_png_with_output  for PNG, or  render_label_with_output  for an\nalready parsed label. The existing  RenderOptions  struct was not expanded.\nFor repeated exports, create  LabelScene::new(\u0026label, drawer_options)  once,\nthen call  to_pdf()  or  to_png(ScenePngOptions { scale, antialias }) .\n encode_scenes_pdf(\u0026scenes)  combines scenes with different page sizes.\n LabelScene::stats()  reports actual glyph/path/image counts and each local\nfallback's source element index, reason and bounds. Enable  serde  to serialize\nthose diagnostics. \n WASM, playground and Android \n The new WASM export, also available from the Node  init  subpath, is: \n  lz_render_output(src, widthMm, heightMm, dpmm, antialias, wantPdf,\n                 language, \"vector\", scale, allPages);\n  \n Zero width/height selects declared sizes and then the standard fallback.\nAn empty language requests detection; unknown nonempty language names fail.\nErrors retain  1:  (input/options) and  2:  (render/encode) prefixes.\nThe Worker exposes the same HTTP query parameters as the server. \n The playground adds  Output ,  PNG scale , and  All PDF pages  controls\nwhen the build supports vector output. Share links retain these settings.\nPDF downloads omit PNG scale; Labelary pixel comparison requires scale 1. \n Android provides  renderOutput(...) ,  renderVectorPdf(...)  and\n renderScaledPng(...) . They use the same option validation and retain\n LabelizeException  stages. WASM and Android enable the feature by default;\n cargo build --no-default-features  produces their smaller raster-only build. \n Hybrid output and fidelity boundaries \n This mode does not promise a PDF containing only paths and fonts. Bitmap\nfields retain their source resolution. The scene records local pixel regions for: \n \n Background-dependent field inversion and bitmap XOR. \n Shallow multi-dot diagonals whose horizontal band is narrower than one\n  source dot perpendicular to the line; preserving the raster polygon's ink\n  keeps these lines visible in monochrome output. \n Print-time region inversion, applied after ordinary fields. \n Source text overlapping barcode modules or their quiet zone: preserve the existing pixels in\n  that region because small changes in text edges can damage the symbol. \n \n The PDF backend represents opaque black/white regions as vertically merged\npixel rectangles, up to 4,096 rectangles per region. This avoids viewer image\nresampling changing barcode modules. A 0.0001-source-dot inward edge guard\nprevents floating-point boundary coverage from tinting neighboring white pixels.\nGrayscale, transparency and more complex images keep their image encoding.\nThese pixel rectangles do not reconstruct smooth detail from a bitmap, and\n LabelScene::stats().images  counts scene image operations, not PDF resources. \n Ordinary text, text blocks, all rotations, barcode interpretation lines,\nbarcode modules and geometric shapes have native scene representations.\nOne-dot diagonals retain one dot of perpendicular stroke width at shallow\nand steep angles, so they remain visible in monochrome scaled PNG output.\nMaxiCode uses shared module centers and circular geometry. The resident-font\nzero repair emits corrected outlines with an invisible searchable text layer.\nEvery native glyph uses its explicit layout position, avoiding accumulated\nrounding of fractional CID font widths in PDF readers.\n ActualText  spans preserve logical strings, including justified spaces. Some\nextractors (notably pypdf) ignore that metadata and infer extra spaces in wide\nresident fonts or superscripts; PDFium and Poppler preserve those strings.\nReader-inferred line order and text-selection boxes can differ; lopdf's raw\nextractor inserts a newline between separately positioned glyphs.\nMissing font characters remain subject to the existing font/parser coverage. \n PDF viewers use their own font hinting, antialiasing and pixel snapping.\nTheir low-resolution renderings need not be pixel-identical to legacy PNG or\nscene PNG, and low-resolution whole-page barcode detection can vary. Use the\nlegacy output when exact existing pixels are the requirement. Vector output\npreserves physical layout and scales continuous text/shape geometry; it does\nnot make an overlapping, clipped or otherwise invalid source label valid. \n See  Testing  for the separate structural,\nsearch, visual and process checks, and the\n independent verification guide  for corpus commands\nand generated reports. "},{"id":"zpl","group":"Reference","title":"ZPL Commands Reference","file":"ZPL_COMMANDS_REFERENCE.md","html":"\u003ch1 id=\"zpl-commands-reference\">ZPL Commands Reference\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Source: https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands.html\u003c/p>\n\u003ch2 id=\"label-control-commands\">Label Control Commands\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Command\u003c/th>\n\u003cth>Description\u003c/th>\n\u003cth>URL\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>^XA\u003c/td>\n\u003ctd>Start label format\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xa.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^XZ\u003c/td>\n\u003ctd>End label format\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xz.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^LH\u003c/td>\n\u003ctd>Label home position\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-lh.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^LL\u003c/td>\n\u003ctd>Label length\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-ll.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^LR\u003c/td>\n\u003ctd>Label reverse print\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-lr.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^LS\u003c/td>\n\u003ctd>Label shift\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-ls.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^PO\u003c/td>\n\u003ctd>Print orientation\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-po.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^PW\u003c/td>\n\u d>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SE\u003c/td>\n\u003ctd>Set encoding\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-se.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SI\u003c/td>\n\u003ctd>Set image\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-si.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SL\u003c/td>\n\u003ctd>Set label\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sl.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SO\u003c/td>\n\u003ctd>Set offset\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-so.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SP\u003c/td>\n\u003ctd>Set parameters\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sp.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SX\u003c/td>\n\u003ctd>Set X position\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sx.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^SZ\u003c/td>\n\u003ctd>Set ZPL mode\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sz.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>~TA\u003c/td>\n\u003ctd>Tear-off adjust\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-ta.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^TB\u003c/td>\n\u003ctd>Text block\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-tb.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^TO\u003c/td>\n\u003ctd>Tear-off\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-to.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>~WC\u003c/td>\n\u003ctd>Wireless configuration\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wc.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^WD\u003c/td>\n\u003ctd>Wireless data\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wd.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>~WQ\u003c/td>\n\u003ctd>Wireless query\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wq.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^XB\u003c/td>\n\u003ctd>Cancel bottom margin\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xb.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^XS\u003c/td>\n\u003ctd>Cancel serialization\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xs.html\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>^ZZ\u003c/td>\n\u003ctd>End of label format\u003c/td>\n\u003ctd>https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-zz.html\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"commands-supported-by-labelize\">Commands Supported by Labelize\u003c/h2>\n\u003cp>The following commands are currently implemented in this project:\u003c/p>\n\u003ch3 id=\"label-control\">Label Control\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>^XA\u003c/code>, \u003ccode>^XZ\u003c/code> - Label format delimiters\u003c/li>\n\u003cli>\u003ccode>^LH\u003c/code> - Label home position\u003c/li>\n\u003cli>\u003ccode>^LR\u003c/code> - Label reverse print\u003c/li>\n\u003cli>\u003ccode>^LT\u003c/code> - Label top (shift content down/up; |value| \u0026gt; 120 dots ignored, per Zebra)\u003c/li>\n\u003cli>\u003ccode>^LS\u003c/code> - Label shift (positive = left, clamped at the left edge)\u003c/li>\n\u003cli>\u003ccode>^LL\u003c/code> - Label length (recorded; no rendering effect — label size comes from the canvas, matching Labelary)\u003c/li>\n\u003cli>\u003ccode>^PO\u003c/code> - Print orientation\u003c/li>\n\u003cli>\u003ccode>^PW\u003c/code> - Print width\u003c/li>\n\u003cli>\u003ccode>^MU\u003c/code> - Units of measurement\u003c/li>\n\u003cli>\u003ccode>^PQ\u003c/code> - Print quantity / copies (emits quantity × copies labels)\u003c/li>\n\u003cli>\u003ccode>^FX\u003c/code> - Comment (ignored)\u003c/li>\n\u003cli>\u003ccode>^SN\u003c/code>, \u003ccode>^SF\u003c/code> - Serial number state (inert: \u003ccode>#\u003c/code> serial markers in \u003ccode>^FD\u003c/code> render literally, matching Labelary)\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"textfont\">Text/Font\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>^A\u003c/code> - Scalable/bitmapped font\u003c/li>\n\u003cli>\u003ccode>^A@\u003c/code> - Named font (built-in names resolve; downloaded names fall back to default)\u003c/li>\n\u003cli>\u003ccode>^CW\u003c/code> - Font identifier mapping\u003c/li>\n\u003cli>\u003ccode>^FO\u003c/code> - Field origin\u003c/li>\n\u003cli>\u003ccode>^FT\u003c/code> - Field typeset\u003c/li>\n\u003cli>\u003ccode>^FW\u003c/code> - Field orientation\u003c/li>\n\u003cli>\u003ccode>^FP\u003c/code> - Upright text direction and additional character spacing (\u003ca href=\"#docs/rendering/field-parameters\">measured behavior\u003c/a>)\u003c/li>\n\u003cli>\u003ccode>^FD\u003c/code> - Field data\u003c/li>\n\u003cli>\u003ccode>^FS\u003c/code> - Field separator\u003c/li>\n\u003cli>\u003ccode>^FB\u003c/code> - Field block\u003c/li>\n\u003cli>\u003ccode>^FV\u003c/code> - Field variable\u003c/li>\n\u003cli>\u003ccode>^FN\u003c/code> - Field number\u003c/li>\n\u003cli>\u003ccode>^FR\u003c/code> - Field reverse print\u003c/li>\n\u003cli>\u003ccode>^FH\u003c/code> - Field hex indicator\u003c/li>\n\u003cli>\u003ccode>^CF\u003c/code> - Change default font\u003c/li>\n\u003cli>\u003ccode>^CI\u003c/code> - Change international font/encoding\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"barcodes\">Barcodes\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>^BC\u003c/code> - Code 128\u003c/li>\n\u003cli>\u003ccode>^BE\u003c/code> - EAN-13\u003c/li>\n\u003cli>\u003ccode>^B8\u003c/code> - EAN-8 (7/8-digit input; check digit recomputed)\u003c/li>\n\u003cli>\u003ccode>^B9\u003c/code> - UPC-E (6/7/11/12-digit input; standard zero-suppression and check digit)\u003c/li>\n\u003cli>\u003ccode>^BU\u003c/code> - UPC-A (11/12-digit input; Labelary-style 6/5 digit split, all-L left half)\u003c/li>\n\u003cli>\u003ccode>^B2\u003c/code> - Interleaved 2 of 5\u003c/li>\n\u003cli>\u003ccode>^B3\u003c/code> - Code 39\u003c/li>\n\u003cli>\u003ccode>^B7\u003c/code> - PDF417\u003c/li>\n\u003cli>\u003ccode>^BO\u003c/code> - Aztec\u003c/li>\n\u003cli>\u003ccode>^BX\u003c/code> - Data Matrix\u003c/li>\n\u003cli>\u003ccode>^BQ\u003c/code> - QR Code\u003c/li>\n\u003cli>\u003ccode>^BD\u003c/code> - MaxiCode\u003c/li>\n\u003cli>\u003ccode>^BY\u003c/code> - Barcode default parameters\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"graphics\">Graphics\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>^GB\u003c/code> - Graphic box\u003c/li>\n\u003cli>\u003ccode>^GC\u003c/code> - Graphic circle\u003c/li>\n\u003cli>\u003ccode>^GD\u003c/code> - Graphic diagonal\u003c/li>\n\u003cli>\u003ccode>^GE\u003c/code> - Graphic ellipse\u003c/li>\n\u003cli>\u003ccode>^GF\u003c/code> - Graphic field\u003c/li>\n\u003cli>\u003ccode>^GS\u003c/code> - Graphic symbol\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"storage\">Storage\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>~DG\u003c/code> - Download graphic\u003c/li>\n\u003cli>\u003ccode>^IL\u003c/code> - Image load\u003c/li>\n\u003cli>\u003ccode>^XG\u003c/code> - Recall graphic\u003c/li>\n\u003cli>\u003ccode>^ID\u003c/code> - Delete stored object (graphic or format)\u003c/li>\n\u003cli>\u003ccode>^IM\u003c/code> - Move stored object\u003c/li>\n\u003cli>\u003ccode>^IS\u003c/code> - Copy stored object\u003c/li>\n\u003cli>\u003ccode>~EG\u003c/code> - Erase graphics (blank name erases all)\u003c/li>\n\u003cli>\u003ccode>^DF\u003c/code> - Download format\u003c/li>\n\u003cli>\u003ccode>^XF\u003c/code> - Recall format\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"known-limitations\">Known Limitations\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>MaxiCode\u003c/strong> (\u003ccode>^BD\u003c/code>): No compliant encoder; structural rendering only (~35% diff)\u003c/li>\n\u003cli>\u003cstrong>PDF417\u003c/strong> (\u003ccode>^B7\u003c/code>): Encoding gaps vs reference (~18% diff)\u003c/li>\n\u003cli>\u003cstrong>Font metrics\u003c/strong>: open-source font substitutes (Roboto Condensed / DejaVu) vs Zebra built-in fonts cause 2-7% typical diff\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>^LL\u003c/code> command\u003c/strong>: Not parsed (label length)\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>^B9\u003c/code> with \u0026gt;7-digit data\u003c/strong>: follows the UPC-E standard; Labelary's own\n  zero-suppression of 11/12-digit input diverges from the standard\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>^A@\u003c/code>/\u003ccode>^CW\u003c/code> downloaded fonts\u003c/strong>: named downloadable fonts (e.g. \u003ccode>E:ARI000.TTF\u003c/code>)\n  cannot be rendered and fall back to the default font; Labelary's \u003ccode>^A@\u003c/code> handling\n  is nonstandard (treats the name as an orientation on font 0), so we follow the\n  Zebra spec instead\u003c/li>\n\u003c/ul>","headings":[["2","label-control-commands","Label Control Commands"],["2","text-and-font-commands","Text and Font Commands"],["2","barcode-commands","Barcode Commands"],["2","graphics-commands","Graphics Commands"],["2","image-commands","Image Commands"],["2","format-storage-commands","Format Storage Commands"],["2","configuration-commands","Configuration Commands"],["2","print-commands","Print Commands"],["2","serial-number-commands","Serial Number Commands"],["2","device-control-commands","Device Control Commands"],["2","status-and-diagnostic-commands","Status and Diagnostic Commands"],["2","memory-commands","Memory Commands"],["2","rfid-commands","RFID Commands"],["2","network-commands","Network Commands"],["2","miscellaneous-commands","Miscellaneo  ~SD \n Set darkness \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sd.html \n \n \n ^SE \n Set encoding \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-se.html \n \n \n ^SI \n Set image \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-si.html \n \n \n ^SL \n Set label \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sl.html \n \n \n ^SO \n Set offset \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-so.html \n \n \n ^SP \n Set parameters \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sp.html \n \n \n ^SX \n Set X position \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sx.html \n \n \n ^SZ \n Set ZPL mode \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-sz.html \n \n \n ~TA \n Tear-off adjust \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-ta.html \n \n \n ^TB \n Text block \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-tb.html \n \n \n ^TO \n Tear-off \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-to.html \n \n \n ~WC \n Wireless configuration \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wc.html \n \n \n ^WD \n Wireless data \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wd.html \n \n \n ~WQ \n Wireless query \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-wq.html \n \n \n ^XB \n Cancel bottom margin \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xb.html \n \n \n ^XS \n Cancel serialization \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-xs.html \n \n \n ^ZZ \n End of label format \n https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-zz.html \n \n \n \n Commands Supported by Labelize \n The following commands are currently implemented in this project: \n Label Control \n \n  ^XA ,  ^XZ  - Label format delimiters \n  ^LH  - Label home position \n  ^LR  - Label reverse print \n  ^LT  - Label top (shift content down/up; |value| > 120 dots ignored, per Zebra) \n  ^LS  - Label shift (positive = left, clamped at the left edge) \n  ^LL  - Label length (recorded; no rendering effect — label size comes from the canvas, matching Labelary) \n  ^PO  - Print orientation \n  ^PW  - Print width \n  ^MU  - Units of measurement \n  ^PQ  - Print quantity / copies (emits quantity × copies labels) \n  ^FX  - Comment (ignored) \n  ^SN ,  ^SF  - Serial number state (inert:  #  serial markers in  ^FD  render literally, matching Labelary) \n \n Text/Font \n \n  ^A  - Scalable/bitmapped font \n  ^A@  - Named font (built-in names resolve; downloaded names fall back to default) \n  ^CW  - Font identifier mapping \n  ^FO  - Field origin \n  ^FT  - Field typeset \n  ^FW  - Field orientation \n  ^FP  - Upright text direction and additional character spacing ( measured behavior ) \n  ^FD  - Field data \n  ^FS  - Field separator \n  ^FB  - Field block \n  ^FV  - Field variable \n  ^FN  - Field number \n  ^FR  - Field reverse print \n  ^FH  - Field hex indicator \n  ^CF  - Change default font \n  ^CI  - Change international font/encoding \n \n Barcodes \n \n  ^BC  - Code 128 \n  ^BE  - EAN-13 \n  ^B8  - EAN-8 (7/8-digit input; check digit recomputed) \n  ^B9  - UPC-E (6/7/11/12-digit input; standard zero-suppression and check digit) \n  ^BU  - UPC-A (11/12-digit input; Labelary-style 6/5 digit split, all-L left half) \n  ^B2  - Interleaved 2 of 5 \n  ^B3  - Code 39 \n  ^B7  - PDF417 \n  ^BO  - Aztec \n  ^BX  - Data Matrix \n  ^BQ  - QR Code \n  ^BD  - MaxiCode \n  ^BY  - Barcode default parameters \n \n Graphics \n \n  ^GB  - Graphic box \n  ^GC  - Graphic circle \n  ^GD  - Graphic diagonal \n  ^GE  - Graphic ellipse \n  ^GF  - Graphic field \n  ^GS  - Graphic symbol \n \n Storage \n \n  ~DG  - Download graphic \n  ^IL  - Image load \n  ^XG  - Recall graphic \n  ^ID  - Delete stored object (graphic or format) \n  ^IM  - Move stored object \n  ^IS  - Copy stored object \n  ~EG  - Erase graphics (blank name erases all) \n  ^DF  - Download format \n  ^XF  - Recall format \n \n Known Limitations \n \n  MaxiCode  ( ^BD ): No compliant encoder; structural rendering only (~35% diff) \n  PDF417  ( ^B7 ): Encoding gaps vs reference (~18% diff) \n  Font metrics : open-source font substitutes (Roboto Condensed / DejaVu) vs Zebra built-in fonts cause 2-7% typical diff \n   ^LL  command : Not parsed (label length) \n   ^B9  with >7-digit data : follows the UPC-E standard; Labelary's own\n  zero-suppression of 11/12-digit input diverges from the standard \n   ^A@ / ^CW  downloaded fonts : named downloadable fonts (e.g.  E:ARI000.TTF )\n  cannot be rendered and fall back to the default font; Labelary's  ^A@  handling\n  is nonstandard (treats the name as an orientation on font 0), so we follow the\n  Zebra spec instead \n "},{"id":"datamatrix","group":"Reference","title":"DataMatrix behavior and evidence","file":"DATAMATRIX.md","html":"\u003ch1 id=\"datamatrix-behavior-and-evidence\">DataMatrix behavior and evidence\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Reference for supported DataMatrix variants, field-data rules, size selection,\nand the provenance and limits of their regression fixtures.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/datamatrix/ecc-200-dimensions\">ECC 200 dimensions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#docs/datamatrix/ecc-200-field-data\">ECC 200 field data\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#docs/datamatrix/legacy-ecc-000-140\">Legacy ECC 000-140\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>For the command overview, see the \u003ca href=\"#docs/zpl\">ZPL command matrix\u003c/a>.\nFor test commands and reference-update policy, see \u003ca href=\"#docs/testing\">Testing\u003c/a>.\u003c/p>\n\u003ch2 id=\"ecc-200-dimensions\">ECC 200 dimensions\u003c/h2>\n\u003cp>\u003ccode>^BX\u003c/code> columns (\u003ccode>c\u003c/code>), rows (\u003ccode>r\u003c/code>), and aspect ratio (\u003ccode>a\u003c/code>) constrain both the\nordinary byte encoder and the explicit FNC1/ECI/structured-append codeword path.\nThe encoder must not replace an unsatisfied constraint with a square symbol.\nLegacy-quality dispatch and the renderer's empty-field suppression are unchanged.\u003c/p>\n\u003ch3 id=\"fixed-rows-with-automatic-columns\">Fixed rows with automatic columns\u003c/h3>\n\u003cp>With \u003ccode>c=0,r=12,a=2\u003c/code>, select the standard 26-column symbol before fitting data.\nDo not widen automatically to 36 columns when the input is too long.\nThe renderer skips a capacity-rejected field in this row-only rectangular mode\nand continues rendering the rest of the label. Direct encoder APIs return an\nerror. Invalid dimensions, conflicting shapes, and malformed escape sequences\nstill return errors. This is deliberately not a general implementation of\n\u003ccode>^CV\u003c/code> diagnostics or of all printer field-rejection behavior.\u003c/p>\n\u003cp>The selection rule uses the smallest matching standard symbol for fixed rows\nwith automatic columns. Labelary also confirms this at \u003ccode>r=8\u003c/code> and \u003ccode>r=16\u003c/code>.\nThe operator also reported consistent physical results for the r8 and r16\ncontrols below. Those reports establish symbol presence/absence, not decoded\nmodule equality.\nWith both dimensions automatic, the encoder selects a fitting symbol. DMRE\nsizes are not enabled.\u003c/p>\n\u003ch3 id=\"independent-evidence-2026-10-06\">Independent evidence (2026-10-06)\u003c/h3>\n\u003cp>Physical controls used a Zebra ZD421, 300 dpi, firmware V93.21.17Z, 50 x 25 mm\nlabels, darkness 15 and speed 2. Native fields used \u003ccode>^BX\u003c/code>, not rendered graphics.\nThe operator confirmed that \u003ccode>ABC\u003c/code> at \u003ccode>c0,r12,a2\u003c/code> and \u003ccode>c26,r12,a2\u003c/code> prints the same\nmatrix, while \u003ccode>ABCD12345678901234567890efgh\u003c/code> at \u003ccode>c0,r12,a2\u003c/code> prints no symbol.\nThe same long payload prints at explicit \u003ccode>c36,r12,a2\u003c/code> in the comparison strip.\nThese are visual/operator observations, not a claim of independently decoded\nmodule equality for every photograph.\u003c/p>\n\u003cp>Separate Labelary API calls confirmed the following boundary. All commands\nused \u003ccode>^BXN,4,200,c,12,6,,2\u003c/code> and differed only in \u003ccode>c\u003c/code> and the listed field data.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Payload\u003c/th>\n\u003cth style=\"text-align: right;\">Characters\u003c/th>\n\u003cth style=\"text-align: right;\">ASCII data codewords\u003c/th>\n\u003cth>c0\u003c/th>\n\u003cth>c26\u003c/th>\n\u003cth>c36\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>ABCD1234567890123490efgh\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">24\u003c/td>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003ctd>26x12\u003c/td>\n\u003ctd>identical 26x12\u003c/td>\n\u003ctd>not tested\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ABCD12345678901234901efgh\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">25\u003c/td>\n\u003ctd style=\"text-align: right;\">17\u003c/td>\n\u003ctd>no symbol\u003c/td>\n\u003ctd>no symbol\u003c/td>\n\u003ctd>36x12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ABCD12345678901234567890efgh\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">28\u003c/td>\n\u003ctd style=\"text-align: right;\">18\u003c/td>\n\u003ctd>no symbol\u003c/td>\n\u003ctd>not tested\u003c/td>\n\u003ctd>36x12\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>This is a data-codeword limit, not a general 24-character limit. Numeric pairs\nconsume one ASCII codeword each. Standard 26x12 has 16 data codewords; standard\n36x12 has 22. Both are classic ECC200 rectangular sizes, not DMRE extensions.\nThe tests establish observable size selection, not the printer's internal\nimplementation or a universal rule for all Zebra firmware.\u003c/p>\n\u003cp>Additional Labelary controls used \u003ccode>^BXN,3,200,c,r,6,_,2\u003c/code>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth style=\"text-align: right;\">Rows\u003c/th>\n\u003cth>Payload\u003c/th>\n\u003cth>c0\u003c/th>\n\u003cth>Small fixed width\u003c/th>\n\u003cth>Large fixed width\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd style=\"text-align: right;\">8\u003c/td>\n\u003ctd>\u003ccode>aB!cD?eF\u003c/code>\u003c/td>\n\u003ctd>no symbol\u003c/td>\n\u003ctd>c18: no symbol\u003c/td>\n\u003ctd>c32: 32x8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd style=\"text-align: right;\">16\u003c/td>\n\u003ctd>\u003ccode>aB!cD?eF#gH%iJ\u0026amp;kLaB!cD?eF#gH%iJ\u0026amp;kL\u003c/code>\u003c/td>\n\u003ctd>no symbol\u003c/td>\n\u003ctd>c36: no symbol\u003c/td>\n\u003ctd>c48: 48x16\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Two native-only physical test labels were sent once at SD15/PR2. The operator\nreported that the printer behaves like Labelary for these controls.\u003c/p>\n\u003ch3 id=\"regression-coverage-and-provenance\">Regression coverage and provenance\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>tests/unit_datamatrix.rs\u003c/code> covers fixed/partial/automatic dimensions, ratio\n  conflicts, the exact capacity boundary, special codewords, magnification,\n  field suppression without losing subsequent fields/labels, and error retention.\u003c/li>\n\u003cli>\u003ccode>testdata/unit/datamatrix_dimensions.zpl\u003c/code> is a text-free fixture with a\n  separately fetched Labelary PNG. It includes successful and suppressed fields,\n  the exact boundary pair, explicit 36x12, FNC1, and a trailing graphic.\n  Its golden tolerance is \u003cstrong>0.0%\u003c/strong>; references are not generated by Labelize.\u003c/li>\n\u003cli>Reference endpoint: \u003ccode>https://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/\u003c/code>.\n  Render comparisons are under \u003ccode>testdata/diffs/datamatrix_dimensions*.png\u003c/code>.\n  Original reference PNG SHA-256:\n  \u003ccode>9d4cf784f94167b4b5edd81942dfec272806d6ef40605fda39707f9ae724b8d0\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>References:\n- \u003ca href=\"https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-bx.html\">Zebra ^BX Programming Guide\u003c/a>.\n- \u003ca href=\"https://github.com/zint/zint/blob/master/backend/dmatrix.h\">Zint size/capacity tables, including the standard/DMRE distinction\u003c/a>.\u003c/p>\n\u003ch2 id=\"ecc-200-field-data\">ECC 200 field data\u003c/h2>\n\u003cp>The \u003ccode>^BX\u003c/code> renderer evaluates field-data escapes only for quality 200. The default\nescape is \u003ccode>_\u003c/code>, matching the newer firmware behavior described in Zebra's\n\u003ca href=\"https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-bx.html\">^BX reference\u003c/a>.\nAn explicit \u003ccode>g\u003c/code> parameter overrides it. Only that character is active; \u003ccode>_1\u003c/code> and\n\u003ccode>~1\u003c/code> are not both interpreted automatically. The old firmware's separate literal\ntilde rules are not emulated. Labelize's existing command splitter also treats\nraw tilde as a command prefix. Use, for example, \u003ccode>^CT!\u003c/code> when testing an explicit\ntilde escape in raw ZPL; context-sensitive command splitting is not changed here.\u003c/p>\n\u003cp>Processing order is the parser's existing \u003ccode>^FH\u003c/code> handling, followed by DataMatrix\nescape parsing. Literal/control/decimal bytes are distinct from function\ncodewords. \u003ccode>_1\u003c/code> emits codeword 232; \u003ccode>_d029\u003c/code> emits a data byte with value 29.\nOnly a leading FNC1 establishes GS1 DataMatrix. FNC1 inside the data becomes a\nseparator when decoded; an ordinary GS byte does not establish GS1.\u003c/p>\n\u003cp>Supported escape tokens are a doubled escape, control shifts, \u003ccode>dNNN\u003c/code> bytes,\nPAD (\u003ccode>0\u003c/code>), FNC1 (\u003ccode>1\u003c/code>), structured-append FNC2 (\u003ccode>2\u003c/code> plus three three-digit values),\nFNC3 (\u003ccode>3\u003c/code>), and ECI (\u003ccode>5NNN\u003c/code>). Malformed or unsupported escapes return errors.\nThe direct \u003ccode>barcodes::datamatrix::encode\u003c/code> API remains literal; \u003ccode>encode_zpl\u003c/code>\naccepts byte slices with ZPL escapes. EPL disables this escape processing.\u003c/p>\n\u003cp>Byte-only payloads retain the existing automatic encodation. Payloads containing\nfunction codewords use ASCII encodation with numeric-pair compaction and upper\nshift. The existing DataMatrix library supplies capacity selection, Reed-Solomon\nECC, and placement. This path prioritizes correct function-codeword positions;\nit does not optimize C40/Text/Base256 segments around functions and may produce\nlarger symbols. See \u003ca href=\"#docs/datamatrix/ecc-200-dimensions\">dimension selection\u003c/a> for capacity rules.\u003c/p>\n\u003cp>Validation includes exact byte/token/codeword tests and an independent RXing\nmatrix decoder. Tests assert both decoded content and the GS1 symbology modifier\n(\u003ccode>]d2\u003c/code>), plus internal FNC1, literal GS, custom escapes, \u003ccode>^FH\u003c/code>-generated controls,\nupper-shift bytes, padding, and EPL isolation. These checks do not use rendered\nimages as replacement reference data.\u003c/p>\n\u003cp>This ECC 200 path is separate from the ECC 000-140 implementation documented in\n\u003ccode>DATAMATRIX.md#legacy-ecc-000-140\u003c/code>; Legacy fields never pass through these substitutions.\nIt does not redesign the ECC 200 string-based ZPL input/charset pipeline: literal\ntext follows its existing UTF-8 behavior, and non-UTF-8 high-byte \u003ccode>^FH\u003c/code> sequences\nremain a separate parser limitation. Decimal escapes (\u003ccode>_d000\u003c/code> through \u003ccode>_d255\u003c/code>)\nand the byte-slice \u003ccode>encode_zpl\u003c/code> API preserve all 256 byte values.\u003c/p>\n\u003ch2 id=\"legacy-ecc-000-140\">Legacy ECC 000-140\u003c/h2>\n\u003cp>ZPL BX with omitted/empty quality or explicit 0/000 uses ECC000. Qualities\n50, 80, 100 and 140 use their respective convolutional encoders. Explicit\nECC200 and EPL keep their own paths; no Legacy input silently becomes ECC200.\u003c/p>\n\u003ch3 id=\"scope-and-byte-handling\">Scope and byte handling\u003c/h3>\n\u003cp>The raw \u003ccode>barcodes::datamatrix_legacy::encode\u003c/code> API accepts literal bytes for\nECC000; \u003ccode>encode_with_ecc\u003c/code> additionally selects 0, 50, 80, 100 or 140. Both accept\nformat 1..6 and an optional complete odd square size. The pipeline implements\nformat encoding, CRC, nine-bit record length, convolution where applicable,\nECC header, zero fill, randomization, placement and finder border.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ECC\u003c/th>\n\u003cth style=\"text-align: right;\">Input bits/cycle\u003c/th>\n\u003cth style=\"text-align: right;\">Output bits/cycle\u003c/th>\n\u003cth style=\"text-align: right;\">Flush cycles\u003c/th>\n\u003cth style=\"text-align: right;\">Minimum side\u003c/th>\n\u003cth style=\"text-align: right;\">Maximum format-6 bytes at 49x49\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>000\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003ctd style=\"text-align: right;\">9\u003c/td>\n\u003ctd style=\"text-align: right;\">271\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>050\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">11\u003c/td>\n\u003ctd style=\"text-align: right;\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>080\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">11\u003c/td>\n\u003ctd style=\"text-align: right;\">13\u003c/td>\n\u003ctd style=\"text-align: right;\">176\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>100\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd style=\"text-align: right;\">2\u003c/td>\n\u003ctd style=\"text-align: right;\">15\u003c/td>\n\u003ctd style=\"text-align: right;\">13\u003c/td>\n\u003ctd style=\"text-align: right;\">131\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>140\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003ctd style=\"text-align: right;\">4\u003c/td>\n\u003ctd style=\"text-align: right;\">13\u003c/td>\n\u003ctd style=\"text-align: right;\">17\u003c/td>\n\u003ctd style=\"text-align: right;\">63\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Convolution excludes the ECC header. A partial final input group is zero-padded,\nthen the state is flushed before adding the header and filling the data area.\nEach call starts with zero state. Capacity errors never truncate the payload.\nLegacy dimensions follow the larger requested row/column value; values above\n49 are automatic, invalid small/even dimensions and rectangular aspect requests\nare rejected. Existing orientation, position and module scaling are reused.\u003c/p>\n\u003cp>The ZPL parser preserves original field bytes through tokenization, FH decoding,\nfield resets and stored-format recall. Literal transport CR/LF/TAB are ignored\nas before; FH can insert them after tokenization. Legacy consumes these bytes\nwithout additional character-set transcoding, including invalid UTF-8. Formats\n1..5 still enforce their byte repertoires. Backslashes and pipes stay literal\nafter FH, matching the scoped CI13/CI27 printer observations below. Parameter g\nis irrelevant for Legacy. The raw encoder never interprets ZPL escapes.\nECC200 has its own \u003ca href=\"#docs/datamatrix/ecc-200-field-data\">field-data rules\u003c/a>.\u003c/p>\n\u003cp>The label renderer skips empty DataMatrix fields and continues rendering the\nrest of the label, including for omitted quality and all supported Legacy\nqualities. For Legacy, preserved \u003ccode>data_bytes\u003c/code> determine emptiness when present;\notherwise the display text is used. ECC200 uses its existing text path. This\nlabel-level behavior is separate from the raw APIs: raw Legacy encoding rejects\nempty input, while raw ECC200 encoding produces a minimal symbol.\u003c/p>\n\u003cp>\u003ccode>BarcodeDatamatrixWithData\u003c/code>, \u003ccode>RecalledFieldData\u003c/code> and\n\u003ccode>RecalledField\u003c/code> carry \u003ccode>data_bytes: Option\u0026lt;Vec\u0026lt;u8\u0026gt;\u0026gt;\u003c/code>. Struct-literal callers must\ninitialize it. Parsed Legacy bytes are authoritative: callers replacing \u003ccode>data\u003c/code>\nmust update or clear \u003ccode>data_bytes\u003c/code>. Manual ASCII fields may use None; manual\nnon-ASCII Legacy fields require explicit bytes. EPL retains its ECC200 text path.\u003c/p>\n\u003ch3 id=\"historical-norms-and-source-attribution\">Historical norms and source attribution\u003c/h3>\n\u003cp>Development worked directly from ISO/IEC 16022:2000, the FCD draft for the next\nedition and GOST R ISO/IEC 16022-2008: Annex H (placement), I (formats), J (CRC),\nK (convolution), L (randomization), and Q (intermediate example values).\nStandard PDFs are not distributed here. Source SHA-256 identifiers:\u003c/p>\n\u003cul>\n\u003cli>FCD: \u003ccode>c618f525c53d884614237349e0e83a85dd4378bca6ad64982d484bec6242fcaa\u003c/code>\u003c/li>\n\u003cli>GOST: \u003ccode>ce038dcde4cd82c8626b9782abb2c379868f7d9bd709dd836cd69c5459b9888d\u003c/code>\u003c/li>\n\u003cli>ISO 2000: \u003ccode>3726076a792673241f9dfef2253e6e1dc815573e3fd564cd176638001ba2d317\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>The encoder and placement generator are ported from the author's own\n\u003ca href=\"https://github.com/Streetblock/QR-Atelier\">QR Atelier\u003c/a>, commit\n\u003ccode>432aa76de2116adc055062f91ef622f4dc9568cb\u003c/code>, files \u003ccode>libs/DMlegacy.js\u003c/code> and\n\u003ccode>libs/DMlegacyPlacementGenerator.js\u003c/code>. Copyright 2026 David Block. This port\nuses the MIT option of MIT OR Apache-2.0; see the included\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/licenses/QR-Atelier-MIT.txt\">license\u003c/a> and source headers.\u003c/p>\n\u003cp>The pinned source already includes random byte BC at offset 211 and the ECC100\ncorrection (no delay-12 tap). Rust uses byte slices, BitMatrix and a bounded lazy\ncache. Placement uses filtered bit reversal, inverse permutation, cyclic row\nshifts and corner swaps. This formula was empirically reconstructed and checked\nfor all 21 supported sizes; it is not a normative algorithm or a proof beyond\nthat finite domain. Production generates/caches grids; fixed grids are test-only.\u003c/p>\n\u003ch3 id=\"evidence-and-limitations\">Evidence and limitations\u003c/h3>\n\u003cp>There is \u003cstrong>no independent overall verification of the Legacy encoder\u003c/strong>. Our\nJavaScript encoder and our own decoder can share interpretation mistakes.\nIndependent RXing checks concern ECC200, not Legacy.\u003c/p>\n\u003cp>Fixed references in \u003ccode>testdata/legacy/\u003c/code> distinguish the evidence:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>placement-grids.txt\u003c/code>: all 21 grids / 18,389 cells extracted from the FCD PDF\n  with two methods sharing that source, supplemented by visual edition checks.\u003c/li>\n\u003cli>\u003ccode>ecc050-annex-q-matrix.txt\u003c/code>: the published 13x13 ECC050 / format3 / AB12-X\n  example. Its 96 protected bits are also tested; the CRC example is 7559.\u003c/li>\n\u003cli>\u003ccode>ecc000-printer-matrices.txt\u003c/code>: three recorded 200/300/400-digit matrices,\n  sides 31/35/41. The 200-digit case came from a Zebra photo; the older 300/400\n  records do not independently identify their encoder.\u003c/li>\n\u003cli>\u003ccode>ecc000-js-port-vectors.txt\u003c/code>: 12 same-author JS outputs, six formats and\n  automatic/49-module sizes. These are port regressions, not independent evidence.\u003c/li>\n\u003cli>\u003ccode>convolution-js-stages.txt\u003c/code>: 200 same-source stage vectors, lengths 0..49 for\n  each quality. Input bit i is 1 when \u003ccode>(i*i + 3*i + 7) % 11 \u0026lt; 5\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>convolution-js-matrices.txt\u003c/code>: 48 same-source outputs, four qualities and six\n  formats, automatic/49-module sizes; format6 includes 00/80/FF/96/01 bytes.\u003c/li>\n\u003cli>\u003ccode>ci13-ci27-photo-grids.txt\u003c/code>: 12 sampled 23x23 grids / 6,348 modules from the\n  field probes. The optional \u003ccode>extract-photo-grids.mjs\u003c/code> copies measured rows from\n  observation JSON, never calls an encoder. Geometry, thresholds and photo hashes\n  are preserved there; these are scoped comparisons, not independent decoding.\u003c/li>\n\u003c/ul>\n\u003cp>Fixtures are frozen and read-only in tests. Stage rows use\n\u003ccode>quality|input_bits|protected_bits\u003c/code>; convolution matrix headers use\n\u003ccode>quality|format|side|payload_hex\u003c/code> followed by binary rows. JS vectors were produced\nfrom the pinned source exports \u003ccode>encodeLegacyEcc050/080/100/140\u003c/code> and\n\u003ccode>generateLegacyDataMatrix\u003c/code>, not regenerated by Rust tests.\u003c/p>\n\u003ch3 id=\"printer-observations\">Printer observations\u003c/h3>\n\u003cp>The recorded ZD421 at 300 dpi, firmware V93.21.17Z, prints Legacy symbols.\nECC000/format6 tests with CI13 and CI27 preserve backslash-ampersand, doubled\nbackslashes and doubled pipes literally. FH 0D/0A produces CR/LF. Each of the\n12 sampled matrices agrees with its known-byte candidate at all 529 modules.\nThe BX prose suggests PDF417-like substitutions, but applying those substitutions\ncontradicted these observations. Other ECC levels/firmware are not hardware-verified\nby this experiment; cross-quality tests establish implementation consistency only.\u003c/p>\n\u003cp>For repeated format1 digit 1, 500 digits print with AUTO and requested 49x49.\nThe supplied N500/N501 photo shows INVALID-L in both N501 fields. The contributor\nreports the same rejection for 511, 512, 596 and 597. Rejected fields print no\nDataMatrix; with CV active the printer emits INVALID-L. These observations do\nnot establish a universal 500-character cap. Model/firmware context was retained\nfrom the experiment, not freshly queried for each photo. Reproducible ZPL and\nscoped results are in \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/examples/legacy-printer-study/README.md\">the printer study\u003c/a>.\u003c/p>\n\u003cp>The generic encoder accepts fitting records through 511 and rejects longer\nrecords explicitly. FCD section 6.5.3 (printed p24 / PDF p32) specifies a nine-bit\ncharacter count, but Table G.1 (printed p68 / PDF p76) lists 560/596 numeric\ncharacters at sides 47/49. Both pages were visually checked. Zebra also lists\n596. No extended record was produced by this printer experiment, so wrapping\nthe count, adding a tenth bit or claiming full 596 support is not justified.\nAll other 29 Zebra maximum-field table cells are tested at and above capacity.\u003c/p>\n\u003cp>Device-specific field suppression and CV diagnostic rendering are separate\nfollow-ups. Labelize returns rendering errors for unsupported input. The 501..511\ngeneric behavior deliberately differs from the tested device's restriction.\u003c/p>\n\u003cp>ISO/IEC 16022:2024 removed Legacy ECC000-140, but existing printer commands still\nuse it. This is compatibility work, not a recommendation for new labels or a\nclaim about every modern Zebra device.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://docs.zebra.com/us/en/printers/software/zpl-pg/c-zpl-zpl-commands/r-zpl-bx.html\">Zebra BX\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.iso.org/standard/80926.html\">ISO/IEC 16022:2024\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://gso-sims-preview-doc-aws.s3-eu-west-1.amazonaws.com/iso-iec-16022-2024-en.html\">2024 foreword preview\u003c/a>\u003c/li>\n\u003c/ul>","headings":[["2","ecc-200-dimensions","ECC 200 dimensions"],["3","fixed-rows-with-automatic-columns","Fixed rows with automatic columns"],["3","independent-evidence-2026-10-06","Independent evidence (2026-10-06)"],["3","regression-coverage-and-provenance","Regression coverage and provenance"],["2","ecc-200-field-data","ECC 200 field data"],["2","legacy-ecc-000-140","Legacy ECC 000-140"],["3","scope-and-byte-handling","Scope and byte handling"],["3","historical-norms-and-source-attribution","Historical norms and source attribution"],["3","evidence-and-limitations","Evidence and limitations"],["3","printer-observations","Printer observations"]],"examples":[],"search":" DataMatrix behavior and evidence \n  Documentation index  \n Reference for supported DataMatrix variants, field-data rules, size selection,\nand the provenance and limits of their regression fixtures. \n \n  ECC 200 dimensions  \n  ECC 200 field data  \n  Legacy ECC 000-140  \n \n For the command overview, see the  ZPL command matrix .\nFor test commands and reference-update policy, see  Testing . \n ECC 200 dimensions \n  ^BX  columns ( c ), rows ( r ), and aspect ratio ( a ) constrain both the\nordinary byte encoder and the explicit FNC1/ECI/structured-append codeword path.\nThe encoder must not replace an unsatisfied constraint with a square symbol.\nLegacy-quality dispatch and the renderer's empty-field suppression are unchanged. \n Fixed rows with automatic columns \n With  c=0,r=12,a=2 , select the standard 26-column symbol before fitting data.\nDo not widen automatically to 36 columns when the input is too long.\nThe renderer skips a capacity-rejected field in this row-only rectangular mode\nand continues rendering the rest of the label. Direct encoder APIs return an\nerror. Invalid dimensions, conflicting shapes, and malformed escape sequences\nstill return errors. This is deliberately not a general implementation of\n ^CV  diagnostics or of all printer field-rejection behavior. \n The selection rule uses the smallest matching standard symbol for fixed rows\nwith automatic columns. Labelary also confirms this at  r=8  and  r=16 .\nThe operator also reported consistent physical results for the r8 and r16\ncontrols below. Those reports establish symbol presence/absence, not decoded\nmodule equality.\nWith both dimensions automatic, the encoder selects a fitting symbol. DMRE\nsizes are not enabled. \n Independent evidence (2026-10-06) \n Physical controls used a Zebra ZD421, 300 dpi, firmware V93.21.17Z, 50 x 25 mm\nlabels, darkness 15 and speed 2. Native fields used  ^BX , not rendered graphics.\nThe operator confirmed that  ABC  at  c0,r12,a2  and  c26,r12,a2  prints the same\nmatrix, while  ABCD12345678901234567890efgh  at  c0,r12,a2  prints no symbol.\nThe same long payload prints at explicit  c36,r12,a2  in the comparison strip.\nThese are visual/operator observations, not a claim of independently decoded\nmodule equality for every photograph. \n Separate Labelary API calls confirmed the following boundary. All commands\nused  ^BXN,4,200,c,12,6,,2  and differed only in  c  and the listed field data. \n \n \n \n Payload \n Characters \n ASCII data codewords \n c0 \n c26 \n c36 \n \n \n \n \n  ABCD1234567890123490efgh  \n 24 \n 16 \n 26x12 \n identical 26x12 \n not tested \n \n \n  ABCD12345678901234901efgh  \n 25 \n 17 \n no symbol \n no symbol \n 36x12 \n \n \n  ABCD12345678901234567890efgh  \n 28 \n 18 \n no symbol \n not tested \n 36x12 \n \n \n \n This is a data-codeword limit, not a general 24-character limit. Numeric pairs\nconsume one ASCII codeword each. Standard 26x12 has 16 data codewords; standard\n36x12 has 22. Both are classic ECC200 rectangular sizes, not DMRE extensions.\nThe tests establish observable size selection, not the printer's internal\nimplementation or a universal rule for all Zebra firmware. \n Additional Labelary controls used  ^BXN,3,200,c,r,6,_,2 : \n \n \n \n Rows \n Payload \n c0 \n Small fixed width \n Large fixed width \n \n \n \n \n 8 \n  aB!cD?eF  \n no symbol \n c18: no symbol \n c32: 32x8 \n \n \n 16 \n  aB!cD?eF#gH%iJ\u0026kLaB!cD?eF#gH%iJ\u0026kL  \n no symbol \n c36: no symbol \n c48: 48x16 \n \n \n \n Two native-only physical test labels were sent once at SD15/PR2. The operator\nreported that the printer behaves like Labelary for these controls. \n Regression coverage and provenance \n \n  tests/unit_datamatrix.rs  covers fixed/partial/automatic dimensions, ratio\n  conflicts, the exact capacity boundary, special codewords, magnification,\n  field suppression without losing subsequent fields/labels, and error retention. \n  testdata/unit/datamatrix_dimensions.zpl  is a text-free fixture with a\n  separately fetched Labelary PNG. It includes successful and suppressed fields,\n  the exact boundary pair, explicit 36x12, FNC1, and a trailing graphic.\n  Its golden tolerance is  0.0% ; references are not generated by Labelize. \n Reference endpoint:  https://api.labelary.com/v1/printers/8dpmm/labels/4.005x8.01/0/ .\n  Render comparisons are under  testdata/diffs/datamatrix_dimensions*.png .\n  Original reference PNG SHA-256:\n   9d4cf784f94167b4b5edd81942dfec272806d6ef40605fda39707f9ae724b8d0 . \n \n References:\n-  Zebra ^BX Programming Guide .\n-  Zint size/capacity tables, including the standard/DMRE distinction . \n ECC 200 field data \n The  ^BX  renderer evaluates field-data escapes only for quality 200. The default\nescape is  _ , matching the newer firmware behavior described in Zebra's\n ^BX reference .\nAn explicit  g  parameter overrides it. Only that character is active;  _1  and\n ~1  are not both interpreted automatically. The old firmware's separate literal\ntilde rules are not emulated. Labelize's existing command splitter also treats\nraw tilde as a command prefix. Use, for example,  ^CT!  when testing an explicit\ntilde escape in raw ZPL; context-sensitive command splitting is not changed here. \n Processing order is the parser's existing  ^FH  handling, followed by DataMatrix\nescape parsing. Literal/control/decimal bytes are distinct from function\ncodewords.  _1  emits codeword 232;  _d029  emits a data byte with value 29.\nOnly a leading FNC1 establishes GS1 DataMatrix. FNC1 inside the data becomes a\nseparator when decoded; an ordinary GS byte does not establish GS1. \n Supported escape tokens are a doubled escape, control shifts,  dNNN  bytes,\nPAD ( 0 ), FNC1 ( 1 ), structured-append FNC2 ( 2  plus three three-digit values),\nFNC3 ( 3 ), and ECI ( 5NNN ). Malformed or unsupported escapes return errors.\nThe direct  barcodes::datamatrix::encode  API remains literal;  encode_zpl \naccepts byte slices with ZPL escapes. EPL disables this escape processing. \n Byte-only payloads retain the existing automatic encodation. Payloads containing\nfunction codewords use ASCII encodation with numeric-pair compaction and upper\nshift. The existing DataMatrix library supplies capacity selection, Reed-Solomon\nECC, and placement. This path prioritizes correct function-codeword positions;\nit does not optimize C40/Text/Base256 segments around functions and may produce\nlarger symbols. See  dimension selection  for capacity rules. \n Validation includes exact byte/token/codeword tests and an independent RXing\nmatrix decoder. Tests assert both decoded content and the GS1 symbology modifier\n( ]d2 ), plus internal FNC1, literal GS, custom escapes,  ^FH -generated controls,\nupper-shift bytes, padding, and EPL isolation. These checks do not use rendered\nimages as replacement reference data. \n This ECC 200 path is separate from the ECC 000-140 implementation documented in\n DATAMATRIX.md#legacy-ecc-000-140 ; Legacy fields never pass through these substitutions.\nIt does not redesign the ECC 200 string-based ZPL input/charset pipeline: literal\ntext follows its existing UTF-8 behavior, and non-UTF-8 high-byte  ^FH  sequences\nremain a separate parser limitation. Decimal escapes ( _d000  through  _d255 )\nand the byte-slice  encode_zpl  API preserve all 256 byte values. \n Legacy ECC 000-140 \n ZPL BX with omitted/empty quality or explicit 0/000 uses ECC000. Qualities\n50, 80, 100 and 140 use their respective convolutional encoders. Explicit\nECC200 and EPL keep their own paths; no Legacy input silently becomes ECC200. \n Scope and byte handling \n The raw  barcodes::datamatrix_legacy::encode  API accepts literal bytes for\nECC000;  encode_with_ecc  additionally selects 0, 50, 80, 100 or 140. Both accept\nformat 1..6 and an optional complete odd square size. The pipeline implements\nformat encoding, CRC, nine-bit record length, convolution where applicable,\nECC header, zero fill, randomization, placement and finder border. \n \n \n \n ECC \n Input bits/cycle \n Output bits/cycle \n Flush cycles \n Minimum side \n Maximum format-6 bytes at 49x49 \n \n \n \n \n 000 \n 1 \n 1 \n 0 \n 9 \n 271 \n \n \n 050 \n 3 \n 4 \n 3 \n 11 \n 200 \n \n \n 080 \n 2 \n 3 \n 11 \n 13 \n 176 \n \n \n 100 \n 1 \n 2 \n 15 \n 13 \n 131 \n \n \n 140 \n 1 \n 4 \n 13 \n 17 \n 63 \n \n \n \n Convolution excludes the ECC header. A partial final input group is zero-padded,\nthen the state is flushed before adding the header and filling the data area.\nEach call starts with zero state. Capacity errors never truncate the payload.\nLegacy dimensions follow the larger requested row/column value; values above\n49 are automatic, invalid small/even dimensions and rectangular aspect requests\nare rejected. Existing orientation, position and module scaling are reused. \n The ZPL parser preserves original field bytes through tokenization, FH decoding,\nfield resets and stored-format recall. Literal transport CR/LF/TAB are ignored\nas before; FH can insert them after tokenization. Legacy consumes these bytes\nwithout additional character-set transcoding, including invalid UTF-8. Formats\n1..5 still enforce their byte repertoires. Backslashes and pipes stay literal\nafter FH, matching the scoped CI13/CI27 printer observations below. Parameter g\nis irrelevant for Legacy. The raw encoder never interprets ZPL escapes.\nECC200 has its own  field-data rules . \n The label renderer skips empty DataMatrix fields and continues rendering the\nrest of the label, including for omitted quality and all supported Legacy\nqualities. For Legacy, preserved  data_bytes  determine emptiness when present;\notherwise the display text is used. ECC200 uses its existing text path. This\nlabel-level behavior is separate from the raw APIs: raw Legacy encoding rejects\nempty input, while raw ECC200 encoding produces a minimal symbol. \n  BarcodeDatamatrixWithData ,  RecalledFieldData  and\n RecalledField  carry  data_bytes: Option\u003cVec\u003cu8>> . Struct-literal callers must\ninitialize it. Parsed Legacy bytes are authoritative: callers replacing  data \nmust update or clear  data_bytes . Manual ASCII fields may use None; manual\nnon-ASCII Legacy fields require explicit bytes. EPL retains its ECC200 text path. \n Historical norms and source attribution \n Development worked directly from ISO/IEC 16022:2000, the FCD draft for the next\nedition and GOST R ISO/IEC 16022-2008: Annex H (placement), I (formats), J (CRC),\nK (convolution), L (randomization), and Q (intermediate example values).\nStandard PDFs are not distributed here. Source SHA-256 identifiers: \n \n FCD:  c618f525c53d884614237349e0e83a85dd4378bca6ad64982d484bec6242fcaa  \n GOST:  ce038dcde4cd82c8626b9782abb2c379868f7d9bd709dd836cd69c5459b9888d  \n ISO 2000:  3726076a792673241f9dfef2253e6e1dc815573e3fd564cd176638001ba2d317  \n \n The encoder and placement generator are ported from the author's own\n QR Atelier , commit\n 432aa76de2116adc055062f91ef622f4dc9568cb , files  libs/DMlegacy.js  and\n libs/DMlegacyPlacementGenerator.js . Copyright 2026 David Block. This port\nuses the MIT option of MIT OR Apache-2.0; see the included\n license  and source headers. \n The pinned source already includes random byte BC at offset 211 and the ECC100\ncorrection (no delay-12 tap). Rust uses byte slices, BitMatrix and a bounded lazy\ncache. Placement uses filtered bit reversal, inverse permutation, cyclic row\nshifts and corner swaps. This formula was empirically reconstructed and checked\nfor all 21 supported sizes; it is not a normative algorithm or a proof beyond\nthat finite domain. Production generates/caches grids; fixed grids are test-only. \n Evidence and limitations \n There is  no independent overall verification of the Legacy encoder . Our\nJavaScript encoder and our own decoder can share interpretation mistakes.\nIndependent RXing checks concern ECC200, not Legacy. \n Fixed references in  testdata/legacy/  distinguish the evidence: \n \n  placement-grids.txt : all 21 grids / 18,389 cells extracted from the FCD PDF\n  with two methods sharing that source, supplemented by visual edition checks. \n  ecc050-annex-q-matrix.txt : the published 13x13 ECC050 / format3 / AB12-X\n  example. Its 96 protected bits are also tested; the CRC example is 7559. \n  ecc000-printer-matrices.txt : three recorded 200/300/400-digit matrices,\n  sides 31/35/41. The 200-digit case came from a Zebra photo; the older 300/400\n  records do not independently identify their encoder. \n  ecc000-js-port-vectors.txt : 12 same-author JS outputs, six formats and\n  automatic/49-module sizes. These are port regressions, not independent evidence. \n  convolution-js-stages.txt : 200 same-source stage vectors, lengths 0..49 for\n  each quality. Input bit i is 1 when  (i*i + 3*i + 7) % 11 \u003c 5 . \n  convolution-js-matrices.txt : 48 same-source outputs, four qualities and six\n  formats, automatic/49-module sizes; format6 includes 00/80/FF/96/01 bytes. \n  ci13-ci27-photo-grids.txt : 12 sampled 23x23 grids / 6,348 modules from the\n  field probes. The optional  extract-photo-grids.mjs  copies measured rows from\n  observation JSON, never calls an encoder. Geometry, thresholds and photo hashes\n  are preserved there; these are scoped comparisons, not independent decoding. \n \n Fixtures are frozen and read-only in tests. Stage rows use\n quality|input_bits|protected_bits ; convolution matrix headers use\n quality|format|side|payload_hex  followed by binary rows. JS vectors were produced\nfrom the pinned source exports  encodeLegacyEcc050/080/100/140  and\n generateLegacyDataMatrix , not regenerated by Rust tests. \n Printer observations \n The recorded ZD421 at 300 dpi, firmware V93.21.17Z, prints Legacy symbols.\nECC000/format6 tests with CI13 and CI27 preserve backslash-ampersand, doubled\nbackslashes and doubled pipes literally. FH 0D/0A produces CR/LF. Each of the\n12 sampled matrices agrees with its known-byte candidate at all 529 modules.\nThe BX prose suggests PDF417-like substitutions, but applying those substitutions\ncontradicted these observations. Other ECC levels/firmware are not hardware-verified\nby this experiment; cross-quality tests establish implementation consistency only. \n For repeated format1 digit 1, 500 digits print with AUTO and requested 49x49.\nThe supplied N500/N501 photo shows INVALID-L in both N501 fields. The contributor\nreports the same rejection for 511, 512, 596 and 597. Rejected fields print no\nDataMatrix; with CV active the printer emits INVALID-L. These observations do\nnot establish a universal 500-character cap. Model/firmware context was retained\nfrom the experiment, not freshly queried for each photo. Reproducible ZPL and\nscoped results are in  the printer study . \n The generic encoder accepts fitting records through 511 and rejects longer\nrecords explicitly. FCD section 6.5.3 (printed p24 / PDF p32) specifies a nine-bit\ncharacter count, but Table G.1 (printed p68 / PDF p76) lists 560/596 numeric\ncharacters at sides 47/49. Both pages were visually checked. Zebra also lists\n596. No extended record was produced by this printer experiment, so wrapping\nthe count, adding a tenth bit or claiming full 596 support is not justified.\nAll other 29 Zebra maximum-field table cells are tested at and above capacity. \n Device-specific field suppression and CV diagnostic rendering are separate\nfollow-ups. Labelize returns rendering errors for unsupported input. The 501..511\ngeneric behavior deliberately differs from the tested device's restriction. \n ISO/IEC 16022:2024 removed Legacy ECC000-140, but existing printer commands still\nuse it. This is compatibility work, not a recommendation for new labels or a\nclaim about every modern Zebra device. \n \n  Zebra BX  \n  ISO/IEC 16022:2024  \n  2024 foreword preview  \n "},{"id":"rendering","group":"Reference","title":"Rendering behavior and evidence","file":"RENDERING_NOTES.md","html":"\u003ch1 id=\"rendering-behavior-and-evidence\">Rendering behavior and evidence\u003c/h1>\n\u003cp>\u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Focused semantics and reference measurements that complement the\n\u003ca href=\"#docs/zpl\">ZPL command matrix\u003c/a> and\n\u003ca href=\"#docs/thresholds\">diff thresholds\u003c/a>. Dated measurements describe the named\nrenderer or device; they are not universal printer conformance claims.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/rendering/print-mirror\">Print mirror\u003c/a>: persistent state, transforms and geometry.\u003c/li>\n\u003cli>\u003ca href=\"#docs/rendering/field-parameters\">Field parameters\u003c/a>: text direction, character spacing and\n  measured Labelary compatibility.\u003c/li>\n\u003cli>\u003ca href=\"#docs/rendering/qr-mask-selection\">QR mask selection\u003c/a>: scoring, independent matrices and\n  observed firmware differences.\u003c/li>\n\u003c/ul>\n\u003cp>DataMatrix has a separate \u003ca href=\"#docs/datamatrix\">reference\u003c/a>; TSPL calibration and\nopen questions are in \u003ca href=\"#docs/tspl-baselines\">TSPL baselines\u003c/a>.\u003c/p>\n\u003ch2 id=\"field-parameters\">Field parameters\u003c/h2>\n\u003cp>\u003ccode>^FPd,g\u003c/code> configures the current text field. \u003ccode>H\u003c/code> places upright characters\nleft to right, \u003ccode>R\u003c/code> places them right to left, and \u003ccode>V\u003c/code> stacks them vertically\nwithout rotating the individual characters. The field's font orientation\nstill rotates the resulting arrangement. This is distinct from \u003ccode>^FR\u003c/code>, which\nreverses field colors.\u003c/p>\n\u003cp>The gap \u003ccode>g\u003c/code> is an additional character spacing in printer dots; \u003ccode>^MU\u003c/code> does\nnot rescale it. Each \u003ccode>^FP\u003c/code> replaces both parameters: omitted or invalid\ndirection selects \u003ccode>H\u003c/code>, and an omitted gap selects zero. \u003ccode>^FS\u003c/code> restores the\ndefault horizontal direction and zero gap for the next field.\u003c/p>\n\u003ch3 id=\"independent-labelary-measurements-november-6-2026\">Independent Labelary measurements (November 6, 2026)\u003c/h3>\n\u003cp>Synthetic \u003ccode>ABCDE\u003c/code> fields were rendered through the public Labelary API at\n8 dots/mm, using scalable font 0 (\u003ccode>^A0N,40,32\u003c/code>) and bitmap font A\n(\u003ccode>^AAN,36,20\u003c/code>). Visible ink widths were:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Gap command\u003c/th>\n\u003cth style=\"text-align: right;\">Font 0\u003c/th>\n\u003cth style=\"text-align: right;\">Font A\u003c/th>\n\u003cth style=\"text-align: right;\">Change from zero gap\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>^FPH,0\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">86\u003c/td>\n\u003ctd style=\"text-align: right;\">115\u003c/td>\n\u003ctd style=\"text-align: right;\">0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FPH,5\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">106\u003c/td>\n\u003ctd style=\"text-align: right;\">135\u003c/td>\n\u003ctd style=\"text-align: right;\">+20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FPH,15\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">146\u003c/td>\n\u003ctd style=\"text-align: right;\">175\u003c/td>\n\u003ctd style=\"text-align: right;\">+60\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FPH,30\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">206\u003c/td>\n\u003ctd style=\"text-align: right;\">235\u003c/td>\n\u003ctd style=\"text-align: right;\">+120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FPH,-5\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">66\u003c/td>\n\u003ctd style=\"text-align: right;\">95\u003c/td>\n\u003ctd style=\"text-align: right;\">-20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Five characters have four between-character spaces: the measured width\nchange is exactly \u003ccode>4 * g\u003c/code>, without stretching the glyphs. \u003ccode>^FPR,10\u003c/code> likewise\nadds ten dots between upright characters in reverse order.\u003c/p>\n\u003cp>For \u003cstrong>both tested fonts\u003c/strong>, \u003ccode>^FPV,0\u003c/code>, \u003ccode>^FPV,5\u003c/code>, \u003ccode>^FPV,10\u003c/code> and \u003ccode>^FPV,30\u003c/code>\nproduced pixel-identical PNGs. Labelize deliberately reproduces this\nLabelary behavior: the gap is ignored for vertical glyph placement. Vertical\nplacement uses the font's cell height as the character pitch. With \u003ccode>^FB\u003c/code>,\nthe gap still affects wrapping, so different gaps can produce different\nblocks even though the pitch within each vertical run is unchanged.\u003c/p>\n\u003cp>Labelary accepts negative gaps down to -10 (more-negative values clamp to\n-10); the Zebra guide documents a nonnegative range instead. Very large\npositive gaps can also be discarded by Labelary based on the selected font\nwidth. These are compatibility observations, \u003cstrong>not verified Zebra printer\nbehavior\u003c/strong>. Physical-printer tests remain outstanding.\u003c/p>\n\u003cp>The independent full-page reference is\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/unit/field_parameters.zpl\">\u003ccode>testdata/unit/field_parameters.zpl\u003c/code>\u003c/a>\nand its PNG; the adjacent provenance JSON records the endpoint, source hash\nand original reference hash. Tests additionally check individual field\ngeometry and spacing so sparse whole-page tolerances cannot hide an ignored\ncommand. Existing substitute-font shape differences remain visible in the\ncomparison artifacts.\u003c/p>\n\u003cp>The new full-page golden has a 3.0% ceiling: the captured comparison measured\n2.7771%, including 1.1299% in the unchanged annotation fields alone. The\nunmodified \u003ccode>db25929\u003c/code> renderer, which ignores \u003ccode>^FP\u003c/code>, measured 3.8829% against\nthe same source and reference and fails this ceiling. Isolated geometry\nchecks separately require the exact requested per-character displacement;\nfont-outline tolerance cannot excuse an ignored or incorrectly scaled gap.\u003c/p>\n\u003cp>The \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/testdata/field-parameters/provenance.json\">additional frozen captures\u003c/a>\npin rotated origins, explicit alignment and field-block interactions. For\ncentered blocks, Labelary includes a trailing word separator in alignment\nmeasurement only when it fits the block width. Acceptance checks compare\nspacing-induced shifts against the zero-gap control, preserving the existing\nsubstitute-font baseline while rejecting new alignment errors.\u003c/p>\n\u003cp>Sources: \u003ca href=\"https://cpws.zebra.com/cpws/docs/zpl/zpl-zbi2-pm-en.pdf\">Zebra Programming Guide\u003c/a>,\n\u003ca href=\"https://labelary.com/reference.html\">Labelary command reference\u003c/a>, and the\ncaptured independent images. Unicode combining sequences and complex field\ninteractions must not be inferred to match physical printer firmware from\nthese synthetic measurements.\u003c/p>\n\u003ch2 id=\"print-mirror\">Print mirror\u003c/h2>\n\u003cp>\u003ccode>^PMY\u003c/code> mirrors the whole label horizontally. The setting persists across\n\u003ccode>^XA\u003c/code>/\u003ccode>^XZ\u003c/code> and subsequent calls to the same \u003ccode>ZplParser\u003c/code>. \u003ccode>^PMN\u003c/code> disables it;\nconstructing a new parser starts with mirroring disabled. Missing or invalid\nparameters leave the current state unchanged. The last valid setting in a\nformat applies to every field and every \u003ccode>^PQ\u003c/code> copy of that label.\u003c/p>\n\u003cp>The completed image is mirrored after print-width clipping/centering and \u003ccode>^PO\u003c/code>\nrotation. \u003ccode>DrawerOptions::enable_inverted_labels\u003c/code> controls \u003ccode>^PO\u003c/code> only; disabling\nthat option does not disable \u003ccode>^PM\u003c/code>.\u003c/p>\n\u003cp>Downloaded formats store an optional explicit mirror instruction. Defining a\nformat does not change the printer's mirror setting. Recalling a format replays\nits instruction, if present; a format without \u003ccode>^PM\u003c/code> inherits the printer's state\nat recall time. A later \u003ccode>^PMN\u003c/code> in the calling format takes precedence.\u003c/p>\n\u003ch3 id=\"sources-and-comparison-september-10-2026\">Sources and comparison (September 10, 2026)\u003c/h3>\n\u003cul>\n\u003cli>The authoritative \u003ca href=\"https://www.zebra.com/content/dam/support-dam/en/documentation/unrestricted/guide/software/zpl-zbi2-pg-en.pdf\">Zebra Programming Guide, ^PM section\u003c/a>\n  specifies horizontal reflection, persistence until explicit disable/power-off,\n  and ignoring missing/invalid parameters.\u003c/li>\n\u003cli>\u003ca href=\"https://labelary.com/docs.html\">Labelary lists ^PM as supported\u003c/a>. Live requests\n  confirmed persistence, reset, ignored invalid/missing parameters, whole-label\n  application, print-width/rotation composition, and stored-format behavior.\u003c/li>\n\u003cli>The inspected \u003ca href=\"https://github.com/le2ni/zplr/blob/590f03c58c79663be37708cd97f8cff5eb0d797e/src/core/interpreter.ts\">ZPLR interpreter at 590f03c\u003c/a>\n  initializes mirror state per label and uses \u003ccode>yesNo(args[0], true)\u003c/code> for \u003ccode>^PM\u003c/code>.\n  Its \u003ca href=\"https://github.com/le2ni/zplr/blob/590f03c58c79663be37708cd97f8cff5eb0d797e/src/core/raster.ts\">raster transform\u003c/a>\n  implements horizontal reflection composed with 180-degree rotation. Its\n  parameter/state handling is not used as the authority for this implementation.\u003c/li>\n\u003c/ul>\n\u003cp>The Labelary HTTP endpoint also ignored a \u003ccode>^PMY\u003c/code> placed before the first \u003ccode>^XA\u003c/code>.\nThat observation does not establish physical-printer behavior outside formats.\nLike other existing printer settings in Labelize, \u003ccode>^PM\u003c/code> is interpreted wherever\nthe command parser receives it; the conformance cases below use complete formats.\u003c/p>\n\u003ch3 id=\"independent-geometry-measurements\">Independent geometry measurements\u003c/h3>\n\u003cp>Requests used \u003ccode>POST https://api.labelary.com/v1/printers/8dpmm/labels/1x0.5/0/\u003c/code>\nwith \u003ccode>Accept: image/png\u003c/code> and the synthetic field\n\u003ccode>^FO10,20^GB20,10,10^FS\u003c/code> inside \u003ccode>^XA\u003c/code>/\u003ccode>^XZ\u003c/code>. The returned canvas was 203 x 101\ndots. Coordinates below are inclusive black-pixel bounds.\u003c/p>\n\u003ctable>\n\u00
