<script id="docs-data" type="application/json">[{"id":"getting-started","group":"Start here","title":"Your first label","file":"GETTING_STARTED.md","html":"\u003ch1 id=\"your-first-label\">Your first label\u003c/h1>\n\u003cp>Go from printer code to a preview, then use the same label in your application.\nLabelize reads ZPL, EPL, TSPL/TSC, CPCL and DPL and produces PNG or PDF.\nYou do not need a printer to start.\u003c/p>\n\u003ch2 id=\"render-a-small-zpl-label\">Render a small ZPL label\u003c/h2>\n\u003cp>Open \u003cstrong>Playground\u003c/strong> and paste the example below, or use \u003cstrong>Try in playground\u003c/strong>\nin the built-in docs. Select \u003cstrong>ZPL\u003c/strong>, \u003cstrong>100 × 60 mm\u003c/strong>, and \u003cstrong>8 dpmm\u003c/strong>.\nPress \u003cstrong>Render\u003c/strong>. You should see “Hello, Labelize” above a Code 128 barcode\non an \u003cstrong>800 × 480 pixel\u003c/strong> label.\u003c/p>\n\u003cdiv class=\"doc-example\">\u003cpre>\u003ccode class=\"language-zpl\">^XA\n^FO40,40^A0N,40,30^FDHello, Labelize^FS\n^FO40,110^BY2^BCN,80,Y,N,N^FD12345678^FS\n^XZ\n\u003c/code>\u003c/pre>\u003cbutton type=\"button\" class=\"doc-try\" data-language=\"zpl\" data-width=\"100\" data-height=\"60\" data-dpmm=\"8\">Try in playground\u003c/button>\u003c/div>\n\n\u003cp>The example button replaces the editor source and settings. Opening docs\nand returning to the playground keeps your current work; copy or download\nyour source before replacing it with an example.\u003c/p>\n\u003ch2 id=\"understand-what-you-changed\">Understand what you changed\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Part\u003c/th>\n\u003cth>What it does in this example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>^XA\u003c/code> / \u003ccode>^XZ\u003c/code>\u003c/td>\n\u003ctd>Start and finish the label\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FO40,40\u003c/code>\u003c/td>\n\u003ctd>Position the next field 40 dots from the left and top\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^A0N,40,30\u003c/code>\u003c/td>\n\u003ctd>Select font 0, normal orientation, height 40 and width 30 dots\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^FD…^FS\u003c/code>\u003c/td>\n\u003ctd>Supply the field data and finish the field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>^BY2\u003c/code> / \u003ccode>^BCN,80,Y,N,N\u003c/code>\u003c/td>\n\u003ctd>Use a 2-dot module and an 80-dot Code 128 barcode with readable text\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>At 8 dpmm, 40 dots are 5 mm. Change the first \u003ccode>^FO40,40\u003c/code> to \u003ccode>^FO80,40\u003c/code>\nand watch the text move right. Changing the canvas width adds space;\nit does not stretch the source. See \u003ca href=\"#docs/playground/size-and-resolution\">sizing and resolution\u003c/a>.\u003c/p>\n\u003ch2 id=\"export-the-result\">Export the result\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>PNG\u003c/strong> downloads the preview. Default output is black and white; enable\n  \u003cstrong>Antialias\u003c/strong> for grayscale edges.\u003c/li>\n\u003cli>\u003cstrong>PDF\u003c/strong> downloads a document at the selected physical size. Raster is the\n  default. Choose \u003cstrong>Vector PDF / scalable PNG\u003c/strong> when available for searchable\n  text and scalable geometry; bitmap content remains resolution-limited.\u003c/li>\n\u003cli>\u003cstrong>Share\u003c/strong> copies a URL containing your source and settings. Anyone with\n  that link can read the label data. Avoid sharing addresses or other secrets.\u003c/li>\n\u003c/ul>\n\u003cp>Print at \u003cstrong>actual size / 100%\u003c/strong>, with “fit to page” disabled. Confirm barcode\nreadability and placement on your target printer before using a label in production.\u003c/p>\n\u003ch2 id=\"use-the-same-label-through-http\">Use the same label through HTTP\u003c/h2>\n\u003cp>Start a local service from a checkout:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">cargo run --features serve,vector -- serve --host 127.0.0.1 --port 8080\n\u003c/code>\u003c/pre>\n\u003cp>In another terminal, create the same 800 × 480 PNG:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body 'http://localhost:8080/convert?width=100\u0026amp;height=60\u0026amp;dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello, Labelize^FS^FO40,110^BY2^BCN,80,Y,N,N^FD12345678^FS^XZ' \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003cp>Always send the language and size explicitly when you need matching output\nacross deployments. The \u003ca href=\"#docs/http\">HTTP guide\u003c/a> explains\nbinary uploads, defaults, validation and error responses.\u003c/p>\n\u003ch2 id=\"choose-your-next-step\">Choose your next step\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Goal\u003c/th>\n\u003cth>Guide\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Learn the editor, sizing, image import or comparison\u003c/td>\n\u003ctd>\u003ca href=\"#docs/playground\">Playground guide\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Start with a different printer language\u003c/td>\n\u003ctd>\u003ca href=\"#docs/languages\">Languages and examples\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Convert files from a terminal\u003c/td>\n\u003ctd>\u003ca href=\"#docs/cli\">CLI tutorial\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Deploy a service\u003c/td>\n\u003ctd>\u003ca href=\"#docs/docker\">Docker\u003c/a> or \u003ca href=\"#docs/http\">HTTP\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Embed the engine\u003c/td>\n\u003ctd>\u003ca href=\"#docs/rust\">Rust\u003c/a>, \u003ca href=\"#docs/javascript\">JavaScript/WASM\u003c/a>, \u003ca href=\"#docs/android\">Android\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fix cropped output, fonts or barcodes\u003c/td>\n\u003ctd>\u003ca href=\"#docs/troubleshooting\">Troubleshooting\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>","headings":[["2","render-a-small-zpl-label","Render a small ZPL label"],["2","understand-what-you-changed","Understand what you changed"],["2","export-the-result","Export the result"],["2","use-the-same-label-through-http","Use the same label through HTTP"],["2","choose-your-next-step","Choose your next step"]],"examples":[{"language":"zpl","width":100.0,"height":60.0,"dpmm":8,"source":"^XA\n^FO40,40^A0N,40,30^FDHello, Labelize^FS\n^FO40,110^BY2^BCN,80,Y,N,N^FD12345678^FS\n^XZ\n"}],"search":" Your first label \n Go from printer code to a preview, then use the same label in your application.\nLabelize reads ZPL, EPL, TSPL/TSC, CPCL and DPL and produces PNG or PDF.\nYou do not need a printer to start. \n Render a small ZPL label \n Open  Playground  and paste the example below, or use  Try in playground \nin the built-in docs. Select  ZPL ,  100 × 60 mm , and  8 dpmm .\nPress  Render . You should see “Hello, Labelize” above a Code 128 barcode\non an  800 × 480 pixel  label. \n   ^XA\n^FO40,40^A0N,40,30^FDHello, Labelize^FS\n^FO40,110^BY2^BCN,80,Y,N,N^FD12345678^FS\n^XZ\n   Try in playground  \n\n The example button replaces the editor source and settings. Opening docs\nand returning to the playground keeps your current work; copy or download\nyour source before replacing it with an example. \n Understand what you changed \n \n \n \n Part \n What it does in this example \n \n \n \n \n  ^XA  /  ^XZ  \n Start and finish the label \n \n \n  ^FO40,40  \n Position the next field 40 dots from the left and top \n \n \n  ^A0N,40,30  \n Select font 0, normal orientation, height 40 and width 30 dots \n \n \n  ^FD…^FS  \n Supply the field data and finish the field \n \n \n  ^BY2  /  ^BCN,80,Y,N,N  \n Use a 2-dot module and an 80-dot Code 128 barcode with readable text \n \n \n \n At 8 dpmm, 40 dots are 5 mm. Change the first  ^FO40,40  to  ^FO80,40 \nand watch the text move right. Changing the canvas width adds space;\nit does not stretch the source. See  sizing and resolution . \n Export the result \n \n  PNG  downloads the preview. Default output is black and white; enable\n   Antialias  for grayscale edges. \n  PDF  downloads a document at the selected physical size. Raster is the\n  default. Choose  Vector PDF / scalable PNG  when available for searchable\n  text and scalable geometry; bitmap content remains resolution-limited. \n  Share  copies a URL containing your source and settings. Anyone with\n  that link can read the label data. Avoid sharing addresses or other secrets. \n \n Print at  actual size / 100% , with “fit to page” disabled. Confirm barcode\nreadability and placement on your target printer before using a label in production. \n Use the same label through HTTP \n Start a local service from a checkout: \n  cargo run --features serve,vector -- serve --host 127.0.0.1 --port 8080\n  \n In another terminal, create the same 800 × 480 PNG: \n  curl --fail-with-body 'http://localhost:8080/convert?width=100\u0026height=60\u0026dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello, Labelize^FS^FO40,110^BY2^BCN,80,Y,N,N^FD12345678^FS^XZ' \\\n  -o label.png\n  \n Always send the language and size explicitly when you need matching output\nacross deployments. The  HTTP guide  explains\nbinary uploads, defaults, validation and error responses. \n Choose your next step \n \n \n \n Goal \n Guide \n \n \n \n \n Learn the editor, sizing, image import or comparison \n  Playground guide  \n \n \n Start with a different printer language \n  Languages and examples  \n \n \n Convert files from a terminal \n  CLI tutorial  \n \n \n Deploy a service \n  Docker  or  HTTP  \n \n \n Embed the engine \n  Rust ,  JavaScript/WASM ,  Android  \n \n \n Fix cropped output, fonts or barcodes \n  Troubleshooting  \n \n \n "},{"id":"playground","group":"Start here","title":"Playground guide","file":"PLAYGROUND.md","html":"\u003ch1 id=\"playground-guide\">Playground guide\u003c/h1>\n\u003cp>The playground combines an editor, label preview and documentation in one\npage. Rendering and validation use the server hosting that page. The docs\nare bundled with the application and need no separate documentation service.\u003c/p>\n\u003cp>Use the workspace navigation to move between Playground, API and Documentation.\nOn desktop, label settings sit beside the source editor and preview. On smaller\nscreens, the settings and panels stack vertically. Language and theme controls\nstay in the navigation, and your preferences apply to every view.\u003c/p>\n\u003cp>Open \u003cstrong>API\u003c/strong> to test individual endpoints and inspect requests and responses.\nCopy examples for your own scripts or download the OpenAPI specification.\nThe \u003ca href=\"#docs/api\">API guide\u003c/a> covers file uploads and temporary directory-conversion\njobs. Switching between API, Documentation and Playground preserves each\nview's draft until the page is reloaded.\u003c/p>\n\u003ch2 id=\"edit-preview-and-learn\">Edit, preview and learn\u003c/h2>\n\u003cp>Choose a sample or open a \u003ccode>.zpl\u003c/code>, \u003ccode>.epl\u003c/code>, \u003ccode>.tspl\u003c/code>, \u003ccode>.cpcl\u003c/code> or \u003ccode>.dpl\u003c/code> file.\nCheck \u003cstrong>Format\u003c/strong> after loading your own source. \u003cstrong>Live preview\u003c/strong> updates as\nyou type; \u003cstrong>Render\u003c/strong> or \u003cstrong>Ctrl/Cmd + Enter\u003c/strong> renders immediately.\n\u003cstrong>Format code\u003c/strong> changes whitespace without acting as a syntax validator.\nThe editor's syntax status reports parse results separately.\u003c/p>\n\u003cp>Open \u003cstrong>Documentation\u003c/strong> whenever you need a guide. Search across page titles\nand content, follow the section links, or copy a code block. \u003cstrong>Try in\nplayground\u003c/strong> loads an example with its language, dimensions and resolution.\nNavigation between docs and the editor preserves your work within the page;\nreloading the page does not save an unsaved draft. A \u003cstrong>Share\u003c/strong> link restores\nsource and render settings.\u003c/p>\n\u003ch2 id=\"size-and-resolution\">Size and resolution\u003c/h2>\n\u003cp>Width and height describe the physical canvas. Enter millimetres or inches;\nswitching \u003cstrong>Unit\u003c/strong> preserves the size. Editing either dimension selects\n\u003cstrong>Custom…\u003c/strong>. The playground sends both dimensions explicitly, so these\ncontrols override dimensions declared in the label source.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setting\u003c/th>\n\u003cth>Example\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Canvas\u003c/td>\n\u003ctd>100 × 60 mm\u003c/td>\n\u003ctd>Space available to draw the label\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resolution\u003c/td>\n\u003ctd>8 dpmm\u003c/td>\n\u003ctd>8 source dots per mm; 800 × 480 pixels at scale 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Preview zoom\u003c/td>\n\u003ctd>Fit, 100%, etc.\u003c/td>\n\u003ctd>Browser display only; no change to downloads\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PNG scale\u003c/td>\n\u003ctd>3×, in vector mode\u003c/td>\n\u003ctd>2400 × 1440 pixels; source coordinates still use 8 dpmm\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Common printer classes are 6, 8, 12 and 24 dpmm (approximately 152, 203,\n305 and 610 dpi). Printer marketing often calls the latter two 300 and 600 dpi.\nUse the resolution your label was authored for. Raising dpmm changes the\nphysical meaning of source dots; use PNG scale to enlarge an export instead.\u003c/p>\n\u003ch2 id=\"png-and-pdf\">PNG and PDF\u003c/h2>\n\u003cp>Raster is the default and PDF embeds the rendered image. Builds with vector\nsupport also offer \u003cstrong>Vector PDF / scalable PNG\u003c/strong>, \u003cstrong>PNG scale\u003c/strong> and \u003cstrong>All PDF\npages\u003c/strong>. PNG previews show the first label. \u003cstrong>All PDF pages\u003c/strong> combines all\nlabels into one vector PDF; the current width/height apply to every page.\u003c/p>\n\u003cp>Vector PDF preserves ordinary text as searchable text and shapes as geometry.\nImages and some compositing operations retain local raster content. See\n\u003ca href=\"#docs/vector\">vector output\u003c/a> for fidelity limits and integration options.\u003c/p>\n\u003ch2 id=\"image-to-printer-code\">Image to printer code\u003c/h2>\n\u003cp>Select \u003cstrong>ZPL\u003c/strong> or \u003cstrong>TSPL\u003c/strong>, set the resolution, then choose \u003cstrong>Image → Code\u003c/strong>.\nThe image is flattened onto white and converted to black and white at the\nserver's default threshold of 128.\u003c/p>\n\u003cul>\n\u003cli>ZPL output loads into the editor and sets the canvas to the image dimensions.\u003c/li>\n\u003cli>TSPL output downloads as a binary file. Keep it as bytes; decoding and\n  re-encoding it as UTF-8 can corrupt the bitmap payload.\u003c/li>\n\u003c/ul>\n\u003cp>One image pixel becomes one printer dot. An 800 × 480 image at 8 dpmm is\n100 × 60 mm. This embeds a bitmap; it does not recognize text or reconstruct\neditable barcode commands. The API's \u003ccode>/encode\u003c/code> endpoint also lets you choose\nthe threshold. See \u003ca href=\"#docs/http/image-to-code\">the HTTP guide\u003c/a>.\u003c/p>\n\u003ch2 id=\"compare-with-labelary\">Compare with Labelary\u003c/h2>\n\u003cp>For ZPL, \u003cstrong>Compare with Labelary\u003c/strong> sends the current source to the external\nLabelary service and shows its image, Labelize's image and a pixel difference.\nIt requires PNG scale 1. It is unavailable for EPL, TSPL, CPCL and DPL.\nFont differences can produce visible pixel differences even when a label is\nusable; a low difference score is not a barcode scan guarantee.\u003c/p>\n\u003cp>Self-hosted native servers can remove this action with\n\u003ccode>LABELIZE_PLAYGROUND_LABELARY_COMPARE=false\u003c/code>. An API-only native deployment\ncan set \u003ccode>LABELIZE_PLAYGROUND_ENABLED=false\u003c/code>.\u003c/p>\n\u003ch2 id=\"data-and-sharing\">Data and sharing\u003c/h2>\n\u003cp>The hosted playground sends source and uploaded images to its rendering\nserver. Comparison additionally sends source to Labelary. Share URLs contain\nthe complete label source; treat them like the original file. Theme and UI\nlanguage preferences are stored locally. For confidential labels, use a\nlocal server or \u003ca href=\"#docs/javascript\">WASM in your own application\u003c/a>.\u003c/p>","headings":[["2","edit-preview-and-learn","Edit, preview and learn"],["2","size-and-resolution","Size and resolution"],["2","png-and-pdf","PNG and PDF"],["2","image-to-printer-code","Image to printer code"],["2","compare-with-labelary","Compare with Labelary"],["2","data-and-sharing","Data and sharing"]],"examples":[],"search":" Playground guide \n The playground combines an editor, label preview and documentation in one\npage. Rendering and validation use the server hosting that page. The docs\nare bundled with the application and need no separate documentation service. \n Use the workspace navigation to move between Playground, API and Documentation.\nOn desktop, label settings sit beside the source editor and preview. On smaller\nscreens, the settings and panels stack vertically. Language and theme controls\nstay in the navigation, and your preferences apply to every view. \n Open  API  to test individual endpoints and inspect requests and responses.\nCopy examples for your own scripts or download the OpenAPI specification.\nThe  API guide  covers file uploads and temporary directory-conversion\njobs. Switching between API, Documentation and Playground preserves each\nview's draft until the page is reloaded. \n Edit, preview and learn \n Choose a sample or open a  .zpl ,  .epl ,  .tspl ,  .cpcl  or  .dpl  file.\nCheck  Format  after loading your own source.  Live preview  updates as\nyou type;  Render  or  Ctrl/Cmd + Enter  renders immediately.\n Format code  changes whitespace without acting as a syntax validator.\nThe editor's syntax status reports parse results separately. \n Open  Documentation  whenever you need a guide. Search across page titles\nand content, follow the section links, or copy a code block.  Try in\nplayground  loads an example with its language, dimensions and resolution.\nNavigation between docs and the editor preserves your work within the page;\nreloading the page does not save an unsaved draft. A  Share  link restores\nsource and render settings. \n Size and resolution \n Width and height describe the physical canvas. Enter millimetres or inches;\nswitching  Unit  preserves the size. Editing either dimension selects\n Custom… . The playground sends both dimensions explicitly, so these\ncontrols override dimensions declared in the label source. \n \n \n \n Setting \n Example \n Effect \n \n \n \n \n Canvas \n 100 × 60 mm \n Space available to draw the label \n \n \n Resolution \n 8 dpmm \n 8 source dots per mm; 800 × 480 pixels at scale 1 \n \n \n Preview zoom \n Fit, 100%, etc. \n Browser display only; no change to downloads \n \n \n PNG scale \n 3×, in vector mode \n 2400 × 1440 pixels; source coordinates still use 8 dpmm \n \n \n \n Common printer classes are 6, 8, 12 and 24 dpmm (approximately 152, 203,\n305 and 610 dpi). Printer marketing often calls the latter two 300 and 600 dpi.\nUse the resolution your label was authored for. Raising dpmm changes the\nphysical meaning of source dots; use PNG scale to enlarge an export instead. \n PNG and PDF \n Raster is the default and PDF embeds the rendered image. Builds with vector\nsupport also offer  Vector PDF / scalable PNG ,  PNG scale  and  All PDF\npages . PNG previews show the first label.  All PDF pages  combines all\nlabels into one vector PDF; the current width/height apply to every page. \n Vector PDF preserves ordinary text as searchable text and shapes as geometry.\nImages and some compositing operations retain local raster content. See\n vector output  for fidelity limits and integration options. \n Image to printer code \n Select  ZPL  or  TSPL , set the resolution, then choose  Image → Code .\nThe image is flattened onto white and converted to black and white at the\nserver's default threshold of 128. \n \n ZPL output loads into the editor and sets the canvas to the image dimensions. \n TSPL output downloads as a binary file. Keep it as bytes; decoding and\n  re-encoding it as UTF-8 can corrupt the bitmap payload. \n \n One image pixel becomes one printer dot. An 800 × 480 image at 8 dpmm is\n100 × 60 mm. This embeds a bitmap; it does not recognize text or reconstruct\neditable barcode commands. The API's  /encode  endpoint also lets you choose\nthe threshold. See  the HTTP guide . \n Compare with Labelary \n For ZPL,  Compare with Labelary  sends the current source to the external\nLabelary service and shows its image, Labelize's image and a pixel difference.\nIt requires PNG scale 1. It is unavailable for EPL, TSPL, CPCL and DPL.\nFont differences can produce visible pixel differences even when a label is\nusable; a low difference score is not a barcode scan guarantee. \n Self-hosted native servers can remove this action with\n LABELIZE_PLAYGROUND_LABELARY_COMPARE=false . An API-only native deployment\ncan set  LABELIZE_PLAYGROUND_ENABLED=false . \n Data and sharing \n The hosted playground sends source and uploaded images to its rendering\nserver. Comparison additionally sends source to Labelary. Share URLs contain\nthe complete label source; treat them like the original file. Theme and UI\nlanguage preferences are stored locally. For confidential labels, use a\nlocal server or  WASM in your own application . "},{"id":"languages","group":"Start here","title":"Languages and examples","file":"LANGUAGES.md","html":"\u003ch1 id=\"languages-and-examples\">Languages and examples\u003c/h1>\n\u003cp>Labelize parses five printer languages into the same renderer. Support means\na documented subset of each language, not complete printer firmware emulation.\nHardware commands such as feed, cut, heat and communications may have no\nvisible effect. A successful preview does not certify a printer's output.\u003c/p>\n\u003ch2 id=\"zpl\">ZPL\u003c/h2>\n\u003cp>Zebra labels usually start with \u003ccode>^XA\u003c/code> and end with \u003ccode>^XZ\u003c/code>. Most positions use\nprinter dots. Start with the annotated \u003ca href=\"#docs/getting-started\">first label\u003c/a>,\nthen use the \u003ca href=\"#docs/zpl\">ZPL command reference\u003c/a> for support\nand parameter details. Set the canvas explicitly: \u003ccode>^LL\u003c/code> is not parsed.\u003c/p>\n\u003ch2 id=\"epl\">EPL\u003c/h2>\n\u003cp>EPL uses line-oriented commands: \u003ccode>N\u003c/code> clears the image buffer and \u003ccode>P1\u003c/code> prints.\nThis example places text at (40, 40) dots and a box around it.\nUse a \u003cstrong>100 × 60 mm\u003c/strong> canvas at \u003cstrong>8 dpmm\u003c/strong>.\u003c/p>\n\u003cdiv class=\"doc-example\">\u003cpre>\u003ccode class=\"language-epl\">N\nA40,40,0,4,1,1,N,\u0026quot;Hello, EPL\u0026quot;\nX30,30,2,420,100\nP1\n\u003c/code>\u003c/pre>\u003cbutton type=\"button\" class=\"doc-try\" data-language=\"epl\" data-width=\"100\" data-height=\"60\" data-dpmm=\"8\">Try in playground\u003c/button>\u003c/div>\n\n\u003cp>Resident font numbers have fixed metrics; they are not ZPL font names.\nBinary \u003ccode>GW\u003c/code> graphics must be uploaded as bytes through the API.\u003c/p>\n\u003ch2 id=\"tspl-tsc\">TSPL / TSC\u003c/h2>\n\u003cp>TSPL mixes physical dimensions (\u003ccode>SIZE\u003c/code>) and dot coordinates (\u003ccode>TEXT\u003c/code>, \u003ccode>BAR\u003c/code>).\nThis example declares 100 × 60 mm. Native APIs can use that declared size;\nthe playground's dimensions override it.\u003c/p>\n\u003cdiv class=\"doc-example\">\u003cpre>\u003ccode class=\"language-tspl\">SIZE 100 mm,60 mm\nCLS\nTEXT 40,40,\u0026quot;3\u0026quot;,0,1,1,\u0026quot;Hello, TSPL\u0026quot;\nBAR 40,90,400,3\nPRINT 1,1\n\u003c/code>\u003c/pre>\u003cbutton type=\"button\" class=\"doc-try\" data-language=\"tspl\" data-width=\"100\" data-height=\"60\" data-dpmm=\"8\">Try in playground\u003c/button>\u003c/div>\n\n\u003cp>\u003ccode>TEXT\u003c/code>, boxes, lines, Code 128/39/EAN-13, QR, DataMatrix, PDF417 and \u003ccode>BITMAP\u003c/code>\nare supported. \u003ccode>AZTEC\u003c/code>, \u003ccode>MPDF417\u003c/code>, \u003ccode>PUTPCX\u003c/code> and \u003ccode>PUTBMP\u003c/code> return explicit\nunsupported-command errors. See \u003ca href=\"#docs/tspl-baselines\">TSPL baselines\u003c/a> for\ncalibration and reference coverage. Binary \u003ccode>BITMAP\u003c/code> data must remain bytes.\u003c/p>\n\u003ch2 id=\"cpcl\">CPCL\u003c/h2>\n\u003cp>CPCL sessions begin with a \u003ccode>!\u003c/code> header and finish with \u003ccode>PRINT\u003c/code> or \u003ccode>END\u003c/code>.\nThe header below declares a 480-dot height at the 203-dpi class; \u003ccode>PAGE-WIDTH\u003c/code>\nsets 800 dots. At 8 dpmm the canvas is \u003cstrong>100 × 60 mm\u003c/strong>.\u003c/p>\n\u003cdiv class=\"doc-example\">\u003cpre>\u003ccode class=\"language-cpcl\">! 0 203 203 480 1\nPAGE-WIDTH 800\nTEXT 4 0 40 40 Hello, CPCL\nLINE 40 110 440 110 3\nFORM\nPRINT\n\u003c/code>\u003c/pre>\u003cbutton type=\"button\" class=\"doc-try\" data-language=\"cpcl\" data-width=\"100\" data-height=\"60\" data-dpmm=\"8\">Try in playground\u003c/button>\u003c/div>\n\n\u003cp>Text, resident fonts, scalable text, multiline fields, several 1D/2D barcodes\nand counted \u003ccode>EG\u003c/code>/\u003ccode>CG\u003c/code> graphics are supported. Stored formats, PCX, font groups\nand some barcode types are unsupported. Reference coverage is described in\n\u003ca href=\"#docs/corpus/cpcl-and-dpl\">the test corpus\u003c/a>.\u003c/p>\n\u003ch2 id=\"dpl\">DPL\u003c/h2>\n\u003cp>DPL formats start with the byte \u003ccode>0x02\u003c/code> (STX) followed by \u003ccode>L\u003c/code> and finish with\n\u003ccode>E\u003c/code>. Coordinates normally use hundredths of an inch from a \u003cstrong>bottom-left\u003c/strong>\norigin; \u003ccode>m\u003c/code> switches to tenths of a millimetre. Text records encode rotation,\nfont, scaling and row/column fields before their data.\u003c/p>\n\u003cp>Use the playground's \u003cstrong>DPL showcase\u003c/strong> sample for a complete runnable format.\nFor integrations, read a \u003ccode>.dpl\u003c/code> file as bytes and send it with\n\u003ccode>Content-Type: application/dpl\u003c/code>. The visible characters \u003ccode>\u0026lt;STX\u0026gt;\u003c/code> are explanatory\nnotation, not a substitute for the actual control byte.\u003c/p>\n\u003cp>Bitmap/smooth fonts, common linear barcodes, QR, DataMatrix, PDF417, Aztec,\nMaxiCode and line/box records are supported. Stored images, polygons, circles\nand several legacy barcodes are unsupported. External DPL comparisons use a\nlayout preview, not a printer-grade renderer; see \u003ca href=\"#docs/corpus/cpcl-and-dpl\">corpus provenance\u003c/a>.\u003c/p>\n\u003ch2 id=\"choose-the-parser-explicitly\">Choose the parser explicitly\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Surface\u003c/th>\n\u003cth>Selection\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Playground\u003c/td>\n\u003ctd>Format selector\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CLI\u003c/td>\n\u003ctd>File extension, or \u003ccode>--format zpl\u003c/code> (also \u003ccode>epl\u003c/code>, \u003ccode>tspl\u003c/code>, \u003ccode>cpcl\u003c/code>, \u003ccode>dpl\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP conversion\u003c/td>\n\u003ctd>\u003ccode>Content-Type: application/zpl\u003c/code> and the equivalent for each language\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP validation/formatting\u003c/td>\n\u003ctd>\u003ccode>?language=zpl\u003c/code> or another supported language\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rust / WASM\u003c/td>\n\u003ctd>Explicit language option; see the platform tutorial\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Prefer explicit selection for files with unusual prefixes and binary payloads.\nDo not switch languages to hide a parse error; consult the support reference\nand reduce the failing label to the command that triggers it.\u003c/p>","headings":[["2","zpl","ZPL"],["2","epl","EPL"],["2","tspl-tsc","TSPL / TSC"],["2","cpcl","CPCL"],["2","dpl","DPL"],["2","choose-the-parser-explicitly","Choose the parser explicitly"]],"examples":[{"language":"epl","width":100.0,"height":60.0,"dpmm":8,"source":"N\nA40,40,0,4,1,1,N,\"Hello, EPL\"\nX30,30,2,420,100\nP1\n"},{"language":"tspl","width":100.0,"height":60.0,"dpmm":8,"source":"SIZE 100 mm,60 mm\nCLS\nTEXT 40,40,\"3\",0,1,1,\"Hello, TSPL\"\nBAR 40,90,400,3\nPRINT 1,1\n"},{"language":"cpcl","width":100.0,"height":60.0,"dpmm":8,"source":"! 0 203 203 480 1\nPAGE-WIDTH 800\nTEXT 4 0 40 40 Hello, CPCL\nLINE 40 110 440 110 3\nFORM\nPRINT\n"}],"search":" Languages and examples \n Labelize parses five printer languages into the same renderer. Support means\na documented subset of each language, not complete printer firmware emulation.\nHardware commands such as feed, cut, heat and communications may have no\nvisible effect. A successful preview does not certify a printer's output. \n ZPL \n Zebra labels usually start with  ^XA  and end with  ^XZ . Most positions use\nprinter dots. Start with the annotated  first label ,\nthen use the  ZPL command reference  for support\nand parameter details. Set the canvas explicitly:  ^LL  is not parsed. \n EPL \n EPL uses line-oriented commands:  N  clears the image buffer and  P1  prints.\nThis example places text at (40, 40) dots and a box around it.\nUse a  100 × 60 mm  canvas at  8 dpmm . \n   N\nA40,40,0,4,1,1,N,\"Hello, EPL\"\nX30,30,2,420,100\nP1\n   Try in playground  \n\n Resident font numbers have fixed metrics; they are not ZPL font names.\nBinary  GW  graphics must be uploaded as bytes through the API. \n TSPL / TSC \n TSPL mixes physical dimensions ( SIZE ) and dot coordinates ( TEXT ,  BAR ).\nThis example declares 100 × 60 mm. Native APIs can use that declared size;\nthe playground's dimensions override it. \n   SIZE 100 mm,60 mm\nCLS\nTEXT 40,40,\"3\",0,1,1,\"Hello, TSPL\"\nBAR 40,90,400,3\nPRINT 1,1\n   Try in playground  \n\n  TEXT , boxes, lines, Code 128/39/EAN-13, QR, DataMatrix, PDF417 and  BITMAP \nare supported.  AZTEC ,  MPDF417 ,  PUTPCX  and  PUTBMP  return explicit\nunsupported-command errors. See  TSPL baselines  for\ncalibration and reference coverage. Binary  BITMAP  data must remain bytes. \n CPCL \n CPCL sessions begin with a  !  header and finish with  PRINT  or  END .\nThe header below declares a 480-dot height at the 203-dpi class;  PAGE-WIDTH \nsets 800 dots. At 8 dpmm the canvas is  100 × 60 mm . \n   ! 0 203 203 480 1\nPAGE-WIDTH 800\nTEXT 4 0 40 40 Hello, CPCL\nLINE 40 110 440 110 3\nFORM\nPRINT\n   Try in playground  \n\n Text, resident fonts, scalable text, multiline fields, several 1D/2D barcodes\nand counted  EG / CG  graphics are supported. Stored formats, PCX, font groups\nand some barcode types are unsupported. Reference coverage is described in\n the test corpus . \n DPL \n DPL formats start with the byte  0x02  (STX) followed by  L  and finish with\n E . Coordinates normally use hundredths of an inch from a  bottom-left \norigin;  m  switches to tenths of a millimetre. Text records encode rotation,\nfont, scaling and row/column fields before their data. \n Use the playground's  DPL showcase  sample for a complete runnable format.\nFor integrations, read a  .dpl  file as bytes and send it with\n Content-Type: application/dpl . The visible characters  \u003cSTX>  are explanatory\nnotation, not a substitute for the actual control byte. \n Bitmap/smooth fonts, common linear barcodes, QR, DataMatrix, PDF417, Aztec,\nMaxiCode and line/box records are supported. Stored images, polygons, circles\nand several legacy barcodes are unsupported. External DPL comparisons use a\nlayout preview, not a printer-grade renderer; see  corpus provenance . \n Choose the parser explicitly \n \n \n \n Surface \n Selection \n \n \n \n \n Playground \n Format selector \n \n \n CLI \n File extension, or  --format zpl  (also  epl ,  tspl ,  cpcl ,  dpl ) \n \n \n HTTP conversion \n  Content-Type: application/zpl  and the equivalent for each language \n \n \n HTTP validation/formatting \n  ?language=zpl  or another supported language \n \n \n Rust / WASM \n Explicit language option; see the platform tutorial \n \n \n \n Prefer explicit selection for files with unusual prefixes and binary payloads.\nDo not switch languages to hide a parse error; consult the support reference\nand reduce the failing label to the command that triggers it. "},{"id":"troubleshooting","group":"Start here","title":"Troubleshooting","file":"TROUBLESHOOTING.md","html":"\u003ch1 id=\"troubleshooting\">Troubleshooting\u003c/h1>\n\u003cp>Start with the same source bytes, language, physical size and resolution on\nboth systems. Change one setting at a time. Keep a copy of the original input.\u003c/p>\n\u003ch2 id=\"empty-or-cropped-preview\">Empty or cropped preview\u003c/h2>\n\u003col>\n\u003cli>Confirm the format and complete label boundaries (\u003ccode>^XA…^XZ\u003c/code>, \u003ccode>N…P1\u003c/code>,\n   \u003ccode>CLS…PRINT\u003c/code>, a CPCL session, or a DPL format).\u003c/li>\n\u003cli>Check the syntax status. A parse result with zero labels cannot render.\u003c/li>\n\u003cli>Set width and height explicitly. At 8 dpmm, a field at x=800 is already\n   beyond a 100 mm canvas. ZPL \u003ccode>^LL\u003c/code> does not set height in Labelize.\u003c/li>\n\u003cli>Check the coordinate origin. DPL rows grow upward from the bottom; most\n   other language examples position from the top-left.\u003c/li>\n\u003c/ol>\n\u003cp>A failed live render keeps the last successful preview. Read the error banner\nbefore assuming that the visible image belongs to your latest edit.\u003c/p>\n\u003ch2 id=\"the-label-prints-at-the-wrong-size\">The label prints at the wrong size\u003c/h2>\n\u003cp>Use actual-size printing with page fitting disabled. Check the document's\nphysical dimensions, printer resolution and stock dimensions. Preview zoom\nchanges only the screen display. In vector mode, PNG scale changes exported\npixel density without changing source dot coordinates.\u003c/p>\n\u003ch2 id=\"text-differs-or-characters-are-missing\">Text differs or characters are missing\u003c/h2>\n\u003cp>Labelize uses embedded substitute fonts and calibrated resident-font metrics.\nIt does not automatically load fonts installed on your printer. Compare font\nselection, encoding and rotation first. A character needs both the correct\ninput encoding and a glyph in the selected font. Image-to-code preserves\nappearance as a bitmap when editable text is unnecessary.\u003c/p>\n\u003ch2 id=\"barcode-looks-different-or-will-not-scan\">Barcode looks different or will not scan\u003c/h2>\n\u003cp>Check payload, symbology, module width and available whitespace. Avoid text\nor boxes overlapping modules, and leave quiet space around the symbol.\nDefault preview behavior does not add a protective quiet-zone canvas for you.\nPrint at the intended resolution and test with the scanner you will use.\nNeither successful parsing nor a low visual diff proves scan reliability.\u003c/p>\n\u003ch2 id=\"binary-graphics-are-corrupted\">Binary graphics are corrupted\u003c/h2>\n\u003cp>Use \u003ccode>--data-binary @file\u003c/code> with curl and byte arrays in SDKs. Do not pass TSPL\n\u003ccode>BITMAP\u003c/code>, EPL \u003ccode>GW\u003c/code>, CPCL compressed graphics or image-to-TSPL output through a\nUTF-8 string conversion. Keep control bytes and counted payload lengths intact.\u003c/p>\n\u003ch2 id=\"api-returns-an-error\">API returns an error\u003c/h2>\n\u003cp>Read the response body before treating it as an image. Use curl's\n\u003ccode>--fail-with-body\u003c/code> or your HTTP client's status check. For \u003ccode>/validate\u003c/code>, HTTP\n200 means a report was produced: inspect \u003ccode>ok\u003c/code> and \u003ccode>error\u003c/code> inside the JSON.\nUnsupported output settings (such as \u003ccode>pages=all\u003c/code> with raster output) are input\nerrors. See the \u003ca href=\"#docs/http\">HTTP contract\u003c/a>.\u003c/p>\n\u003ch2 id=\"vector-controls-are-absent\">Vector controls are absent\u003c/h2>\n\u003cp>The running build lacks the \u003ccode>vector\u003c/code> feature. Build the native service with\n\u003ccode>cargo build --features serve,vector\u003c/code> and run that binary. The presence of\nvector documentation does not mean every deployed instance enables it.\u003c/p>\n\u003ch2 id=\"report-a-reproducible-issue\">Report a reproducible issue\u003c/h2>\n\u003cp>Include the Labelize version or commit, execution surface, a minimal source\nfile, language, dimensions, dpmm and output mode. Attach the actual output\nand describe the expected output with its source (printer model, reference\nservice or specification). Remove customer addresses and other private data.\nSee \u003ca href=\"#docs/testing\">testing\u003c/a> for fixture and reference-image conventions.\u003c/p>","headings":[["2","empty-or-cropped-preview","Empty or cropped preview"],["2","the-label-prints-at-the-wrong-size","The label prints at the wrong size"],["2","text-differs-or-characters-are-missing","Text differs or characters are missing"],["2","barcode-looks-different-or-will-not-scan","Barcode looks different or will not scan"],["2","binary-graphics-are-corrupted","Binary graphics are corrupted"],["2","api-returns-an-error","API returns an error"],["2","vector-controls-are-absent","Vector controls are absent"],["2","report-a-reproducible-issue","Report a reproducible issue"]],"examples":[],"search":" Troubleshooting \n Start with the same source bytes, language, physical size and resolution on\nboth systems. Change one setting at a time. Keep a copy of the original input. \n Empty or cropped preview \n \n Confirm the format and complete label boundaries ( ^XA…^XZ ,  N…P1 ,\n    CLS…PRINT , a CPCL session, or a DPL format). \n Check the syntax status. A parse result with zero labels cannot render. \n Set width and height explicitly. At 8 dpmm, a field at x=800 is already\n   beyond a 100 mm canvas. ZPL  ^LL  does not set height in Labelize. \n Check the coordinate origin. DPL rows grow upward from the bottom; most\n   other language examples position from the top-left. \n \n A failed live render keeps the last successful preview. Read the error banner\nbefore assuming that the visible image belongs to your latest edit. \n The label prints at the wrong size \n Use actual-size printing with page fitting disabled. Check the document's\nphysical dimensions, printer resolution and stock dimensions. Preview zoom\nchanges only the screen display. In vector mode, PNG scale changes exported\npixel density without changing source dot coordinates. \n Text differs or characters are missing \n Labelize uses embedded substitute fonts and calibrated resident-font metrics.\nIt does not automatically load fonts installed on your printer. Compare font\nselection, encoding and rotation first. A character needs both the correct\ninput encoding and a glyph in the selected font. Image-to-code preserves\nappearance as a bitmap when editable text is unnecessary. \n Barcode looks different or will not scan \n Check payload, symbology, module width and available whitespace. Avoid text\nor boxes overlapping modules, and leave quiet space around the symbol.\nDefault preview behavior does not add a protective quiet-zone canvas for you.\nPrint at the intended resolution and test with the scanner you will use.\nNeither successful parsing nor a low visual diff proves scan reliability. \n Binary graphics are corrupted \n Use  --data-binary @file  with curl and byte arrays in SDKs. Do not pass TSPL\n BITMAP , EPL  GW , CPCL compressed graphics or image-to-TSPL output through a\nUTF-8 string conversion. Keep control bytes and counted payload lengths intact. \n API returns an error \n Read the response body before treating it as an image. Use curl's\n --fail-with-body  or your HTTP client's status check. For  /validate , HTTP\n200 means a report was produced: inspect  ok  and  error  inside the JSON.\nUnsupported output settings (such as  pages=all  with raster output) are input\nerrors. See the  HTTP contract . \n Vector controls are absent \n The running build lacks the  vector  feature. Build the native service with\n cargo build --features serve,vector  and run that binary. The presence of\nvector documentation does not mean every deployed instance enables it. \n Report a reproducible issue \n Include the Labelize version or commit, execution surface, a minimal source\nfile, language, dimensions, dpmm and output mode. Attach the actual output\nand describe the expected output with its source (printer model, reference\nservice or specification). Remove customer addresses and other private data.\nSee  testing  for fixture and reference-image conventions. "},{"id":"http","group":"Integrate","title":"HTTP service","file":"tutorials/http-service.md","html":"\u003ch1 id=\"http-service\">HTTP service\u003c/h1>\n\u003cp>Run a local rendering service with the playground and documentation at \u003ccode>/\u003c/code>.\nThe same endpoints are available in the Cloudflare Worker, with the default\nhandling differences described below. For container setup, see \u003ca href=\"#docs/docker\">Docker\u003c/a>.\u003c/p>\n\u003ch2 id=\"start-locally\">Start locally\u003c/h2>\n\u003cp>From a checkout with a Rust toolchain:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">cargo run --features serve,vector -- serve --host 127.0.0.1 --port 8080\n\u003c/code>\u003c/pre>\n\u003cp>Open \u003ca href=\"http://localhost:8080/\">http://localhost:8080/\u003c/a>. Check the service from another terminal:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body http://localhost:8080/health\n# {\u0026quot;status\u0026quot;:\u0026quot;ok\u0026quot;}\n\u003c/code>\u003c/pre>\n\u003cp>You can also use the public playground's origin in place of localhost.\nThat sends your label data to the public service; use a local deployment for\nprivate data. Examples below use explicit dimensions and language for\nconsistent behavior across native and Worker deployments.\u003c/p>\n\u003cp>Use the playground's \u003cstrong>API\u003c/strong> tab to test these endpoints on the current\norigin. The \u003ca href=\"#docs/api\">public API guide\u003c/a> includes a hosted quickstart,\nOpenAPI download, CORS details and runnable Python/Node.js directory jobs.\nBoth deployments expose \u003ccode>GET /openapi.json\u003c/code>, including in native API-only mode.\u003c/p>\n\u003ch2 id=\"convert-label-bytes\">Convert label bytes\u003c/h2>\n\u003cp>\u003ccode>POST /convert\u003c/code> accepts the raw source as its request body. Use the matching\ncontent type: \u003ccode>application/zpl\u003c/code>, \u003ccode>application/epl\u003c/code>, \u003ccode>application/tspl\u003c/code>,\n\u003ccode>application/cpcl\u003c/code> or \u003ccode>application/dpl\u003c/code>. Do not wrap the source in JSON.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body 'http://localhost:8080/convert?width=100\u0026amp;height=60\u0026amp;dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello, HTTP^FS^XZ' \\\n  -o label.png\n\u003c/code>\u003c/pre>\n\u003cp>Expect an \u003cstrong>800 × 480 PNG\u003c/strong>. For a file, replace the inline data with\n\u003ccode>--data-binary @label.zpl\u003c/code>. This also preserves control bytes and binary\ngraphics in the other languages.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>width\u003c/code>, \u003ccode>height\u003c/code>\u003c/td>\n\u003ctd>See below\u003c/td>\n\u003ctd>Positive physical dimensions in mm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>8\u003c/code>\u003c/td>\n\u003ctd>Positive integer source dots per mm; typical choices 6, 8, 12, 24\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>output\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>png\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>png\u003c/code> or \u003ccode>pdf\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>antialias\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code> preserves grayscale edges in PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mode\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>raster\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>vector\u003c/code> requires a build with vector support\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>scale\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>Positive PNG scale; values other than 1 require vector PNG\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pages\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>first\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>all\u003c/code> requires vector PDF\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Native conversion resolves each dimension from the explicit query value,\nthen a supported dimension in the label, then \u003cstrong>102 × 152 mm\u003c/strong>. Without a\nlanguage content type it detects the language from the source.\u003c/p>\n\u003cp>Worker raster conversion defaults omitted dimensions to \u003cstrong>102 × 152 mm\u003c/strong>\nand an unspecified language to \u003cstrong>ZPL\u003c/strong>. Worker vector conversion uses declared\ndimensions and source detection before falling back. Send all three values\nexplicitly to avoid relying on these differences.\u003c/p>\n\u003ch2 id=\"pdf-and-scaled-png\">PDF and scaled PNG\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\"># Raster PDF, with an explicit physical page size\ncurl --fail-with-body 'http://localhost:8080/convert?width=100\u0026amp;height=60\u0026amp;output=pdf' \\\n  -H 'Content-Type: application/zpl' --data-binary @label.zpl -o label.pdf\n\n# Searchable hybrid PDF; all labels, with their declared sizes where available\ncurl --fail-with-body 'http://localhost:8080/convert?mode=vector\u0026amp;output=pdf\u0026amp;pages=all' \\\n  -H 'Content-Type: application/tspl' --data-binary @batch.tspl -o batch.pdf\n\n# 3 output pixels per source dot; source resolution remains 8 dpmm\ncurl --fail-with-body 'http://localhost:8080/convert?width=100\u0026amp;height=60\u0026amp;mode=vector\u0026amp;scale=3' \\\n  -H 'Content-Type: application/zpl' --data-binary @label.zpl -o large.png\n\u003c/code>\u003c/pre>\n\u003cp>The default returns the first label. Use vector PDF with \u003ccode>pages=all\u003c/code> for a\nmultipage document, or split input labels into separate requests. See\n\u003ca href=\"#docs/vector\">vector output\u003c/a> for bitmap and compositing limits.\u003c/p>\n\u003ch2 id=\"validate-and-format\">Validate and format\u003c/h2>\n\u003cp>\u003ccode>POST /validate?language=zpl\u0026amp;dpmm=8\u003c/code> returns a JSON report without rendering.\nLanguage defaults to detection; \u003ccode>dpmm\u003c/code> defaults to 8.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body 'http://localhost:8080/validate?language=zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello^FS^XZ'\n# {\u0026quot;language\u0026quot;:\u0026quot;zpl\u0026quot;,\u0026quot;ok\u0026quot;:true,\u0026quot;labels\u0026quot;:1}\n\u003c/code>\u003c/pre>\n\u003cp>Inspect \u003cstrong>\u003ccode>ok\u003c/code>\u003c/strong>, even when HTTP status is 200. Parse failures appear in the\nreport's \u003ccode>error\u003c/code> field. An unknown explicit language returns HTTP 400.\u003c/p>\n\u003cp>\u003ccode>POST /format?language=zpl\u003c/code> returns formatted source as \u003ccode>text/plain\u003c/code>.\nFormatting is not validation: unknown commands can be reflowed without\nbeing supported by the renderer. Keep binary payloads as bytes.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body 'http://localhost:8080/format?language=zpl' \\\n  --data-binary @label.zpl -o formatted.zpl\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"image-to-code\">Image to code\u003c/h2>\n\u003cp>\u003ccode>POST /encode\u003c/code> takes encoded image bytes (for example PNG or JPEG) and emits\nZPL or TSPL. It embeds a monochrome bitmap, without OCR or barcode recognition.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body 'http://localhost:8080/encode?language=zpl\u0026amp;dpmm=8\u0026amp;threshold=128' \\\n  -H 'Content-Type: application/octet-stream' --data-binary @logo.png -o logo.zpl\n\ncurl --fail-with-body 'http://localhost:8080/encode?language=tspl\u0026amp;dpmm=8' \\\n  -H 'Content-Type: application/octet-stream' --data-binary @logo.png -o logo.tspl\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parameter\u003c/th>\n\u003cth>Default\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>language\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>zpl\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>zpl\u003c/code> (text/plain) or \u003ccode>tspl\u003c/code> (application/octet-stream)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dpmm\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>8\u003c/code>\u003c/td>\n\u003ctd>Positive integer; one source pixel becomes one printer dot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>threshold\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>128\u003c/code>\u003c/td>\n\u003ctd>Integer 0–255; pixels darker than this become ink\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>An 800 × 480 image at 8 dpmm occupies 100 × 60 mm. Generated ZPL does not\nset the canvas: supply those dimensions when rendering it. TSPL includes\n\u003ccode>SIZE\u003c/code> and binary \u003ccode>BITMAP\u003c/code> data. Never decode that output as UTF-8.\u003c/p>\n\u003cp>Images are limited to 16 Mi pixels, 32000 dots per dimension and 128 MiB\nof decoded data. Hosting and native request-body limits may reject an\nupload before image decoding runs.\u003c/p>\n\u003ch2 id=\"handle-responses\">Handle responses\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Endpoint\u003c/th>\n\u003cth>Successful response\u003c/th>\n\u003cth>Failure handling\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/convert\u003c/code>\u003c/td>\n\u003ctd>200, image/png or application/pdf\u003c/td>\n\u003ctd>Invalid options/parse errors: 400; render/encode failures: 500\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/validate\u003c/code>\u003c/td>\n\u003ctd>200, application/json\u003c/td>\n\u003ctd>Check \u003ccode>ok\u003c/code>; invalid language/query: 400\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/format\u003c/code>\u003c/td>\n\u003ctd>200, text/plain\u003c/td>\n\u003ctd>Invalid explicit language/query: 400\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/encode\u003c/code>\u003c/td>\n\u003ctd>200, text/plain or application/octet-stream\u003c/td>\n\u003ctd>Invalid image/options: 400; internal failures may return 500\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/health\u003c/code>\u003c/td>\n\u003ctd>200, application/json\u003c/td>\n\u003ctd>Connection failures indicate an unavailable service\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Error bodies can be plain text. Reject non-success responses before saving\noutput as an image. Native request extraction can also reject malformed\nqueries or oversized bodies before the handler runs. Production deployments\nshould define their own authentication, request limits and network access.\u003c/p>\n\u003ch2 id=\"integrate-with-python\">Integrate with Python\u003c/h2>\n\u003cp>Install \u003ccode>requests\u003c/code> in your application's environment, then keep files as bytes:\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">from pathlib import Path\nimport requests\n\nresponse = requests.post(\n    \u0026quot;http://localhost:8080/convert\u0026quot;,\n    data=Path(\u0026quot;label.zpl\u0026quot;).read_bytes(),\n    headers={\u0026quot;Content-Type\u0026quot;: \u0026quot;application/zpl\u0026quot;},\n    params={\u0026quot;width\u0026quot;: 100, \u0026quot;height\u0026quot;: 60, \u0026quot;dpmm\u0026quot;: 8},\n    timeout=30,\n)\nresponse.raise_for_status()\nPath(\u0026quot;label.png\u0026quot;).write_bytes(response.content)\n\u003c/code>\u003c/pre>\n\u003cp>See \u003ca href=\"#docs/usage\">Usage\u003c/a> for CLI and Rust options, or\n\u003ca href=\"#docs/javascript\">JavaScript/WASM\u003c/a> to render within your own application.\u003c/p>","headings":[["2","start-locally","Start locally"],["2","convert-label-bytes","Convert label bytes"],["2","pdf-and-scaled-png","PDF and scaled PNG"],["2","validate-and-format","Validate and format"],["2","image-to-code","Image to code"],["2","handle-responses","Handle responses"],["2","integrate-with-python","Integrate with Python"]],"examples":[],"search":" HTTP service \n Run a local rendering service with the playground and documentation at  / .\nThe same endpoints are available in the Cloudflare Worker, with the default\nhandling differences described below. For container setup, see  Docker . \n Start locally \n From a checkout with a Rust toolchain: \n  cargo run --features serve,vector -- serve --host 127.0.0.1 --port 8080\n  \n Open  http://localhost:8080/ . Check the service from another terminal: \n  curl --fail-with-body http://localhost:8080/health\n# {\"status\":\"ok\"}\n  \n You can also use the public playground's origin in place of localhost.\nThat sends your label data to the public service; use a local deployment for\nprivate data. Examples below use explicit dimensions and language for\nconsistent behavior across native and Worker deployments. \n Use the playground's  API  tab to test these endpoints on the current\norigin. The  public API guide  includes a hosted quickstart,\nOpenAPI download, CORS details and runnable Python/Node.js directory jobs.\nBoth deployments expose  GET /openapi.json , including in native API-only mode. \n Convert label bytes \n  POST /convert  accepts the raw source as its request body. Use the matching\ncontent type:  application/zpl ,  application/epl ,  application/tspl ,\n application/cpcl  or  application/dpl . Do not wrap the source in JSON. \n  curl --fail-with-body 'http://localhost:8080/convert?width=100\u0026height=60\u0026dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello, HTTP^FS^XZ' \\\n  -o label.png\n  \n Expect an  800 × 480 PNG . For a file, replace the inline data with\n --data-binary @label.zpl . This also preserves control bytes and binary\ngraphics in the other languages. \n \n \n \n Parameter \n Default \n Meaning \n \n \n \n \n  width ,  height  \n See below \n Positive physical dimensions in mm \n \n \n  dpmm  \n  8  \n Positive integer source dots per mm; typical choices 6, 8, 12, 24 \n \n \n  output  \n  png  \n  png  or  pdf  \n \n \n  antialias  \n  false  \n  true  preserves grayscale edges in PNG \n \n \n  mode  \n  raster  \n  vector  requires a build with vector support \n \n \n  scale  \n  1  \n Positive PNG scale; values other than 1 require vector PNG \n \n \n  pages  \n  first  \n  all  requires vector PDF \n \n \n \n Native conversion resolves each dimension from the explicit query value,\nthen a supported dimension in the label, then  102 × 152 mm . Without a\nlanguage content type it detects the language from the source. \n Worker raster conversion defaults omitted dimensions to  102 × 152 mm \nand an unspecified language to  ZPL . Worker vector conversion uses declared\ndimensions and source detection before falling back. Send all three values\nexplicitly to avoid relying on these differences. \n PDF and scaled PNG \n  # Raster PDF, with an explicit physical page size\ncurl --fail-with-body 'http://localhost:8080/convert?width=100\u0026height=60\u0026output=pdf' \\\n  -H 'Content-Type: application/zpl' --data-binary @label.zpl -o label.pdf\n\n# Searchable hybrid PDF; all labels, with their declared sizes where available\ncurl --fail-with-body 'http://localhost:8080/convert?mode=vector\u0026output=pdf\u0026pages=all' \\\n  -H 'Content-Type: application/tspl' --data-binary @batch.tspl -o batch.pdf\n\n# 3 output pixels per source dot; source resolution remains 8 dpmm\ncurl --fail-with-body 'http://localhost:8080/convert?width=100\u0026height=60\u0026mode=vector\u0026scale=3' \\\n  -H 'Content-Type: application/zpl' --data-binary @label.zpl -o large.png\n  \n The default returns the first label. Use vector PDF with  pages=all  for a\nmultipage document, or split input labels into separate requests. See\n vector output  for bitmap and compositing limits. \n Validate and format \n  POST /validate?language=zpl\u0026dpmm=8  returns a JSON report without rendering.\nLanguage defaults to detection;  dpmm  defaults to 8. \n  curl --fail-with-body 'http://localhost:8080/validate?language=zpl' \\\n  --data-binary '^XA^FO40,40^A0N,40,30^FDHello^FS^XZ'\n# {\"language\":\"zpl\",\"ok\":true,\"labels\":1}\n  \n Inspect   ok  , even when HTTP status is 200. Parse failures appear in the\nreport's  error  field. An unknown explicit language returns HTTP 400. \n  POST /format?language=zpl  returns formatted source as  text/plain .\nFormatting is not validation: unknown commands can be reflowed without\nbeing supported by the renderer. Keep binary payloads as bytes. \n  curl --fail-with-body 'http://localhost:8080/format?language=zpl' \\\n  --data-binary @label.zpl -o formatted.zpl\n  \n Image to code \n  POST /encode  takes encoded image bytes (for example PNG or JPEG) and emits\nZPL or TSPL. It embeds a monochrome bitmap, without OCR or barcode recognition. \n  curl --fail-with-body 'http://localhost:8080/encode?language=zpl\u0026dpmm=8\u0026threshold=128' \\\n  -H 'Content-Type: application/octet-stream' --data-binary @logo.png -o logo.zpl\n\ncurl --fail-with-body 'http://localhost:8080/encode?language=tspl\u0026dpmm=8' \\\n  -H 'Content-Type: application/octet-stream' --data-binary @logo.png -o logo.tspl\n  \n \n \n \n Parameter \n Default \n Meaning \n \n \n \n \n  language  \n  zpl  \n  zpl  (text/plain) or  tspl  (application/octet-stream) \n \n \n  dpmm  \n  8  \n Positive integer; one source pixel becomes one printer dot \n \n \n  threshold  \n  128  \n Integer 0–255; pixels darker than this become ink \n \n \n \n An 800 × 480 image at 8 dpmm occupies 100 × 60 mm. Generated ZPL does not\nset the canvas: supply those dimensions when rendering it. TSPL includes\n SIZE  and binary  BITMAP  data. Never decode that output as UTF-8. \n Images are limited to 16 Mi pixels, 32000 dots per dimension and 128 MiB\nof decoded data. Hosting and native request-body limits may reject an\nupload before image decoding runs. \n Handle responses \n \n \n \n Endpoint \n Successful response \n Failure handling \n \n \n \n \n  /convert  \n 200, image/png or application/pdf \n Invalid options/parse errors: 400; render/encode failures: 500 \n \n \n  /validate  \n 200, application/json \n Check  ok ; invalid language/query: 400 \n \n \n  /format  \n 200, text/plain \n Invalid explicit language/query: 400 \n \n \n  /encode  \n 200, text/plain or application/octet-stream \n Invalid image/options: 400; internal failures may return 500 \n \n \n  /health  \n 200, application/json \n Connection failures indicate an unavailable service \n \n \n \n Error bodies can be plain text. Reject non-success responses before saving\noutput as an image. Native request extraction can also reject malformed\nqueries or oversized bodies before the handler runs. Production deployments\nshould define their own authentication, request limits and network access. \n Integrate with Python \n Install  requests  in your application's environment, then keep files as bytes: \n  from pathlib import Path\nimport requests\n\nresponse = requests.post(\n    \"http://localhost:8080/convert\",\n    data=Path(\"label.zpl\").read_bytes(),\n    headers={\"Content-Type\": \"application/zpl\"},\n    params={\"width\": 100, \"height\": 60, \"dpmm\": 8},\n    timeout=30,\n)\nresponse.raise_for_status()\nPath(\"label.png\").write_bytes(response.content)\n  \n See  Usage  for CLI and Rust options, or\n JavaScript/WASM  to render within your own application. "},{"id":"api","group":"Integrate","title":"Public HTTP API","file":"API.md","html":"\u003ch1 id=\"public-http-api\">Public HTTP API\u003c/h1>\n\u003cp>Use the \u003ca href=\"#api\">API console\u003c/a> to test requests on the server hosting the\nplayground, or call the public service at\n\u003ca href=\"https://labelize.764629910.workers.dev\">https://labelize.764629910.workers.dev\u003c/a> from your own application.\nNo signup or API key is required. Each request returns its result directly.\u003c/p>\n\u003ch2 id=\"test-and-inspect-a-request\">Test and inspect a request\u003c/h2>\n\u003cp>Open \u003cstrong>API\u003c/strong> beside Playground and Documentation. Its default source,\nlanguage, dimensions, resolution and render settings match the playground,\nincluding settings restored from a shared link. Untouched requests follow\nthe playground when you open the API tab. Once you edit an API request, its\ndraft is preserved instead. \u003cstrong>Use playground source\u003c/strong> copies the editor's\ncurrent source and settings again without changing the editor or your\nchosen API output format. Select an endpoint, adjust its parameters, and\nenter source text or choose a file to customize the request.\u003c/p>\n\u003cp>\u003cstrong>Send request\u003c/strong> shows the URL, HTTP status, elapsed time, size and response\nheaders. PNG and PDF responses have inline previews; JSON and text are\nreadable inline. The PDF preview uses your browser's PDF viewer, with its\npage navigation and zoom controls. \u003cstrong>Open PDF in new tab\u003c/strong> gives the viewer\nmore space and also works when embedded viewing is unavailable. Downloads\npreserve the original PDF and binary bytes. Binary printer data is shown as\nhexadecimal. \u003cstrong>Cancel\u003c/strong> stops waiting for the response; a server conversion\nthat has already started may still finish.\u003c/p>\n\u003cp>Switching between API, Documentation and Playground preserves drafts within\nthe page. Reloading clears unsaved drafts and selected files. Request bodies\nare never put into API navigation links.\u003c/p>\n\u003cp>The cURL, JavaScript and Python examples follow the current request. File\nexamples read the chosen filename from the script's working directory.\nJavaScript examples use Node.js 20+; Python examples use only the standard\nlibrary. Copying an example does not send a request.\u003c/p>\n\u003ch2 id=\"endpoints-and-openapi\">Endpoints and OpenAPI\u003c/h2>\n\u003cp>Download the \u003ca href=\"/openapi.json\">OpenAPI 3.0.3 specification\u003c/a>, also available from\nthe console's \u003cstrong>OpenAPI JSON\u003c/strong> link. Import it into an API client for testing.\nNative and Worker deployments serve the same specification, with relative\nserver URLs that use the hosting origin.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Method and path\u003c/th>\n\u003cth>Request body\u003c/th>\n\u003cth>Response\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /health\u003c/code>\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>JSON \u003ccode>{\"status\":\"ok\"}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /convert\u003c/code>\u003c/td>\n\u003ctd>Raw ZPL, EPL, TSPL, CPCL or DPL bytes\u003c/td>\n\u003ctd>PNG or PDF bytes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /validate\u003c/code>\u003c/td>\n\u003ctd>Raw label bytes\u003c/td>\n\u003ctd>JSON report; check \u003cstrong>\u003ccode>ok\u003c/code>\u003c/strong> even with HTTP 200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /format\u003c/code>\u003c/td>\n\u003ctd>Raw label bytes\u003c/td>\n\u003ctd>Formatted source bytes; binary graphics are preserved\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /encode\u003c/code>\u003c/td>\n\u003ctd>Encoded image bytes\u003c/td>\n\u003ctd>ZPL text or binary TSPL bytes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Send raw bytes, without JSON or multipart wrapping. \u003ccode>/convert\u003c/code> selects the\nparser using \u003ccode>Content-Type: application/zpl\u003c/code> (or \u003ccode>epl\u003c/code>, \u003ccode>tspl\u003c/code>, \u003ccode>cpcl\u003c/code>, \u003ccode>dpl\u003c/code>).\n\u003ccode>/validate\u003c/code> and \u003ccode>/format\u003c/code> use \u003ccode>?language=…\u003c/code> or detect the source, independently\nof Content-Type. \u003ccode>/encode?language=zpl|tspl\u003c/code> selects the output language.\u003c/p>\n\u003cp>Errors may be plain text or JSON. Check the HTTP status before saving output;\nfor validation, also reject reports with \u003ccode>ok: false\u003c/code>. Keep file content and\nTSPL output as bytes throughout. See the \u003ca href=\"#docs/http\">HTTP service guide\u003c/a>\nfor all parameters, defaults, image limits and vector/PDF options.\u003c/p>\n\u003ch2 id=\"convert-a-file-from-a-terminal\">Convert a file from a terminal\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">curl --fail-with-body --max-time 30 \\\n  'https://labelize.764629910.workers.dev/convert?width=100\u0026amp;height=60\u0026amp;dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary @label.zpl -o label.png\n\u003c/code>\u003c/pre>\n\u003cp>This returns an 800 × 480 PNG. Use \u003ccode>output=pdf\u003c/code> and save as \u003ccode>label.pdf\u003c/code> for\nraster PDF. Explicit language, dimensions and dpmm avoid relying on different\ndefaults between Worker raster, Worker vector and native conversion.\u003c/p>\n\u003cp>The public Worker supports browser calls from other origins using CORS,\nincluding preflight requests with Content-Type. No cookies or credentials\nare needed. This does not configure CORS on a self-hosted native deployment.\u003c/p>\n\u003ch2 id=\"run-a-temporary-directory-conversion\">Run a temporary directory conversion\u003c/h2>\n\u003cp>Use the runnable \u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/examples/http/convert-directory.py\">Python example\u003c/a> or\n\u003ca href=\"https://github.com/GOODBOY008/labelize/blob/main/examples/http/convert-directory.mjs\">Node.js example\u003c/a> from a checkout:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 examples/http/convert-directory.py ./labels ./converted \\\n  --width 100 --height 60 --dpmm 8\n\nnode examples/http/convert-directory.mjs ./labels ./converted \\\n  --width 100 --height 60 --dpmm 8 --format pdf\n\u003c/code>\u003c/pre>\n\u003cp>Both scripts scan the input directory without recursion, choose the language\nfrom each file's extension, and process one request at a time. They preserve\ninput bytes and write successful responses as \u003ccode>label.zpl.png\u003c/code> or\n\u003ccode>label.zpl.pdf\u003c/code>, retaining the source extension to avoid filename collisions.\nExisting output files with those names are overwritten after successful\nresponses. Failed requests are reported individually; the scripts continue\nthrough the remaining files and exit nonzero if any fail.\u003c/p>\n\u003cp>Use \u003ccode>--base-url\u003c/code> or \u003ccode>LABELIZE_BASE_URL\u003c/code> to choose another deployment:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 examples/http/convert-directory.py ./labels ./converted \\\n  --base-url http://127.0.0.1:8080 --timeout 60\n\nnode examples/http/convert-directory.mjs ./labels ./converted \\\n  --base-url http://127.0.0.1:8080 --timeout 60\n\u003c/code>\u003c/pre>\n\u003cp>The default request timeout is 30 seconds (Python's timeout applies to socket\noperations; Node's timeout bounds the complete request). Conversion returns\nthe first label in each file. For multipage input, use a vector PDF request\nwith \u003ccode>pages=all\u003c/code> as described in the HTTP guide.\u003c/p>\n\u003cp>These jobs run in your process and stop when it stops. The API has no job\nqueue, scheduler or stored-result URLs. Public service availability and\ncapacity depend on the deployment's \u003ca href=\"https://developers.cloudflare.com/workers/platform/limits/\">Cloudflare limits\u003c/a>;\nthe scripts report failures without automatically retrying them. Run a local\nservice when you need control over capacity or where your label data is sent.\u003c/p>","headings":[["2","test-and-inspect-a-request","Test and inspect a request"],["2","endpoints-and-openapi","Endpoints and OpenAPI"],["2","convert-a-file-from-a-terminal","Convert a file from a terminal"],["2","run-a-temporary-directory-conversion","Run a temporary directory conversion"]],"examples":[],"search":" Public HTTP API \n Use the  API console  to test requests on the server hosting the\nplayground, or call the public service at\n https://labelize.764629910.workers.dev  from your own application.\nNo signup or API key is required. Each request returns its result directly. \n Test and inspect a request \n Open  API  beside Playground and Documentation. Its default source,\nlanguage, dimensions, resolution and render settings match the playground,\nincluding settings restored from a shared link. Untouched requests follow\nthe playground when you open the API tab. Once you edit an API request, its\ndraft is preserved instead.  Use playground source  copies the editor's\ncurrent source and settings again without changing the editor or your\nchosen API output format. Select an endpoint, adjust its parameters, and\nenter source text or choose a file to customize the request. \n  Send request  shows the URL, HTTP status, elapsed time, size and response\nheaders. PNG and PDF responses have inline previews; JSON and text are\nreadable inline. The PDF preview uses your browser's PDF viewer, with its\npage navigation and zoom controls.  Open PDF in new tab  gives the viewer\nmore space and also works when embedded viewing is unavailable. Downloads\npreserve the original PDF and binary bytes. Binary printer data is shown as\nhexadecimal.  Cancel  stops waiting for the response; a server conversion\nthat has already started may still finish. \n Switching between API, Documentation and Playground preserves drafts within\nthe page. Reloading clears unsaved drafts and selected files. Request bodies\nare never put into API navigation links. \n The cURL, JavaScript and Python examples follow the current request. File\nexamples read the chosen filename from the script's working directory.\nJavaScript examples use Node.js 20+; Python examples use only the standard\nlibrary. Copying an example does not send a request. \n Endpoints and OpenAPI \n Download the  OpenAPI 3.0.3 specification , also available from\nthe console's  OpenAPI JSON  link. Import it into an API client for testing.\nNative and Worker deployments serve the same specification, with relative\nserver URLs that use the hosting origin. \n \n \n \n Method and path \n Request body \n Response \n \n \n \n \n  GET /health  \n None \n JSON  {\"status\":\"ok\"}  \n \n \n  POST /convert  \n Raw ZPL, EPL, TSPL, CPCL or DPL bytes \n PNG or PDF bytes \n \n \n  POST /validate  \n Raw label bytes \n JSON report; check   ok   even with HTTP 200 \n \n \n  POST /format  \n Raw label bytes \n Formatted source bytes; binary graphics are preserved \n \n \n  POST /encode  \n Encoded image bytes \n ZPL text or binary TSPL bytes \n \n \n \n Send raw bytes, without JSON or multipart wrapping.  /convert  selects the\nparser using  Content-Type: application/zpl  (or  epl ,  tspl ,  cpcl ,  dpl ).\n /validate  and  /format  use  ?language=…  or detect the source, independently\nof Content-Type.  /encode?language=zpl|tspl  selects the output language. \n Errors may be plain text or JSON. Check the HTTP status before saving output;\nfor validation, also reject reports with  ok: false . Keep file content and\nTSPL output as bytes throughout. See the  HTTP service guide \nfor all parameters, defaults, image limits and vector/PDF options. \n Convert a file from a terminal \n  curl --fail-with-body --max-time 30 \\\n  'https://labelize.764629910.workers.dev/convert?width=100\u0026height=60\u0026dpmm=8' \\\n  -H 'Content-Type: application/zpl' \\\n  --data-binary @label.zpl -o label.png\n  \n This returns an 800 × 480 PNG. Use  output=pdf  and save as  label.pdf  for\nraster PDF. Explicit language, dimensions and dpmm avoid relying on different\ndefaults between Worker raster, Worker vector and native conversion. \n The public Worker supports browser calls from other origins using CORS,\nincluding preflight requests with Content-Type. No cookies or credentials\nare needed. This does not configure CORS on a self-hosted native deployment. \n Run a temporary directory conversion \n Use the runnable  Python example  or\n Node.js example  from a checkout: \n  python3 examples/http/convert-directory.py ./labels ./converted \\\n  --width 100 --height 60 --dpmm 8\n\nnode examples/http/convert-directory.mjs ./labels ./converted \\\n  --width 100 --height 60 --dpmm 8 --format pdf\n  \n Both scripts scan the input directory without recursion, choose the language\nfrom each file's extension, and process one request at a time. They preserve\ninput bytes and write successful responses as  label.zpl.png  or\n label.zpl.pdf , retaining the source extension to avoid filename collisions.\nExisting output files with those names are overwritten after successful\nresponses. Failed requests are reported individually; the scripts continue\nthrough the remaining files and exit nonzero if any fail. \n Use  --base-url  or  LABELIZE_BASE_URL  to choose another deployment: \n  python3 examples/http/convert-directory.py ./labels ./converted \\\n  --base-url http://127.0.0.1:8080 --timeout 60\n\nnode examples/http/convert-directory.mjs ./labels ./converted \\\n  --base-url http://127.0.0.1:8080 --timeout 60\n  \n The default request timeout is 30 seconds (Python's timeout applies to socket\noperations; Node's timeout bounds the complete request). Conversion returns\nthe first label in each file. For multipage input, use a vector PDF request\nwith  pages=all  as described in the HTTP guide. \n These jobs run in your process and stop when it stops. The API has no job\nqueue, scheduler or stored-result URLs. Public service availability and\ncapacity depend on the deployment's  Cloudflare limits ;\nthe scripts report failures without automatically retrying them. Run a local\nservice when you need control over capacity or where your label data is sent. "},{"id":"cli","group":"Integrate","title":"Tutorial: Command Line (macOS · Linux · Windows)","file":"tutorials/cli.md","html":"\u003ch1 id=\"tutorial-command-line-macos-linux-windows\">Tutorial: Command Line (macOS · Linux · Windows)\u003c/h1>\n\u003cp>\u003ca href=\"#docs/tutorials\">All tutorials\u003c/a> · \u003ca href=\"#docs/index\">Documentation index\u003c/a>\u003c/p>\n\u003cp>Convert \u003ccode>.zpl\u003c/code> / \u003ccode>.epl\u003c/code> / \u003ccode>.tspl\u003c/code> / \u003ccode>.cpcl\u003c/code> / \u003ccode>.dpl\u003c/code> files to PNG or PDF from a shell. Format is\nauto-detected from the file extension.\u003c/p>\n\u003ch2 id=\"1-install\">1. Install\u003c/h2>\n\u003cp>\u003cstrong>macOS / Linux (Homebrew)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">brew tap GOODBOY008/homebrew-labelize\nbrew install labelize\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Any OS with a Rust toolchain\u003c/strong> (builds from source, ~1 min)\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">cargo install labelize --features cli\n# or, from a checkout of this repo:\ncargo install --path . --features cli\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Windows (pre-built binary)\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Go to \u003ca href=\"https://github.com/GOODBOY008/labelize/releases\">https://github.com/GOODBOY008/labelize/releases\u003c/a>\u003c/li>\n\u003cli>Download \u003ccode>labelize-x86_64-pc-windows-msvc.zip\u003c/code>\u003c/li>\n\u003cli>Extract \u003ccode>labelize.exe\u003c/code> and put its folder on your \u003ccode>PATH\u003c/code>\u003c/li>\n\u003c/ol>\n\u003cp>(Windows with a Rust toolchain: \u003ccode>cargo install labelize --features cli\u003c/code> works too.)\u003c/p>\n\u003cp>Verify:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">labelize --help\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"2-your-first-conversion\">2. Your first conversion\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl          # → label.png, next to the input\n\u003c/code>\u003c/pre>\n\u003cp>EPL works the same way — \u003ccode>labelize convert label.epl\u003c/code>. If the file has a\ndifferent extension, force the format:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert data.txt --format zpl\nlabelize convert data.txt --format tspl   # TSPL/TSC input\n\u003c/code>\u003c/pre>\n\u003cp>A file containing several labels (\u003ccode>^XA…^XZ\u003c/code> repeated, or several \u003ccode>P\u003c/code> commands\nin EPL) produces one output per label: \u003ccode>label_1.png\u003c/code>, \u003ccode>label_2.png\u003c/code>, …\u003c/p>\n\u003ch2 id=\"3-choose-the-output-type-and-path\">3. Choose the output type and path\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl -t pdf            # → label.pdf (single-page PDF)\nlabelize convert label.zpl -o out/label.png  # explicit output path\n\u003c/code>\u003c/pre>\n\u003cp>For searchable vector PDF, multipage PDF or larger PNG exports, see\n\u003ca href=\"#docs/vector\">Vector output\u003c/a>.\u003c/p>\n\u003ch2 id=\"4-get-the-size-right\">4. Get the size right\u003c/h2>\n\u003cp>The canvas uses explicit dimensions, then supported label-declared dimensions,\nthen 102 × 152 mm at 8 dpmm. If your label looks\ncropped or has excess whitespace, override:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl --width 100 --height 62   # 100 × 62 mm\nlabelize convert label.zpl --dpmm 12                 # 300 dpi → bigger pixels\nlabelize convert label.zpl --dpmm 6                  # 152 dpi\n\u003c/code>\u003c/pre>\n\u003cp>Tip: many carrier labels declare their width with \u003ccode>^PW\u003c/code> (in dots). Divide by\nthe dpmm to get millimetres — e.g. \u003ccode>^PW812\u003c/code> at 8 dpmm ≈ 101.5 mm.\u003c/p>\n\u003ch2 id=\"5-antialiased-output-optional\">5. Antialiased output (optional)\u003c/h2>\n\u003cp>By default the PNG stores black/white pixels in an 8-bit grayscale image.\nTo keep antialiased greys (closer to Labelary's preview):\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">labelize convert label.zpl --antialias\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"6-batch-conversion\">6. Batch conversion\u003c/h2>\n\u003cp>The CLI converts one file per invocation; loop in your shell:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">for f in labels/*.zpl; do labelize convert \u0026quot;$f\u0026quot;; done\n\u003c/code>\u003c/pre>\n\u003cp>For recurring service-style workloads, consider the\n\u003ca href=\"#docs/http\">HTTP service\u003c/a> instead.\u003c/p>\n\u003ch2 id=\"7-whats-next\">7. What's next\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#docs/http\">HTTP service tu
