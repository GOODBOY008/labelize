name: Deploy Worker

on:
  push:
    branches: [main]
    # The wasm binary statically compiles the whole engine — src/** via the
    # path dependency, the playground page as lz_playground_html inside the
    # wasm binary — so any engine change must redeploy the worker, not just
    # worker/wasm glue. Missed src-only fixes otherwise keep serving stale
    # renders (e.g. the TSPL DMATRIX fix in #106 and the ZPL lowercase fix
    # in #105 were both live-missing until manually noticed).
    paths:
      - 'workers/**'
      - 'wasm/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Install wasm-bindgen-cli
        run: |
          WBG_VERSION="$(cargo pkgid -p wasm-bindgen --manifest-path wasm/Cargo.toml | sed 's/.*@//')"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked
      - name: Build engine
        run: ./build.sh
        working-directory: wasm
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}