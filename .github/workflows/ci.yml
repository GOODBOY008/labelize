name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation:
    name: Playground documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r tools/docs/requirements.txt
      - run: python tools/docs/build.py --check
      - run: node --test workers/playground.test.mjs workers/api.test.mjs

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit & integration tests
        run: cargo test --lib --test 'unit_*' --features skill,vector,playground -- --test-threads=4
        timeout-minutes: 8
      - name: Golden diff regression
        run: cargo test --test 'e2e_*' --features vector -- --test-threads=4
        timeout-minutes: 8
      # CLI/HTTP process tests need the feature-gated binary.
      - name: CLI and HTTP output e2e
        run: cargo test --test e2e_cli_encode --test e2e_http_encode --test e2e_vector_output --features serve,vector -- --test-threads=4
        timeout-minutes: 8
      # e2e_diff_report regenerates testdata/diffs/* and auto-bootstraps missing
      # reference PNGs; anything left dirty means the author forgot to commit
      # regenerated golden artifacts (see AGENTS.md → Rendering Change Workflow).
      - name: Verify golden test artifacts are committed
        run: |
          dirty="$(git status --porcelain -- testdata)"
          if [ -n "$dirty" ]; then
            echo "::error::Golden test artifacts are stale — running the e2e tests regenerated files under testdata/ that were not committed."
            echo "Regenerate locally with 'cargo test --test e2e_diff_report -- --nocapture' and commit the changed files (AGENTS.md → Rendering Change Workflow). Changed paths:"
            printf '%s\n' "$dirty"
            exit 1
          fi

  vector-output:
    name: Vector PDF structure and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: e2e/vector/requirements.txt
      - name: Install independent PDF readers and barcode decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r e2e/vector/requirements.txt
      - name: Render fixed visual cases and export PDF fixtures through the public API
        run: cargo test --locked --features vector --test e2e_vector_visual
      - name: Reject raster and hidden-text negative controls
        run: python -m unittest discover -s e2e/vector -p 'test_*.py' -v
      - name: Verify PDF structural goldens and searchable text
        run: python e2e/vector/verify_pdf.py --check structure
      - name: Compare independent PDF renderings and persisted barcode payloads
        run: python e2e/vector/verify_pdf.py --check visual
      - name: Export the complete five-language corpus
        run: cargo run --locked --features vector,serde --example vector_audit -- output/pdf/vector-audit
      - name: Verify corpus in PDFium and Poppler at 1x and 3x
        run: python e2e/vector/verify_corpus.py output/pdf/vector-audit
      - name: Verify golden references were not changed
        run: test -z "$(git status --porcelain -- testdata/vector)"
      - name: Upload vector PDFs, actual pixels and diff diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vector-output-verification
          retention-days: 7
          path: |
            output/vector-golden/
            output/pdf/vector-audit/manifest.json
            output/pdf/vector-audit/verification.json
      - name: Upload full corpus on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vector-output-failed-corpus
          retention-days: 3
          path: output/pdf/vector-audit/

  wasm-worker:
    name: WASM and worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Binding unit tests
        run: cargo test --manifest-path wasm/Cargo.toml
      - name: Install matching wasm-bindgen-cli
        run: |
          WBG_VERSION="$(cargo pkgid -p wasm-bindgen --manifest-path wasm/Cargo.toml | sed 's/.*@//')"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked
      - name: Build WASM
        run: ./wasm/build.sh
      - name: Worker and playground regression tests
        run: node --experimental-vm-modules --test workers/*.test.mjs

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ── Rust tests ──────────────────────────────────────────────
      # A cold vector build plus the complete font-character sweeps exceeds
      # eight minutes on Windows; retain the full suite with a bounded budget.
      - name: Unit & integration tests
        run: cargo test --lib --test 'unit_*' --features skill,vector,playground -- --test-threads=4
        timeout-minutes: 12
      - name: Golden diff regression
        run: cargo test --test 'e2e_*' --features vector -- --test-threads=4
        timeout-minutes: 8
      - name: CLI and HTTP vector output e2e
        run: cargo test --locked --test e2e_vector_output --features serve,vector -- --test-threads=4
        timeout-minutes: 8

      # ── Build binary for e2e scripts ────────────────────────────
      - name: Build labelize binary
        run: cargo build --release --features serve,vector

      - name: Add labelize to PATH
        shell: bash
        run: echo "$(pwd)/target/release" >> "$GITHUB_PATH"

      - name: Verify installation
        shell: bash
        run: labelize --version

      # ── CLI E2E ─────────────────────────────────────────────────
      - name: Run CLI E2E tests
        shell: bash
        run: bash e2e/cli/test_cli.sh

      # ── HTTP E2E ────────────────────────────────────────────────
      - name: Run HTTP E2E tests
        shell: bash
        run: bash e2e/http/test_http.sh

      # ── Upload e2e outputs ──────────────────────────────────────
      - name: Upload e2e outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-outputs
          retention-days: 1
          path: |
            e2e/cli-output/
            e2e/http-output/

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: labelize
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: labelize
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: labelize
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: labelize.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features serve,vector --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: labelize-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  android:
    name: Android (AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # GitHub runners ship an NDK preinstalled under $ANDROID_HOME/ndk.
      - name: Cross-compile JNI libraries
        run: android/build.sh
        env:
          ANDROID_ABIS: arm64-v8a,x86_64
      - name: Assemble AAR
        working-directory: android
        run: ./gradlew :lib:assembleRelease
      - name: Binding unit tests (host)
        run: cargo test --manifest-path android/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: labelize-android-aar
          path: android/lib/build/outputs/aar/lib-release.aar
