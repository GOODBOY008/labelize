name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit & integration tests
        run: cargo test --test 'unit_*' --features skill -- --test-threads=4
        timeout-minutes: 8
      - name: Golden diff regression
        run: cargo test --test 'e2e_*' -- --test-threads=4
        timeout-minutes: 8
      # e2e_diff_report regenerates testdata/diffs/* and auto-bootstraps missing
      # reference PNGs; anything left dirty means the author forgot to commit
      # regenerated golden artifacts (see AGENTS.md → Rendering Change Workflow).
      - name: Verify golden test artifacts are committed
        run: |
          dirty="$(git status --porcelain -- testdata)"
          if [ -n "$dirty" ]; then
            echo "::error::Golden test artifacts are stale — running the e2e tests regenerated files under testdata/ that were not committed."
            echo "Regenerate locally with 'cargo test --test e2e_diff_report -- --nocapture' and commit the changed files (AGENTS.md → Rendering Change Workflow). Changed paths:"
            printf '%s\n' "$dirty"
            exit 1
          fi

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ── Rust tests ──────────────────────────────────────────────
      - name: Unit & integration tests
        run: cargo test --test 'unit_*' --features skill -- --test-threads=4
        timeout-minutes: 8
      - name: Golden diff regression
        run: cargo test --test 'e2e_*' -- --test-threads=4
        timeout-minutes: 8

      # ── Build binary for e2e scripts ────────────────────────────
      - name: Build labelize binary
        run: cargo build --release --features serve

      - name: Add labelize to PATH
        shell: bash
        run: echo "$(pwd)/target/release" >> "$GITHUB_PATH"

      - name: Verify installation
        shell: bash
        run: labelize --version

      # ── CLI E2E ─────────────────────────────────────────────────
      - name: Run CLI E2E tests
        shell: bash
        run: bash e2e/cli/test_cli.sh

      # ── HTTP E2E ────────────────────────────────────────────────
      - name: Run HTTP E2E tests
        shell: bash
        run: bash e2e/http/test_http.sh

      # ── Upload e2e outputs ──────────────────────────────────────
      - name: Upload e2e outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-outputs
          retention-days: 1
          path: |
            e2e/cli-output/
            e2e/http-output/

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: labelize
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: labelize
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: labelize
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: labelize.exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features serve --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: labelize-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
