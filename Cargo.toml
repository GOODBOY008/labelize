[package]
name = "labelize"
version = "1.7.0"
edition = "2021"
description = "Fast ZPL & EPL label parser and renderer — convert label data to PNG/PDF. Open-source Labelary alternative."
keywords = ["zpl", "epl", "label", "barcode", "thermal-printer"]
categories = ["graphics", "parsing"]
repository = "https://github.com/GOODBOY008/labelize"
homepage = "https://github.com/GOODBOY008/labelize"
license = "MIT AND BSD-3-Clause"
readme = "README.md"
exclude = [
    "testdata/",
    "docs/",
    "examples/",
    "e2e/",
    ".github/",
    ".qoder/",
    ".kiro/",
    ".idea/",
    ".claude/",
    ".remember/",
    "AGENTS.md",
    "CHANGELOG.md",
]

[dependencies]
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
thiserror = "2"
lopdf = "0.45"
flate2 = "1"
base64 = "0.23"
datamatrix = "0.3"
qrcode = "0.14"
rxing = { version = "0.9", default-features = false, features = [
    "encoding_rs",
    "encoders",
    "aztec",
    "pdf417",
] }

# Optional — CLI
clap = { version = "4", features = ["derive"], optional = true }

# Optional — HTTP server
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
cli = ["dep:clap"]
playground = []
serve = ["cli", "playground", "dep:axum", "dep:tokio", "dep:serde"]
skill = []

[[bin]]
name = "labelize"
required-features = ["cli"]

[dev-dependencies]
proptest = "1"
# Character-display sweep tests read the embedded fonts' cmaps directly to
# know which characters must render (mirrors get_ttf_font_data in the renderer).
ab_glyph = "0.2"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
# Decoder stack is test-only (DataMatrix escapes and QR mask tests); kept out of the
# production dependency so Android/WASM consumers don't compile it.
rxing = { version = "0.9", default-features = false, features = ["decoders", "datamatrix", "qrcode"] }
